<html lang="es">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sistema de Evidencias Digitales · Don Aseo Ltda.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
:root{
  --brand:#1d33c7;            /* azul corporativo */
  --brand-deep:#13218a;
  --brand-soft:#eef1fd;
  --brand-soft2:#e1e6fb;
  --green:#1fa84e;            /* verde pelícano */
  --green-soft:#e6f7ec;
  --yellow:#f5c518;           /* amarillo del logo */
  --ink:#0e1733;
  --ink-2:#46506e;
  --ink-3:#7b85a3;
  --line:#e4e8f4;
  --line-2:#eef1f8;
  --bg:#f4f6fc;
  --card:#ffffff;
  --danger:#d63b50;
  --danger-soft:#fdecef;
  --radius:18px;
  --radius-sm:12px;
  --shadow-sm:0 1px 2px rgba(20,33,90,.06), 0 1px 3px rgba(20,33,90,.05);
  --shadow:0 4px 14px rgba(20,33,90,.08), 0 2px 6px rgba(20,33,90,.05);
  --shadow-lg:0 24px 60px rgba(14,23,51,.18), 0 8px 24px rgba(14,23,51,.10);
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:"Bricolage Grotesque","Manrope",sans-serif;
}
/* Modo oscuro — mismas variables de siempre, redefinidas (el resto del CSS ya usa
   var(--xxx) en casi todo, así que hereda el tema solo con esto). Criterio Material
   Design (ver m2.material.io/design/color/dark-theme.html): superficies gris oscuro
   AZULADO, nunca negro puro (menos fatiga visual, las sombras se notan mejor); los
   colores de acento se aclaran/desaturan un poco frente a su versión de modo claro
   para no "vibrar" sobre fondo oscuro (los saturados del modo claro se ven bien sobre
   blanco, pero cansan sobre superficies oscuras). "--brand"/"--brand-deep" se usan
   sobre todo como PAR fondo-suave + texto (ej. .hstat-ic, .lcard .tipo, .badge) — al
   invertir ambos el mismo patrón sigue funcionando sin tocar ninguna regla que ya use
   la variable, solo estas dos declaraciones. */
:root[data-theme="dark"]{
  --brand:#5b7cfa;
  --brand-deep:#a9bdff;
  --brand-soft:#1c2447;
  --brand-soft2:#293268;
  --green:#3ecf76;
  --green-soft:#123324;
  --yellow:#f0c94a;
  --ink:#e9ecf6;
  --ink-2:#b3bad4;
  --ink-3:#828ab0;
  --line:#2b3358;
  --line-2:#232b4c;
  --bg:#0e1224;
  --card:#171d38;
  --danger:#ff7b8a;
  --danger-soft:#3a1723;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.3);
  --shadow:0 4px 14px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.4);
}
/* La gran mayoría de reglas ya usa var(--card)/var(--bg)/etc. y hereda el tema con
   solo las variables de arriba. Estas de acá son las excepciones — reglas que traían
   un color fijo en vez de una variable — SOLO para superficies de interfaz normales
   (campos, tarjetas, tablas, chips). Deliberadamente NO se tocan las superficies que
   representan contenido real que debe verse igual sin importar el tema: firmas
   (.sig-box, .sig-thumb, .resp-firma .rf-img, etc.), fotos (.foto-thumb, .ev-img),
   el QR (#qrBox, siempre debe quedar negro sobre blanco para poder escanearse) y la
   vista previa de PDF/documento (.pdf-page, .doc-render) — esas son "papel", no
   interfaz, y cambiarles el fondo no tendría sentido. */
:root[data-theme="dark"] .modal-foot{background:#12172c}
:root[data-theme="dark"] .topbar{background:rgba(14,18,36,.82)}
:root[data-theme="dark"] .field input,:root[data-theme="dark"] .field textarea,:root[data-theme="dark"] .field select,
:root[data-theme="dark"] input[type="date"],:root[data-theme="dark"] input[type="time"],
:root[data-theme="dark"] .item-row select,:root[data-theme="dark"] .item-row input,
:root[data-theme="dark"] .chip-predet,:root[data-theme="dark"] .predet-pick,
:root[data-theme="dark"] .chip-estado,:root[data-theme="dark"] .tipo-estado-btn,
:root[data-theme="dark"] .sec-card,:root[data-theme="dark"] .dropzone{background:var(--card)}
:root[data-theme="dark"] .info-item,:root[data-theme="dark"] table.dt th,
:root[data-theme="dark"] .trab-summary,:root[data-theme="dark"] .firma-legal{background:var(--brand-soft)}
:root[data-theme="dark"] table.dt tr:hover td{background:var(--line-2)}
:root[data-theme="dark"] .aviso-cedula{background:#332a10;border-color:#5c4a12;color:#e0c874}
/* Parches de estilos EN LÍNEA (escritos directo en el HTML generado por JS, ej.
   style="background:#f6f8fd") — cambiarlos uno por uno en cada plantilla habría sido
   cientos de ediciones repetidas; en cambio se atrapan todos aquí por el TEXTO del
   atributo "style" (funciona porque "style" es un atributo normal para efectos de
   selección CSS). Necesitan !important porque un estilo en línea siempre le gana a
   cualquier regla de hoja de estilos, sin importar la especificidad. */
:root[data-theme="dark"] [style*="background:#f6f8fd"]{background:var(--brand-soft)!important}
:root[data-theme="dark"] [style*="background:#f4f6fc"]{background:var(--bg)!important}
:root[data-theme="dark"] [style*="background:#fff9e6"]{background:#332a10!important;color:#e0c874!important}
:root[data-theme="dark"] [style*="background:#fff;color:var(--brand-deep)"]{background:var(--card)!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;max-width:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(1100px 520px at 88% -8%, rgba(29,51,199,.07), transparent 60%),
    radial-gradient(900px 480px at -6% 6%, rgba(31,168,78,.07), transparent 55%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  min-height:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
/* Los <input type="date"/"time"> vacíos, sin esto, heredan el fondo gris por
   defecto del navegador (sobre todo en celular) y a simple vista parecen
   deshabilitados aunque sí funcionan — se fuerza fondo blanco y texto normal
   para que se vean igual que cualquier otro campo de texto. */
input[type="date"], input[type="time"]{background:#fff;color:var(--ink)}
::selection{background:var(--brand-soft2)}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;padding:14px 26px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand-logo{height:46px;width:auto;display:block;border-radius:6px}
.brand-text{display:flex;flex-direction:column;line-height:1.12}
.brand-text .t1{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--ink)}
.brand-text .t2{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.brand-divider{width:1px;height:34px;background:var(--line);margin:0 4px}
.brand-accent{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--brand),var(--green));width:54px;margin-top:5px}
.topbar-spacer{flex:1}
.topbar-badge{
  font-size:12px;font-weight:700;color:var(--brand-deep);
  background:var(--brand-soft);padding:7px 13px;border-radius:999px;
  border:1px solid var(--brand-soft2);
}
.topnav{display:flex;gap:4px;margin-left:10px;flex-wrap:wrap}
.topnav a{padding:8px 14px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--ink-2);text-decoration:none;transition:.15s;white-space:nowrap}
.topnav a:hover{background:var(--brand-soft);color:var(--brand-deep)}
.topnav a.active{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(29,51,199,.25)}
@media(max-width:860px){.topnav a{padding:7px 9px;font-size:12px} .brand-text .t1{font-size:15px}}
@media(max-width:760px){
  .topbar-inner{gap:8px 10px}
  .brand-divider{display:none}
  .user-chip{display:none}
  .topnav{margin-left:0;order:3;width:100%;gap:6px}
  .topbar-spacer{flex:0 0 0;width:0}
  .btn-pc-only{display:none!important}
  .dot-pc-only{display:none!important}
  /* iOS hace zoom automático al enfocar un campo con font-size menor a 16px, y el zoom no siempre
     se restablece al cerrar el teclado — subir el tamaño de letra en los campos evita el zoom. */
  input,textarea,select{font-size:16px!important}
}

/* ---------- Menú lateral (PC/tablet, ≥761px) — estilo "liquid glass" oscuro ---------- */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:260px;z-index:60;
  background:#002d80;
  border-right:1px solid rgba(255,255,255,.06);
  box-shadow:6px 0 28px rgba(6,10,26,.28);
  display:flex;flex-direction:column;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px;border-bottom:1px solid rgba(255,255,255,.08);height:86px}
.sb-brand img{height:40px;width:40px;object-fit:contain;display:block;border-radius:8px;flex:none;background:#fff;padding:4px}
.sb-brand-text{min-width:0}
.sb-brand-name{font-size:12.5px;font-weight:800;color:#fff;letter-spacing:.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-brand-nit{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.55);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{display:flex;flex-direction:column;gap:3px;padding:16px 8px;flex:1;overflow-y:auto}
.sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:11px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.68);text-decoration:none;white-space:nowrap;transition:.15s}
.sb-nav a:hover{background:#2e5397;color:#fff}
.sb-nav a.active{background:#2e5397;color:#fff;font-weight:700}
.sb-nav-ic{display:flex;flex:none}
.sb-nav-ic svg{width:19px;height:19px;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.sb-nav a:hover .sb-nav-ic svg{transform:scale(1.16) rotate(-8deg)}
.sb-nav a.active .sb-nav-ic svg{transform:scale(1.08)}
.sb-profile{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.sb-avatar{
  flex:none;width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,#5865e0,#8b5cf6);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.02em;
}
.sb-profile-info{flex:1;min-width:0}
.sb-profile-name{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-profile-role{font-size:11px;color:rgba(255,255,255,.48);font-weight:600;margin-top:1px}
.sb-profile-actions{display:flex;gap:2px;flex:none}
.sb-icon-btn{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  color:rgba(255,255,255,.55);background:transparent;border:none;cursor:pointer;transition:.15s;text-decoration:none;
}
.sb-icon-btn svg{width:16px;height:16px;display:block}
.sb-icon-btn:hover,.sb-icon-btn.active{background:rgba(255,255,255,.1);color:#fff}
.sb-icon-btn.danger:hover{background:rgba(214,59,80,.22);color:#ff8a99}
@media(min-width:761px){
  .mobile-topbar{display:none}
}
@media(max-width:760px){
  .sidebar{display:none}
}

/* ---------- Layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:34px 26px 80px}
/* Va DESPUÉS de la regla de arriba a propósito: ".wrap{margin:0 auto}" es la
   misma especificidad, así que si este ajuste fuera ANTES, el "margin:0 auto"
   ganaría por venir después en el CSS y el contenido quedaría oculto bajo el
   menú lateral. */
@media(min-width:761px){ .wrap{margin-left:260px} }
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.page-head h1{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.02em}
.page-head p{color:var(--ink-3);font-size:14.5px;margin-top:4px;font-weight:500}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px}
.stat.s-total::before{background:var(--brand)}
.stat.s-act::before{background:var(--green)}
.stat.s-clo::before{background:var(--ink-3)}
.stat.s-asi::before{background:var(--yellow)}
.stat.s-venc::before{background:var(--danger)}
.stats.cinco{grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.stats.cinco{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.stats.cinco{grid-template-columns:1fr 1fr}}
.stat .label{font-size:12.5px;color:var(--ink-3);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.stat .value{font-family:var(--display);font-size:30px;font-weight:700;margin-top:6px;letter-spacing:-.02em}

/* ---------- Cabecera compacta: ícono del módulo + estadísticas en línea junto al título
   (EPP/Dotación) — reemplaza la fila de 4 tarjetas grandes por unas más chicas dentro
   del mismo renglón del título, para que ocupen menos espacio vertical. ---------- */
/* .ph-grid: cuadrícula real de 2 columnas × 2 filas (título/estadísticas arriba,
   subtítulo/accesos rápidos abajo) — como es una grilla, la fila 2 automáticamente
   toma la altura que necesite y AMBOS lados (subtítulo y accesos rápidos) arrancan
   exactamente en el mismo borde superior de esa fila, sin importar que el título
   sea más corto o más largo que las estadísticas. Orden en el HTML (así se reparten
   solas en la grilla): h1, hstat-row, p, ph-quicklinks. En celular se cae a bloque
   simple (columna 2 y la fila de abajo quedan ocultas por dot-pc-only de todos modos). */
.ph-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:20px;row-gap:8px;align-items:start}
@media(max-width:760px){.ph-grid{display:block}}
.ph-icon{width:50px;height:50px;border-radius:14px;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;flex:none}
.ph-icon svg{width:23px;height:23px}
.hstat-row{display:flex;gap:10px;flex-wrap:wrap}
.hstat{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.hstat-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.hstat-ic svg{width:16px;height:16px}
.hstat-ic.c-blue{background:var(--brand-soft);color:var(--brand-deep)}
.hstat-ic.c-green{background:var(--green-soft);color:#0f6e56}
.hstat-ic.c-amber{background:#faeeda;color:#854f0b}
.hstat-ic.c-purple{background:#eeedfe;color:#3c3489}
.hstat-click{border:1px solid var(--line);cursor:pointer;font-family:inherit;text-align:left;transition:.15s}
.hstat-click:hover{border-color:var(--brand);box-shadow:0 2px 8px rgba(29,51,199,.12)}
.hstat .label{font-size:10px;color:var(--ink-3);font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.25;white-space:nowrap}
.hstat .value{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:1px}
.field-label-sm{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px}
.ph-quicklinks{display:flex;gap:8px;justify-self:end}
/* Contrato activo / Acciones principales / Herramientas: tres cajas apiladas,
   cada una con su rótulo chico arriba. Dentro de Acciones/Herramientas, tarjetas
   chicas en cuadrícula de 4 por fila — SOLO ícono + título (sin descripción, para
   que ocupen lo menos posible). Las que necesitan un contrato específico (no
   "Todos los contratos") NO desaparecen: quedan en gris y sin poder darles clic
   (atributo disabled nativo), para que nada se mueva de sitio al cambiar el filtro. */
.panel-section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.panel-section .section-label{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.02em;margin-bottom:8px}
.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:1100px){.action-grid{grid-template-columns:repeat(2,1fr)}}
.action-card{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;cursor:pointer;transition:.15s;text-align:left;width:100%;
}
.action-card:hover{border-color:var(--brand-soft2);box-shadow:var(--shadow-sm)}
.action-card .ac-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep);flex:none}
.action-card .ac-ic svg{width:13px;height:13px}
.action-card .ac-title{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action-card .ac-chevron{color:var(--ink-3);flex:none;font-size:15px;line-height:1}
.action-card.primary{background:var(--brand);border-color:var(--brand)}
.action-card.primary .ac-ic{background:rgba(255,255,255,.18);color:#fff}
.action-card.primary .ac-title{color:#fff}
.action-card.primary .ac-chevron{color:#fff}
.action-card:disabled,.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.action-card:disabled:hover{border-color:var(--line);box-shadow:none}
.search-sm{flex:none!important;width:320px;max-width:calc(100vw - 40px)}
/* Pestañas verticales dentro de un panel-section (lista de secciones a la izquierda,
   contenido de la seleccionada a la derecha) — para agrupar apartados relacionados
   (ej. Inspecciones: preoperacional/inspección/hoja de vida/formatos) sin apilarlos
   todos como panel-section sueltos, y que escale bien si se agregan más a futuro. */
.subtab-wrap{display:flex;gap:14px;align-items:flex-start}
.subtab-list{display:flex;flex-direction:column;gap:6px;width:220px;flex:none}
.subtab-item{
  display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
  border-left:3px solid transparent;border-radius:10px;padding:11px 12px;cursor:pointer;
  transition:.15s;text-align:left;width:100%;font-size:13px;font-weight:700;color:var(--ink-2);
}
.subtab-item:hover{border-color:var(--brand-soft2)}
.subtab-item .st-ic{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--ink-3)}
.subtab-item .st-ic svg{width:15px;height:15px}
.subtab-item.active{background:var(--brand-soft);border-color:transparent;border-left-color:var(--brand);color:var(--brand-deep)}
.subtab-item.active .st-ic{color:var(--brand-deep)}
.subtab-content{flex:1;min-width:0}
.subtab-pane{display:none}
.subtab-pane.active{display:block}
@media(max-width:760px){
  .subtab-wrap{flex-direction:column}
  .subtab-list{width:100%;flex-direction:column}
  .subtab-item{width:100%;white-space:nowrap}
}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.search{
  position:relative;flex:1;min-width:240px;
}
.search input{
  width:100%;padding:12px 14px 12px 42px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);outline:none;font-size:14px;
  transition:.18s;box-shadow:var(--shadow-sm);
}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.tab{padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--ink-2);transition:.15s}
.tab.active{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(29,51,199,.28)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  padding:11px 18px;border-radius:11px;font-weight:700;font-size:14px;
  transition:.16s;white-space:nowrap;border:1px solid transparent;
}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 3px 12px rgba(29,51,199,.30)}
.btn-primary:hover{background:var(--brand-deep);transform:translateY(-1px);box-shadow:0 6px 18px rgba(29,51,199,.34)}
.btn-ghost{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow-sm)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-soft)}
.btn-green{background:var(--green);color:#fff;box-shadow:0 3px 12px rgba(31,168,78,.28)}
.btn-green:hover{filter:brightness(.95);transform:translateY(-1px)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border-color:#f6cdd4}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* ---------- Cards grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.lcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-sm);transition:.2s;position:relative;
  display:flex;flex-direction:column;gap:14px;
}
.lcard:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--brand-soft2)}
.lcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.badge{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;letter-spacing:.03em;display:inline-flex;align-items:center;gap:6px}
.badge .dot{width:7px;height:7px;border-radius:50%}
.badge.activa{background:var(--green-soft);color:#127a37}
.badge.activa .dot{background:var(--green);box-shadow:0 0 0 3px rgba(31,168,78,.18)}
.badge.cerrada{background:#eef0f6;color:var(--ink-2)}
.badge.cerrada .dot{background:var(--ink-3)}
.lcard .tipo{font-size:11.5px;font-weight:700;color:var(--brand-deep);background:var(--brand-soft);padding:4px 10px;border-radius:7px;display:inline-block}
.lcard h3{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.lcard .meta{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--ink-2)}
.lcard .meta div{display:flex;align-items:center;gap:9px}
.lcard .meta svg{width:15px;height:15px;color:var(--ink-3);flex-shrink:0}
.lcard-foot{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line-2);margin-top:auto}
.attn{display:flex;align-items:center;gap:8px}
.attn .num{font-family:var(--display);font-size:22px;font-weight:700;color:var(--brand)}
.attn .lab{font-size:12px;color:var(--ink-3);font-weight:600;line-height:1.1}
.card-actions{display:flex;gap:7px}
.lcard-sel{width:17px;height:17px;flex:none;accent-color:var(--brand);cursor:pointer}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand-deep);transition:.15s;border:1px solid transparent;
}
.icon-btn:hover{background:var(--brand);color:#fff}
.icon-btn svg{width:17px;height:17px}
.icon-btn.danger{background:var(--danger-soft);color:var(--danger)}
.icon-btn.danger:hover{background:var(--danger);color:#fff}
.lcard-temas{font-size:12.5px;color:var(--ink-3);line-height:1.4;margin-top:-2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Empty ---------- */
.empty{
  text-align:center;padding:70px 20px;background:var(--card);
  border:1.5px dashed var(--line);border-radius:var(--radius);color:var(--ink-3);
}
.empty .ic{width:62px;height:62px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}
.empty h3{font-family:var(--display);color:var(--ink);font-size:20px;margin-bottom:6px}
.empty p{font-size:14px;max-width:360px;margin:0 auto}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(14,23,51,.42);
  backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 18px;overflow-y:auto;opacity:0;pointer-events:none;transition:.2s;
}
.overlay.open{opacity:1;pointer-events:auto}
.modal{
  background:var(--card);border-radius:22px;width:100%;max-width:560px;
  box-shadow:var(--shadow-lg);transform:translateY(16px) scale(.985);transition:.25s cubic-bezier(.2,.8,.2,1);
  overflow:hidden;margin:auto 0;
}
.modal.lg{max-width:860px}
.modal.xl{max-width:1080px}
.overlay.open .modal{transform:none}
.modal-head{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.modal-head h2{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.modal-head p{font-size:13px;color:var(--ink-3);margin-top:3px}
.modal-body{padding:24px 26px;max-height:64vh;overflow-y:auto}
.modal-foot{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:#fbfcfe}
.close-x{width:34px;height:34px;border-radius:9px;background:#f1f3f9;color:var(--ink-2);display:grid;place-items:center;flex-shrink:0;transition:.15s}
.close-x:hover{background:var(--danger-soft);color:var(--danger)}

/* ---------- Form ---------- */
.field{margin-bottom:16px}
.field.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.field label .opt{font-weight:600;color:var(--ink-3)}
.field input,.field textarea,.field select{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  outline:none;transition:.16s;background:#fff;
}
.field textarea{resize:vertical;min-height:74px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.err{font-size:12.5px;color:var(--danger);margin-top:6px;font-weight:600;display:none}
.invalid input,.invalid textarea{border-color:var(--danger)!important}
.invalid .err{display:block}

/* ---------- Detail ---------- */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.info-item{background:#f8f9fd;border:1px solid var(--line-2);border-radius:12px;padding:12px 14px}
.info-item .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700}
.info-item .v{font-size:14.5px;font-weight:600;margin-top:3px;word-break:break-word}
.info-item.full{grid-column:1/-1}
.table-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
table.dt th{background:#f6f8fd;text-align:left;padding:11px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);font-weight:800;border-bottom:1px solid var(--line)}
table.dt td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.dt tr:last-child td{border-bottom:none}
table.dt tr:hover td{background:#fafbfe}
.sig-thumb{height:34px;width:auto;max-width:120px;border:1px solid var(--line);border-radius:6px;background:#fff}
.foto-thumb{height:36px;width:36px;object-fit:cover;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
.dt .icon-btn{width:30px;height:30px;border-radius:8px}
.dt .icon-btn svg{width:15px;height:15px}
.dt .acc-mini{display:flex;gap:5px;flex-wrap:nowrap;align-items:center}
.muted-sm{color:var(--ink-3);font-size:12.5px}
.grid-insp{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.grid-insp .card-actions{flex-wrap:nowrap;gap:5px}
.grid-insp .card-actions .icon-btn{width:30px;height:30px;border-radius:8px;flex:none}
.grid-insp .card-actions .icon-btn svg{width:15px;height:15px}
.grid-insp .attn{flex:none}

/* ---------- Public form ---------- */
.pub-wrap{max-width:660px;margin:0 auto;padding:30px 20px 80px}
.pub-card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.pub-head{padding:26px;background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#fff;position:relative;overflow:hidden}
.pub-head::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.pub-head .acc{height:4px;width:60px;background:var(--yellow);border-radius:4px;margin-bottom:14px}
.pub-head h1{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.pub-head .sub{font-size:13.5px;opacity:.9;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 18px}
.pub-head .sub span{display:inline-flex;align-items:center;gap:6px}
.pub-body{padding:26px}
.pub-logo{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line-2)}
.pub-logo img{height:42px}
.pub-logo .pt1{font-family:var(--display);font-weight:700;font-size:14px}
.pub-logo .pt2{font-size:11.5px;color:var(--ink-3);font-weight:600}
.sig-box{border:2px dashed var(--brand-soft2);border-radius:14px;background:#fbfcff;position:relative;overflow:hidden;touch-action:none}
.sig-box canvas{display:block;width:100%;height:200px;cursor:crosshair;touch-action:none}
.sig-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:13.5px;font-weight:600;pointer-events:none;gap:8px}
.sig-placeholder svg{width:30px;height:30px;opacity:.5}
.sig-actions{display:flex;gap:10px;margin-top:12px}
.success-screen,.locked-screen{text-align:center;padding:46px 26px}
.success-screen .ic{width:74px;height:74px;border-radius:22px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 18px;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.locked-screen .ic{width:74px;height:74px;border-radius:22px;background:#eef0f6;color:var(--ink-3);display:grid;place-items:center;margin:0 auto 18px}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.success-screen h2,.locked-screen h2{font-family:var(--display);font-size:23px;margin-bottom:8px}
.success-screen p,.locked-screen p{color:var(--ink-2);font-size:14.5px;max-width:380px;margin:0 auto}
.counter-pill{display:inline-flex;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand-deep);font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;margin-top:20px}

/* ---------- Toast ---------- */
.toast-zone{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;
  animation:slideUp .3s cubic-bezier(.2,.9,.3,1.2);
}
.toast.ok{background:var(--green)}
.toast.err{background:var(--danger)}
.toast svg{width:18px;height:18px}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

.footer-note{text-align:center;color:var(--ink-3);font-size:12.5px;margin-top:40px;padding-top:20px}
.footer-note b{color:var(--ink-2)}

@media(max-width:760px){
  .stats{grid-template-columns:1fr 1fr}
  .page-head h1{font-size:26px}
  .info-grid,.field.row2{grid-template-columns:1fr}
  .wrap{padding:24px 16px 70px}
  .topbar-inner{padding:12px 16px}
  .brand-text .t2{display:none}
}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);width:100%;max-width:400px;padding:36px 32px;text-align:center}
.login-logo{height:54px;margin-bottom:18px}
.login-card h1{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.01em}
.login-card>p{color:var(--ink-3);font-size:14px;margin:6px 0 24px}
.login-card .field{text-align:left}
.login-err{color:var(--danger);font-size:13px;font-weight:600;margin-top:12px;min-height:18px}
.login-foot{margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3)}
.logout-btn{background:var(--card);color:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.logout-btn:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.logout-btn svg{width:16px;height:16px;flex:none}
.user-chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600;background:var(--brand-soft);padding:7px 13px;border-radius:999px;border:1px solid var(--brand-soft2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Constructor de plantillas (módulo Documentos) ---------- */
.sec-bar{display:flex;align-items:center;justify-content:space-between;margin:22px 0 14px;gap:10px}
.sec-bar h2{font-family:var(--display);font-size:18px;font-weight:700}
.cons-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.cons-head .nombre{font-family:var(--display);font-size:20px;font-weight:700;border:none;border-bottom:2px solid var(--line);padding:6px 2px;flex:1;min-width:240px;outline:none;background:transparent}
.cons-head .nombre:focus{border-color:var(--brand)}
.cons-head .cat{border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;outline:none}
.cons-head .cat:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
/* Constructor de formatos de inspección: editor + previsualización en vivo lado a lado */
.cons-grid{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
.cons-preview{position:sticky;top:16px}
.cons-preview .pub-card{max-height:calc(100vh - 110px);overflow-y:auto}
@media(max-width:900px){ .cons-grid{grid-template-columns:1fr} .cons-preview{position:static} .cons-preview .pub-card{max-height:none} }
/* Tarjetas de sección del constructor de Inspecciones — barra de acento a la
   izquierda para que cada sección se distinga de las demás sin depender solo del
   borde gris de siempre (misma idea que un ".panel-section", pero sin tocar esa
   clase compartida por el resto de la app). */
.sec-card{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff;transition:box-shadow .15s,opacity .15s}
/* Color de acento distinto por tipo de sección (info=azul de marca por defecto arriba) */
.sec-card.t-checklist{border-left-color:var(--green)}
.sec-card.t-tabla_dinamica{border-left-color:var(--yellow)}
.sec-card.t-fotos{border-left-color:#e8720c}
.sec-card.t-gps{border-left-color:#0e8a8a}
.sec-card.sec-dragging{opacity:.6;box-shadow:0 6px 18px rgba(20,30,90,.18)}
.sec-drag-handle{display:flex;flex:none;color:var(--ink-3);cursor:grab;touch-action:none;padding:2px;border-radius:6px}
.sec-drag-handle:hover{color:var(--ink-2);background:var(--line-2)}
.sec-drag-handle svg{width:18px;height:18px;display:block}
.sec-card.sec-dragging .sec-drag-handle{cursor:grabbing}
/* Acciones de eliminar/duplicar más discretas — solo se ven con fuerza al pasar el
   cursor, para que el contenido (títulos, campos) sea lo que más resalte. */
.insp-del-btn{opacity:.5;transition:opacity .15s}
.insp-del-btn:hover{opacity:1}
.paleta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:18px;box-shadow:var(--shadow-sm);position:sticky;top:72px;z-index:20}
.paleta b{width:100%;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.paleta button{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;background:var(--brand-soft);color:var(--brand-deep);font-weight:700;font-size:12.5px;border:1px solid var(--brand-soft2);transition:.15s}
.paleta button svg{width:15px;height:15px}
.paleta button:hover{background:var(--brand);color:#fff}
.tabla-ctrl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tabla-ctrl button{font-size:11.5px;padding:5px 10px;border-radius:7px;background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.tabla-ctrl button:hover{background:var(--brand);color:#fff}

/* ---------- Editor PDF (subir documento + colocar campos) ---------- */
.dropzone{border:2px dashed var(--brand-soft2);border-radius:18px;background:#fbfcff;text-align:center;padding:48px 24px;transition:.15s}
.dropzone.over{border-color:var(--brand);background:var(--brand-soft)}
.dropzone .dz-ic{width:64px;height:64px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.dropzone .dz-ic svg{width:30px;height:30px}
.dropzone h3{font-family:var(--display);font-size:19px;margin-bottom:6px}
.dropzone p{font-size:13.5px;color:var(--ink-3);max-width:430px;margin:0 auto 18px;line-height:1.6}
.pdf-cont{display:flex;flex-direction:column;align-items:center;gap:16px;background:#eef0f6;border-radius:14px;padding:18px;max-height:72vh;overflow:auto}
.pdf-page{position:relative;box-shadow:var(--shadow);background:#fff;flex-shrink:0}
.pdf-page canvas{display:block;border-radius:2px}
.campo-ov{position:absolute;border:2px solid var(--brand);background:rgba(29,51,199,.10);border-radius:5px;cursor:move;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;user-select:none;touch-action:none;min-width:30px;min-height:18px}
.campo-ov .co-lbl{position:absolute;top:-9px;left:6px;background:var(--card,#fff);border:1px solid currentColor;border-radius:5px;font-size:9px;line-height:1.5;padding:0 4px;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.campo-ov .co-preview{pointer-events:none;white-space:nowrap;overflow:hidden;line-height:1;color:#0e1733;font-family:Helvetica,Arial,sans-serif;padding:0 4px;font-weight:600}
.campo-ov .co-del{position:absolute;top:-9px;right:-9px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;font-size:11px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm)}
.campo-ov .co-rz{position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;border-radius:3px;background:#fff;border:2px solid currentColor;cursor:nwse-resize}
.campo-ov .co-pg{position:absolute;bottom:-11px;left:6px;background:currentColor;color:#fff;border-radius:6px;font-size:9px;font-weight:700;line-height:1.6;padding:0 6px;cursor:pointer;box-shadow:var(--shadow-sm);white-space:nowrap}
/* campos interactivos en la página de firma del trabajador */
.campo-firma{position:absolute;border:2px dashed var(--brand);background:rgba(29,51,199,.06);border-radius:5px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.campo-firma:hover{background:rgba(29,51,199,.13)}
.campo-firma img{max-width:100%;max-height:100%;object-fit:contain}
.campo-firma .cf-hint{color:var(--brand-deep);font-weight:700;font-size:11px;text-align:center;pointer-events:none;padding:2px;line-height:1.1}
.campo-firma .cf-val{font-size:12px;color:var(--ink);font-weight:600}
.campo-firma .cf-input{width:100%;height:100%;border:none;background:transparent;text-align:center;font-size:12px;outline:none;color:var(--ink);font-weight:600}

/* ---------- Crear documento (Fase 3) ---------- */
.card-sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow-sm);margin-bottom:18px}
.card-sec h3{font-family:var(--display);font-size:16px;font-weight:700;margin-bottom:14px}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink);cursor:pointer;padding:6px 0;user-select:none}
.chk input{width:17px;height:17px;accent-color:var(--brand);flex-shrink:0}
.seg-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
.firmante-row{display:grid;grid-template-columns:26px 1.5fr 1.5fr 1fr 1fr 38px;gap:8px;align-items:center;margin-bottom:8px}
.firmante-row input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;width:100%}
.firmante-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.firmante-num{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-size:12px;font-weight:700}
.firmante-row .icon-btn{width:34px;height:34px}
.badge.enviado{background:var(--brand-soft);color:var(--brand-deep)}
.badge.enviado .dot{background:var(--brand)}
.badge.venc{background:var(--danger-soft);color:var(--danger)}
.badge.venc .dot{background:var(--danger)}
@media(max-width:760px){.seg-grid{grid-template-columns:1fr} .firmante-row{grid-template-columns:1fr 1fr 38px} .firmante-num{display:none}}

/* ---------- Módulo Dotación ---------- */
.item-row{display:grid;grid-template-columns:26px 1.8fr 0.7fr 0.9fr 38px;gap:8px;align-items:center;margin-bottom:8px}
.item-row select,.item-row input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;width:100%;background:#fff}
.item-row select:focus,.item-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.item-row .icon-btn{width:34px;height:34px}
@media(max-width:760px){.item-row{grid-template-columns:1fr 1fr 1fr 38px}.item-row .firmante-num{display:none}}
.cat-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.cat-row input[type="text"]{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
.cat-row input[type="text"].cat-unidad{flex:0 0 90px}
.trab-summary{background:#f6f8fd;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.aviso-cedula{background:#fff9e6;border:1px solid #f0d580;border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:13.5px;color:#7a5c00;line-height:1.4}
.aviso-cedula button{flex:none}
.chip-predet{padding:6px 4px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-predet:hover{border-color:var(--brand-soft2)}
.chip-predet.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.predet-pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:8px;width:100%;background:#fff;text-align:left;font:inherit;color:inherit}
.predet-pick:hover{border-color:var(--brand-soft2);background:var(--brand-soft)}
.predet-pick span{font-size:13.5px;font-weight:700}
.chip-estado{padding:10px 16px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink-2);cursor:pointer;min-height:40px}
.chip-estado:hover{border-color:var(--brand-soft2)}
.chip-estado.active{border-color:transparent;color:#fff}
.chip-estado.active.bien{background:var(--green)}
.chip-estado.active.mal{background:var(--danger)}
.chip-estado.active.na{background:#9aa2b8}
/* Marcado manual de qué estado de un checklist cuenta como conforme/no conforme,
   en el constructor (ver 7.111 en MEMORY.md) — reutiliza los mismos 3 colores de
   .chip-estado (verde/rojo/gris) para que el criterio se vea igual en todos lados. */
.tipo-estado-btn{font-size:11px;font-weight:700;padding:4px 9px;border-radius:7px;border:1.5px solid var(--line);background:#fff;color:var(--ink-3);cursor:pointer;transition:.15s}
.tipo-estado-btn:hover{border-color:var(--brand-soft2)}
.tipo-estado-btn.active{color:#fff;border-color:transparent}
.tipo-estado-btn.active.bien{background:var(--green)}
.tipo-estado-btn.active.mal{background:var(--danger)}
.tipo-estado-btn.active.na{background:#9aa2b8}
.trab-summary .tk{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.trab-summary .tv{font-size:15px;font-weight:700;color:var(--ink);margin-top:2px}
.entrega-item-tag{display:inline-block;background:var(--brand-soft);color:var(--brand-deep);border-radius:7px;padding:2px 9px;font-size:12px;font-weight:600;margin:0 5px 5px 0}

/* ---------- Firma pública (Fase 4) ---------- */
.doc-render{border:1px solid var(--line);border-radius:12px;padding:24px 26px;margin-bottom:20px;background:#fff}
.r-titulo{font-family:var(--display);font-size:21px;font-weight:700;text-align:center;margin:6px 0;color:var(--ink)}
.r-subtitulo{font-family:var(--display);font-size:15px;font-weight:600;text-align:center;color:var(--ink-2);margin:4px 0}
.r-texto{font-size:14px;line-height:1.6;white-space:pre-wrap;margin:8px 0;color:var(--ink)}
.r-logo{text-align:center;margin:8px 0}.r-logo img{height:54px}
.r-img{text-align:center;margin:10px 0}.r-img img{max-width:100%;border-radius:8px}
.r-tabla{width:100%;border-collapse:collapse;margin:10px 0}.r-tabla td{border:1px solid var(--line);padding:7px 9px;font-size:13px}
.r-campo{margin:11px 0;font-size:14px}.r-lbl{font-weight:700;color:var(--ink-2)}
.r-input{display:block;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;outline:none}
.r-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.r-firma{margin:14px 0}.r-firma-line{border-top:1.5px dashed var(--ink-3);padding-top:6px;color:var(--ink-3);font-size:12.5px}
.firma-sec{margin-bottom:18px}.firma-sec h3{font-family:var(--display);font-size:15px;font-weight:700;margin-bottom:10px}
.firma-legal{margin:18px 0 6px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#f6f8fd}
.firma-legal p{font-size:12.5px;line-height:1.5;color:var(--ink-2);margin:0 0 12px;text-align:justify}
.chk-legal{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer}
.chk-legal input{width:20px;height:20px;flex-shrink:0;margin-top:1px;cursor:pointer}
.cap-box{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cap-prev{display:flex;align-items:center;gap:12px}.cap-prev img{height:84px;border-radius:9px;border:1px solid var(--line);object-fit:cover}
.cap-ok{color:var(--green);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px}
.cap-ok svg{width:16px;height:16px}

/* ---------- Auditoría (Fase 5) ---------- */
.timeline{position:relative;padding-left:2px;margin-top:6px}
.tl-item{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:-2px;width:2px;background:var(--line)}
.tl-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--brand-soft);color:var(--brand-deep);z-index:1}
.tl-dot svg{width:14px;height:14px}
.tl-firmado{background:#e9f7ee;color:var(--green)}
.tl-finalizado{background:var(--green);color:#fff}
.tl-title{font-size:13.5px;font-weight:600;color:var(--ink)}
.tl-time{font-size:12px;color:var(--ink-3);margin-top:1px}
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.load-box{text-align:center;padding:54px 20px}
.load-box .muted-sm{margin-top:14px}

/* ---------- Bloqueo de pantalla global (a prueba de clic) ---------- */
#loadScreen{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
  background:rgba(14,23,51,.34);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#loadScreen.on{display:flex;animation:fadeIn .12s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#loadScreen .ls-card{background:var(--card,#fff);border:1px solid var(--line);border-radius:16px;
  padding:26px 34px;box-shadow:0 18px 50px rgba(14,23,51,.28);display:flex;flex-direction:column;
  align-items:center;gap:14px;min-width:180px}
#loadScreen .ls-msg{font-size:14px;color:var(--ink-2);font-weight:600;text-align:center}
.ev-imgs{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.ev-img{text-align:center}
.ev-img img{height:130px;max-width:210px;border:1px solid var(--line);border-radius:10px;background:#fff;object-fit:contain;padding:4px}
.ev-img .cap{font-size:11.5px;color:var(--ink-3);margin-top:5px;font-weight:600}

/* ---------- Integración asistencia (Fase 6) ---------- */
.doc-cta{margin-top:16px;padding:13px 16px;border:1px solid var(--brand-soft2);border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--brand-deep)}
.resp-firma{margin-top:16px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card,#fff);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.resp-firma .rf-info{flex:1;min-width:140px}
.resp-firma .rf-k{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.resp-firma .rf-v{font-size:14px;color:var(--ink);font-weight:600;margin-top:2px}
.resp-firma .rf-img{height:56px;max-width:160px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;padding:3px}
.chip-sol{display:inline-block;background:var(--brand);color:#fff;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.03em;vertical-align:middle}
</style>
<script>
// Aplica el tema ANTES de pintar la página (por eso va aparte, chiquito, en el
// <head> — si se hiciera en el script grande de abajo, que corre después de que el
// navegador ya casi terminó de leer el <body>, se alcanzaría a ver un parpadeo de
// tema claro antes de cambiar a oscuro). localStorage manda; si nunca se eligió,
// se respeta el tema del sistema operativo/navegador.
(function(){
  try{
    // Los formularios públicos de Inspecciones (#/inspeccion/<enlace>, el link/QR que
    // se comparte con inspectores/trabajadores) SIEMPRE se ven en modo claro — nunca
    // heredan el tema oscuro guardado ni el del sistema operativo del celular de quien
    // lo abre. Decisión explícita del usuario: el formulario oficial debe verse igual
    // para todos, sin importar el modo del dispositivo.
    if(location.hash.indexOf('#/inspeccion/')===0){
      document.documentElement.setAttribute('data-theme', 'light');
      return;
    }
    var t = localStorage.getItem('tema_firmas');
    if(t!=='dark' && t!=='light') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

/* ---------- Estado en memoria (cache del panel admin) ---------- */
let STATE = { listas: [], userEmail: "" };

/* ---------- Permisos del usuario logueado (roles/módulos/contratos) ---------- */
let MIPERFIL = { cargado:false, activo:true, esAdmin:false, rol:"editor", modulos:[], contratos:[], catalogoDot:[], entidadesDtl:[], contratosInsp:[], nombre:"", uid:null };
/* Mapa uid -> nombre/correo, para mostrar "Creado por: X" sin exponer toda acc_perfiles */
let PERFILES_NOMBRE = {};
let PERFILES_CORREO = {};

/* Ajustes globales de la empresa (tabla app_config, fila única). Legible por anon
   porque el enlace público de Dotación también necesita saber si la foto es obligatoria. */
let APP_CONFIG = { eppFotoObligatoria:false, dotacionFotoObligatoria:false };
async function cargarAppConfig(){
  const { data } = await sb.from("app_config").select("epp_foto_obligatoria,dotacion_foto_obligatoria").eq("id",true).maybeSingle();
  if(data) APP_CONFIG = { eppFotoObligatoria: !!data.epp_foto_obligatoria, dotacionFotoObligatoria: !!data.dotacion_foto_obligatoria };
}

async function cargarMiPerfil(){
  await cargarAppConfig();
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ MIPERFIL = { cargado:false, activo:true, esAdmin:false, rol:"editor", modulos:[], contratos:[], catalogoDot:[], entidadesDtl:[], contratosInsp:[], nombre:"", uid:null }; return; }
  const uid = session.user.id;
  const [{ data:p }, { data:pm }, { data:pc }, { data:pe }, { data:pi }, { data:pn }] = await Promise.all([
    sb.from("acc_perfiles").select("es_admin,activo,nombre,rol").eq("id",uid).maybeSingle(),
    sb.from("acc_perfil_modulos").select("modulo").eq("perfil_id",uid),
    sb.from("acc_perfil_contratos").select("contrato_id,puede_agregar_catalogo").eq("perfil_id",uid),
    sb.from("acc_perfil_entidades").select("entidad_id").eq("perfil_id",uid),
    sb.from("acc_perfil_contratos_insp").select("contrato_id").eq("perfil_id",uid),
    sb.rpc("acc_perfiles_nombres")
  ]);
  MIPERFIL = {
    cargado: true,
    activo: p ? p.activo!==false : true,   // si no hay fila todavía (BD sin migrar), no bloquea por defecto
    esAdmin: !!(p && p.es_admin),
    rol: (p && p.rol) || "editor",
    modulos: (pm||[]).map(x=>x.modulo),
    contratos: (pc||[]).map(x=>x.contrato_id),
    catalogoDot: (pc||[]).filter(x=>x.puede_agregar_catalogo).map(x=>x.contrato_id),
    entidadesDtl: (pe||[]).map(x=>x.entidad_id),
    contratosInsp: (pi||[]).map(x=>x.contrato_id),
    nombre: (p && p.nombre) || session.user.email || "",
    uid
  };
  PERFILES_NOMBRE = {};
  PERFILES_CORREO = {};
  (pn||[]).forEach(x=>{ PERFILES_NOMBRE[x.id] = x.nombre || x.email || "—"; PERFILES_CORREO[x.id] = x.email || ""; });
}
function tieneModulo(m){ return MIPERFIL.esAdmin || (MIPERFIL.activo && MIPERFIL.modulos.includes(m)); }
function tieneContratoDotacion(id){ return MIPERFIL.esAdmin || MIPERFIL.contratos.includes(id); }
function puedeAgregarCatalogoDot(id){ return MIPERFIL.esAdmin || MIPERFIL.catalogoDot.includes(id); }
function tieneEntidadDtl(id){ return MIPERFIL.esAdmin || MIPERFIL.entidadesDtl.includes(id); }
function tieneContratoInsp(id){ return MIPERFIL.esAdmin || MIPERFIL.contratosInsp.includes(id); }
/* ¿Puede crear/editar/eliminar en general? admin o editor; visualizador nunca escribe (refuerzo visual — la RLS es la protección real) */
function puedeEscribir(){ return MIPERFIL.esAdmin || MIPERFIL.rol==='editor'; }
/* ¿Puede tocar (editar/eliminar) algo creado por uidCreador? admin siempre; editor solo lo suyo; visualizador nunca.
   Gatea editar/eliminar en Asistencia y Documentos, y (junto con puedoTocarEntrega de abajo)
   en EPP/Dotación — hasta CAMBIOS_SQL_54 eso además exigía estar dentro de las 24h siguientes
   a creado_en (puedoTocarReciente, ya eliminada); CAMBIOS_SQL_55 quitó SOLO el límite de
   tiempo, a pedido explícito del usuario — un editor sigue sin poder tocar lo que registró un
   compañero, eso no cambió. La auditoría se hizo más detallada (acc_diff_texto) para poder
   dar esta libertad de tiempo con confianza. */
function puedoTocar(uidCreador){ return MIPERFIL.esAdmin || (MIPERFIL.rol==='editor' && uidCreador===MIPERFIL.uid); }
/* Solo para entregas de EPP/Dotación (dot_entregas/dtl_entregas, sus ítems, y las escaneadas):
   además de lo de arriba, un editor SÍ puede tocar una entrega remota (registrada por el
   enlace público/QR, sin sesión — uidCreador queda null) — CAMBIOS_SQL_62, a pedido del
   usuario ("si le mando el enlace a un trabajador de mi contrato, debo poder corregirlo yo
   mismo"). El contrato/entidad al que pertenece ya se filtró aparte (solo llega a ver la
   ficha de un trabajador de un contrato al que tiene acceso), y la RLS del servidor exige
   ese mismo acceso de nuevo — este helper solo espeja esa regla para mostrar/ocultar los
   botones, la barrera real sigue siendo la RLS. */
function puedoTocarEntrega(uidCreador){ return puedoTocar(uidCreador) || (!uidCreador && puedeEscribir()); }
/* Igual, pero además exige que no esté cerrado/finalizado (admin sí puede aunque esté cerrado) */
function puedoTocarCerrable(uidCreador, cerrado){ return MIPERFIL.esAdmin || (MIPERFIL.rol==='editor' && uidCreador===MIPERFIL.uid && !cerrado); }
function nombreDe(uid){ return uid ? (PERFILES_NOMBRE[uid] || "—") : "—"; }
function correoDe(uid){ return uid ? (PERFILES_CORREO[uid] || "") : ""; }

/* Pantalla de candado: se usa cuando el usuario no tiene acceso a un módulo o está desactivado */
function renderSinAcceso(tituloModulo){
  const desactivado = MIPERFIL.cargado && !MIPERFIL.activo;
  const sinModulos = !desactivado && !tituloModulo;
  document.getElementById("app").innerHTML = `
    ${topbar('')}
    <div class="wrap"><div class="empty">
      <div class="ic">${I.lockBig}</div>
      <h3>${desactivado?'Tu acceso fue desactivado':sinModulos?'Aún no tienes acceso a ningún módulo':'No tienes acceso a '+esc(tituloModulo)}</h3>
      <p>${desactivado||sinModulos?'Contacta al administrador del sistema para más información.':'Contacta al administrador si crees que deberías tener acceso a este módulo.'}</p>
    </div></div>`;
  wireLogout();
}

/* ---------- Mapeo entre columnas de la BD y el objeto del programa ---------- */
function rowToList(r){
  return {
    id:r.id, codigo:CODIGO,
    actividad:r.actividad, tipo:r.tipo, fecha:r.fecha, duracion:r.duracion,
    centroTrabajo:r.centro_trabajo, lugar:r.lugar, temas:r.temas,
    responsableNombre:r.responsable_nombre, responsableCargo:r.responsable_cargo,
    responsableFirma:r.responsable_firma,
    observaciones:r.observaciones, estado:r.estado,
    creadaEn:r.creada_en, cerradaEn:r.cerrada_en, creadaPor:r.creada_por,
    solicitarDoc:r.solicitar_doc, docPlantillaId:r.doc_plantilla_id, asistentes:[]
  };
}
function rowToAsist(r){
  const d = new Date(r.registrado_en);
  return {
    id:r.id, nombre:r.nombre, documento:r.documento, cargo:r.cargo, area:r.area,
    fecha:d.toLocaleDateString("es-CO"),
    hora:d.toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'}),
    firma:r.firma
  };
}

/* ---------- Carga de datos del admin (listas + sus asistentes) ---------- */
async function loadState(){
  const [r1, r2] = await Promise.all([
    sb.from("asis_listas").select("*").order("creada_en",{ascending:false}),
    sb.from("asis_asistentes").select("id,lista_id,nombre,documento,cargo,area,registrado_en").order("registrado_en",{ascending:true})
  ]);
  if(r1.error || r2.error){
    console.error(r1.error || r2.error);
    toast("Error cargando datos: "+((r1.error||r2.error).message),"err");
    STATE.listas = [];
    return;
  }
  const map = {};

/* ---------- Utilidades ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Ejecuta una operación .in("id", lote) por tandas — con cientos/miles de ids en un
   solo .in() la URL de la petición se vuelve enorme y el servidor la rechaza con
   "Bad Request". Se parte en lotes de 150 ids (~5.5KB de URL cada uno, margen de sobra). */
async function porLotes(ids, fn, tam=150){
  for(let i=0;i<ids.length;i+=tam){
    const { error } = await fn(ids.slice(i, i+tam));
    if(error) return { error };
  }
  return { error: null };
}
/* Trae TODAS las filas de una consulta, sin importar cuántas sean — Supabase/PostgREST
   limita a 1000 filas por página si no se pide explícitamente un rango, así que una
   tabla que ya pasó de 1000 filas (dot_entregas, dtl_entregas... con el uso diario, tarde
   o temprano cualquier tabla que crece sin parar llega ahí) se quedaba TRUNCADA en
   silencio — sin error, solo con menos filas de las que en realidad hay. Recibe una
   función que arma la consulta desde cero (para poder pedirle un ".range()" distinto en
   cada vuelta) en vez del resultado ya armado. */
async function cargarTodasFilas(armarConsulta, tam=1000){
  let desde = 0, todas = [];
  while(true){
    const { data, error } = await armarConsulta().range(desde, desde+tam-1);
    if(error) return { data: null, error };
    todas = todas.concat(data||[]);
    if(!data || data.length < tam) break;
    desde += tam;
  }
  return { data: todas, error: null };
}
function hoyLocal(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pdfTexto(s){ return String(s==null?'':s).replace(/[^\x09\x0A\x0D\x20-\xFF]/g,''); }
function fmtDate(iso){
  if(!iso) return "—";
  const p = iso.split("-");
  if(p.length===3) return p[2]+"/"+p[1]+"/"+p[0];
  return iso;
}
function fmtDateTime(d){
  const dt = new Date(d);
  return dt.toLocaleDateString("es-CO") + " · " + dt.toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'});
}

function toast(msg, type){

/* ---------- Bloqueo de pantalla con reloj de arena (a prueba de clic) ---------- */
let _loadCount = 0;
function bloquear(msg){
  _loadCount++;
  const ls = document.getElementById("loadScreen");
  const lm = document.getElementById("loadMsg");
  if(lm) lm.textContent = msg || "Cargando…";
  if(ls) ls.classList.add("on");
}
function desbloquear(){
  _loadCount = Math.max(0, _loadCount - 1);
  if(_loadCount === 0){
    const ls = document.getElementById("loadScreen");
    if(ls) ls.classList.remove("on");
  }
}
/* Solo cambia el texto del reloj de arena SIN tocar el contador (para procesos largos con progreso) */
function bloquearMsg(msg){
  const lm = document.getElementById("loadMsg");
  if(lm) lm.textContent = msg || "Cargando…";
}
/* Envuelve una promesa mostrando el bloqueo mientras se resuelve */
async function conBloqueo(msg, fn){
  bloquear(msg);
  try{ return await fn(); }
  finally{ desbloquear(); }
}

/* ---------- Modal helpers ---------- */
let _modalVolver = null;   // función a ejecutar EN VEZ DE cerrar un sub-modal (abre otro modal — "volver" al anterior)
let _modalOnClose = null;  // función a ejecutar DESPUÉS de cerrar del todo (no abre otro modal — ej. refrescar el panel de atrás)
function openModal(html){
  _modalVolver = null;     // abrir un modal "raíz" limpia cualquier retorno/aviso pendiente
  _modalOnClose = null;
  document.getElementById("modalHost").innerHTML = html;
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow="hidden";
}
/* Abre un sub-modal recordando a qué volver al cerrarlo (X o clic fuera) — "volver" ABRE
   otro modal (openModal/openSubModal por dentro), nunca deja la pantalla sin modal. */
function openSubModal(html, volver){
  openModal(html);
  _modalVolver = volver || null;
}
/* Abre un modal recordando algo para hacer DESPUÉS de cerrarlo del todo (X, clic afuera,
   o un botón que solo llama a closeModal()) — a diferencia de openSubModal, "onClose" NO
   abre otro modal, así que closeModal() sí cierra la ventana de verdad antes de llamarlo. */
function openModalOnClose(html, onClose){
  openModal(html);
  _modalOnClose = onClose || null;
}
function closeModal(){
  if(_modalVolver){ const v=_modalVolver; _modalVolver=null; v(); return; }   // volver al modal anterior
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow="";
  setTimeout(()=>{ document.getElementById("modalHost").innerHTML=""; },220);
  if(_modalOnClose){ const cb=_modalOnClose; _modalOnClose=null; cb(); }
}
document.getElementById("overlay").addEventListener("mousedown", e=>{
  if(e.target.id==="overlay") closeModal();
});

   ROUTER
   ============================================================ */
function esRutaPublica(){
  return location.hash.startsWith("#/lista/") || location.hash.startsWith("#/firmar/") || location.hash.startsWith("#/responsable/") || location.hash.startsWith("#/firmadoc/") || location.hash.startsWith("#/dotacionlegal/entrega") || location.hash.startsWith("#/dotacion/entrega") || location.hash.startsWith("#/inspeccion/");
}

async function router(){
  // ----- Rutas PÚBLICAS (sin login) -----
  const mLista = location.hash.match(/^#\/lista\/(.+)$/);
  if(mLista){ await renderPublic(decodeURIComponent(mLista[1])); return; }
  const mFirmar = location.hash.match(/^#\/firmar\/(.+)$/);
  if(mFirmar){ await renderFirmaPublica(decodeURIComponent(mFirmar[1])); return; }
  const mResp = location.hash.match(/^#\/responsable\/(.+)$/);
  if(mResp){ await renderFirmaResponsable(decodeURIComponent(mResp[1])); return; }
  const mFdoc = location.hash.match(/^#\/firmadoc\/(.+)$/);
  if(mFdoc){ await renderFirmaDoc(decodeURIComponent(mFdoc[1])); return; }
  const mNuevoEpp = location.hash.match(/^#\/dotacion\/entrega-nuevo\/(.+)$/);
  if(mNuevoEpp){ await renderDotPublicoNuevo(decodeURIComponent(mNuevoEpp[1])); return; }
  const mNuevoDtl = location.hash.match(/^#\/dotacionlegal\/entrega-nuevo\/(.+)$/);
  if(mNuevoDtl){ await renderDtlPublicoNuevo(decodeURIComponent(mNuevoDtl[1])); return; }
  if(location.hash.startsWith("#/dotacionlegal/entrega")){ await renderDtlPublico(); return; }
  if(location.hash === "#/dotacion/entrega"){ await renderDotPublicoUniversal(); return; }
  const mInsp = location.hash.match(/^#\/inspeccion\/(.+)$/);
  if(mInsp){ await renderInspeccionPublica(decodeURIComponent(mInsp[1])); return; }
  // ----- Rutas de ADMINISTRACIÓN (requieren sesión) -----
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  STATE.userEmail = session.user?.email || "";
  // No basta con "MIPERFIL.cargado" — si la sesión cambió de usuario (ej. alguien cerró sesión
  // por expiración del token en vez de darle a "Salir", o volvió a iniciar sesión con otra cuenta
  // sin recargar la página), MIPERFIL podía quedar con los datos del usuario ANTERIOR. Comparar
  // contra el uid de la sesión real fuerza una recarga cada vez que no coincidan.
  if(!MIPERFIL.cargado || MIPERFIL.uid !== session.user.id) await cargarMiPerfil();
  if(MIPERFIL.cargado && !MIPERFIL.activo){ renderSinAcceso(""); return; }

  if(location.hash.startsWith("#/configuracion")){
    if(!MIPERFIL.esAdmin){ renderSinAcceso("Configuración"); return; }
    await renderConfiguracion();
  } else if(location.hash.startsWith("#/auditoria")){
    if(!MIPERFIL.esAdmin){ renderSinAcceso("Auditoría"); return; }
    await renderAuditoria();
  } else if(location.hash.startsWith("#/docs")){
    if(!tieneModulo('documentos')){ renderSinAcceso("Documentos y Firmas"); return; }
    const mPlant = location.hash.match(/^#\/docs\/plantilla\/(.+)$/);
    const mEditDoc = location.hash.match(/^#\/docs\/documento\/(.+)\/editar$/);
    if(mPlant && mPlant[1]==='nueva' && !puedeEscribir()){ renderSinAcceso("Documentos y Firmas"); }
    else if(location.hash === "#/docs/documento/nuevo" && !puedeEscribir()){ renderSinAcceso("Documentos y Firmas"); }
    else if(mPlant){ await renderConstructor(mPlant[1]==='nueva' ? null : decodeURIComponent(mPlant[1])); }
    else if(location.hash === "#/docs/documento/nuevo"){ await renderCrearDocumento(); }
    else if(mEditDoc){ await renderEditarDocumento(decodeURIComponent(mEditDoc[1])); }
    else { await renderDocsAdmin(); }   // MÓDULO: Documentos y Firmas
  } else if(location.hash === "#/dotacionlegal" || location.hash.startsWith("#/dotacionlegal/")){
    if(!tieneModulo('dotacionlegal')){ renderSinAcceso("Dotación"); return; }
    const mFichaDtl = location.hash.match(/^#\/dotacionlegal\/trabajador\/(.+)$/);
    if(mFichaDtl){ await renderFichaTrabajadorDtl(decodeURIComponent(mFichaDtl[1])); }
    else { await renderDtlAdmin(); }   // MÓDULO: Dotación (legal)
  } else if(location.hash === "#/dotacion" || location.hash.startsWith("#/dotacion/")){
    if(!tieneModulo('dotacion')){ renderSinAcceso("Entrega de EPP"); return; }
    const mFicha = location.hash.match(/^#\/dotacion\/trabajador\/(.+)$/);
    if(mFicha){ await renderFichaTrabajador(decodeURIComponent(mFicha[1])); }
    else { await renderDotacionAdmin(); }   // MÓDULO: EPP
  } else if(location.hash === "#/inspecciones" || location.hash.startsWith("#/inspecciones/")){
    if(!tieneModulo('inspecciones')){ renderSinAcceso("Inspecciones"); return; }
    const mFormatoInsp = location.hash.match(/^#\/inspecciones\/formato\/(.+)$/);
    const mEnlaceInsp = location.hash.match(/^#\/inspecciones\/enlace\/(.+)\/editar$/);
    if((mFormatoInsp||mEnlaceInsp) && !puedeEscribir()){ renderSinAcceso("Inspecciones"); }
    else if(mFormatoInsp){ await renderConstructorFormatoInsp(mFormatoInsp[1]==='nueva' ? null : decodeURIComponent(mFormatoInsp[1])); }
    else if(mEnlaceInsp){ await renderConstructorFormatoInsp(null, decodeURIComponent(mEnlaceInsp[1])); }
    else { await renderInspeccionesAdmin(); }   // MÓDULO: Inspecciones
  } else {
    // Ruta por defecto (recién logueado, o cualquier hash no reconocido). Si no tiene Asistencia,
    // en vez de mostrar "sin acceso" de una, lo mandamos al primer módulo que sí tenga habilitado
    // — solo si no tiene NINGUNO de los cuatro se muestra el candado.
    if(!tieneModulo('asistencia')){
      if(tieneModulo('documentos')){ location.hash = "#/docs"; return; }
      if(tieneModulo('dotacion')){ location.hash = "#/dotacion"; return; }
      if(tieneModulo('dotacionlegal')){ location.hash = "#/dotacionlegal"; return; }
      if(tieneModulo('inspecciones')){ location.hash = "#/inspecciones"; return; }
      renderSinAcceso();
      return;
    }
    bloquear("Cargando…");
    try{ await loadState(); } finally{ desbloquear(); }
    renderAdmin();                    // MÓDULO: Asistencia (existente, intacto)
  }
}

     "truthy", el modal se abriría en modo EDITAR (título y botón equivocados) en
     vez de CREAR, y al guardar fallaría con "invalid input syntax for type uuid:
     undefined" porque el Event no tiene un .id real. Por eso aquí sí se envuelve. */
  const btnNueva = document.getElementById("btnNueva"); if(btnNueva) btnNueva.onclick = ()=> openCreateModal();
  document.getElementById("search").oninput = (e)=>{ adminQuery = e.target.value; renderGrid(); };
  document.querySelectorAll(".tab").forEach(t=> t.onclick = ()=>{ adminFilter = t.dataset.f; renderAdmin(); });
  wireLogout();
  renderGrid();
  if(silent) window.scrollTo(0, scrollY);
  if(!silent){ if(_asisTimer) clearInterval(_asisTimer); _asisTimer = setInterval(_tickAsis, 20000); }
}

function renderGrid(){
  const host = document.getElementById("listGrid");
  let db = STATE.listas.slice();
  if(adminFilter!=="todas") db = db.filter(l=>l.estado===adminFilter);
  const q = adminQuery.trim().toLowerCase();
  if(q) db = db.filter(l=>
    (l.actividad||"").toLowerCase().includes(q) ||
    (l.responsableNombre||"").toLowerCase().includes(q) ||
    (l.lugar||"").toLowerCase().includes(q) ||
    (l.tipo||"").toLowerCase().includes(q)
  );

  if(db.length===0){
    host.innerHTML = `
      <div class="empty">
        <div class="ic">${I.doc}</div>
        <h3>No hay listas para mostrar</h3>
        <p>${adminQuery||adminFilter!=="todas" ? "Ajusta la búsqueda o el filtro para ver resultados." : "Crea tu primera lista de asistencia con el botón “Nueva lista”."}</p>
      </div>`;
    return;
  }

  host.innerHTML = '<div class="grid">' + db.map(l=>{
    const n = l.asistentes ? l.asistentes.length : 0;
    const act = l.estado==="activa";
    return `
      <div class="lcard">
        <div class="lcard-top">
          <span class="tipo">${esc(l.tipo||"Actividad")}</span>
          <span class="badge ${act?'activa':'cerrada'}"><span class="dot"></span>${act?'Activa':'Cerrada'}</span>
        </div>
        <h3>${esc(l.actividad||"Sin nombre")}</h3>
        ${l.temas?`<p class="lcard-temas">${esc(l.temas)}</p>`:""}
        <div class="meta">
          <div>${I.cal}<span>${fmtDate(l.fecha)}${l.duracion?" · "+esc(l.duracion):""}</span></div>
          <div>${I.pin}<span>${esc(l.lugar||"—")}</span></div>
          <div>${I.user}<span>${esc(l.responsableNombre||"—")}</span></div>
        </div>
        <div class="lcard-foot">
          <div class="attn">
            <span class="num">${n}</span>
            <span class="lab">asistente${n===1?'':'s'}<br>registrado${n===1?'':'s'}</span>
          </div>
          <div class="card-actions">
            <button class="icon-btn" title="Ver detalle" data-act="ver" data-id="${l.id}">${I.eye}</button>
            <button class="icon-btn" title="Copiar enlace" data-act="link" data-id="${l.id}">${I.link}</button>
            <button class="icon-btn" title="Compartir QR" data-act="qr" data-id="${l.id}">${I.qr}</button>
            <button class="icon-btn" title="Generar PDF" data-act="pdf" data-id="${l.id}">${I.pdf}</button>
            ${puedoTocarCerrable(l.creadaPor, l.estado==='cerrada')?`<button class="icon-btn danger" title="Eliminar lista" data-act="del" data-id="${l.id}">${I.trash}</button>`:''}
          </div>
        </div>
        <p class="muted-sm" style="margin-top:8px">Creado por: ${esc(nombreDe(l.creadaPor))}</p>
      </div>`;
  }).join("") + '</div>';

  host.querySelectorAll("[data-act]").forEach(b=>{
    b.onclick = ()=>{
      const id=b.dataset.id, act=b.dataset.act;
      if(act==="ver") openDetail(id);
      else if(act==="link") copyLink(id);
      else if(act==="qr") mostrarQR(linkFor(id), "Registro de asistencia");
      else if(act==="pdf") firmarYGenerarPDF(id);
      else if(act==="del") eliminarLista(id);
    };
  });
}

  };

/* ---------- Copiar enlace ---------- */
function copyLink(id){
  const url = linkFor(id);
  const done = ()=> toast("Enlace copiado al portapapeles","ok");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done));
  } else fallbackCopy(url,done);
}
function copyText(text, msg){
  const done = ()=> toast(msg||"Copiado al portapapeles","ok");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text, cb){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); cb(); }catch(e){ prompt("Copia el enlace:", text); }
  ta.remove();
}

/* ---------- Eliminar un asistente (libera su cédula para volver a registrarse) ---------- */
function eliminarAsistente(aid, listaId, nombre){
  openModal(`
    <div class="modal" style="max-width:440px">
      <div class="modal-head">
        <div><h2>Eliminar registro</h2><p>El asistente podrá volver a registrar su asistencia.</p></div>
        <button class="close-x" onclick="closeModal()">${I.close}</button>
      </div>
      <div class="modal-body">
        <p style="font-size:14.5px;color:var(--ink-2)">Vas a eliminar el registro de <b>${esc(nombre||"este asistente")}</b>. Su firma se borrará y su documento quedará <b>libre</b> para registrarse de nuevo. Esta acción no se puede deshacer.</p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-danger" id="confDelAsist">${I.trash} Sí, eliminar</button>
      </div>
    </div>
  `);
  document.getElementById("confDelAsist").onclick = async ()=>{
    const btn = document.getElementById("confDelAsist");
    btn.disabled = true; btn.innerHTML = "Eliminando…";
    const { error } = await sb.from("asis_asistentes").delete().eq("id", aid);
    if(error){
      btn.disabled = false; btn.innerHTML = `${I.trash} Sí, eliminar`;
      toast("No se pudo eliminar: "+error.message,"err");
      return;
    }
    await loadState();
    closeModal();
    openDetail(listaId);
    toast("Registro eliminado","ok");
  };
}

/* ---------- Editar (reemplazar) la firma del responsable, sin pasar por el enlace
   público — mismo sistema de EPP/Dotación: firmar en el lienzo o adjuntar una foto
   de la firma (le quitamos el fondo automáticamente con quitarFondoFirma). Asistencia
   no tiene "plantillas" de responsable como EPP/Dotación (el responsable se define
   por lista, no se reutiliza de una lista de guardados), así que este modal es solo
   lienzo + adjuntar imagen, sin la sección de "usar una firma guardada". ---------- */
function abrirEditarFirmaResponsable(listaId){
  const l = getList(listaId);
  openModal(`<div class="modal" style="max-width:480px">
    <div class="modal-head"><div><h2>Editar firma del responsable</h2><p>${esc(l?.responsableNombre||'Responsable')}${l?.responsableCargo?' · '+esc(l.responsableCargo):''}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      ${l?.responsableFirma?`<div style="text-align:center;margin-bottom:14px"><img src="${l.responsableFirma}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"></div>`:''}
      <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
      <div class="sig-actions">
        <button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btnAefAdjuntarFirma">${I.plus} Adjuntar imagen de firma</button>
      </div>
      <p class="muted-sm" style="margin-top:4px">Si ya tienes la firma guardada como foto o imagen, la puedes subir — le quitamos el fondo automáticamente para que quede igual de limpia que si la dibujaras aquí.</p>
      <input type="file" id="aefArchivoFirma" accept="image/*" style="display:none">
      <div id="aefFirmaSubidaPreview"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarFirmaResponsableEditada">${I.check} Guardar firma</button>
    </div></div>`);
  initSignature();
  document.getElementById('sigClear').onclick = ()=> sigPad.clear();
  let firmaSubida = null;
  document.getElementById('btnAefAdjuntarFirma').onclick = ()=> document.getElementById('aefArchivoFirma').click();
  document.getElementById('aefArchivoFirma').onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const prev = document.getElementById('aefFirmaSubidaPreview');
    prev.innerHTML = `<p class="muted-sm">Procesando…</p>`;
    try{
      firmaSubida = await quitarFondoFirma(f);
      prev.innerHTML = `<div style="text-align:center;margin-top:8px;padding:10px;background:repeating-conic-gradient(#e9ecf5 0% 25%,#fff 0% 50%) 50%/16px 16px"><img src="${firmaSubida}" style="height:80px;max-width:100%"></div>`;
    }catch(err){ prev.innerHTML = `<p class="muted-sm" style="color:var(--danger)">No se pudo procesar la imagen</p>`; firmaSubida = null; }
  };
  document.getElementById('btnGuardarFirmaResponsableEditada').onclick = async ()=>{
    const firma = firmaSubida || ((sigPad && !sigPad.isEmpty()) ? sigPad.dataURL() : null);
    if(!firma){ toast("Firma primero, o adjunta una imagen","err"); return; }
    const btn = document.getElementById('btnGuardarFirmaResponsableEditada'); btn.disabled=true; btn.innerHTML="Guardando…";
    bloquear("Guardando firma…");
    const { error } = await sb.from("asis_listas").update({ responsable_firma: firma }).eq("id", listaId);
    desbloquear();
    if(error){ btn.disabled=false; btn.innerHTML=`${I.check} Guardar firma`; toast("No se pudo guardar: "+error.message,"err"); return; }
    if(l) l.responsableFirma = firma;
    closeModal();
    openDetail(listaId);
    toast("Firma actualizada","ok");
  };
}
