}

function eliminarPlantilla(id){
  const p = DOCSTATE.plantillas.find(x=>x.id===id);
  openModal(`
    <div class="modal" style="max-width:440px">
      <div class="modal-head"><div><h2>Eliminar plantilla</h2><p>Esta acción no se puede deshacer.</p></div>
        <button class="close-x" onclick="closeModal()">${I.close}</button></div>
      <div class="modal-body"><p style="font-size:14.5px;color:var(--ink-2)">Se eliminará la plantilla <b>${esc(p?p.nombre:"")}</b>. Los documentos ya creados a partir de ella no se ven afectados.</p></div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-danger" id="confDelPl">${I.trash} Sí, eliminar</button></div>
    </div>`);
  document.getElementById("confDelPl").onclick = async ()=>{
    const btn=document.getElementById("confDelPl"); btn.disabled=true; btn.innerHTML="Eliminando…";
    const { error } = await sb.from("doc_plantillas").delete().eq("id", id);
    if(error){ btn.disabled=false; btn.innerHTML=`${I.trash} Sí, eliminar`; toast("No se pudo eliminar: "+error.message,"err"); return; }
    closeModal(); toast("Plantilla eliminada","ok"); renderDocsAdmin();
  };
}

let editorPlantillaId = null;

/* === Editor PDF (modelo tipo DocuSign): subir PDF + colocar campos === */
let pdfEditor = { pdfData:null, campos:[], numPages:0 };
const FIELD_TYPES = {
  firma:   { label:'Firma',       icon:'✍️', w:26, h:9,  color:'#1d33c7' },
  selfie:  { label:'Selfie',      icon:'📷', w:18, h:16, color:'#1fa84e' },
  foto_id: { label:'Foto cédula', icon:'🪪', w:26, h:16, color:'#0d7a6b' },
  fecha:   { label:'Fecha',       icon:'📅', w:22, h:6,  color:'#c98a00' },
  texto:   { label:'Texto',       icon:'✎',  w:28, h:6,  color:'#7b85a3' },
  nombre:  { label:'Nombre',      icon:'👤', w:34, h:6,  color:'#46506e' },
  nombre_part: { label:'Nombre participante', icon:'🧑', w:42, h:6, color:'#2a3557', auto:true },
  cedula_part: { label:'Cédula participante', icon:'🆔', w:30, h:6, color:'#2a3557', auto:true }
};

async function renderConstructor(plantillaId){
  editorPlantillaId = plantillaId || null;
  let nombre = "", categoria = "";
  pdfEditor = { pdfData:null, campos:[], numPages:0 };
  if(plantillaId){
    bloquear("Cargando plantilla…");
    const { data, error } = await sb.from("doc_plantillas").select("*").eq("id", plantillaId).maybeSingle();
    desbloquear();
    if(error || !data){ toast("No se pudo cargar la plantilla","err"); location.hash="#/docs"; return; }
    if(!puedoTocar(data.creada_por)){ toast("No puedes editar una plantilla que no creaste","err"); location.hash="#/docs"; return; }
    nombre = data.nombre||""; categoria = data.categoria||"";
    pdfEditor.pdfData = data.pdf || null;
    pdfEditor.campos = Array.isArray(data.contenido) ? data.contenido : [];
  }

  document.getElementById("app").innerHTML = `
    ${topbar('docs')}
    <div class="wrap" style="max-width:1000px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" id="btnVolver">${I.back} Volver</button>
        <div style="flex:1"></div>
        <button class="btn btn-ghost btn-sm" id="btnCambiarPdf">Cambiar PDF</button>
        <button class="btn btn-primary" id="btnGuardarPlantilla">${I.check} Guardar plantilla</button>
      </div>
      <div class="cons-head">
        <input class="nombre" id="plNombre" placeholder="Nombre de la plantilla (ej. Acta de entrega de EPP)" value="${esc(nombre)}">
        <input class="cat" id="plCategoria" placeholder="Categoría (ej. EPP, Acta, Consentimiento)" value="${esc(categoria)}">
      </div>
      <div id="pdfZone"></div>
    </div>`;

  wireLogout();
  document.getElementById("btnVolver").onclick = ()=>{ location.hash = "#/docs"; };
  document.getElementById("btnGuardarPlantilla").onclick = guardarPlantilla;
  document.getElementById("btnCambiarPdf").onclick = pedirPdf;
  if(pdfEditor.pdfData) await renderPdfEditor();
  else mostrarDropzone();
}

function mostrarDropzone(){
  document.getElementById("pdfZone").innerHTML = `
    <div class="dropzone" id="dropzone">
      <div class="dz-ic">${I.pdf}</div>
      <h3>Sube tu documento en PDF</h3>
      <p>Arrastra aquí tu PDF o haz clic para elegirlo.<br>¿Tienes un Word? Ábrelo y usa <b>Guardar como → PDF</b>, luego súbelo aquí.</p>
      <button class="btn btn-primary" id="btnSubirPdf">${I.doc} Elegir PDF</button>
    </div>`;
  document.getElementById("btnSubirPdf").onclick = pedirPdf;
  const dz = document.getElementById("dropzone");
  dz.ondragover = e=>{ e.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave = ()=> dz.classList.remove('over');
  dz.ondrop = e=>{ e.preventDefault(); dz.classList.remove('over'); const f=e.dataTransfer.files[0]; if(f) cargarPdfArchivo(f); };
}

function pedirPdf(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/pdf';
  inp.onchange=()=>{ const f=inp.files[0]; if(f) cargarPdfArchivo(f); };
  inp.click();
}

function cargarPdfArchivo(file){
  if(file.type!=='application/pdf'){ toast("Debe ser un archivo PDF","err"); return; }
  if(file.size > 8*1024*1024){ toast("El PDF es muy grande (máx 8 MB)","err"); return; }
  bloquear("Cargando PDF…");
  const rd=new FileReader();
  rd.onload=async ()=>{ try{ pdfEditor.pdfData = rd.result; pdfEditor.campos = []; await renderPdfEditor(); toast("PDF cargado. Arrastra los campos sobre el documento.","ok"); } finally{ desbloquear(); } };
  rd.onerror=()=>{ desbloquear(); toast("No se pudo leer el archivo","err"); };
  rd.readAsDataURL(file);
}

async function renderPdfEditor(){
  const zone = document.getElementById("pdfZone");
  zone.innerHTML = `
    <div class="paleta"><b>Añade un campo y arrástralo sobre el documento donde quieras:</b>
      ${Object.entries(FIELD_TYPES).map(([k,v])=>`<button data-tipo="${k}">${v.icon} ${v.label}</button>`).join("")}
    </div>
    <div class="pdf-cont" id="pdfCont"><div class="muted-sm" style="text-align:center;padding:24px">Cargando PDF…</div></div>`;
  zone.querySelectorAll(".paleta [data-tipo]").forEach(b=> b.onclick = ()=> addCampo(b.dataset.tipo));

  const cont = document.getElementById("pdfCont");
  try{
    const bytes = Uint8Array.from(atob(pdfEditor.pdfData.split(',')[1]), c=>c.charCodeAt(0));
    const pdf = await window.pdfjsLib.getDocument({data:bytes}).promise;
    pdfEditor.numPages = pdf.numPages;
    cont.innerHTML = "";
    const W = Math.min(820, Math.max(360, (cont.clientWidth||760) - 36));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const vp1 = page.getViewport({scale:1});
      const vp = page.getViewport({scale: W/vp1.width});
      const wrap = document.createElement('div'); wrap.className='pdf-page'; wrap.dataset.page=i-1;
      wrap.style.width=vp.width+'px'; wrap.style.height=vp.height+'px';
      const canvas = document.createElement('canvas');
      canvas.width=Math.floor(vp.width*dpr); canvas.height=Math.floor(vp.height*dpr);
      canvas.style.width=vp.width+'px'; canvas.style.height=vp.height+'px';
      wrap.appendChild(canvas); cont.appendChild(wrap);
      await page.render({ canvasContext:canvas.getContext('2d'), viewport:vp, transform: dpr!==1 ? [dpr,0,0,dpr,0,0] : undefined }).promise;
    }
    renderCampos();
  }catch(e){ console.error(e); cont.innerHTML = `<div class="empty"><div class="ic">${I.pdf}</div><h3>No se pudo leer el PDF</h3><p>${esc(e.message||'Archivo no válido')}</p></div>`; }
}

function addCampo(tipo){
  if(!pdfEditor.numPages){ toast("Sube un PDF primero","err"); return; }
  const ft=FIELD_TYPES[tipo];
  // Coloca el campo en la página que está viendo el usuario (no siempre la primera)
  let page=0; const midY=window.innerHeight/2;
  const pages=Array.from(document.querySelectorAll('#pdfCont .pdf-page'));
  const vis=pages.find(pg=>{ const r=pg.getBoundingClientRect(); return r.top<=midY && r.bottom>=midY; })
          || pages.find(pg=>{ const r=pg.getBoundingClientRect(); return r.bottom>0 && r.top<window.innerHeight; });
  if(vis) page=+vis.dataset.page;
  const nuevo = { id:uid(), tipo, page, x:50-ft.w/2, y:10, w:ft.w, h:ft.h };
  pdfEditor.campos.push(nuevo);
  renderCampos();
  const el = document.querySelector(`.campo-ov[data-id="${nuevo.id}"]`);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  toast("Campo agregado en la página "+(page+1)+". Arrástralo donde quieras (puedes pasarlo a otra página).","ok");
}

function renderCampos(){
  document.querySelectorAll('.campo-ov').forEach(e=>e.remove());
  pdfEditor.campos.forEach(c=>{
    const wrap = document.querySelector(`.pdf-page[data-page="${c.page}"]`);
    if(!wrap) return;
    const ft = FIELD_TYPES[c.tipo]||FIELD_TYPES.texto;
    const el = document.createElement('div');
    el.className='campo-ov'; el.dataset.id=c.id;
    el.style.left=c.x+'%'; el.style.top=c.y+'%'; el.style.width=c.w+'%'; el.style.height=c.h+'%';
    el.style.borderColor=ft.color; el.style.color=ft.color;
    const pgBtn = pdfEditor.numPages>1 ? `<span class="co-pg" title="Cambiar de página">Pág ${c.page+1}/${pdfEditor.numPages} ⇄</span>` : '';
    el.innerHTML=`<span class="co-lbl">${ft.icon} ${ft.label}</span><span class="co-del" title="Quitar">✕</span>${pgBtn}<span class="co-rz"></span>`;
    wrap.appendChild(el);
    const pg = el.querySelector('.co-pg');
    if(pg) pg.onclick=(ev)=>{ ev.stopPropagation(); ev.preventDefault(); c.page=(c.page+1)%pdfEditor.numPages; renderCampos(); const nuevo=document.querySelector(`.campo-ov[data-id="${c.id}"]`); if(nuevo) nuevo.scrollIntoView({behavior:'smooth',block:'center'}); toast("Campo movido a la página "+(c.page+1),"ok"); };
    // Vista previa del tamaño de letra para campos de texto (así se ve cómo quedará en el PDF)
    const muestras = { nombre:'Nombre Apellido', texto:'Texto de ejemplo', fecha:new Date().toLocaleDateString('es-CO'), nombre_part:'Nombre del Participante', cedula_part:'1.234.567.890' };
    if(muestras[c.tipo]!=null){
      const prev=document.createElement('span'); prev.className='co-preview'; prev.textContent=muestras[c.tipo];
      el.appendChild(prev);
      const hpx = el.clientHeight || ((c.h/100)*(wrap.clientHeight||600));
      prev.style.fontSize = Math.max(8, Math.min(hpx*0.62, 60)) + 'px';
    }
    el.querySelector('.co-del').onclick=(ev)=>{ ev.stopPropagation(); pdfEditor.campos=pdfEditor.campos.filter(x=>x.id!==c.id); renderCampos(); };
    hacerArrastrable(el, c, wrap);
  });
}

function hacerArrastrable(el, c, wrap){
  let mode=null, sx, sy, ow, oh, gx=0, gy=0, curWrap=wrap, lastX=0, lastY=0, scrollTimer=null;
  const actualizarPreview=()=>{ const prev=el.querySelector('.co-preview'); if(prev){ prev.style.fontSize = Math.max(8, Math.min((el.clientHeight||0)*0.62, 60)) + 'px'; } };
  const paginaEn=(x,y)=>{
    const pages = Array.from(document.querySelectorAll('#pdfCont .pdf-page'));
    return pages.find(pg=>{ const r=pg.getBoundingClientRect(); return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom; });
  };
  const reposicionar=()=>{
    // Si el cursor está sobre otra página, mueve el campo a esa página (¡pasa a hoja 2, 3, …!)
    const target = paginaEn(lastX, lastY);
    if(target && target!==curWrap){ curWrap=target; c.page=+target.dataset.page; curWrap.appendChild(el); }
    const r=curWrap.getBoundingClientRect();
    c.x = Math.max(0, Math.min(100-c.w, (lastX-r.left)/r.width*100 - gx));
    c.y = Math.max(0, Math.min(100-c.h, (lastY-r.top)/r.height*100 - gy));
    el.style.left=c.x+'%'; el.style.top=c.y+'%'; actualizarPreview();
  };
  const onMove=(e)=>{
    const p = e.touches?e.touches[0]:e; lastX=p.clientX; lastY=p.clientY;
    if(mode==='move'){ reposicionar(); }
    else { const r=curWrap.getBoundingClientRect(); const dxP=(p.clientX-sx)/r.width*100, dyP=(p.clientY-sy)/r.height*100;
      c.w=Math.max(6,Math.min(100-c.x, ow+dxP)); c.h=Math.max(3,Math.min(100-c.y, oh+dyP)); el.style.width=c.w+'%'; el.style.height=c.h+'%'; actualizarPreview(); }
    e.preventDefault();
  };
  const onUp=()=>{ mode=null; if(scrollTimer){ clearInterval(scrollTimer); scrollTimer=null; } document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); document.removeEventListener('touchmove',onMove); document.removeEventListener('touchend',onUp); };
  const onDown=(e)=>{
    if(e.target.classList.contains('co-del') || e.target.classList.contains('co-pg')) return;
    mode = e.target.classList.contains('co-rz') ? 'resize' : 'move';
    const p = e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY; ow=c.w; oh=c.h; lastX=p.clientX; lastY=p.clientY;
    const r=curWrap.getBoundingClientRect(); gx=(p.clientX-r.left)/r.width*100 - c.x; gy=(p.clientY-r.top)/r.height*100 - c.y;
    e.preventDefault();
    document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
    document.addEventListener('touchmove',onMove,{passive:false}); document.addEventListener('touchend',onUp);
    // Auto-scroll cerca de los bordes para poder arrastrar hasta páginas de abajo/arriba
    if(mode==='move'){ scrollTimer=setInterval(()=>{ const m=70; if(lastY<m){ window.scrollBy(0,-16); reposicionar(); } else if(lastY>window.innerHeight-m){ window.scrollBy(0,16); reposicionar(); } }, 16); }
  };
  el.addEventListener('mousedown',onDown); el.addEventListener('touchstart',onDown,{passive:false});
}

function comprimirImagen(file, maxW){
  return new Promise(res=>{
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image(); img.onload=()=>{
      const sc=Math.min(1, maxW/img.width), w=Math.round(img.width*sc), h=Math.round(img.height*sc);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      res(cv.toDataURL("image/jpeg",0.85));
    }; img.onerror=()=>res(rd.result); img.src=rd.result; };
    rd.readAsDataURL(file);
  });
}

async function guardarPlantilla(){
  const nombre = document.getElementById("plNombre").value.trim();
  const categoria = document.getElementById("plCategoria").value.trim() || null;
  if(!nombre){ toast("Ponle un nombre a la plantilla","err"); document.getElementById("plNombre").focus(); return; }
  if(!pdfEditor.pdfData){ toast("Sube un PDF para la plantilla","err"); return; }
  const btn = document.getElementById("btnGuardarPlantilla");
  btn.disabled=true; btn.innerHTML="Guardando…";
  bloquear("Guardando plantilla…");
  const payload = { nombre, categoria, contenido: pdfEditor.campos, pdf: pdfEditor.pdfData };
  const res = editorPlantillaId
    ? await sb.from("doc_plantillas").update(payload).eq("id", editorPlantillaId)
    : await sb.from("doc_plantillas").insert(payload).select().single();
  if(res.error){ desbloquear(); btn.disabled=false; btn.innerHTML=`${I.check} Guardar plantilla`; toast("No se pudo guardar: "+res.error.message,"err"); return; }
  desbloquear();
  toast("Plantilla guardada","ok");
  location.hash = "#/docs";
}

  const done=()=>toast("Enlace copiado","ok");
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));
  else fallbackCopy(t,done);
}

/* Compartir por QR (cliente, no envía el enlace a terceros) */
function mostrarQR(url, titulo, volver){
  openModal(`<div class="modal" style="max-width:380px">
    <div class="modal-head"><div><h2>${esc(titulo||'Compartir')}</h2><p>Escanea el código para abrir el enlace</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body" style="text-align:center">
      <div id="qrBox" style="display:inline-block;padding:12px;background:#fff;border-radius:14px;border:1px solid var(--line)"></div>
      <div class="muted-sm" style="margin-top:12px;word-break:break-all">${esc(url)}</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="qrCopiar">${I.copy} Copiar enlace</button>
      <button class="btn btn-green" id="qrDescargar">${I.pdf} Descargar QR</button>
    </div></div>`);
  const box = document.getElementById('qrBox');
  try{ box.innerHTML=''; new QRCode(box, { text:url, width:224, height:224, correctLevel: QRCode.CorrectLevel.M }); }
  catch(e){ box.innerHTML='<div class="muted-sm" style="padding:30px">No se pudo generar el QR.</div>'; }
  document.getElementById('qrCopiar').onclick = ()=> copiarTexto(url);
  document.getElementById('qrDescargar').onclick = ()=>{
    const cv = box.querySelector('canvas'), img = box.querySelector('img');
    const dataUrl = cv ? cv.toDataURL('image/png') : (img ? img.src : null);
    if(!dataUrl){ toast("QR no disponible","err"); return; }
    const a=document.createElement('a'); a.href=dataUrl; a.download='QR_DonAseo.png'; document.body.appendChild(a); a.click(); a.remove();
  };
  if(volver) _modalVolver = volver;   // al cerrar el QR, volver al modal anterior
}

/* ---------- Carga masiva de firmantes desde Excel ---------- */
function descargarPlantillaFirmantes(){
  if(!window.XLSX){ toast("No se pudo cargar el generador de Excel (revisa tu conexión)","err"); return; }
  const datos = [
    ["Nombre completo","Identificación","Correo","Cargo"],
    ["Juan Pérez Gómez","1094567890","juan@ejemplo.com","Operario"],
    ["María López Ruiz","43567123","","Auxiliar"]
  ];
  const ws = XLSX.utils.aoa_to_sheet(datos);
  ws["!cols"] = [{wch:28},{wch:16},{wch:26},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Firmantes");
  XLSX.writeFile(wb, "Plantilla_firmantes.xlsx");
  toast("Plantilla descargada","ok");
}

async function cargarFirmantesExcel(file){
  if(!window.XLSX){ toast("No se pudo cargar el lector de Excel (revisa tu conexión)","err"); return; }
  bloquear("Leyendo archivo…");
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
    if(!filas.length){ toast("El archivo está vacío","err"); return; }
    const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
    const head = (filas[0]||[]).map(norm);
    const findCol = (...alts)=> head.findIndex(h => alts.some(a => h.includes(a)));
    let cNom = findCol("nombre"), cId = findCol("identificacion","cedula","documento","cc"),
        cCor = findCol("correo","email","mail"), cCar = findCol("cargo");
    let start = 1;
    if(cNom === -1 && cId === -1){ cNom=0; cId=1; cCor=2; cCar=3; start=0; }
    const nuevos = []; let ignoradas = 0;
    for(let i=start;i<filas.length;i++){
      const r = filas[i]; if(!r) continue;
      const nombre = String(cNom>=0?r[cNom]:"").trim();
      const identificacion = String(cId>=0?r[cId]:"").trim();
      const correo = String(cCor>=0?r[cCor]:"").trim();
      const cargo = String(cCar>=0?r[cCar]:"").trim();
      if(!nombre && !identificacion) continue;
      if(!nombre || !identificacion){ ignoradas++; continue; }
      nuevos.push({ nombre, correo, identificacion, cargo });
    }
    if(!nuevos.length){ toast("No se encontraron filas válidas (se requiere nombre e identificación)","err"); return; }
    const keyOf = s => s.replace(/[^0-9A-Za-z]/g,"").toLowerCase();
    const vistos = new Set(docFirmantes.filter(f=>f.identificacion.trim()).map(f=>keyOf(f.identificacion)));
    const base = docFirmantes.filter(f=>f.nombre.trim()||f.identificacion.trim());
    let dup=0;
    nuevos.forEach(n=>{ const k=keyOf(n.identificacion); if(vistos.has(k)){ dup++; return; } vistos.add(k); base.push(n); });
    docFirmantes = base.length ? base : [{nombre:'',correo:'',identificacion:'',cargo:''}];
    renderFirmantes();
    let msg = `${nuevos.length-dup} firmante(s) cargado(s)`;
    if(ignoradas) msg += ` · ${ignoradas} sin nombre/cédula omitida(s)`;
    if(dup) msg += ` · ${dup} duplicada(s)`;
    toast(msg,"ok");
  }catch(e){ console.error(e); toast("No se pudo leer el archivo: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

function renderFirmantes(){
  const host = document.getElementById("firmantesList");
  if(!host) return;
  host.innerHTML = docFirmantes.map((f,i)=>`
    <div class="firmante-row" data-i="${i}">
      <span class="firmante-num">${i+1}</span>
      <input data-f="nombre" placeholder="Nombre completo" value="${esc(f.nombre)}">
      <input data-f="correo" placeholder="Correo" value="${esc(f.correo)}">
      <input data-f="identificacion" placeholder="Identificación" value="${esc(f.identificacion)}">
      <input data-f="cargo" placeholder="Cargo" value="${esc(f.cargo)}">
      <button class="icon-btn danger" data-del="${i}" title="Quitar" ${docFirmantes.length<=1?'disabled':''}>${I.trash}</button>
    </div>`).join("");
  host.querySelectorAll("input[data-f]").forEach(inp=>{
    inp.oninput=()=>{ const i=+inp.closest(".firmante-row").dataset.i; docFirmantes[i][inp.dataset.f]=inp.value; };
  });
  host.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick=()=>{ if(docFirmantes.length<=1) return; docFirmantes.splice(+b.dataset.del,1); renderFirmantes(); };
  });
}

async function guardarDocumento(enviar){
  const plantillaId = document.getElementById("docPlantilla").value;
  const nombre = document.getElementById("docNombre").value.trim();
  const fecha_limite = document.getElementById("docLimite").value || null;
  const firma_ordenada = document.getElementById("docOrden").checked;
  if(!nombre){ toast("Ponle un nombre al documento","err"); document.getElementById("docNombre").focus(); return; }
  const abierto = !!(document.getElementById("docAbierto") && document.getElementById("docAbierto").checked);
  const validos = abierto ? [] : docFirmantes.filter(f=>f.nombre.trim() && f.identificacion.trim());
  if(enviar && !abierto && !validos.length){ toast("Agrega al menos un participante con nombre e identificación (o marca 'Documento abierto')","err"); return; }

  const config={}; document.querySelectorAll("[data-seg]").forEach(c=> config[c.dataset.seg]=c.checked);

  const btnE=document.getElementById("btnCrearEnviar"), btnB=document.getElementById("btnGuardarBorrador");
  btnE.disabled=true; btnB.disabled=true; btnE.innerHTML="Guardando…";
  bloquear(enviar?"Creando documento y enlaces…":"Guardando borrador…");

  // Congela el documento: copia el PDF y los campos de la plantilla (el dashboard no carga el pdf)
  let contenido = [], pdfSnap = null;
  { const { data:plFull } = await sb.from("doc_plantillas").select("contenido,pdf").eq("id", plantillaId).maybeSingle();
    if(plFull){ if(Array.isArray(plFull.contenido)) contenido = plFull.contenido; pdfSnap = plFull.pdf||null; } }
  if(!pdfSnap){ desbloquear(); btnE.disabled=false; btnB.disabled=false; btnE.innerHTML=`${I.check} Crear y generar enlaces`; toast("La plantilla no tiene un PDF cargado","err"); return; }

  const { data:doc, error } = await sb.from("doc_documentos").insert({
    plantilla_id: plantillaId, nombre, estado: enviar?'enviado':'borrador',
    config, contenido, pdf: pdfSnap, fecha_limite, firma_ordenada, abierto, lista_id: currentDocListaId || null
  }).select().single();
  if(error){ desbloquear(); btnE.disabled=false; btnB.disabled=false; btnE.innerHTML=`${I.check} Crear y generar enlaces`; toast("No se pudo crear: "+error.message,"err"); return; }

  if(validos.length){
    const rows = validos.map((f,idx)=>({
      documento_id:doc.id, nombre:f.nombre.trim(),
      correo:f.correo.trim()||null, identificacion:f.identificacion.trim()||null,
      cargo:f.cargo.trim()||null, orden:idx
    }));
    const { error:e2 } = await sb.from("doc_firmantes").insert(rows);
    if(e2) toast("Documento creado, pero error guardando firmantes: "+e2.message,"err");
  }
  await sb.from("doc_eventos").insert({ documento_id:doc.id, tipo:'creado', detalle:{nombre} });
  if(enviar) await sb.from("doc_eventos").insert({ documento_id:doc.id, tipo:'enviado', detalle:{firmantes:validos.length} });

  desbloquear();
  toast(enviar?(abierto?"Documento abierto creado — comparte el enlace general":"Documento creado y listo para firmar"):"Borrador guardado","ok");
  location.hash="#/docs";
  if(enviar) setTimeout(()=>abrirDocumento(doc.id), 350);
}

let _docPesadoId = null;

async function abrirDocumento(id){
  // Abre el modal AL INSTANTE con una ruedita de carga
  openModal(`<div class="modal lg"><div class="modal-body"><div class="load-box"><div class="spinner"></div><div class="muted-sm">Cargando documento…</div></div></div></div>`);

  // Carga LIGERA: sin el PDF ni las imágenes de firma (eso es lo pesado) → abre rápido
  const { data:doc, error } = await sb.from("doc_documentos")
    .select("id,nombre,estado,fecha_limite,firma_ordenada,config,contenido,creado_en,plantilla_id,lista_id,abierto,creado_por")
    .eq("id",id).maybeSingle();
  if(error||!doc){ closeModal(); toast("Documento no encontrado","err"); return; }
  if((!Array.isArray(doc.contenido) || !doc.contenido.length) && doc.plantilla_id){
    const { data:plFull } = await sb.from("doc_plantillas").select("contenido").eq("id", doc.plantilla_id).maybeSingle();
    if(plFull && Array.isArray(plFull.contenido)) doc.contenido = plFull.contenido;
  }
  const { data:fdata } = await sb.from("doc_firmantes")
    .select("id,documento_id,nombre,correo,identificacion,cargo,orden,token,estado,evidencia,firmado_en")
    .eq("documento_id",id).order("orden",{ascending:true});
  const fs = fdata||[];
  const { data:edata } = await sb.from("doc_eventos").select("*").eq("documento_id",id).order("ocurrido_en",{ascending:true});
  const eventos = edata||[];
  docDetalleActual = doc; docDetalleFirmantes = fs; _docPesadoId = null;

  // La columna "Foto" solo aparece si el documento captura selfie (por config o por campo en la plantilla)
  const tieneSelfie = !!(doc.config && doc.config.selfie) || (Array.isArray(doc.contenido) && doc.contenido.some(c=>c.tipo==='selfie'));
  // Documento de "copia por persona": el PDF/vista combinado no aplica (cada quien tiene su copia individual)
  const multiCopia = docEsMultiCopia(doc, fs.length);

  const rows = fs.map((f,i)=>{
    let acc;
    const nombreEsc = esc(f.nombre||'firmante').replace(/'/g,"\\'");
    const puedeTocarFirmante = puedoTocarCerrable(doc.creado_por, doc.estado==='finalizado');
    if(f.estado==='firmado'){
      acc = `<button class="icon-btn" title="Ver evidencia" onclick="verEvidencia('${f.id}')">${I.eye}</button>
             <button class="icon-btn" title="Descargar PDF firmado" onclick="descargarPdfFirmante('${f.id}')">${I.pdf}</button>
             ${puedeTocarFirmante?`<button class="icon-btn" title="Repetir firma" onclick="repetirFirmaFirmante('${f.id}','${doc.id}','${nombreEsc}')">${I.pen}</button>`:''}`;
    } else {
      acc = `<button class="icon-btn" title="Copiar enlace" onclick="copiarTexto('${linkFirma(f.token)}')">${I.link}</button>`;
      acc += `<button class="icon-btn" title="Compartir QR" onclick="mostrarQR('${linkFirma(f.token)}','Firma del documento', ()=>abrirDocumento('${doc.id}'))">${I.qr}</button>`;
      if(f.correo) acc += `<button class="icon-btn" title="Enviar por correo" onclick="enviarPorCorreo('${f.id}')">✉️</button>`;
    }
    if(puedeTocarFirmante) acc += `<button class="icon-btn" title="Editar nombre/cédula" onclick="abrirEditarFirmante('${f.id}','${doc.id}')">${I.pen}</button>`;
    if(puedeTocarFirmante) acc += `<button class="icon-btn danger" title="Eliminar firmante" onclick="eliminarFirmanteDoc('${f.id}','${doc.id}','${nombreEsc}')">${I.trash}</button>`;
    const miniPh = f.estado==='firmado' ? '<span class="muted-sm">…</span>' : '<span class="muted-sm">—</span>';
    return `<tr>
      <td>${i+1}</td>
      <td><b>${esc(f.nombre||'—')}</b>${f.correo?`<div class="muted-sm">${esc(f.correo)}</div>`:''}${f.identificacion?`<div class="muted-sm">C.C. ${esc(f.identificacion)}</div>`:''}</td>
      <td><span class="badge ${f.estado==='firmado'?'activa':'cerrada'}"><span class="dot"></span>${f.estado==='firmado'?'Firmado':'Pendiente'}</span></td>
      <td data-firma-cell="${f.id}">${miniPh}</td>
      ${tieneSelfie ? `<td data-foto-cell="${f.id}">${miniPh}</td>` : ''}
      <td><div class="acc-mini">${acc}</div></td>
    </tr>`;
  }).join("");

  document.getElementById("modalHost").innerHTML = `
    <div class="modal lg">
      <div class="modal-head"><div>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:4px">
          <span class="badge ${estadoBadgeClass(doc.estado)}"><span class="dot"></span>${estadoLabel(doc.estado)}</span>
        </div>
        <h2>${esc(doc.nombre)}</h2>
        <p>Creado el ${fmtDateTime(doc.creado_en)} · Creado por: ${esc(nombreDe(doc.creado_por))}</p>
      </div><button class="close-x" onclick="closeModal()">${I.close}</button></div>
      <div class="modal-body">
        <div class="info-grid">
          <div class="info-item"><div class="k">Estado</div><div class="v">${estadoLabel(doc.estado)}</div></div>
          <div class="info-item"><div class="k">Fecha límite</div><div class="v">${doc.fecha_limite?fmtDate(doc.fecha_limite):'—'}</div></div>
          <div class="info-item"><div class="k">Orden de firma</div><div class="v">${doc.firma_ordenada?'Secuencial':'Cualquier orden'}</div></div>
          <div class="info-item"><div class="k">Campos</div><div class="v">${Array.isArray(doc.contenido)?doc.contenido.length:0}</div></div>
          <div class="info-item"><div class="k">Tipo de firma</div><div class="v">${doc.abierto?'Abierta (cualquiera)':'Restringida (por cédula)'}</div></div>
          <div class="info-item full"><div class="k">Seguridad activada</div><div class="v">${esc(segResumen(doc.config))}</div></div>
        </div>
        ${doc.estado==='enviado'?`
        <div class="resp-firma" style="margin-bottom:16px">
          <div class="rf-info">
            <div class="rf-k">Enlace de firma general</div>
            <div class="rf-v">${doc.abierto?'Cualquiera con el enlace puede firmar':'Solo firman las cédulas de la lista'}</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="copiarTexto('${linkFirmaDoc(doc.id)}')">${I.link} Copiar enlace</button>
          <button class="btn btn-ghost btn-sm" onclick="mostrarQR('${linkFirmaDoc(doc.id)}','Firma del documento', ()=>abrirDocumento('${doc.id}'))">${I.qr} QR</button>
        </div>`:''}
        <h3 style="font-family:var(--display);font-size:16px;margin-bottom:10px">Firmantes ${doc.abierto?'que han firmado ':''}(${fs.length})</h3>
        ${fs.length?`<div class="table-wrap"><table class="dt"><thead><tr><th>No</th><th>Firmante</th><th>Estado</th><th>Firma</th>${tieneSelfie?'<th>Foto</th>':''}<th>Acciones</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="muted-sm">Sin firmantes registrados.</div>'}
        ${eventos.length?`<h3 style="font-family:var(--display);font-size:16px;margin:24px 0 8px">Historial de eventos</h3>${eventoTimelineHTML(eventos)}`:''}
      </div>
      <div class="modal-foot">
        ${puedoTocarCerrable(doc.creado_por, doc.estado==='finalizado')?`<button class="btn btn-danger" onclick="eliminarDocumento('${doc.id}')">${I.trash} Eliminar</button>`:''}
        ${doc.estado!=='finalizado' && puedoTocar(doc.creado_por)?`<button class="btn btn-ghost" onclick="location.hash='#/docs/documento/${doc.id}/editar'">${I.pen} Editar</button>`:''}
        ${!multiCopia?`<button class="btn btn-ghost" onclick="verDocumento()">${I.eye} Ver documento</button>
        <button class="btn btn-green" onclick="generarPDFDocumento()">${I.pdf} PDF completo</button>`:''}
        ${fs.filter(f=>f.estado==='firmado').length?`<button class="btn btn-green" onclick="descargarZipFirmados()">${I.doc} Descargar todos (ZIP)</button>`:''}
        ${doc.estado==='borrador' && puedoTocar(doc.creado_por)?`<button class="btn btn-primary" onclick="enviarDocumento('${doc.id}')">${I.check} Marcar como enviado</button>`:''}
        ${doc.estado==='enviado' && puedoTocar(doc.creado_por)?`<button class="btn btn-danger" onclick="finalizarDocumento('${doc.id}')">${I.lock} Cerrar documento</button>`:''}
      </div>
    </div>`;

  // La ventana abre YA; las miniaturas (firma/foto) se cargan aparte y se rellenan cuando llegan (más fluido)
  cargarMiniaturasFirmantes(id, tieneSelfie);

/* Carga bajo demanda lo pesado (PDF + imágenes de firmas) solo cuando se necesita */
async function cargarPesadoDoc(){
  const doc = docDetalleActual; if(!doc) return;

  const { data:dp } = await sb.from("doc_documentos").select("pdf").eq("id",doc.id).maybeSingle();

  _docPesadoId = doc.id;
}

function descargarBlobPdf(bytes, nombre){
  const blob = new Blob([bytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url;
  a.download = 'Documento_'+String(nombre||'doc').replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,50)+'.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

async function guardarEdicionDocumento(id){
  const nombre = document.getElementById("edNombre").value.trim();
  if(!nombre){ toast("Ponle un nombre al documento","err"); document.getElementById("edNombre").focus(); return; }
  const fecha_limite = document.getElementById("edLimite").value || null;
  const firma_ordenada = document.getElementById("edOrden").checked;
  const config={}; document.querySelectorAll("[data-seg]").forEach(c=> config[c.dataset.seg]=c.checked);
  const btn=document.getElementById("btnGuardarEdit"); btn.disabled=true; btn.innerHTML="Guardando…";
  bloquear("Guardando cambios…");

  const { error:e1 } = await sb.from("doc_documentos").update({ nombre, fecha_limite, firma_ordenada, config }).eq("id",id);
  if(e1){ desbloquear(); btn.disabled=false; btn.innerHTML=`${I.check} Guardar cambios`; toast("No se pudo guardar: "+e1.message,"err"); return; }

  // Firmantes: borrar pendientes quitados, actualizar existentes, insertar nuevos
  const conNombre = editDocFirmantes.filter(f=> f.estado==='firmado' || f.nombre.trim());
  const idsActuales = conNombre.filter(f=>f.id).map(f=>f.id);
  const { data:orig } = await sb.from("doc_firmantes").select("id,estado").eq("documento_id",id);
  const borrar = (orig||[]).filter(o=> o.estado!=='firmado' && !idsActuales.includes(o.id)).map(o=>o.id);
  if(borrar.length){ await sb.from("doc_firmantes").delete().in("id", borrar); }
  for(let i=0;i<conNombre.length;i++){
    const f=conNombre[i];
    if(f.estado==='firmado'){ if(f.id) await sb.from("doc_firmantes").update({ orden:i }).eq("id",f.id); continue; }
    const datos = { nombre:f.nombre.trim(), correo:f.correo.trim()||null, identificacion:f.identificacion.trim()||null, cargo:f.cargo.trim()||null, orden:i };
    if(f.id){ await sb.from("doc_firmantes").update(datos).eq("id",f.id); }
    else if(f.nombre.trim()){ await sb.from("doc_firmantes").insert({ documento_id:id, ...datos }); }
  }
  await sb.from("doc_eventos").insert({ documento_id:id, tipo:'editado', detalle:{} });
  desbloquear();
  toast("Documento actualizado","ok");
  location.hash="#/docs"; setTimeout(()=>abrirDocumento(id), 150);
}

/* === Componer el PDF FIRMADO: estampa firma/fotos/textos en cada campo (pdf-lib) === */
function _dataUrlABytes(u){ return Uint8Array.from(atob(u.split(',')[1]), c=>c.charCodeAt(0)); }

async function componerPdfFirmado(doc, firmantes){
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const pdfDoc = await PDFDocument.load(_dataUrlABytes(doc.pdf));
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const pages = pdfDoc.getPages();
  const firmados = (firmantes||[]).filter(f=>f.estado==='firmado');
  const idxTipo = { firma:0, selfie:0, foto_id:0, nombre_part:0, cedula_part:0 };
  for(const campo of (doc.contenido||[])){
    const page = pages[campo.page]; if(!page) continue;
    const { width:pw, height:ph } = page.getSize();
    const x=(campo.x/100)*pw, w=(campo.w/100)*pw, h=(campo.h/100)*ph, y=ph-(campo.y/100)*ph-h;
    if(campo.tipo==='firma' || campo.tipo==='selfie' || campo.tipo==='foto_id'){
      const key = campo.tipo;
      const signer = firmados[idxTipo[key]] || firmados[0];
      idxTipo[key]++;
      const du = signer && (key==='foto_id' ? signer.foto_id : signer[key]);
      if(du){
        try{
          const ib=_dataUrlABytes(du);
          const img = du.startsWith('data:image/png') ? await pdfDoc.embedPng(ib) : await pdfDoc.embedJpg(ib);
          const ar=img.width/img.height; let dw=w, dh=w/ar; if(dh>h){ dh=h; dw=h*ar; }
          page.drawImage(img, { x:x+(w-dw)/2, y:y+(h-dh)/2, width:dw, height:dh });
        }catch(e){ console.warn('img campo', e); }
      }
    } else if(campo.tipo==='nombre_part' || campo.tipo==='cedula_part'){
      // Auto-relleno con los datos del participante (aunque aún no haya firmado)
      const todos = firmantes||[];
      const signer = todos[idxTipo[campo.tipo]] || todos[0];
      idxTipo[campo.tipo]++;
      let val = signer ? (campo.tipo==='nombre_part' ? (signer.nombre||'') : (signer.identificacion||'')) : '';
      if(val){
        let fs = Math.max(7, Math.min(h*0.62, 60));
        try{ page.drawText(pdfTexto(val), { x:x+2, y:y+(h-fs)/2+1, size:fs, font, color:rgb(0.1,0.1,0.16) }); }catch(e){}
      }
    } else {
      let val='';
      const s = firmados.find(f=>f.evidencia && f.evidencia.campos && f.evidencia.campos[campo.id]!=null);
      if(s) val = s.evidencia.campos[campo.id];
      else if(campo.tipo==='fecha') val = new Date().toLocaleDateString('es-CO');
      else if(campo.tipo==='nombre' && firmados[0]) val = firmados[0].nombre||'';
      if(val){
        let fs = Math.max(7, Math.min(h*0.62, 60));
        try{ page.drawText(pdfTexto(val), { x:x+2, y:y+(h-fs)/2+1, size:fs, font, color:rgb(0.1,0.1,0.16) }); }catch(e){}
      }
    }
  }

  // Constancia de firma electrónica al pie de la última página (IP, fecha y hora exactas)
  if(firmados.length){
    const last = pages[pages.length-1];
    const { width:lpw } = last.getSize();
    const lineH = 8.2, baseY = 20;
    const blockH = baseY + firmados.length*lineH + 12;
    last.drawRectangle({ x:0, y:0, width:lpw, height:blockH, color:rgb(1,1,1), opacity:0.9 });
    last.drawLine({ start:{x:26,y:blockH-3}, end:{x:lpw-26,y:blockH-3}, thickness:0.5, color:rgb(0.7,0.7,0.78) });
    try{ last.drawText('Constancia de firma electrónica - Don Aseo Ltda.', { x:26, y:blockH-10, size:6.8, font, color:rgb(0.45,0.45,0.55) }); }catch(e){}
    firmados.forEach((f,i)=>{
      const ev=f.evidencia||{};
      const fhRaw = ev.fecha_hora || f.firmado_en;
      const fh = fhRaw ? new Date(fhRaw).toLocaleString('es-CO') : '-';
      const line = pdfTexto((f.nombre||'-')+'   |   C.C. '+(f.identificacion||'-')+'   |   Firmado: '+fh+'   |   IP: '+(ev.ip||'-'));
      try{ last.drawText(line, { x:26, y:baseY + (firmados.length-1-i)*lineH, size:6.8, font, color:rgb(0.28,0.28,0.36) }); }catch(e){}
    });
  }

  return await pdfDoc.save();
}

async function renderPdfEnCont(src, cont){
  const bytes = (src instanceof Uint8Array) ? src : _dataUrlABytes(src);
  const pdf = await window.pdfjsLib.getDocument({data:bytes}).promise;
  cont.innerHTML="";
  const W = Math.min(820, Math.max(360, (cont.clientWidth||760)-36));
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i); const vp1=page.getViewport({scale:1}); const vp=page.getViewport({scale:W/vp1.width});
    const wrap=document.createElement('div'); wrap.className='pdf-page'; wrap.style.width=vp.width+'px'; wrap.style.height=vp.height+'px';
    const cv=document.createElement('canvas');
    cv.width=Math.floor(vp.width*dpr); cv.height=Math.floor(vp.height*dpr);
    cv.style.width=vp.width+'px'; cv.style.height=vp.height+'px';
    wrap.appendChild(cv); cont.appendChild(wrap);
    await page.render({ canvasContext:cv.getContext('2d'), viewport:vp, transform: dpr!==1 ? [dpr,0,0,dpr,0,0] : undefined }).promise;
  }
}

      try{
        const signed = await componerPdfFirmado(doc, [f]);
        let base = String((f.nombre||'firmante')+'_'+(f.identificacion||'')).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,60) || ('firmante_'+(i+1));
        if(usados[base]!=null){ usados[base]++; base = base+'_'+usados[base]; } else usados[base]=0;
        zip.file(base+'.pdf', signed);
      }catch(e){ console.warn('zip firmante', f.id, e); }
    }
    bloquearMsg("Comprimiendo ZIP…");
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url;
    a.download = 'Firmados_'+String(doc.nombre||'documento').replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,50)+'.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 6000);
    toast(`ZIP con ${firmados.length} documento(s) generado`,"ok");
  }catch(e){ console.error(e); toast("No se pudo generar el ZIP: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* Genera el PDF firmado directamente desde la tarjeta del panel (sin abrir el documento) */
async function generarPDFDocDirecto(id){
  if(!window.PDFLib){ toast("No se pudo cargar el generador de PDF","err"); return; }
  bloquear("Generando PDF…");
  try{
    const { data:doc } = await sb.from("doc_documentos")
      .select("id,nombre,estado,config,contenido,pdf,plantilla_id").eq("id",id).maybeSingle();
    if(!doc){ toast("Documento no encontrado","err"); return; }

      const { data:pl } = await sb.from("doc_plantillas").select("contenido").eq("id",doc.plantilla_id).maybeSingle();

    const { data:fs } = await sb.from("doc_firmantes")
      .select("id,nombre,identificacion,cargo,orden,estado,firma,selfie,foto_id,evidencia,firmado_en")
      .eq("documento_id",id).order("orden",{ascending:true});

/* ¿El documento es de "copia por persona" (circular masiva)? Si sí, el PDF/vista COMBINADO no tiene sentido
   (solo mostraría al 1er firmante). Se detecta cuando hay más firmantes que campos de firma, o si es abierto. */
function docEsMultiCopia(doc, nFirmantes){
  if(doc && doc.abierto) return true;
  const slots = (doc && Array.isArray(doc.contenido)) ? doc.contenido.filter(c=>c.tipo==='firma').length : 0;
  return (nFirmantes||0) > Math.max(1, slots);
}

/* ============================================================
   FLUJO DE FIRMA PÚBLICO  (#/firmar/<token>)  — Fase 4
   Acceso sin login mediante funciones RPC por token.
   ============================================================ */
let firmaState = { token:null, doc:null, firmante:null, config:{}, selfie:null, fotoId:null, gps:null };

function detectarNavegador(){
  const ua = navigator.userAgent;
  let nav="Desconocido";
  if(/Edg\//.test(ua)) nav="Edge";
  else if(/OPR\//.test(ua)||/Opera/.test(ua)) nav="Opera";
  else if(/Chrome\//.test(ua)) nav="Chrome";
  else if(/Firefox\//.test(ua)) nav="Firefox";
  else if(/Safari\//.test(ua)) nav="Safari";
  let so="Desconocido";
  if(/Windows NT 10/.test(ua)) so="Windows 10/11";
  else if(/Windows/.test(ua)) so="Windows";
  else if(/Android/.test(ua)) so="Android";
  else if(/iPhone|iPad|iPod/.test(ua)) so="iOS";
  else if(/Mac OS X/.test(ua)) so="macOS";
  else if(/Linux/.test(ua)) so="Linux";
  return { navegador:nav, so:so };
}
function obtenerGPS(){
  return new Promise(res=>{
    if(!navigator.geolocation){ res(null); return; }
    navigator.geolocation.getCurrentPosition(
      p=>res({ lat:p.coords.latitude, lng:p.coords.longitude, precision:p.coords.accuracy }),
      ()=>res(null), { timeout:9000, enableHighAccuracy:true });
  });
}

/* Formulario de firma DEBAJO del PDF (sin campos sobrepuestos): datos + texto + pad de firma + capturas */
function formularioFirmaHTML(c, f, pedirId){
  f = f || {};
  let datos = `<div class="field"><label>Nombre completo *</label><input id="ff_nombre" value="${esc(f.nombre||'')}" placeholder="Nombre completo"></div>`;
  if(pedirId || c.identificacion) datos += `<div class="field"><label>Número de identificación (cédula) *</label><input id="ff_id" inputmode="numeric" value="${esc(f.identificacion||'')}" placeholder="C.C. / documento"></div>`;
  if(c.correo) datos += `<div class="field"><label>Correo electrónico *</label><input id="ff_correo" type="email" value="${esc(f.correo||'')}" placeholder="correo@ejemplo.com"></div>`;
  if(c.cargo)  datos += `<div class="field"><label>Cargo *</label><input id="ff_cargo" value="${esc(f.cargo||'')}" placeholder="Tu cargo"></div>`;
  let html = `<div class="firma-sec"><h3>Tus datos</h3>${datos}</div>`;
  const textos = (firmaState.doc.contenido||[]).filter(x=>x.tipo==='texto');
  if(textos.length){
    let ti='';
    textos.forEach((t,i)=>{ ti += `<div class="field"><label>Texto${textos.length>1?(' '+(i+1)):''}</label><input data-txt="${t.id}" value="${esc(firmaState.campos[t.id]||'')}" placeholder="Escribe aquí…"></div>`; });
    html += `<div class="firma-sec"><h3>Datos del documento</h3>${ti}</div>`;
  }
  if(c.firma   || tieneCampo('firma'))   html += firmaPadHTML();
  if(c.selfie  || tieneCampo('selfie'))  html += capturaHTML('selfie','Selfie', I.user);
  if(c.foto_id || tieneCampo('foto_id')) html += capturaHTML('fotoId','Documento de identidad', I.doc);
  if(c.gps) html += gpsHTML();
  html += declaracionLegalHTML();
  return html;
}

async function renderFirmaPdf(){
  const cont = document.getElementById('firmaPdf');
  const d = firmaState.doc;
  if(!d.pdf){ cont.innerHTML = `<div class="muted-sm" style="text-align:center;padding:20px">Este documento no tiene PDF asociado.</div>`; return; }
  try{
    const bytes = Uint8Array.from(atob(d.pdf.split(',')[1]), ch=>ch.charCodeAt(0));
    const pdf = await window.pdfjsLib.getDocument({data:bytes}).promise;
    cont.innerHTML = "";
    const W = Math.min(820, Math.max(360, (cont.clientWidth||760)-36));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);   // nitidez en pantallas de alta densidad (móviles)
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i); const vp1=page.getViewport({scale:1}); const vp=page.getViewport({scale:W/vp1.width});
      const wrap=document.createElement('div'); wrap.className='pdf-page'; wrap.dataset.page=i-1; wrap.style.width=vp.width+'px'; wrap.style.height=vp.height+'px';
      const cv=document.createElement('canvas');
      cv.width=Math.floor(vp.width*dpr); cv.height=Math.floor(vp.height*dpr);
      cv.style.width=vp.width+'px'; cv.style.height=vp.height+'px';
      wrap.appendChild(cv); cont.appendChild(wrap);
      await page.render({ canvasContext:cv.getContext('2d'), viewport:vp, transform: dpr!==1 ? [dpr,0,0,dpr,0,0] : undefined }).promise;
    }
    // Sin campos sobrepuestos: el firmante ve el PDF limpio y firma en el formulario de abajo.
  }catch(e){ console.error(e); cont.innerHTML = `<div class="muted-sm" style="text-align:center;padding:20px">No se pudo mostrar el documento.</div>`; }
}

function pintarCampoFirma(el, c){
  const ft = FIELD_TYPES[c.tipo]||FIELD_TYPES.texto;
  if(c.tipo==='firma'){
    el.innerHTML = firmaState.firma ? `<img src="${firmaState.firma}">` : `<span class="cf-hint">${ft.icon} Toca para firmar</span>`;
    el.onclick = ()=> abrirPadFirma();
  } else if(c.tipo==='selfie' || c.tipo==='foto_id'){
    const key = c.tipo==='selfie' ? 'selfie' : 'fotoId';
    el.innerHTML = firmaState[key] ? `<img src="${firmaState[key]}">` : `<span class="cf-hint">${ft.icon} Tocar</span>`;
    el.onclick = ()=> tomarFotoCampo(key);
  } else if(c.tipo==='fecha'){
    if(firmaState.campos[c.id]==null) firmaState.campos[c.id]=new Date().toLocaleDateString('es-CO');
    el.innerHTML = `<span class="cf-val">${esc(firmaState.campos[c.id])}</span>`;
    el.onclick = null;
  } else if(c.tipo==='nombre_part' || c.tipo==='cedula_part'){
    const val = c.tipo==='nombre_part' ? (firmaState.firmante.nombre||'') : (firmaState.firmante.identificacion||'');
    el.innerHTML = val ? `<span class="cf-val">${esc(val)}</span>` : `<span class="cf-hint">${ft.icon} ${esc(ft.label)} (automático)</span>`;
    el.onclick = null;
  } else {
    const ph = c.tipo==='nombre' ? 'Tu nombre' : 'Escribe aquí';
    let v = firmaState.campos[c.id];
    if(v==null){ v = c.tipo==='nombre' ? (firmaState.firmante.nombre||'') : ''; if(v) firmaState.campos[c.id]=v; }
    el.innerHTML = `<input class="cf-input" value="${esc(v)}" placeholder="${ph}">`;
    el.querySelector('input').oninput = (ev)=>{ firmaState.campos[c.id]=ev.target.value; };
  }
}

function tomarFotoCampo(key){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.setAttribute('capture', key==='fotoId' ? 'environment' : 'user');
  // El input DEBE estar en el DOM para que en móvil el onchange dispare de forma confiable (si no, a veces falla la 1ª vez)
  inp.style.position='fixed'; inp.style.left='-9999px'; inp.style.opacity='0';
  document.body.appendChild(inp);
  inp.onchange=async ()=>{
    try{
      const file=inp.files[0]; if(!file) return;
      const box=document.getElementById('cap_'+key);
      if(box) box.innerHTML=`<div class="muted-sm" style="padding:8px">Procesando imagen…</div>`;
      firmaState[key] = await comprimirImagen(file, key==='fotoId'?1000:600);
      const box2=document.getElementById('cap_'+key);
      if(box2){ box2.innerHTML=`<div class="cap-prev"><img src="${firmaState[key]}"><button class="btn btn-ghost btn-sm" data-recap="${key}">Cambiar</button></div>`; box2.querySelector('[data-recap]').onclick=()=>tomarFotoCampo(key); }
      toast(key==='selfie'?"Selfie lista":"Foto lista","ok");
    }catch(e){ console.error(e); toast("No se pudo procesar la imagen, intenta de nuevo","err"); }
    finally{ inp.remove(); }
  };
  inp.click();
}

async function confirmarFirma(){
  const c = firmaState.config, d = firmaState.doc, g = id => document.getElementById(id);
  if(!g('ff_acepto')?.checked){ toast("Debes aceptar la declaración para poder firmar","err"); return; }
  const camposDoc = d.contenido||[];
  const campoNombre = camposDoc.find(x=>x.tipo==='nombre');
  const nombre = (g('ff_nombre')?.value||"").trim() || (campoNombre ? (firmaState.campos[campoNombre.id]||'') : '').trim() || firmaState.firmante.nombre || "";
  const correo = (g('ff_correo')?.value||"").trim() || firmaState.firmante.correo || "";
  const identificacion = (g('ff_id')?.value||"").trim() || firmaState.firmante.identificacion || "";
  const cargo = (g('ff_cargo')?.value||"").trim() || firmaState.firmante.cargo || "";
  if(!nombre){ toast("Falta tu nombre","err"); return; }
  if(c.correo && !correo){ toast("El correo es obligatorio","err"); return; }
  if(c.identificacion && !identificacion){ toast("La identificación es obligatoria","err"); return; }
  if(c.cargo && !cargo){ toast("El cargo es obligatorio","err"); return; }
  if(campoNombre) firmaState.campos[campoNombre.id] = nombre;
  const exigeFirma = c.firma || camposDoc.some(x=>x.tipo==='firma');
  if(exigeFirma && (!sigPad || sigPad.isEmpty())){ toast("Debes firmar en el recuadro de abajo","err"); return; }
  if(sigPad && !sigPad.isEmpty()) firmaState.firma = sigPad.dataURL();
  if(c.selfie && !firmaState.selfie){ toast("Falta la selfie","err"); return; }
  if(c.foto_id && !firmaState.fotoId){ toast("Falta la foto de tu documento de identidad","err"); return; }
  if(c.gps && !firmaState.gps){ toast("Comparte tu ubicación","err"); return; }

  const det = detectarNavegador();
  let ip=null;
  if(c.ip){ try{ const r=await fetch('https://api.ipify.org?format=json'); ip=(await r.json()).ip; }catch(e){} }
  const evidencia = {
    fecha_hora: c.fecha_hora ? new Date().toISOString() : null,
    ip: c.ip ? ip : null,
    navegador: c.navegador ? det.navegador : null,
    so: c.so ? det.so : null,
    gps: c.gps ? firmaState.gps : null,
    campos: firmaState.campos,
    aceptacion: { texto:'Declaración de firma electrónica - Ley 527 de 1999', aceptado:true, fecha:new Date().toISOString() }
  };

  const btn=g('btnConfirmarFirma'); btn.disabled=true; btn.innerHTML="Registrando firma…";
  const { data, error } = await sb.rpc("firma_registrar", {
    p_token: firmaState.token, p_nombre:nombre, p_correo:correo, p_identificacion:identificacion, p_cargo:cargo,
    p_firma:firmaState.firma, p_selfie:firmaState.selfie, p_foto_id:firmaState.fotoId, p_evidencia:evidencia
  });
  if(error || !data || !data.ok){
    btn.disabled=false; btn.innerHTML=`${I.check} Confirmar y firmar`;
    const m = data && data.motivo;
    toast(m==='ya_firmado'?"Este documento ya fue firmado":m==='no_es_turno'?"Aún no es tu turno":m==='no_disponible'?"El documento no está disponible":"No se pudo registrar la firma","err");
    return;
  }
  firmaState._miFirmado = { estado:'firmado', nombre, correo, identificacion, cargo, firma:firmaState.firma, selfie:firmaState.selfie, foto_id:firmaState.fotoId, evidencia, firmado_en:new Date().toISOString() };
  document.getElementById('firmaBody').innerHTML = `
    <div class="success-screen">
      <div class="ic">${I.checkBig}</div>
      <h2>¡Documento firmado!</h2>
      <p>Gracias, <b>${esc(nombre)}</b>. Tu firma y la evidencia quedaron registradas de forma segura.${data.finalizado?' El documento está completo.':''}</p>
      <div style="margin-top:22px"><button class="btn btn-green" id="btnDescargarMio" style="padding:13px 26px">${I.pdf} Descargar documento firmado</button></div>
    </div>`;

/* ============================================================
   MÓDULO DOTACIÓN · Entrega de EPP/uniformes con firma digital
   Directorio de trabajadores + catálogo de ítems + entregas
   (firma en persona, mismo dispositivo) + kárdex imprimible.
   ============================================================ */
let DOTACION = { contratos: [], trabajadores: [], catalogo: [], entregas: [], entregaItems: [], predeterminados: [] };
let dotQuery = "";
let entregaDraft = null;
let contratoActualId = localStorage.getItem('dot_contrato_actual') || null; // null hasta que se carguen los contratos; "todos" = vista combinada
/* Selección múltiple para marcar inactivos / eliminar en bloque (solo admin) */
let dotMostrarInactivos = false;
let seleccionadosDot = new Set();

async function loadDotacionState(){
  const [co, t, e, ei] = await Promise.all([
    sb.from("dot_contratos").select("id,nombre,activo,creado_en").order("creado_en",{ascending:true}),
    sb.from("dot_trabajadores").select("id,nombre,identificacion,cargo,area,contrato_id,activo,inactivo_por_archivo,creado_en").order("nombre",{ascending:true}),
    sb.from("dot_entregas").select("id,trabajador_id,fecha").order("fecha",{ascending:false}),
    sb.from("dot_entrega_items").select("entrega_id,nombre_item,cantidad")
  ]);
  const err = co.error || t.error || e.error || ei.error;
  if(err){ console.warn(err); toast("Error cargando EPP: "+err.message,"err"); }
  DOTACION.contratos = co.data || [];
  DOTACION.trabajadores = t.data || [];
  DOTACION.entregas = e.data || [];
  DOTACION.entregaItems = ei.data || [];
  // Si el contrato guardado ya no existe (o nunca se eligió uno), cae al primero activo, o al primero que haya
  const existe = contratoActualId==='todos' || DOTACION.contratos.some(x=>x.id===contratoActualId);
  if(!existe){
    const primero = DOTACION.contratos.find(x=>x.activo) || DOTACION.contratos[0];
    contratoActualId = primero ? primero.id : null;
    if(contratoActualId) localStorage.setItem('dot_contrato_actual', contratoActualId);
  }
  // El catálogo y los predeterminados son POR CONTRATO — se cargan después de tener
  // contratoActualId ya resuelto. En modo "todos" (o sin contrato) quedan vacíos.
  if(contratoActualId && contratoActualId!=='todos'){
    const [{ data:c, error:ec }, { data:pd, error:epd }] = await Promise.all([
      sb.from("dot_catalogo").select("*").eq("contrato_id", contratoActualId).order("nombre",{ascending:true}),
      sb.from("dot_predeterminados").select("id,nombre,responsable_nombre,responsable_cargo,firma").eq("contrato_id", contratoActualId).order("creado_en",{ascending:true})
    ]);
    if(ec) console.warn(ec);
    if(epd) console.warn(epd);
    DOTACION.catalogo = c || [];
    DOTACION.predeterminados = pd || [];
  } else {
    DOTACION.catalogo = [];
    DOTACION.predeterminados = [];
  }
}

function contratoActual(){ return DOTACION.contratos.find(x=>x.id===contratoActualId) || null; }
/* Trabajadores del contrato seleccionado (o todos, en vista combinada) */
function trabajadoresDelContrato(){
  return contratoActualId==='todos' ? DOTACION.trabajadores : DOTACION.trabajadores.filter(t=>t.contrato_id===contratoActualId);
}

/* ---------- Panel principal ---------- */
function entregasDelContrato(){
  if(contratoActualId==='todos') return DOTACION.entregas;
  const ids = new Set(trabajadoresDelContrato().map(t=>t.id));
  return DOTACION.entregas.filter(e=>ids.has(e.trabajador_id));
}

/* Lista actualmente visible (contrato + búsqueda + filtro de inactivos) — la usan tanto
   la grilla como la casilla "Todos", para que seleccione justo lo que se está viendo. */
function trabajadoresFiltradosDot(){
  let db = trabajadoresDelContrato();
  if(!dotMostrarInactivos) db = db.filter(t=>t.activo!==false);
  const q = dotQuery.trim().toLowerCase();
  if(q) db = db.filter(t=>
    (t.nombre||"").toLowerCase().includes(q) ||
    (t.identificacion||"").toLowerCase().includes(q) ||
    (t.cargo||"").toLowerCase().includes(q) ||
    (t.area||"").toLowerCase().includes(q)
  );
  return db;
}

function actualizarContadorSeleccionDot(){
  const el = document.getElementById('contadorSeleccionDot');
  if(el) el.textContent = seleccionadosDot.size+' seleccionado(s)';
}

/* Se llama cada vez que cambia la selección (una tarjeta o la casilla "Todos"): muestra/oculta
   la barra de acciones en bloque y sincroniza la casilla "Todos" sin recargar toda la grilla. */
function actualizarBarraSeleccionDot(){
  const barra = document.getElementById('barraSeleccionDot');
  if(barra) barra.style.display = seleccionadosDot.size ? 'flex' : 'none';

    const visibles = trabajadoresFiltradosDot();
    chkTodos.checked = visibles.length>0 && visibles.every(t=>seleccionadosDot.has(t.id));
  }
}

/* Si al borrar trabajadores un contrato queda en CERO trabajadores, el contrato
   también se borra — pedido explícito del usuario: un contrato vacío no tiene
   razón para seguir en el selector. Requiere CAMBIOS_SQL_26.sql (agrega "on
   delete cascade" en catálogo/firmas predeterminadas, si no la borrada del
   contrato falla porque esas tablas todavía lo referencian). */
async function borrarContratosVaciosDot(contratoIdsTocados){
  const ids = [...new Set(contratoIdsTocados)].filter(Boolean);
  if(!ids.length) return;
  const { data: restantes } = await sb.from("dot_trabajadores").select("contrato_id").in("contrato_id", ids);
  const conGente = new Set((restantes||[]).map(r=>r.contrato_id));
  const vacios = ids.filter(cid=>!conGente.has(cid));
  if(!vacios.length) return;
  const nombres = vacios.map(cid=>DOTACION.contratos.find(c=>c.id===cid)?.nombre).filter(Boolean);
  const { error } = await sb.from("dot_contratos").delete().in("id", vacios);
  if(error){ console.warn(error); toast("No se pudo borrar el contrato que quedó vacío: "+error.message,"err"); return; }
  if(vacios.includes(contratoActualId)){ contratoActualId='todos'; localStorage.setItem('dot_contrato_actual','todos'); }
  toast(`${nombres.length===1?`Contrato "${nombres[0]}" eliminado`:nombres.length+' contratos eliminados'} por quedar sin trabajadores`,"ok");
}

    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confEliminarSeleccionDot">${I.trash} Sí, eliminar ${ids.length}</button></div></div>`);
  document.getElementById('confEliminarSeleccionDot').onclick = async ()=>{
    const btn=document.getElementById("confEliminarSeleccionDot"); btn.disabled=true; btn.innerHTML="Eliminando…";
    bloquear("Eliminando…");

      await loadDotacionState();
      seleccionadosDot.clear();
      closeModal();
      toast(`${ids.length} trabajador(es) eliminados`,"ok");
      renderDotacionAdmin();
    } finally { desbloquear(); }
  };
}

  const { data, error } = await sb.from("dot_entregas").select("id,trabajador_id,creado_en,responsable_nombre,via").in("id", idsHoy).order("creado_en",{ascending:false});
  if(error){ host.innerHTML = `<div class="empty"><h3>No se pudo cargar</h3><p>${esc(error.message)}</p></div>`; return; }

/* comoRaiz=true: se abre SIN modal "padre" al que volver (ej. desde la pantalla
   vacía "Crea tu primer contrato") — la X/Cancelar debe cerrar de una, no intentar
   volver a ningún lado. Sin esto, openSubModal deja pendiente un "volver" que la
   primera X consume sin cerrar nada (hay que darle una segunda vez). */
function abrirFormContrato(id, alGuardar, comoRaiz){
  const c = id ? DOTACION.contratos.find(x=>x.id===id) : null;
  const html = `<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>${c?'Renombrar contrato':'Nuevo contrato'}</h2><p>Ej. "Hospital de Medellín", "Colegio San José"…</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Nombre del contrato *</label><input id="ctNombre" value="${esc(c?.nombre||'')}" placeholder="Nombre del cliente o contrato"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarContrato">${I.check} Guardar</button>
    </div></div>`;
  if(comoRaiz) openModal(html); else openSubModal(html, ()=>{ if(alGuardar) alGuardar(); else abrirGestionContratos(); });
  document.getElementById('btnGuardarContrato').onclick = async ()=>{
    const nombre = document.getElementById('ctNombre').value.trim();
    if(!nombre){ toast("Escribe el nombre del contrato","err"); return; }
    const btn = document.getElementById('btnGuardarContrato'); btn.disabled=true; btn.innerHTML="Guardando…";
    let error, data;
    if(c){ ({error} = await sb.from("dot_contratos").update({nombre}).eq("id",c.id)); }
    else { ({data,error} = await sb.from("dot_contratos").insert({nombre}).select().single()); }
    if(error){ btn.disabled=false; btn.innerHTML=`${I.check} Guardar`; toast("No se pudo guardar: "+error.message,"err"); return; }
    await loadDotacionState();
    if(!c && data) { contratoActualId = data.id; localStorage.setItem('dot_contrato_actual', data.id); }
    toast(c?"Contrato actualizado":"Contrato creado","ok");
    closeModal(); // no-comoRaiz: vuelve a "alGuardar" (gestión de contratos) solo por el _modalVolver
    if(comoRaiz && alGuardar) alGuardar(); // comoRaiz no deja _modalVolver puesto, así que aquí se llama directo
  };
}

/* ---------- Corregir cargos en bloque — útil cuando la carga masiva trajo el mismo
   error de tipeo repetido en muchos trabajadores (ej. "OPERARRIO" en vez de "OPERARIO").
   Renombra el cargo en TODOS los trabajadores que lo tengan escrito exactamente igual,
   dentro del contrato actual (o de todos, en modo "todos los contratos"). ---------- */
function abrirCorregirCargosDot(){
  const trabs = trabajadoresDelContrato();
  const porCargo = {};
  trabs.forEach(t=>{
    const k = (t.cargo||'').trim();
    porCargo[k] = (porCargo[k]||0) + 1;
  });
  const lista = Object.keys(porCargo).sort((a,b)=> porCargo[b]-porCargo[a]);
  openModal(`<div class="modal" style="max-width:520px">
    <div class="modal-head"><div><h2>Corregir cargos</h2><p>Renombra un cargo y se corrige de una vez en todos los trabajadores que lo tengan escrito igual.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      ${lista.length ? lista.map(c=>`
        <div class="cat-row">
          <span style="flex:1;font-weight:600;font-size:13.5px">${c?esc(c):'<span class="muted-sm">(sin cargo)</span>'} <span class="muted-sm">— ${porCargo[c]} trabajador${porCargo[c]===1?'':'es'}</span></span>
          <button class="icon-btn" title="Renombrar" data-cargo-edit="${esc(c)}">${I.pen}</button>
        </div>`).join('') : '<p class="muted-sm">No hay trabajadores en este contrato.</p>'}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>
  </div>`);
  document.querySelectorAll('[data-cargo-edit]').forEach(b=>{
    const cargoActual = b.dataset.cargoEdit;
    b.onclick = ()=> abrirRenombrarCargoDot(cargoActual, porCargo[cargoActual]);
  });
}
function abrirRenombrarCargoDot(cargoActual, cantidad){
  openSubModal(`<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>Renombrar cargo</h2><p>Se corregirá en ${cantidad} trabajador${cantidad===1?'':'es'} de este contrato.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Texto correcto *</label><input id="cargoNuevo" value="${esc(cargoActual)}" placeholder="Cargo"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarCargo">${I.check} Corregir</button>
    </div></div>`, ()=> abrirCorregirCargosDot());
  document.getElementById('btnGuardarCargo').onclick = async ()=>{
    const nuevo = document.getElementById('cargoNuevo').value.trim();
    if(!nuevo){ toast("Escribe el texto correcto","err"); return; }
    if(nuevo === cargoActual){ toast("No cambiaste nada","err"); return; }
    const btn = document.getElementById('btnGuardarCargo'); btn.disabled=true; btn.innerHTML="Corrigiendo…";
    bloquear("Corrigiendo cargo…");
    try{
      const ids = trabajadoresDelContrato().filter(t=>(t.cargo||'').trim()===cargoActual).map(t=>t.id);
      const { error } = await porLotes(ids, lote=> sb.from("dot_trabajadores").update({ cargo: nuevo }).in("id", lote));
      if(error){ toast("No se pudo corregir: "+error.message,"err"); return; }
      await loadDotacionState();
      toast(`Cargo corregido en ${ids.length} trabajador(es)`,"ok");
      closeModal();
      renderDotacionBody();
    } finally { desbloquear(); }
  };
}

function renderContratosLista(){
  const host = document.getElementById('contratosLista'); if(!host) return;
  host.innerHTML = DOTACION.contratos.map(c=>{
    const n = DOTACION.trabajadores.filter(t=>t.contrato_id===c.id).length;
    return `<div class="cat-row">
      <span style="flex:1;font-weight:600;font-size:13.5px;${c.activo?'':'opacity:.5'}">${esc(c.nombre)}${c.activo?'':' · archivado'}</span>
      <span class="muted-sm" style="width:90px">${n} trabajador${n===1?'':'es'}</span>
      <button class="icon-btn" title="Renombrar" data-ct-edit="${c.id}">${I.pen}</button>
      <button class="icon-btn" title="${c.activo?'Archivar':'Reactivar'}" data-ct-toggle="${c.id}">${c.activo?I.lock:I.check}</button>
    </div>`;
  }).join('');
  host.querySelectorAll('[data-ct-edit]').forEach(b=>{ b.onclick = ()=> abrirFormContrato(b.dataset.ctEdit, ()=>abrirGestionContratos()); });
  host.querySelectorAll('[data-ct-toggle]').forEach(b=>{
    b.onclick = async ()=>{
      const c = DOTACION.contratos.find(x=>x.id===b.dataset.ctToggle);
      const archivando = c.activo;
      const { error } = await sb.from("dot_contratos").update({activo: !c.activo}).eq("id", c.id);
      if(error){ toast("No se pudo actualizar: "+error.message,"err"); return; }
      let nTocados = 0;
      if(archivando){
        // Al archivar un contrato, sus trabajadores dejan de tener sentido en la vista
        // normal — se marcan inactivos igual que si el admin los hubiera seleccionado
        // uno por uno (se conserva todo su historial de entregas y firmas). Se marcan
        // con inactivo_por_archivo:true para poder reactivar EXACTAMENTE a estos (y no a
        // alguien que ya estaba inactivo por otra razón desde antes de archivar).
        const idsTrab = DOTACION.trabajadores.filter(t=>t.contrato_id===c.id && t.activo!==false).map(t=>t.id);
        nTocados = idsTrab.length;
        if(nTocados){
          const { error: e2 } = await porLotes(idsTrab, lote=> sb.from("dot_trabajadores").update({activo:false, inactivo_por_archivo:true}).in("id", lote));
          if(e2){ toast("Contrato archivado, pero no se pudo marcar a los trabajadores como inactivos: "+e2.message,"err"); }
        }
      } else {
        // Al reactivar, solo se reactivan los que quedaron inactivos POR archivar este
        // contrato — no a quien ya estaba inactivo antes por otro motivo.
        const idsTrab = DOTACION.trabajadores.filter(t=>t.contrato_id===c.id && t.inactivo_por_archivo).map(t=>t.id);
        nTocados = idsTrab.length;
        if(nTocados){
          const { error: e2 } = await porLotes(idsTrab, lote=> sb.from("dot_trabajadores").update({activo:true, inactivo_por_archivo:false}).in("id", lote));
          if(e2){ toast("Contrato reactivado, pero no se pudo reactivar a sus trabajadores: "+e2.message,"err"); }
        }
      }
      await loadDotacionState();
      renderContratosLista();
      toast(archivando
        ?`Contrato archivado${nTocados?` — ${nTocados} trabajador(es) marcados como inactivos`:''}`
        :`Contrato reactivado${nTocados?` — ${nTocados} trabajador(es) reactivados`:''}`,"ok");
    };
  });
}

async function guardarTrabajador(id){

  bloquear("Guardando…");

  if(id){ ({error} = await sb.from("dot_trabajadores").update({nombre,identificacion,cargo,area,contrato_id}).eq("id",id)); }

async function cargarTrabajadoresExcelDot(file){
  if(!window.XLSX){ toast("No se pudo cargar el lector de Excel (revisa tu conexión)","err"); return; }
  if(contratoActualId==='todos'){ toast("Selecciona un contrato específico antes de cargar trabajadores","err"); return; }
  bloquear("Leyendo archivo…");
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
    if(!filas.length){ toast("El archivo está vacío","err"); return; }
    const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
    const head = (filas[0]||[]).map(norm);
    const findCol = (...alts)=> head.findIndex(h => alts.some(a => h.includes(a)));
    let cNom = findCol("nombre"), cId = findCol("identificacion","cedula","documento","cc"),
        cCar = findCol("cargo"), cAr = findCol("area","dependencia");
    let start = 1;
    if(cNom === -1 && cId === -1){ cNom=0; cId=1; cCar=2; cAr=3; start=0; }
    const filasValidas = []; let ignoradas = 0;
    for(let i=start;i<filas.length;i++){
      const r = filas[i]; if(!r) continue;
      const nombre = String(cNom>=0?r[cNom]:"").trim();
      const identificacion = String(cId>=0?r[cId]:"").trim();
      const cargo = String(cCar>=0?r[cCar]:"").trim();
      const area = String(cAr>=0?r[cAr]:"").trim();
      if(!nombre && !identificacion) continue;
      if(!nombre || !identificacion){ ignoradas++; continue; }
      filasValidas.push({ nombre, identificacion, cargo:cargo||null, area:area||null });
    }
    if(!filasValidas.length){ toast("No se encontraron filas válidas (se requiere nombre e identificación)","err"); return; }
    const keyOf = s => s.replace(/[^0-9A-Za-z]/g,"").toLowerCase();
    // La cédula es única POR CONTRATO: solo comparamos contra los trabajadores de este mismo contrato
    const existentes = {}; trabajadoresDelContrato().forEach(t=>{ existentes[keyOf(t.identificacion)] = t; });
    const nuevos = [], actualizaciones = [];
    const vistosEnArchivo = new Set(); let dup = 0;
    filasValidas.forEach(f=>{
      const k = keyOf(f.identificacion);
      if(vistosEnArchivo.has(k)){ dup++; return; }
      vistosEnArchivo.add(k);
      if(existentes[k]){ actualizaciones.push({ id: existentes[k].id, ...f }); }
      else { nuevos.push({ ...f, contrato_id: contratoActualId }); }
    });
    let errores = 0;
    if(nuevos.length){
      const { error } = await sb.from("dot_trabajadores").insert(nuevos);
      if(error){ errores++; console.error(error); }
    }
    for(const a of actualizaciones){
      const { id, ...datos } = a;
      const { error } = await sb.from("dot_trabajadores").update(datos).eq("id", id);
      if(error) errores++;
    }
    await loadDotacionState();
    renderDotTrabajadoresGrid();
    let msg = `${nuevos.length} nuevo(s), ${actualizaciones.length} actualizado(s)`;
    if(ignoradas) msg += ` · ${ignoradas} sin nombre/cédula omitida(s)`;
    if(dup) msg += ` · ${dup} duplicada(s) en el archivo`;
    if(errores) msg += ` · ${errores} error(es)`;
    toast(msg, errores?"err":"ok");
  }catch(e){ console.error(e); toast("No se pudo leer el archivo: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

function descargarPlantillaCatalogoDot(){
  if(!window.XLSX){ toast("No se pudo cargar el generador de Excel (revisa tu conexión)","err"); return; }
  const datos = [
    ["Nombre del ítem","Unidad"],

  ];
  const ws = XLSX.utils.aoa_to_sheet(datos);
  ws["!cols"] = [{wch:32},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Catalogo");
  XLSX.writeFile(wb, "Plantilla_catalogo_dotacion.xlsx");

}

async function cargarCatalogoExcelDot(file){
  if(!window.XLSX){ toast("No se pudo cargar el lector de Excel (revisa tu conexión)","err"); return; }
  bloquear("Leyendo archivo…");
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
    if(!filas.length){ toast("El archivo está vacío","err"); return; }
    const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
    const head = (filas[0]||[]).map(norm);
    const findCol = (...alts)=> head.findIndex(h => alts.some(a => h.includes(a)));
    let cNom = findCol("nombre","item","ítem"), cUn = findCol("unidad");
    let start = 1;
    if(cNom === -1){ cNom=0; cUn=1; start=0; }
    const nombresValidos = []; let ignoradas = 0;
    for(let i=start;i<filas.length;i++){
      const r = filas[i]; if(!r) continue;
      const nombre = String(cNom>=0?r[cNom]:"").trim();
      const unidad = String(cUn>=0?r[cUn]:"").trim();
      if(!nombre){ if(r.some(v=>String(v||"").trim())) ignoradas++; continue; }
      nombresValidos.push({ nombre, unidad: unidad||null, contrato_id: contratoActualId });
    }
    if(!nombresValidos.length){ toast("No se encontraron filas válidas (se requiere el nombre del ítem)","err"); return; }
    const keyOf = s => s.trim().toLowerCase();
    const existentes = new Set(DOTACION.catalogo.map(c=>keyOf(c.nombre)));
    const vistosEnArchivo = new Set(); let dup = 0, yaExistian = 0;
    const nuevos = [];
    nombresValidos.forEach(it=>{
      const k = keyOf(it.nombre);
      if(vistosEnArchivo.has(k)){ dup++; return; }
      vistosEnArchivo.add(k);
      if(existentes.has(k)){ yaExistian++; return; }
      nuevos.push(it);
    });
    if(nuevos.length){
      const { error } = await sb.from("dot_catalogo").insert(nuevos);
      if(error){ toast("No se pudo cargar el catálogo: "+error.message,"err"); return; }
    }
    await loadDotacionState();
    renderCatalogoLista();
    let msg = `${nuevos.length} ítem(s) nuevo(s) agregado(s)`;
    if(yaExistian) msg += ` · ${yaExistian} ya existían (sin cambios)`;
    if(ignoradas) msg += ` · ${ignoradas} fila(s) sin nombre omitida(s)`;
    if(dup) msg += ` · ${dup} duplicada(s) en el archivo`;
    toast(msg,"ok");
  }catch(e){ console.error(e); toast("No se pudo leer el archivo: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}
