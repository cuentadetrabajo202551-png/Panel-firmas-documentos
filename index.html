    <div class="modal-foot">
      <button class="btn btn-ghost" id="sigClear">${I.trash} Limpiar</button>
      <button class="btn btn-green" id="sigUsar">${I.check} Usar firma</button>
    </div></div>`);
  initSignature();
  document.getElementById('sigClear').onclick = ()=> sigPad.clear();
  document.getElementById('sigUsar').onclick = ()=>{
    if(!sigPad || sigPad.isEmpty()){ toast("Primero firma","err"); return; }
    firmaState.firma = sigPad.dataURL(); closeModal();
    document.querySelectorAll('.campo-firma[data-tipo="firma"]').forEach(el=>{ const c=(firmaState.doc.contenido||[]).find(x=>x.id===el.dataset.id); if(c) pintarCampoFirma(el,c); });
    toast("Firma lista","ok");
  };
}

function tomarFotoCampo(key){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.setAttribute('capture', key==='fotoId' ? 'environment' : 'user');
  inp.onchange=async ()=>{ const file=inp.files[0]; if(!file) return;
    firmaState[key] = await comprimirImagen(file, key==='fotoId'?1000:600);
    const tipo = key==='fotoId' ? 'foto_id' : 'selfie';
    document.querySelectorAll(`.campo-firma[data-tipo="${tipo}"]`).forEach(el=>{ const c=(firmaState.doc.contenido||[]).find(x=>x.id===el.dataset.id); if(c) pintarCampoFirma(el,c); });
    const box=document.getElementById('cap_'+key);
    if(box){ box.innerHTML=`<div class="cap-prev"><img src="${firmaState[key]}"><button class="btn btn-ghost btn-sm" data-recap="${key}">Cambiar</button></div>`; box.querySelector('[data-recap]').onclick=()=>tomarFotoCampo(key); }
    toast(key==='selfie'?"Selfie lista":"Foto lista","ok");
  };
  inp.click();
}

function wireFirmaExtra(){
  document.querySelectorAll('#firmaExtra [data-cap]').forEach(btn=>{ btn.onclick=()=>tomarFotoCampo(btn.dataset.cap); });
  const gbtn=document.getElementById('btnGps');
  if(gbtn) gbtn.onclick = async ()=>{
    gbtn.disabled=true; gbtn.innerHTML='Obteniendo ubicación…';
    const gps = await obtenerGPS();
    if(gps){ firmaState.gps=gps; document.getElementById('gpsBox').innerHTML=`<div class="cap-ok">${I.check} Ubicación capturada (±${Math.round(gps.precision)} m)</div>`; }
    else { gbtn.disabled=false; gbtn.innerHTML=`${I.pin} Reintentar ubicación`; toast("No se pudo obtener la ubicación. Revisa los permisos.","err"); }
  };
}

function tomarFoto(key){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.setAttribute('capture', key==='fotoId' ? 'environment' : 'user');
  inp.onchange=async ()=>{ const file=inp.files[0]; if(!file) return;
    firmaState[key] = await comprimirImagen(file, key==='fotoId'?1000:600);
    const box=document.getElementById('cap_'+key);
    box.innerHTML=`<div class="cap-prev"><img src="${firmaState[key]}"><button class="btn btn-ghost btn-sm" data-recap="${key}">Cambiar</button></div>`;
    box.querySelector('[data-recap]').onclick=()=>tomarFoto(key);
  };
  inp.click();
}

function wireFirmaForm(){
  document.querySelectorAll('[data-cap]').forEach(btn=>{ btn.onclick=()=>tomarFoto(btn.dataset.cap); });
  const gbtn=document.getElementById('btnGps');
  if(gbtn) gbtn.onclick = async ()=>{
    gbtn.disabled=true; gbtn.innerHTML='Obteniendo ubicación…';
    const g = await obtenerGPS();
    if(g){ firmaState.gps=g; document.getElementById('gpsBox').innerHTML=`<div class="cap-ok">${I.check} Ubicación capturada (±${Math.round(g.precision)} m)</div>`; }
    else { gbtn.disabled=false; gbtn.innerHTML=`${I.pin} Reintentar ubicación`; toast("No se pudo obtener la ubicación. Revisa los permisos.","err"); }
  };
  if(firmaState.config.firma){ initSignature(); const sc=document.getElementById('sigClear'); if(sc) sc.onclick=()=>sigPad.clear(); }
  document.getElementById('btnConfirmarFirma').onclick = confirmarFirma;
}

async function confirmarFirma(){
  const c = firmaState.config, d = firmaState.doc, g = id => document.getElementById(id);
  const camposDoc = d.contenido||[];
  const campoNombre = camposDoc.find(x=>x.tipo==='nombre');
  const nombre = (campoNombre ? (firmaState.campos[campoNombre.id]||'') : '').trim() || firmaState.firmante.nombre || "";
  const correo = (g('ff_correo')?.value||"").trim() || firmaState.firmante.correo || "";
  const identificacion = (g('ff_id')?.value||"").trim() || firmaState.firmante.identificacion || "";
  const cargo = (g('ff_cargo')?.value||"").trim() || firmaState.firmante.cargo || "";
  if(!nombre){ toast("Falta tu nombre","err"); return; }
  if(c.correo && !correo){ toast("El correo es obligatorio","err"); return; }
  if(c.identificacion && !identificacion){ toast("La identificación es obligatoria","err"); return; }
  if(c.cargo && !cargo){ toast("El cargo es obligatorio","err"); return; }
  const exigeFirma = c.firma || camposDoc.some(x=>x.tipo==='firma');
  if(exigeFirma && !firmaState.firma){ toast("Debes firmar el documento (toca el campo de firma)","err"); return; }
  if(c.selfie && !firmaState.selfie){ toast("Falta la selfie","err"); return; }
  if(c.foto_id && !firmaState.fotoId){ toast("Falta la foto de tu documento de identidad","err"); return; }
  if(c.gps && !firmaState.gps){ toast("Comparte tu ubicación","err"); return; }

  const det = detectarNavegador();
  let ip=null;
  if(c.ip){ try{ const r=await fetch('https://api.ipify.org?format=json'); ip=(await r.json()).ip; }catch(e){} }
  const evidencia = {
    fecha_hora: c.fecha_hora ? new Date().toISOString() : null,
    ip: c.ip ? ip : null,
    navegador: c.navegador ? det.navegador : null,
    so: c.so ? det.so : null,
    gps: c.gps ? firmaState.gps : null,
    campos: firmaState.campos
  };

  const btn=g('btnConfirmarFirma'); btn.disabled=true; btn.innerHTML="Registrando firma…";
  const { data, error } = await sb.rpc("firma_registrar", {
    p_token: firmaState.token, p_nombre:nombre, p_correo:correo, p_identificacion:identificacion, p_cargo:cargo,
    p_firma:firmaState.firma, p_selfie:firmaState.selfie, p_foto_id:firmaState.fotoId, p_evidencia:evidencia
  });
  if(error || !data || !data.ok){
    btn.disabled=false; btn.innerHTML=`${I.check} Confirmar y firmar`;
    const m = data && data.motivo;
    toast(m==='ya_firmado'?"Este documento ya fue firmado":m==='no_es_turno'?"Aún no es tu turno":m==='no_disponible'?"El documento no está disponible":"No se pudo registrar la firma","err");
    return;
  }
  document.getElementById('firmaBody').innerHTML = `
    <div class="success-screen">
      <div class="ic">${I.checkBig}</div>
      <h2>¡Documento firmado!</h2>
      <p>Gracias, <b>${esc(nombre)}</b>. Tu firma y la evidencia quedaron registradas de forma segura.${data.finalizado?' El documento está completo.':''}</p>
    </div>`;
}

/* ---------- Auto-refresh del panel al volver a la pestaña ---------- */
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden || esRutaPublica()) return;
  router();   // re-renderiza el módulo activo (asistencia o documentos)
});

/* ---------- Si la sesión se cierra, volver al login ---------- */
sb.auth.onAuthStateChange((event)=>{
  if(event === "SIGNED_OUT" && !esRutaPublica()) renderLogin();
});

/* ---------- Arranque ---------- */
router();
</script>
