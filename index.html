async function guardarEdicionEntregaDtl(){
  const d = editarEntregaDtlDraft;
  const fecha = document.getElementById('eeDtlFecha').value;
  const pantalonCantidad = +document.getElementById('eeDtlPantalonCant').value || 0;
  const pantalonTalla = document.getElementById('eeDtlPantalonTalla').value.trim();
  const camisaCantidad = +document.getElementById('eeDtlCamisaCant').value || 0;
  const camisaTalla = document.getElementById('eeDtlCamisaTalla').value.trim();
  const botasCantidad = +document.getElementById('eeDtlBotasCant').value || 0;
  const botasTalla = document.getElementById('eeDtlBotasTalla').value.trim();
  const adicional = document.getElementById('eeDtlAdicional').value.trim();

  if(camisaCantidad>0 && !camisaTalla){ toast("Escribe la talla de la camisa","err"); return; }
  if(botasCantidad>0 && !botasTalla){ toast("Escribe la talla de las botas","err"); return; }

/* Resumen legible del user-agent capturado por el servidor en la entrega remota — solo
   identifica la familia de sistema operativo, no busca precisión de navegador/versión. */
function resumenDispositivoUA(ua){
  if(!ua) return null;
  if(/ipad/i.test(ua)) return 'iPad';
  if(/iphone/i.test(ua)) return 'iPhone';
  if(/android/i.test(ua)) return 'Android';
  if(/windows/i.test(ua)) return 'Windows';
  if(/macintosh|mac os x/i.test(ua)) return 'Mac';
  if(/linux/i.test(ua)) return 'Linux';
  return 'Otro dispositivo';
}

/* ---------- Kárdex acumulado en PDF ---------- */
async function construirKardexDtlPDF(trabajadorId){
  const { data: t } = await sb.from("dtl_trabajadores").select("id,nombre,identificacion,cargo,area,entidad_id").eq("id",trabajadorId).maybeSingle();
  if(!t) return null;
  const { data: entregas } = await sb.from("dtl_entregas")
    .select("id,fecha,pantalon_cantidad,pantalon_talla,camisa_cantidad,camisa_talla,botas_cantidad,botas_talla,adicional,responsable_nombre,firma_trabajador,firma_responsable,foto_trabajador,creado_en,via,ip_address,dispositivo_ua")
    .eq("trabajador_id", trabajadorId).order("fecha",{ascending:true});
  const listaEntregas = entregas || [];
  if(!listaEntregas.length) return null;
  const nombreEntidad = (DTL.entidades.find(x=>x.id===t.entidad_id)||{}).nombre || "";

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const PW = 210, M = 10, RIGHT = PW - M;
  const x0=M, x1=M+18, x2=M+78, x2f=M+104, x3=M+139, x4=RIGHT;

  function grayHead(y,h){ doc.setFillColor(238,241,248); doc.rect(M,y,RIGHT-M,h,"F"); }

  function encabezado(){
    let y=M;
    const hH=24, logoW=44;
    doc.setDrawColor(150,160,190); doc.setLineWidth(0.3); doc.rect(M,y,RIGHT-M,hH);
    doc.line(M+logoW,y,M+logoW,y+hH);
    try{ doc.addImage(LOGO,"JPEG",M+4,y+2,36,36*315/570); }catch(e){}
    doc.setTextColor(20,33,90); doc.setFont("helvetica","bold"); doc.setFontSize(14);
    doc.text("CONTROL DE ENTREGA DE DOTACIÓN", M+logoW+(RIGHT-M-logoW)/2, y+13, {align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(90,90,110);
    doc.text(pdfTexto("Kárdex acumulado por trabajador"+(nombreEntidad?" · "+nombreEntidad:"")+" · Don Aseo Ltda."), M+logoW+(RIGHT-M-logoW)/2, y+19, {align:"center"});
    y += hH;

    const fh=16;
    doc.setDrawColor(150,160,190); doc.rect(M,y,RIGHT-M,fh);
    doc.line(M+95,y,M+95,y+fh);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(90,90,110);
    doc.text("TRABAJADOR", M+3, y+5);
    doc.text("CARGO / ÁREA", M+98, y+5);
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
    doc.text(pdfTexto(t.nombre||""), M+3, y+11);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(60,60,70);
    doc.text("C.C. "+(t.identificacion||""), M+3, y+15.5);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(20,20,20);
    doc.text(doc.splitTextToSize(pdfTexto((t.cargo||"—")+(t.area?(" · "+t.area):"")), RIGHT-M-100), M+98, y+11);
    y += fh + 2;
    return y;
  }

  function tablaHead(y){
    const h=8;
    grayHead(y,h);
    doc.setDrawColor(150,160,190);
    [x0,x1,x2,x2f,x3,x4].forEach(x=>doc.line(x,y,x,y+h));
    doc.rect(M,y,RIGHT-M,h);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(40,40,60);
    const ct=(a,b,txt)=>doc.text(txt,(a+b)/2,y+5.2,{align:"center"});
    ct(x0,x1,"FECHA"); ct(x1,x2,"ELEMENTOS ENTREGADOS");
    ct(x2,x2f,"FOTO"); ct(x2f,x3,"FIRMA TRABAJADOR"); ct(x3,x4,"FIRMA RESPONSABLE");
    return y+h;
  }

  const FOOTER_Y = 282;
  function piePagina(pag){
    doc.setFontSize(5.8); doc.setTextColor(140,140,160);
    doc.text(doc.splitTextToSize(pdfTexto(DTL_DECLARACION), RIGHT-M), PW/2, FOOTER_Y-4, {align:"center"});
    doc.text("Generado el "+fmtDateTime(new Date())+" · Don Aseo Ltda. · Pág. "+pag, PW/2, FOOTER_Y+8, {align:"center"});
  }

  const FOOTER_TOP = 265;
  let y = encabezado();
  y = tablaHead(y);
  let pag = 1;
  const colFotoW = x2f-x2-4;
  for(const e of listaEntregas){
    const partes = [];
    if(e.pantalon_cantidad>0) partes.push("• Pantalón × "+e.pantalon_cantidad+(e.pantalon_talla?" ("+e.pantalon_talla+")":""));
    if(e.camisa_cantidad>0) partes.push("• Camisa × "+e.camisa_cantidad+(e.camisa_talla?" ("+e.camisa_talla+")":""));
    if(e.botas_cantidad>0) partes.push("• Botas × "+e.botas_cantidad+(e.botas_talla?" ("+e.botas_talla+")":""));
    if(e.adicional) partes.push("• "+e.adicional);
    const lineas = partes.length ? partes : ["—"];
    const wrapped = doc.splitTextToSize(pdfTexto(lineas.join("\n")), x2-x1-4);
    let rowH = Math.max(e.via==='remoto' ? 22 : 16, wrapped.length*3.6 + 5);
    let fotoH = 0;
    const dims = e.foto_trabajador ? await getImageSize(e.foto_trabajador) : null;
    if(dims && dims.w>0){ fotoH = Math.min(90, colFotoW * (dims.h/dims.w)); rowH = Math.max(rowH, fotoH+4); }
    if(y + rowH > FOOTER_TOP){
      piePagina(pag);
      doc.addPage(); pag++;
      y = M+2; y = tablaHead(y);
    }
    doc.setDrawColor(180,188,210);
    [x0,x1,x2,x2f,x3,x4].forEach(x=>doc.line(x,y,x,y+rowH));
    doc.line(M,y+rowH,RIGHT,y+rowH);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(20,20,20);
    doc.text(fmtDate(e.fecha), (x0+x1)/2, y+rowH/2-0.5, {align:"center"});
    let yAudit = y+rowH/2+4;
    if(e.creado_en){
      const horaFirma = new Date(e.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'});
      doc.setFontSize(6.5); doc.setTextColor(120,120,140);
      doc.text(horaFirma, (x0+x1)/2, yAudit, {align:"center"});
      yAudit += 3;
    }
    if(e.via==='remoto'){
      doc.setFontSize(5.3); doc.setTextColor(150,150,170);
      if(e.ip_address){ doc.text("IP "+e.ip_address, (x0+x1)/2, yAudit, {align:"center"}); yAudit += 2.6; }
      const disp = resumenDispositivoUA(e.dispositivo_ua);
      if(disp) doc.text(disp, (x0+x1)/2, yAudit, {align:"center"});
    }
    doc.setFontSize(7.4); doc.setTextColor(20,20,20);
    doc.text(wrapped, x1+2, y+5);
    if(e.foto_trabajador){
      try{
        if(dims && dims.w>0) doc.addImage(e.foto_trabajador,"JPEG",x2+2,y+2,colFotoW,fotoH);
        else doc.addImage(e.foto_trabajador,"JPEG",x2+2,y+2,colFotoW,rowH-4);
      }catch(err){}
    }
    if(e.firma_trabajador){ try{ doc.addImage(e.firma_trabajador,"PNG",x2f+3,y+2,x3-x2f-6,rowH-4); }catch(err){} }
    if(e.firma_responsable){ try{ doc.addImage(e.firma_responsable,"PNG",x3+3,y+2,x4-x3-6,rowH-4); }catch(err){} }
    else if(e.via==='remoto'){
      doc.setFont("helvetica","italic"); doc.setFontSize(7.5); doc.setTextColor(130,130,150);
      doc.text("Firmado remotamente", (x3+x4)/2, y+rowH/2, {align:"center"});
      doc.setFont("helvetica","normal");
    }
    doc.setFontSize(6); doc.setTextColor(120,120,140);
    if(e.responsable_nombre) doc.text(pdfTexto(e.responsable_nombre), x3+3, y+rowH-1.5);
    y += rowH;
  }
  piePagina(pag);

  const safe = (t.nombre||"trabajador").replace(/[^\w\sáéíóúñ-]/gi,"").trim().replace(/\s+/g,"_").slice(0,40);
  return { doc, nombreBase: safe };
}

async function generarKardexDtlPDF(trabajadorId){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  bloquear("Generando PDF…");
  try{
    const r = await construirKardexDtlPDF(trabajadorId);
    if(!r){ toast("Este trabajador no tiene entregas registradas","err"); return; }
    r.doc.save("Kardex_dotacion_"+r.nombreBase+".pdf");
    toast("PDF generado","ok");
  }catch(e){ console.error(e); toast("No se pudo generar el PDF: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

async function descargarZipKardexDtlSeleccion(entidadIds){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  if(!window.JSZip){ toast("No se pudo cargar el compresor ZIP (revisa tu conexión)","err"); return; }
  const idsSet = new Set(entidadIds);
  const candidatos = DTL.trabajadores.filter(t=>idsSet.has(t.entidad_id));
  const idsConEntrega = new Set(DTL.entregas.map(e=>e.trabajador_id));
  const lista = candidatos.filter(t=>idsConEntrega.has(t.id));
  if(!candidatos.length){ toast("No hay trabajadores para exportar","err"); return; }
  if(!lista.length){ toast("Ninguno de los trabajadores elegidos tiene entregas registradas todavía","err"); return; }
  bloquear("Preparando ZIP…");
  try{
    const zip = new JSZip();
    const usados = {};
    let incluidos = 0, sinEntregas = candidatos.length - lista.length;
    for(let i=0;i<lista.length;i++){
      const t = lista[i];
      bloquearMsg(`Generando kárdex ${i+1} de ${lista.length}…`);
      try{
        const r = await construirKardexDtlPDF(t.id);
        if(!r){ sinEntregas++; continue; }
        let base = r.nombreBase || ('trabajador_'+(i+1));
        if(usados[base]!=null){ usados[base]++; base = base+'_'+usados[base]; } else usados[base]=0;
        zip.file(base+'.pdf', r.doc.output('arraybuffer'));
        incluidos++;
      }catch(e){ console.warn('kardex zip', t.id, e); }
    }
    if(!incluidos){ toast("Ningún trabajador tiene entregas registradas todavía","err"); return; }
    bloquearMsg("Comprimiendo ZIP…");
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
    const url = URL.createObjectURL(blob);
    const nombreEntidad = entidadIds.length===DTL.entidades.length ? 'todos_los_contratos' : (entidadIds.length===1 ? nombreEntidadDtl(entidadIds[0]) : entidadIds.length+'_contratos');
    const safeEntidad = String(nombreEntidad).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,40);
    const a = document.createElement('a'); a.href=url;
    a.download = 'Kardex_dotacion_'+safeEntidad+'.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 6000);
    let msg = `ZIP generado con ${incluidos} kárdex`;
    if(sinEntregas) msg += ` (${sinEntregas} trabajador(es) sin entregas, omitido(s))`;
    toast(msg,"ok");
  }catch(e){ console.error(e); toast("No se pudo generar el ZIP: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* Excel de entregas de Dotación: una fila por entrega (nombre/identificación/cargo/área + fecha/ítems/responsable).
   Los trabajadores sin ninguna entrega también aparecen, con esas columnas en blanco. */
async function descargarExcelDtlSeleccion(entidadIds){
  if(!window.XLSX){ toast("No se pudo cargar el generador de Excel (revisa tu conexión)","err"); return; }
  const idsSet = new Set(entidadIds);
  const trabajadores = DTL.trabajadores.filter(t=>idsSet.has(t.entidad_id));
  if(!trabajadores.length){ toast("No hay trabajadores para exportar","err"); return; }
  bloquear("Generando Excel…");
  try{
    const idsTrab = trabajadores.map(t=>t.id);
    const { data: entregas, error } = await sb.from("dtl_entregas")
      .select("id,trabajador_id,fecha,pantalon_cantidad,pantalon_talla,camisa_cantidad,camisa_talla,botas_cantidad,botas_talla,adicional,responsable_nombre,via")
      .in("trabajador_id", idsTrab).order("fecha",{ascending:true});
    if(error){ toast("No se pudo cargar: "+error.message,"err"); return; }
    const entregasPorTrab = {};
    (entregas||[]).forEach(e=>{ (entregasPorTrab[e.trabajador_id]=entregasPorTrab[e.trabajador_id]||[]).push(e); });

    const filas = [];
    trabajadores.forEach(t=>{
      const nombreContrato = nombreEntidadDtl(t.entidad_id);
      const entregasT = entregasPorTrab[t.id] || [];
      if(!entregasT.length){
        filas.push({ Contrato:nombreContrato, 'Nombre completo':t.nombre, 'Identificación':t.identificacion, Cargo:t.cargo||'', 'Área':t.area||'', 'Fecha de entrega':'', 'Ítems entregados':'', Responsable:'' });
      } else {
        entregasT.forEach(e=>{
          const partes = [];
          if(e.pantalon_cantidad>0) partes.push('Pantalón × '+e.pantalon_cantidad+(e.pantalon_talla?' ('+e.pantalon_talla+')':''));
          if(e.camisa_cantidad>0) partes.push('Camisa × '+e.camisa_cantidad+(e.camisa_talla?' ('+e.camisa_talla+')':''));
          if(e.botas_cantidad>0) partes.push('Botas × '+e.botas_cantidad+(e.botas_talla?' ('+e.botas_talla+')':''));
          if(e.adicional) partes.push(e.adicional);
          filas.push({
            Contrato: nombreContrato, 'Nombre completo': t.nombre, 'Identificación': t.identificacion,
            Cargo: t.cargo||'', 'Área': t.area||'',
            'Fecha de entrega': fmtDate(e.fecha), 'Ítems entregados': partes.join(', ') || '—',
            Responsable: e.responsable_nombre || (e.via==='remoto' ? '(entrega remota)' : '')
          });
        });
      }
    });
    const ws = XLSX.utils.json_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Dotación');
    const nombreArchivo = entidadIds.length===DTL.entidades.length ? 'todos_los_contratos' : (entidadIds.length===1 ? nombreEntidadDtl(entidadIds[0]) : entidadIds.length+'_contratos');
    const safe = String(nombreArchivo).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,40);
    XLSX.writeFile(wb, 'Entregas_Dotacion_'+safe+'.xlsx');
    toast("Excel generado","ok");
  }catch(e){ console.error(e); toast("No se pudo generar el Excel: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

async function confirmarEntregaDtlPublica(){
  const err = document.getElementById('dpError'); err.textContent = '';

  const bCant = +document.getElementById('dpBotasCant').value || 0;
  const bTalla = document.getElementById('dpBotasTalla').value.trim();
  if(pCant>0 && !pTalla){ err.textContent = 'Escribe la talla del pantalón.'; return; }
  if(cCant>0 && !cTalla){ err.textContent = 'Escribe la talla de la camisa.'; return; }
  if(bCant>0 && !bTalla){ err.textContent = 'Escribe la talla de las botas.'; return; }
  if(APP_CONFIG.dotacionFotoObligatoria && !dtlPublicoState.foto){ err.textContent = 'Tu foto es obligatoria para continuar.'; return; }

  const btn = document.getElementById('dpConfirmarBtn'); btn.disabled=true; btn.innerHTML='Guardando…';
  const firma = sigPad.dataURL();
  const { data, error } = await sb.rpc('dtl_publico_registrar', {
    p_trabajador_id: dtlPublicoState.trabajador.id,

    p_camisa_cantidad: cCant,
    p_camisa_talla: cTalla || null,

async function cargarBitacora(){
  const host = document.getElementById('audLista');
  if(!host) return;
  host.innerHTML = `<div class="empty"><h3>Cargando…</h3></div>`;
  let q = sb.from("acc_bitacora").select("*").order("ocurrido_en",{ascending:false}).limit(300);
  if(auditFiltroDesde) q = q.gte("ocurrido_en", auditFiltroDesde+"T00:00:00");
  if(auditFiltroHasta) q = q.lte("ocurrido_en", auditFiltroHasta+"T23:59:59");
  if(auditFiltroModulo!=='todos') q = q.eq("modulo", auditFiltroModulo);
  if(auditFiltroAccion!=='todos') q = q.eq("accion", auditFiltroAccion);
  const { data, error } = await q;
  if(error){
    host.innerHTML = `<div class="empty"><h3>No se pudo cargar</h3><p>${esc(error.message)}</p></div>`;
    return;
  }
  if(!data || !data.length){
    host.innerHTML = `<div class="empty"><h3>Sin movimientos</h3><p>No hay registros para los filtros elegidos.</p></div>`;
    return;
  }
  const modLabel = { epp:'EPP', dotacion:'Dotación', asistencia:'Asistencia', documentos:'Documentos' };
  const accLabel = { crear:'Creación', editar:'Edición', eliminar:'Eliminación' };
  const accBadge = { crear:'activa', editar:'cerrada', eliminar:'venc' };
  const hayFiltros = auditFiltroDesde || auditFiltroHasta || auditFiltroModulo!=='todos' || auditFiltroAccion!=='todos';
  host.innerHTML = `<div class="table-wrap"><table class="dt">
    <thead><tr><th>Fecha y hora</th><th>Módulo</th><th>Acción</th><th>Detalle</th><th>Quién</th></tr></thead>
    <tbody>${data.map(r=>`
      <tr>
        <td style="white-space:nowrap">${fmtDateTime(r.ocurrido_en)}</td>
        <td><span class="tipo">${esc(modLabel[r.modulo]||r.modulo)}</span></td>
        <td><span class="badge ${accBadge[r.accion]||'cerrada'}"><span class="dot"></span>${esc(accLabel[r.accion]||r.accion)}</span></td>
        <td>${esc(r.descripcion)}</td>
        <td>${r.actor_uid ? esc(nombreDe(r.actor_uid)) : '<span class="muted-sm">Enlace remoto (sin sesión)</span>'}</td>
      </tr>`).join('')}</tbody>
  </table></div>
  <p class="muted-sm" style="margin-top:10px">Mostrando los ${data.length} movimientos más recientes${hayFiltros?' que cumplen los filtros':''}${data.length===300?' (hay más — usa los filtros de fecha para ver más atrás)':''}.</p>`;
}

      <div class="sec-bar"><h2>Ajustes generales</h2></div>
      <div style="margin-bottom:20px;padding:14px 16px;background:#f6f8fd;border:1px solid var(--line);border-radius:10px">
        <p class="muted-sm" style="margin-bottom:10px">Si marcas alguna, no se podrá guardar una entrega de ese módulo sin foto del trabajador (aplica también al enlace público de Dotación).</p>
        <label class="chk"><input type="checkbox" id="cfgFotoEpp" ${APP_CONFIG.eppFotoObligatoria?'checked':''}> Foto obligatoria en <b>EPP</b></label>
        <label class="chk"><input type="checkbox" id="cfgFotoDtl" ${APP_CONFIG.dotacionFotoObligatoria?'checked':''}> Foto obligatoria en <b>Dotación</b></label>
        <button class="btn btn-primary btn-sm" id="btnGuardarAjustes" style="margin-top:10px">${I.check} Guardar</button>
      </div>
      <div class="sec-bar"><h2>Usuarios</h2><span class="muted-sm">${perfiles.length} registrado(s)</span></div>
      ${perfiles.length
        ? `<div class="table-wrap"><table class="dt"><thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Permisos</th></tr></thead><tbody>${filas}</tbody></table></div>`
        : `<div class="empty"><div class="ic">${I.user}</div><h3>Sin usuarios todavía</h3><p>Correrá automáticamente cuando alguien inicie sesión, o al correr CAMBIOS_SQL_7.sql si ya tienes usuarios creados.</p></div>`}
    </div>`;
  wireLogout();
  document.getElementById('btnGuardarAjustes').onclick = guardarAjustesGenerales;
  document.querySelectorAll('[data-perf-activo]').forEach(chk=>{
    chk.onchange = ()=> toggleActivoPerfil(chk.dataset.perfActivo, chk.checked);
  });
  document.querySelectorAll('[data-perf-editar]').forEach(b=>{
    b.onclick = ()=> abrirPermisosUsuario(b.dataset.perfEditar);
  });
  if(silent) window.scrollTo(0, scrollY);
}

async function guardarAjustesGenerales(){
  const eppOb = document.getElementById('cfgFotoEpp').checked;
  const dtlOb = document.getElementById('cfgFotoDtl').checked;
  const btn = document.getElementById('btnGuardarAjustes'); btn.disabled=true; btn.innerHTML="Guardando…";
  const { error } = await sb.from("app_config").update({ epp_foto_obligatoria: eppOb, dotacion_foto_obligatoria: dtlOb }).eq("id", true);
  if(error){ toast("No se pudo guardar: "+error.message,"err"); btn.disabled=false; btn.innerHTML=`${I.check} Guardar`; return; }
  APP_CONFIG = { eppFotoObligatoria: eppOb, dotacionFotoObligatoria: dtlOb };
  toast("Ajustes guardados","ok");
  btn.disabled=false; btn.innerHTML=`${I.check} Guardar`;
}

async function toggleActivoPerfil(id, activo){
  if(id === MIPERFIL.uid){ toast("No puedes desactivar tu propia cuenta","err"); return; }
  const { error } = await sb.from("acc_perfiles").update({ activo }).eq("id", id);
  if(error){ toast("No se pudo actualizar: "+error.message,"err"); renderConfiguracion(); return; }
  toast(activo?"Usuario activado":"Usuario desactivado","ok");
  renderConfiguracion();
}

async function abrirPermisosUsuario(perfilId){
  bloquear("Cargando permisos…");
  let perfil, modulos, contratosMarcados, todosLosContratos, entidadesMarcadas, todasLasEntidades;
  try{
    const [{ data:p }, { data:pm }, { data:pc }, { data:cs }, { data:pe }, { data:es }] = await Promise.all([
      sb.from("acc_perfiles").select("id,email,nombre,es_admin,activo,rol").eq("id",perfilId).maybeSingle(),
      sb.from("acc_perfil_modulos").select("modulo").eq("perfil_id",perfilId),
      sb.from("acc_perfil_contratos").select("contrato_id").eq("perfil_id",perfilId),
      sb.from("dot_contratos").select("id,nombre").order("nombre",{ascending:true}),
      sb.from("acc_perfil_entidades").select("entidad_id").eq("perfil_id",perfilId),
      sb.from("dtl_entidades").select("id,nombre").order("nombre",{ascending:true})
    ]);
    perfil = p; modulos = (pm||[]).map(x=>x.modulo); contratosMarcados = (pc||[]).map(x=>x.contrato_id); todosLosContratos = cs||[];
    entidadesMarcadas = (pe||[]).map(x=>x.entidad_id); todasLasEntidades = es||[];
  } finally { desbloquear(); }
  if(!perfil){ toast("Usuario no encontrado","err"); return; }

  const esUnoMismo = perfil.id === MIPERFIL.uid;
  openModal(`<div class="modal" style="max-width:520px">
    <div class="modal-head"><div><h2>${esc(perfil.nombre||perfil.email||'Usuario')}</h2><p>${esc(perfil.email||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div id="resumenAcceso" style="margin-bottom:14px;padding:10px 12px;background:#eef1fb;border-radius:8px;font-size:13px;color:var(--ink-2)"></div>
      <label class="chk"><input type="checkbox" id="pfAdmin" ${perfil.es_admin?'checked':''} ${esUnoMismo?'disabled':''}> Es administrador (acceso total a todo)</label>
      ${esUnoMismo?`<p class="muted-sm" style="margin:-4px 0 10px">No puedes quitarte tu propio acceso de administrador.</p>`:''}
      <div id="permisosDetalle" style="${perfil.es_admin?'display:none':''}">
        <div class="sec-bar" style="margin-top:14px"><h2 style="font-size:14px">Rol</h2></div>
        <label class="chk"><input type="radio" name="pfRol" value="editor" ${perfil.rol!=='visualizador'?'checked':''}> <b>Editor</b> — en Asistencia/Documentos: crea y edita solo lo suyo, nunca lo cerrado/finalizado. En EPP/Dotación: ve y registra todo, edita/elimina cualquier entrega de las últimas 24h, pero no toca el directorio de trabajadores (agregar/editar/eliminar es solo admin)</label>
        <label class="chk"><input type="radio" name="pfRol" value="visualizador" ${perfil.rol==='visualizador'?'checked':''}> <b>Visualizador</b> — solo puede ver lo que sus módulos/contratos le permitan; no crea, edita ni elimina nada</label>
        <div class="sec-bar" style="margin-top:14px"><h2 style="font-size:14px">Módulos</h2></div>
        <label class="chk"><input type="checkbox" data-pf-mod="asistencia" ${modulos.includes('asistencia')?'checked':''}> Asistencia</label>
        <label class="chk"><input type="checkbox" data-pf-mod="documentos" ${modulos.includes('documentos')?'checked':''}> Documentos y Firmas</label>
        <label class="chk"><input type="checkbox" data-pf-mod="dotacion" ${modulos.includes('dotacion')?'checked':''}> Entrega de EPP</label>
        <div id="permisosDotacion" style="margin-top:10px;padding:12px 14px;background:#f6f8fd;border:1px solid var(--line);border-radius:10px;${modulos.includes('dotacion')?'':'display:none'}">
          <div class="sec-bar" style="margin:0 0 8px"><h2 style="font-size:13px">Contratos permitidos</h2>${todosLosContratos.length?`<button type="button" class="btn btn-ghost btn-sm" id="btnPfContratoTodos">Marcar todos</button>`:''}</div>
          ${todosLosContratos.length
            ? todosLosContratos.map(c=>`<label class="chk" style="padding:3px 0"><input type="checkbox" data-pf-contrato="${c.id}" ${contratosMarcados.includes(c.id)?'checked':''}> ${esc(c.nombre)}</label>`).join('')
            : '<p class="muted-sm">Aún no hay contratos creados.</p>'}
        </div>
        <label class="chk" style="margin-top:8px"><input type="checkbox" data-pf-mod="dotacionlegal" ${modulos.includes('dotacionlegal')?'checked':''}> Dotación</label>
        <div id="permisosDotacionLegal" style="margin-top:10px;padding:12px 14px;background:#f6f8fd;border:1px solid var(--line);border-radius:10px;${modulos.includes('dotacionlegal')?'':'display:none'}">
          <div class="sec-bar" style="margin:0 0 8px"><h2 style="font-size:13px">Contratos permitidos (Dotación)</h2>${todasLasEntidades.length?`<button type="button" class="btn btn-ghost btn-sm" id="btnPfEntidadTodos">Marcar todos</button>`:''}</div>
          ${todasLasEntidades.length
            ? todasLasEntidades.map(en=>`<label class="chk" style="padding:3px 0"><input type="checkbox" data-pf-entidad="${en.id}" ${entidadesMarcadas.includes(en.id)?'checked':''}> ${esc(en.nombre)}</label>`).join('')
            : '<p class="muted-sm">Aún no hay contratos creados.</p>'}
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarPermisos">${I.check} Guardar</button>
    </div></div>`);

  /* Resumen en texto claro de lo que estos checkboxes realmente significan — se recalcula
     en vivo con cada cambio, para que no haya sorpresas como "le quité módulos pero le
     quedó acceso a todo" (eso pasaba cuando "Es administrador" seguía marcado sin notarlo). */
  const actualizarResumenAccesoUI = ()=>{
    const el = document.getElementById('resumenAcceso'); if(!el) return;
    if(document.getElementById('pfAdmin').checked){
      el.innerHTML = `<b>Administrador</b> — acceso total a todos los módulos y contratos, sin restricciones.`;
      return;
    }
    const modulosSel = Array.from(document.querySelectorAll('[data-pf-mod]:checked')).map(x=>x.dataset.pfMod);
    if(!modulosSel.length){
      el.innerHTML = `<span style="color:var(--danger)">Sin ningún módulo marcado — al iniciar sesión no verá nada.</span>`;
      return;
    }
    const partes = [];
    if(modulosSel.includes('asistencia')) partes.push('Asistencia');
    if(modulosSel.includes('documentos')) partes.push('Documentos y Firmas');
    if(modulosSel.includes('dotacion')){
      const ids = Array.from(document.querySelectorAll('[data-pf-contrato]:checked')).map(x=>x.dataset.pfContrato);
      const nombres = ids.map(id=>todosLosContratos.find(c=>c.id===id)?.nombre).filter(Boolean);
      partes.push(`EPP (${nombres.length?esc(nombres.join(', ')):'<span style="color:var(--danger)">ningún contrato marcado</span>'})`);
    }
    if(modulosSel.includes('dotacionlegal')){
      const ids = Array.from(document.querySelectorAll('[data-pf-entidad]:checked')).map(x=>x.dataset.pfEntidad);
      const nombres = ids.map(id=>todasLasEntidades.find(x=>x.id===id)?.nombre).filter(Boolean);
      partes.push(`Dotación (${nombres.length?esc(nombres.join(', ')):'<span style="color:var(--danger)">ningún contrato marcado</span>'})`);
    }
    const rol = document.querySelector('input[name="pfRol"]:checked')?.value || 'editor';
    const rolTxt = rol==='visualizador' ? 'solo puede ver (Visualizador)' : 'puede crear/editar lo suyo (Editor)';
    el.innerHTML = `Podrá entrar a: <b>${partes.join(' · ')}</b>. Rol: ${rolTxt}.`;
  };
  actualizarResumenAccesoUI();

  document.getElementById('pfAdmin').onchange = (e)=>{
    document.getElementById('permisosDetalle').style.display = e.target.checked ? 'none' : 'block';
    actualizarResumenAccesoUI();
  };
  const chkDot = document.querySelector('[data-pf-mod="dotacion"]');
  if(chkDot) chkDot.onchange = (e)=>{ document.getElementById('permisosDotacion').style.display = e.target.checked ? 'block' : 'none'; };
  const chkDtl = document.querySelector('[data-pf-mod="dotacionlegal"]');
  if(chkDtl) chkDtl.onchange = (e)=>{ document.getElementById('permisosDotacionLegal').style.display = e.target.checked ? 'block' : 'none'; };
  /* "Marcar todos"/"Quitar todos": evita tener que darle clic contrato por contrato
     cuando alguien necesita ver, por ejemplo, TODA la Dotación de todos los contratos. */
  const btnPfContratoTodos = document.getElementById('btnPfContratoTodos');
  if(btnPfContratoTodos) btnPfContratoTodos.onclick = ()=>{
    const marcar = btnPfContratoTodos.textContent.trim()==='Marcar todos';
    document.querySelectorAll('[data-pf-contrato]').forEach(chk=> chk.checked = marcar);
    btnPfContratoTodos.textContent = marcar ? 'Quitar todos' : 'Marcar todos';
    actualizarResumenAccesoUI();
  };
  const btnPfEntidadTodos = document.getElementById('btnPfEntidadTodos');
  if(btnPfEntidadTodos) btnPfEntidadTodos.onclick = ()=>{
    const marcar = btnPfEntidadTodos.textContent.trim()==='Marcar todos';
    document.querySelectorAll('[data-pf-entidad]').forEach(chk=> chk.checked = marcar);
    btnPfEntidadTodos.textContent = marcar ? 'Quitar todos' : 'Marcar todos';
    actualizarResumenAccesoUI();
  };
  document.querySelectorAll('input[name="pfRol"]').forEach(r=> r.addEventListener('change', actualizarResumenAccesoUI));
  document.querySelectorAll('[data-pf-mod],[data-pf-contrato],[data-pf-entidad]').forEach(chk=>{
    chk.addEventListener('change', actualizarResumenAccesoUI);
  });
  document.getElementById('btnGuardarPermisos').onclick = ()=> guardarPermisosUsuario(perfilId);
}

async function guardarPermisosUsuario(perfilId){
  const esAdmin = document.getElementById('pfAdmin').checked;
  const modulosMarcados = esAdmin ? [] : Array.from(document.querySelectorAll('[data-pf-mod]:checked')).map(el=>el.dataset.pfMod);
  const contratosMarcados = esAdmin ? [] : Array.from(document.querySelectorAll('[data-pf-contrato]:checked')).map(el=>el.dataset.pfContrato);
  const entidadesMarcadas = esAdmin ? [] : Array.from(document.querySelectorAll('[data-pf-entidad]:checked')).map(el=>el.dataset.pfEntidad);
  const rolSeleccionado = document.querySelector('input[name="pfRol"]:checked');
  const rol = rolSeleccionado ? rolSeleccionado.value : 'editor';

  const btn = document.getElementById('btnGuardarPermisos'); btn.disabled=true; btn.innerHTML="Guardando…";
  bloquear("Guardando permisos…");
  try{
    const { error:e1 } = await sb.from("acc_perfiles").update({ es_admin: esAdmin, rol }).eq("id", perfilId);
    if(e1){ toast("No se pudo guardar: "+e1.message,"err"); return; }

    // Reemplazo simple: borra lo que había y vuelve a insertar lo marcado (evita comparar/diferenciar)
    await sb.from("acc_perfil_modulos").delete().eq("perfil_id", perfilId);
    if(modulosMarcados.length){
      const { error:e2 } = await sb.from("acc_perfil_modulos").insert(modulosMarcados.map(m=>({perfil_id:perfilId, modulo:m})));
      if(e2){ toast("Se guardó parcialmente, error en módulos: "+e2.message,"err"); }
    }
    await sb.from("acc_perfil_contratos").delete().eq("perfil_id", perfilId);
    if(contratosMarcados.length){
      const { error:e3 } = await sb.from("acc_perfil_contratos").insert(contratosMarcados.map(c=>({perfil_id:perfilId, contrato_id:c})));
      if(e3){ toast("Se guardó parcialmente, error en contratos: "+e3.message,"err"); }
    }
    await sb.from("acc_perfil_entidades").delete().eq("perfil_id", perfilId);
    if(entidadesMarcadas.length){
      const { error:e4 } = await sb.from("acc_perfil_entidades").insert(entidadesMarcadas.map(en=>({perfil_id:perfilId, entidad_id:en})));
      if(e4){ toast("Se guardó parcialmente, error en contratos: "+e4.message,"err"); }
    }
    toast("Permisos actualizados","ok");
    closeModal();
    if(perfilId === MIPERFIL.uid){ await cargarMiPerfil(); }   // si te editaste a ti mismo, refresca tus propios permisos
    renderConfiguracion();
  } finally { desbloquear(); }
}

/* ---------- Auto-refresh del panel al volver a la pestaña ---------- */
document.addEventListener("visibilitychange", ()=>{
  // No recargar si está oculta, en una vista pública, o en un formulario (perdería lo escrito)
  if(document.hidden || esRutaPublica() || esRutaEdicion()) return;
  // Home de documentos / dotación: refresco SILENCIOSO (sin reloj de arena) para no molestar
  // (si el acceso fue revocado mientras la pestaña estaba abierta, cae a router() para mostrar el candado)
  if(location.hash === "#/docs" && tieneModulo('documentos')){ renderDocsAdmin(true); return; }
  if(location.hash === "#/dotacion" && tieneModulo('dotacion')){ renderDotacionAdmin(true); return; }
  if(location.hash === "#/dotacionlegal" && tieneModulo('dotacionlegal')){ renderDtlAdmin(true); return; }
  if(location.hash === "#/configuracion" && MIPERFIL.esAdmin){ renderConfiguracion(true); return; }
  if(location.hash === "#/auditoria" && MIPERFIL.esAdmin){ renderAuditoria(true); return; }
  router();   // re-renderiza el módulo activo (asistencia, documentos, dotación o configuración)
});

/* ---------- Si la sesión se cierra, volver al login ---------- */
sb.auth.onAuthStateChange((event)=>{
  if(event === "SIGNED_OUT" && !esRutaPublica()){
    // Igual que en "Salir" (wireLogout): si la sesión se cerró sola (ej. token expirado) en vez
    // de por el botón, hay que limpiar MIPERFIL/STATE aquí también — si no, quedan con los datos
    // del usuario anterior y el siguiente que inicie sesión en esta misma pestaña los hereda.
    MIPERFIL = { cargado:false, activo:true, esAdmin:false, rol:"editor", modulos:[], contratos:[], entidadesDtl:[], nombre:"", uid:null };
    PERFILES_NOMBRE = {};
    STATE.listas = []; STATE.userEmail = "";
    renderLogin();
  }
});

/* ---------- Arranque ---------- */
router();
</script>
