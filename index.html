  wireLogout();
  document.getElementById('btnVolverFormatoInsp').onclick = ()=>{ location.hash = "#/inspecciones"; };
  document.getElementById('btnGuardarFormatoInsp').onclick = guardarFormatoInsp;

  // "Ver PDF final": arma el PDF REAL (construirInspeccionPDF, el mismo que usa el
  // enlace público) con los datos de prueba que ya haya en la previsualización de
  // formulario (inspeccionDraft.respuestas/fotos — lo que sea que el admin haya
  // llenado ahí de prueba se refleja también acá) y firmantes de relleno (no hay
  // firma real todavía en el constructor). Se regenera bajo demanda (al cambiar de
  // pestaña o con "Actualizar"), no en cada tecla — armar el PDF no es gratis
  // (fotos, conversión de firmas) y no aporta nada regenerar en cada letra escrita.
  let pdfPreviewUrl = null;
  async function actualizarPdfPreviewInsp(){
    const btn = document.getElementById('btnActualizarPdfPreview');
    const host = document.getElementById('consVistaPdf');
    if(btn){ btn.disabled = true; btn.innerHTML = "Generando…"; }
    try{
      const firmantesPreview = (formatoEditorState.firmantes||[]).map(f=>({
        rol: f.rol || 'Firmante',
        nombre: f.origen==='banco' ? '(se completa con la firma guardada del banco)' : '(nombre del firmante)',
        cargo: null, firma: null
      }));
      const insp = {
        formato_nombre: formatoEditorState.nombre || 'Nombre del formato',
        contrato_nombre: 'Contrato de ejemplo',
        creado_en: new Date().toISOString(),
        estructura: formatoEditorState.estructura,
        respuestas: inspeccionDraft.respuestas,
        fotos: inspeccionDraft.fotos,
        firmantes: firmantesPreview,
        color_acento: formatoEditorState.color_acento,
        mostrar_cumplimiento: formatoEditorState.mostrar_cumplimiento,
        imagen_pdf: formatoEditorState.imagen_pdf,
        herramienta_nombre: null
      };
      const r = await construirInspeccionPDF(insp);
      if(pdfPreviewUrl) URL.revokeObjectURL(pdfPreviewUrl);
      pdfPreviewUrl = r.doc.output('bloburl'); // se conserva solo para "Abrir en pestaña nueva"

      // La vista principal NO usa <iframe>/<embed> con el visor nativo de PDF del
      // navegador — en producción eso salía en negro (probablemente por la opción
      // "Descargar PDF en vez de abrirlo en Chrome", que un sitio web no puede
      // detectar ni pasar por alto). En cambio se dibuja el PDF con pdf.js directo a
      // <canvas>, el MISMO motor que ya usa el editor de plantillas de Documentos
      // (renderPdfEditor) para mostrar el PDF subido — no depende en absoluto del
      // visor nativo, así que funciona sin importar esa configuración del navegador.
      host.innerHTML = '<p class="muted-sm" style="text-align:center;padding:24px;color:#fff">Generando vista previa…</p>';
      const bytes = new Uint8Array(r.doc.output('arraybuffer'));
      const pdf = await window.pdfjsLib.getDocument({data:bytes}).promise;
      host.innerHTML = '';
      const W = Math.min(820, Math.max(360, (host.clientWidth||760) - 36));
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      for(let i=1;i<=pdf.numPages;i++){
        const page = await pdf.getPage(i);
        const vp1 = page.getViewport({scale:1});
        const vp = page.getViewport({scale: W/vp1.width});
        const wrap = document.createElement('div');
        wrap.style.cssText = `width:${vp.width}px;height:${vp.height}px;margin:0 auto 16px;box-shadow:0 4px 14px rgba(0,0,0,.4)`;
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(vp.width*dpr); canvas.height = Math.floor(vp.height*dpr);
        canvas.style.width = vp.width+'px'; canvas.style.height = vp.height+'px';
        wrap.appendChild(canvas); host.appendChild(wrap);
        await page.render({ canvasContext:canvas.getContext('2d'), viewport:vp, transform: dpr!==1 ? [dpr,0,0,dpr,0,0] : undefined }).promise;
      }
    }catch(e){
      console.error(e);
      toast("No se pudo generar la vista previa del PDF","err");
      host.innerHTML = `<div class="empty" style="background:transparent"><div class="ic" style="color:#fff">${I.pdf}</div><h3 style="color:#fff">No se pudo generar la vista previa</h3></div>`;
    }
    if(btn){ btn.disabled = false; btn.innerHTML = `${I.check} Actualizar`; }
  }
  document.getElementById('btnAbrirPdfPreview').onclick = ()=>{
    if(!pdfPreviewUrl){ toast("Primero genera la vista previa","err"); return; }
    window.open(pdfPreviewUrl, '_blank');
  };
  document.querySelectorAll('[data-cons-tab]').forEach(b=>{

      document.getElementById('btnAbrirPdfPreview').style.display = tab==='pdf' ? '' : 'none';
      if(tab==='pdf') await actualizarPdfPreviewInsp();
    };
  });
  document.getElementById('btnActualizarPdfPreview').onclick = actualizarPdfPreviewInsp;
  document.getElementById('fiNombre').oninput = (e)=>{
    formatoEditorState.nombre = e.target.value;
    const prev = document.getElementById('prevNombreFormato'); if(prev) prev.textContent = e.target.value || 'Nombre del formato';
  };
  document.querySelectorAll('[data-add-seccion]').forEach(b=>{
    b.onclick = ()=>{
      const tipo = b.dataset.addSeccion;
      if(tipo==='fotos' && formatoEditorState.estructura.some(s=>s.tipo==='fotos')){ toast("Ya hay una sección de fotos — solo puede haber una, pero la puedes mover con las flechas","err"); return; }
      if(tipo==='gps' && formatoEditorState.estructura.some(s=>s.tipo==='gps')){ toast("Ya hay una sección de ubicación GPS — solo puede haber una, pero la puedes mover","err"); return; }
      const nueva = tipo==='info' ? { id: nuevoIdCampoInsp(), tipo:'info', titulo:'Nueva sección', campos: [] }
        : tipo==='checklist' ? { id: nuevoIdCampoInsp(), tipo:'checklist', titulo:'Nuevo checklist', estados:['Cumple','No cumple','N/A'], conObservaciones:true, items: [] }
        : tipo==='fotos' ? { id: nuevoIdCampoInsp(), tipo:'fotos', titulo:'Registro fotográfico', max:5, requerido:false }
        : tipo==='gps' ? { id: nuevoIdCampoInsp(), tipo:'gps', titulo:'Ubicación de la inspección' }
        : { id: nuevoIdCampoInsp(), tipo:'tabla_dinamica', titulo:'Nueva tabla', columnas: [] };
      formatoEditorState.estructura.push(nueva);
      renderSeccionesFormatoInsp();
    };
  });
  document.getElementById('btnAddFirmanteInsp').onclick = ()=>{
    formatoEditorState.firmantes.push({ id: nuevoIdCampoInsp(), rol:'', origen:'fresco' });
    renderFirmantesFormatoInsp();
  };
  document.getElementById('fiColorAcento').oninput = (e)=>{ formatoEditorState.color_acento = e.target.value; };
  document.getElementById('btnResetColorAcento').onclick = ()=>{
    formatoEditorState.color_acento = '#14215a';
    document.getElementById('fiColorAcento').value = '#14215a';
  };
  document.getElementById('fiMostrarCumplimiento').onchange = (e)=>{ formatoEditorState.mostrar_cumplimiento = e.target.checked; renderSeccionesFormatoInsp(); };
  document.querySelectorAll('[data-fi-tipo]').forEach(b=>{
    b.onclick = ()=>{
      formatoEditorState.tipo = b.dataset.fiTipo;
      document.querySelectorAll('[data-fi-tipo]').forEach(x=>{
        if(x===b){ x.classList.add('active','bien'); } else { x.classList.remove('active','bien'); }
      });
    };
  });
  function refrescarImagenPdfUI(){
    const prev = document.getElementById('fiImagenPdfPreview');
    const lbl = document.getElementById('fiImagenPdfLabel');
    const btnQuitar = document.getElementById('btnQuitarImagenPdf');
    const hay = !!formatoEditorState.imagen_pdf;
    prev.style.display = hay ? '' : 'none';
    prev.querySelector('img').src = formatoEditorState.imagen_pdf || '';
    lbl.textContent = hay ? 'Cambiar foto' : 'Subir foto del equipo';
    btnQuitar.style.display = hay ? '' : 'none';
  }
  const fiImgInput = document.getElementById('fiImagenPdfInput');
  document.getElementById('btnSubirImagenPdf').onclick = ()=> fiImgInput.click();
  fiImgInput.onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    formatoEditorState.imagen_pdf = await comprimirImagen(f, 480, 0.72);
    fiImgInput.value = '';
    refrescarImagenPdfUI();
  };
  document.getElementById('btnQuitarImagenPdf').onclick = ()=>{
    formatoEditorState.imagen_pdf = null;
    refrescarImagenPdfUI();
  };
  renderFirmantesFormatoInsp();
  renderSeccionesFormatoInsp();
}

/* Lista de firmantes del formato — vive aparte de "estructura" (no es una
   sección movible, es información estructural del formato completo). Cada
   fila: rol (texto libre) + origen (fresco/banco, ver CAMBIOS_SQL_56). */
function renderFirmantesFormatoInsp(){
  const host = document.getElementById('firmantesFormatoInsp');
  if(!host) return;
  const firmantes = formatoEditorState.firmantes;
  const camposTexto = camposTextoInfoInsp(formatoEditorState.estructura);
  host.innerHTML = firmantes.length ? firmantes.map((f,i)=>{
    const vinculable = f.origen==='fresco' && camposTexto.length>0;
    return `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:${vinculable?'2px':'6px'};flex-wrap:wrap">
      <input data-firmante-rol="${i}" value="${esc(f.rol||'')}" placeholder="Rol (ej. Inspector, Supervisor, Cliente)" style="flex:1;min-width:180px;padding:6px 8px;border:1px solid var(--line);border-radius:6px">
      <select data-firmante-origen="${i}" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px">
        <option value="fresco" ${f.origen==='fresco'?'selected':''}>Firma en vivo (en el enlace)</option>
        <option value="banco" ${f.origen==='banco'?'selected':''}>Firma guardada (banco de firmas)</option>
      </select>
      ${vinculable?`<select data-firmante-campo="${i}" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;min-width:220px">
        <option value="">— Pedir el nombre al firmar (como siempre) —</option>
        ${camposTexto.map(c=>`<option value="${esc(c.id)}" ${f.campoNombre===c.id?'selected':''}>${esc(c.seccion?c.seccion+' → ':'')}${esc(c.etiqueta)}</option>`).join('')}
      </select>`:''}

/* Clona una sección completa con IDs nuevos (la propia y las de sus campos/ítems/
   columnas) para que no colisionen con la original al editar — mismo criterio que
   duplicarFormatoInsp, que le agrega " (copia)" al nombre para que sea obvio cuál es cuál. */
function duplicarSeccionInsp(s){
  const copia = JSON.parse(JSON.stringify(s));
  copia.id = nuevoIdCampoInsp();
  copia.titulo = (copia.titulo||'') + ' (copia)';
  (copia.campos||[]).forEach(c=> c.id = nuevoIdCampoInsp());
  (copia.items||[]).forEach(it=> it.id = nuevoIdCampoInsp());
  (copia.columnas||[]).forEach(col=> col.id = nuevoIdCampoInsp());
  return copia;
}

/* Arrastrar para reordenar (reemplaza los botones ▲/▼) — Pointer Events en vez de la
   API HTML5 de drag-and-drop porque esa API se comporta mal con dedo en celular/tablet
   (justo donde más se va a usar el constructor). Mientras se arrastra, la tarjeta se
   reordena de una vez en el DOM (insertBefore, conserva el mismo nodo capturado — si se
   re-renderizara a cada movimiento se perdería el pointer capture a mitad del gesto);
   el estado (formatoEditorState.estructura) solo se sincroniza UNA VEZ al soltar,
   leyendo el orden final directo del DOM. */
/* Arrastrar para reordenar con la API nativa de HTML5 (draggable + dragstart/dragover/
   dragend) en vez de Pointer Events — el constructor de formatos SOLO se usa en
   computador (nunca en el enlace público que llena el inspector, ese sí es para
   celular), así que no hace falta que el arrastre funcione con el dedo; a cambio se
   gana algo mucho más simple y confiable con mouse, que es justo lo que se necesita
   aquí. Un primer intento con Pointer Events + setPointerCapture se sentía elegante
   pero en la práctica el evento de soltar (pointerup) no siempre llegaba de forma
   confiable al elemento con la captura — con drag-and-drop nativo del navegador ese
   problema no existe. */
function wireDragSeccionesInsp(host){
  let arrastrando = null; // la tarjeta (elemento del DOM) que se está moviendo
  host.querySelectorAll('[data-sec-drag]').forEach(handle=>{
    handle.draggable = true;
    handle.ondragstart = (e)=>{
      const card = handle.closest('[data-sec-card]');
      if(!card) return;
      arrastrando = card;
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', card.dataset.secCard); }catch(err){}
      try{ e.dataTransfer.setDragImage(card, 20, 20); }catch(err){}
      setTimeout(()=> card.classList.add('sec-dragging'), 0);
    };
    handle.ondragend = ()=>{
      if(!arrastrando) return;
      arrastrando.classList.remove('sec-dragging');
      // Mutar el arreglo EN EL MISMO SITIO (no reasignar formatoEditorState.estructura a
      // uno nuevo) — la previsualización en vivo apunta a esta misma referencia
      // (inspeccionDraft.estructura = formatoEditorState.estructura, fijado una sola vez
      // al abrir el constructor); reasignar rompe ese enlace y la deja desactualizada.
      const nuevoOrden = Array.from(host.querySelectorAll('[data-sec-card]')).map(c=>+c.dataset.secCard);
      const reordenado = nuevoOrden.map(idx=>formatoEditorState.estructura[idx]);
      formatoEditorState.estructura.splice(0, formatoEditorState.estructura.length, ...reordenado);
      arrastrando = null;
      renderSeccionesFormatoInsp();
    };
  });
  host.ondragover = (e)=>{
    if(!arrastrando) return;
    e.preventDefault(); // obligatorio para que el navegador permita soltar aquí
    const cards = Array.from(host.querySelectorAll('[data-sec-card]'));
    const destino = cards.find(c=>{
      if(c===arrastrando) return false;
      const r = c.getBoundingClientRect();
      return e.clientY < r.top + r.height/2;
    });
    if(destino){ host.insertBefore(arrastrando, destino); }
    else if(cards[cards.length-1]!==arrastrando){ host.appendChild(arrastrando); }
  };
}

function wireEditoresSeccionInsp(host){
  const st = formatoEditorState;

      const i = +el.dataset.fotosMax;

      renderInspFormBody();
    };
  });
  host.querySelectorAll('[data-fotos-requerido]').forEach(el=>{
    el.onchange = (e)=>{ const i=+el.dataset.fotosRequerido; st.estructura[i].requerido = e.target.checked; renderInspFormBody(); };
  });
  // --- info: campos ---
  host.querySelectorAll('[data-campo-etiqueta]').forEach(el=>{
    el.oninput = (e)=>{ const [i,j]=el.dataset.campoEtiqueta.split(':').map(Number); st.estructura[i].campos[j].etiqueta = e.target.value; renderInspFormBody(); };
  });
  host.querySelectorAll('[data-campo-tipo]').forEach(el=>{
    el.onchange = (e)=>{ const [i,j]=el.dataset.campoTipo.split(':').map(Number); st.estructura[i].campos[j].tipo = e.target.value; renderSeccionesFormatoInsp(); };
  });
  host.querySelectorAll('[data-campo-requerido]').forEach(el=>{
    el.onchange = (e)=>{ const [i,j]=el.dataset.campoRequerido.split(':').map(Number); st.estructura[i].campos[j].requerido = e.target.checked; renderInspFormBody(); };
  });
  host.querySelectorAll('[data-campo-opciones]').forEach(el=>{
    el.oninput = (e)=>{ const [i,j]=el.dataset.campoOpciones.split(':').map(Number); st.estructura[i].campos[j].opciones = e.target.value.split('\n').map(v=>v.trim()).filter(Boolean); renderInspFormBody(); };
  });
  host.querySelectorAll('[data-campo-del]').forEach(b=>{
    b.onclick = ()=>{ const [i,j]=b.dataset.campoDel.split(':').map(Number); st.estructura[i].campos.splice(j,1); renderSeccionesFormatoInsp(); };
  });
  host.querySelectorAll('[data-add-campo]').forEach(b=>{
    b.onclick = ()=>{ const i=+b.dataset.addCampo; (st.estructura[i].campos = st.estructura[i].campos||[]).push({ id: nuevoIdCampoInsp(), etiqueta:'', tipo:'texto' }); renderSeccionesFormatoInsp(); };
  });
  // --- checklist ---
  host.querySelectorAll('[data-checklist-estados]').forEach(el=>{
    el.oninput = (e)=>{ const i=+el.dataset.checklistEstados; st.estructura[i].estados = e.target.value.split(',').map(v=>v.trim()).filter(Boolean); renderInspFormBody(); };
    el.onchange = ()=> renderSeccionesFormatoInsp();
  });
  host.querySelectorAll('[data-tipo-estado]').forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.tipoEstado, val = b.dataset.tipoEstadoVal, tipo = b.dataset.tipoEstadoTipo;
      const s = st.estructura[i];
      s.estadosTipo = s.estadosTipo || {};
      s.estadosTipo[val] = tipo;
      renderSeccionesFormatoInsp();
    };
  });
  host.querySelectorAll('[data-checklist-obs]').forEach(el=>{
    el.onchange = (e)=>{ const i=+el.dataset.checklistObs; st.estructura[i].conObservaciones = e.target.checked; renderInspFormBody(); };
  });
  host.querySelectorAll('[data-checklist-marca]').forEach(el=>{
    el.onchange = (e)=>{ const i=+el.dataset.checklistMarca; st.estructura[i].conMarcaModelo = e.target.checked; renderInspFormBody(); };
  });
  host.querySelectorAll('[data-checklist-cantidad]').forEach(el=>{
    el.onchange = (e)=>{ const i=+el.dataset.checklistCantidad; st.estructura[i].conCantidad = e.target.checked; renderInspFormBody(); };
  });
  host.querySelectorAll('[data-checklist-vencimiento]').forEach(el=>{
    el.onchange = (e)=>{ const i=+el.dataset.checklistVencimiento; st.estructura[i].conFechaVencimiento = e.target.checked; renderSeccionesFormatoInsp(); renderInspFormBody(); };
  });
  host.querySelectorAll('[data-checklist-vencimiento-etiqueta]').forEach(el=>{
    el.oninput = (e)=>{ const i=+el.dataset.checklistVencimientoEtiqueta; st.estructura[i].fechaVenceEtiqueta = e.target.value; renderInspFormBody(); };
  });
  host.querySelectorAll('[data-item-texto]').forEach(el=>{

  host.querySelectorAll('[data-item-del]').forEach(b=>{

  host.querySelectorAll('[data-add-item]').forEach(b=>{

  });
  host.querySelectorAll('[data-agregar-pegados]').forEach(b=>{
    b.onclick = ()=>{

      if(!lineas.length) return;
      st.estructura[i].items = (st.estructura[i].items||[]).concat(lineas.map(texto=>({ id: nuevoIdCampoInsp(), texto })));
      renderSeccionesFormatoInsp();
    };
  });
  // --- tabla_dinamica ---
  host.querySelectorAll('[data-col-etiqueta]').forEach(el=>{
    el.oninput = (e)=>{ const [i,j]=el.dataset.colEtiqueta.split(':').map(Number); st.estructura[i].columnas[j].etiqueta = e.target.value; renderInspFormBody(); };
  });
  host.querySelectorAll('[data-col-tipo]').forEach(el=>{
    el.onchange = (e)=>{ const [i,j]=el.dataset.colTipo.split(':').map(Number); st.estructura[i].columnas[j].tipo = e.target.value; renderInspFormBody(); };
  });
  host.querySelectorAll('[data-col-del]').forEach(b=>{
    b.onclick = ()=>{ const [i,j]=b.dataset.colDel.split(':').map(Number); st.estructura[i].columnas.splice(j,1); renderSeccionesFormatoInsp(); };
  });
  host.querySelectorAll('[data-add-col]').forEach(b=>{
    b.onclick = ()=>{ const i=+b.dataset.addCol; (st.estructura[i].columnas = st.estructura[i].columnas||[]).push({ id: nuevoIdCampoInsp(), etiqueta:'', tipo:'texto' }); renderSeccionesFormatoInsp(); };
  });
}

async function guardarFormatoInsp(){
  const nombre = formatoEditorState.nombre.trim();
  if(!nombre){ toast("Ponle un nombre al formato","err"); document.getElementById('fiNombre')?.focus(); return; }
  if(!formatoEditorState.estructura.length){ toast("Agrega al menos una sección","err"); return; }
  for(const s of formatoEditorState.estructura){
    if(s.tipo==='checklist' && (!s.estados||!s.estados.length)){ toast(`La sección "${s.titulo||'sin título'}" necesita al menos un estado (ej. Cumple, No cumple)`,"err"); return; }
    if(s.tipo==='tabla_dinamica' && (!s.columnas||!s.columnas.length)){ toast(`La tabla "${s.titulo||'sin título'}" necesita al menos una columna`,"err"); return; }
  }
  for(const f of formatoEditorState.firmantes){
    if(!f.rol || !f.rol.trim()){ toast("Ponle un rol a cada firmante (o quítalo si no hace falta)","err"); return; }
  }
  const btn = document.getElementById('btnGuardarFormatoInsp');
  if(btn){ btn.disabled=true; btn.innerHTML="Guardando…"; }

  if(enlaceEditorId){
    // Editando un enlace en uso: se guarda SU PROPIA copia (insp_enlaces), nunca la
    // plantilla de "Formatos" — por diseño quedan independientes desde que se activó.
    // No toca tipo/contrato_id/herramienta_id/firmantes_banco/predeterminado_id/activo.
    bloquear("Guardando cambios…");
    const payload = { formato_nombre: nombre, tiene_fotos: formatoEditorState.estructura.some(s=>s.tipo==='fotos'), estructura: formatoEditorState.estructura, firmantes: formatoEditorState.firmantes, color_acento: formatoEditorState.color_acento, mostrar_cumplimiento: formatoEditorState.mostrar_cumplimiento, imagen_pdf: formatoEditorState.imagen_pdf };
    const { error } = await sb.from("insp_enlaces").update(payload).eq("id", enlaceEditorId);
    desbloquear();
    if(error){ if(btn){ btn.disabled=false; btn.innerHTML=`${I.check} Guardar cambios`; } toast("No se pudo guardar: "+error.message,"err"); return; }
    const enActual = INSPECCIONES.enlaces.find(e=>e.id===enlaceEditorId);
    const tieneBancoSinAsignar = formatoEditorState.firmantes.some(f=>f.origen==='banco' && !((enActual?.firmantes_banco||{})[f.id] || (f.id==='responsable' && enActual?.predeterminado_id)));
    toast("Cambios guardados"+(tieneBancoSinAsignar?" — configura la firma guardada que falte desde \"Firmantes\"":""),"ok");
    location.hash = "#/inspecciones";
    return;
  }

  bloquear("Guardando formato…");
  const payload = { nombre, tiene_fotos: formatoEditorState.estructura.some(s=>s.tipo==='fotos'), estructura: formatoEditorState.estructura, firmantes: formatoEditorState.firmantes, color_acento: formatoEditorState.color_acento, mostrar_cumplimiento: formatoEditorState.mostrar_cumplimiento, tipo: formatoEditorState.tipo, imagen_pdf: formatoEditorState.imagen_pdf };
  const res = formatoEditorId
    ? await sb.from("insp_formatos").update(payload).eq("id", formatoEditorId)
    : await sb.from("insp_formatos").insert(payload).select().single();
  desbloquear();
  if(res.error){ if(btn){ btn.disabled=false; btn.innerHTML=`${I.check} Guardar formato`; } toast("No se pudo guardar: "+res.error.message,"err"); return; }
  toast(formatoEditorId?"Formato actualizado":"Formato creado","ok");
  location.hash = "#/inspecciones";
}

/* ---------- Panel principal ---------- */
async function renderInspeccionesAdmin(modo){
  // modo: undefined/false → bloqueo visible + recarga (navegación normal a la sección);
  // true → recarga silenciosa (auto-refresco cada 20s, o tras guardar algo);
  // 'norecarga' → repinta con lo que YA está en INSPECCIONES.* sin ir a Supabase — para
  // cuando se sabe que el estado quedó fresco un instante antes (ej. justo después de
  // crear un enlace, loadInspeccionesState() ya se corrió una vez; volver a pedirlo todo
  // al cerrar el modal de confirmación era una segunda recarga completa redundante, y con
  // el historial de inspecciones creciendo se sentía como 10s de "nada pasa" sin aviso).
  const scrollY = window.scrollY;
  if(modo==='norecarga'){ /* usa el estado ya cargado, sin fetch */ }
  else if(modo){ await loadInspeccionesState(); }
  else { bloquear("Cargando Inspecciones…"); try{ await loadInspeccionesState(); } finally{ desbloquear(); } }

/* ---------- Grillas de enlaces por tipo (preoperacional/inspección), y hoja de vida ---------- */
function renderEnlacesInspPorTipo(tipo, hostId){
  const host = document.getElementById(hostId); if(!host) return;
  const enlaces = enlacesDelContrato().filter(e=> e.tipo === tipo);
  const botonNuevo = puedeEscribir() ? `<button class="btn btn-ghost btn-sm" data-nuevo-enlace-tipo="${tipo}" style="margin-top:10px">${I.plus} Crear formulario</button>` : '';
  if(!enlaces.length){
    const copiaVacia = tipo==='preoperacional' ? 'Crea uno para que un trabajador registre el preoperacional de una herramienta.'
      : tipo==='inventario' ? 'Crea uno para registrar la revisión periódica de inventario de maquinaria/herramienta.'
      : 'Crea uno para que se registren inspecciones de una herramienta o equipo.';
    host.innerHTML = `<div class="empty" style="padding:24px 20px"><div class="ic">${I.link}</div><h3>Sin enlaces todavía</h3><p>${copiaVacia}</p></div>${botonNuevo}`;
  } else {
    host.innerHTML = '<div class="grid grid-insp">' + enlaces.map(en=>{
      const herr = en.herramienta_id ? INSPECCIONES.herramientas.find(h=>h.id===en.herramienta_id) : null;
      const titulo = en.nombre || en.formato_nombre || 'Enlace';
      const n = INSPECCIONES.inspecciones.filter(i=>i.enlace_id===en.id).length;
      const firmantesEn = Array.isArray(en.firmantes) ? en.firmantes : FIRMANTES_DEFAULT_INSP;
      // Estado de la(s) firma(s) de banco de este enlace — no si TIENE un firmante
      // "fresco" (ese no necesita nada del banco), sino si tiene alguno "banco" y,
      // si lo tiene, si ya quedó asignada una firma guardada o todavía falta.
      const bancoSlotsCard = firmantesEn.filter(f=>f.origen==='banco');
      const bancoAsignadosCard = bancoSlotsCard.filter(f=> (en.firmantes_banco||{})[f.id] || (f.id==='responsable' && en.predeterminado_id));
      const estadoBancoCard = !bancoSlotsCard.length ? null : (bancoAsignadosCard.length===bancoSlotsCard.length ? 'ok' : 'falta');
      return `
        <div class="lcard">
          <div class="lcard-top">
            <span class="tipo">${herr?'Herramienta':'Sin herramienta'}</span>
            <span class="badge ${en.activo?'activa':'cerrada'}"><span class="dot"></span>${en.activo?'Activo':'Inactivo'}</span>
          </div>
          <h3>${esc(titulo)}</h3>
          <div class="meta">
            ${herr ? `<div>${I.catalogo}<span>${esc(herr.nombre||'')}</span></div>` : ''}
            <div>${I.cal}<span>Enlace creado ${fmtDate((en.creado_en||'').slice(0,10))}</span></div>
            ${estadoBancoCard==='ok' ? `<div>${I.firma}<span>Firma guardada asignada</span></div>` : ''}
            ${estadoBancoCard==='falta' ? `<div>${I.warn}<span style="color:var(--danger);font-weight:700">Falta asignar firma guardada</span></div>` : ''}
          </div>
          <div class="lcard-foot">
            <div class="attn" title="${n} registro${n===1?'':'s'} guardado${n===1?'':'s'}">
              <span class="num">${n}</span>
            </div>
            <div class="card-actions">
              <button class="icon-btn" title="Ver detalle" data-eit="ver" data-id="${en.id}">${I.eye}</button>
              <button class="icon-btn" title="Copiar enlace" data-eit="link" data-id="${en.id}">${I.link}</button>
              <button class="icon-btn" title="Compartir QR" data-eit="qr" data-id="${en.id}">${I.qr}</button>
              ${puedeEscribir()?`<button class="icon-btn" title="Editar nombre" data-eit="nombre" data-id="${en.id}">${I.tag}</button>
              <button class="icon-btn" title="Editar" data-eit="editar" data-id="${en.id}">${I.pen}</button>
              <button class="icon-btn" title="Cambiar herramienta" data-eit="herramienta" data-id="${en.id}">${I.catalogo}</button>
              ${firmantesEn.length?`<button class="icon-btn" title="Firmantes" data-eit="firma" data-id="${en.id}">${I.firma}</button>`:''}
              <button class="icon-btn" title="${en.activo?'Desactivar enlace':'Activar enlace'}" data-eit="toggle" data-id="${en.id}">${en.activo?I.lock:I.check}</button>
              <button class="icon-btn danger" title="Eliminar enlace" data-eit="eliminar" data-id="${en.id}">${I.trash}</button>`:''}
            </div>
          </div>
        </div>`;
    }).join('') + '</div>' + botonNuevo;
  }
  host.querySelectorAll('[data-eit]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.id, act = b.dataset.eit;
      if(act==='ver') abrirDetalleEnlaceInsp(id);
      else if(act==='link') copyText(linkInspeccion(id), "Enlace de inspección copiado");
      else if(act==='qr') mostrarQR(linkInspeccion(id), "Enlace de inspección");
      else if(act==='nombre') renombrarEnlaceInsp(id);
      else if(act==='editar') location.hash = "#/inspecciones/enlace/"+id+"/editar";
      else if(act==='herramienta') cambiarHerramientaEnlaceInsp(id);
      else if(act==='firma') cambiarFirmaEnlaceInsp(id);
      else if(act==='toggle') toggleActivoEnlaceInsp(id);
      else if(act==='eliminar') eliminarEnlaceInsp(id);
    };
  });
  const bn = host.querySelector('[data-nuevo-enlace-tipo]');
  if(bn) bn.onclick = ()=> abrirNuevoEnlaceInsp(bn.dataset.nuevoEnlaceTipo);
}

async function verHojaDeVidaInsp(herramientaId){
  const h = INSPECCIONES.herramientas.find(x=>x.id===herramientaId);
  openModal(`<div class="modal lg">
    <div class="modal-head"><div><h2>Hoja de vida — ${esc(h?.nombre||'')}</h2><p>Todo lo registrado para esta herramienta, de más reciente a más antigua.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body" id="hojaVidaInspBody"><div class="empty"><h3>Cargando…</h3></div></div>
    <div class="modal-foot" id="hojaVidaInspFoot">
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
      ${puedeEscribir()?`<button class="btn btn-ghost" onclick="abrirMantenimientosHerramientaInsp('${herramientaId}')">${I.plus} Agregar mantenimiento</button>`:''}
    </div>
  </div>`);
  const host = document.getElementById('hojaVidaInspBody');
  // Kárdex fusionado: mismo listado de siempre (insp_inspecciones) + el historial de
  // insp_mantenimientos de esta herramienta, normalizados a una fecha comparable y
  // ordenados juntos — así se ve todo lo que le ha pasado a la herramienta en un solo lugar.
  const [{ data: di, error: ei }, { data: dm, error: em }] = await Promise.all([
    sb.from("insp_inspecciones").select("id,formato_nombre,inspector_nombre,creado_en,ip_address,dispositivo_ua").eq("herramienta_id", herramientaId).order("creado_en",{ascending:false}),
    sb.from("insp_mantenimientos").select("id,fecha,frecuencia,tipo,descripcion,responsable_nombre,creado_en").eq("herramienta_id", herramientaId).order("fecha",{ascending:false})
  ]);
  if(ei || em){ host.innerHTML = `<div class="empty"><h3>No se pudo cargar</h3><p>${esc((ei||em).message)}</p></div>`; return; }
  const eventosInsp = (di||[]).map(x=>({ origen:'inspeccion', fecha:(x.creado_en||'').slice(0,10), ...x }));
  const eventosMant = (dm||[]).map(x=>({ origen:'mantenimiento', fecha:x.fecha, ...x }));
  const lista = [...eventosInsp, ...eventosMant].sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  if(!lista.length){ host.innerHTML = `<div class="empty"><div class="ic">${I.box}</div><h3>Sin registros todavía</h3><p>Cuando se registre una inspección, preoperacional o mantenimiento de esta herramienta, aparecerá aquí.</p></div>`; return; }
  host.innerHTML = `<div class="table-wrap"><table class="dt">
    <thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Registrado por</th><th></th></tr></thead>
    <tbody>${lista.map(x=>{
      if(x.origen==='inspeccion'){
        const hora = x.creado_en ? new Date(x.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'}) : '';
        const auditLinea = (x.ip_address||x.dispositivo_ua)
          ? `<div class="muted-sm">${x.ip_address?'IP '+esc(x.ip_address):''}${x.ip_address&&x.dispositivo_ua?' · ':''}${x.dispositivo_ua?esc(resumenDispositivoUA(x.dispositivo_ua)):''}</div>` : '';
        const puedeTocar = puedoTocarInspeccionReciente(x.creado_en);
        return `<tr>
          <td>${fmtDate(x.fecha)}${hora?`<div class="muted-sm">${hora}</div>`:''}${auditLinea}</td>
          <td>Inspección</td>
          <td>${esc(x.formato_nombre||'—')}</td>
          <td>${esc(x.inspector_nombre||'—')}</td>
          <td><div style="display:flex;gap:4px">
            <button class="icon-btn" title="Ver detalle" onclick="verInspeccion('${x.id}')">${I.eye}</button>
            <button class="icon-btn" title="Descargar PDF" onclick="generarInspeccionPDF('${x.id}')">${I.doc}</button>
            ${puedeTocar?`<button class="icon-btn" title="Editar" onclick="abrirEditarInspeccionPorId('${x.id}')">${I.pen}</button>
            <button class="icon-btn danger" title="Eliminar" onclick="eliminarInspeccion('${x.id}', ()=>verHojaDeVidaInsp('${herramientaId}'))">${I.trash}</button>`:''}
          </div></td>
        </tr>`;
      }
      return `<tr>
        <td>${fmtDate(x.fecha)}</td>
        <td>Mantenimiento<div class="muted-sm">${esc(etiquetaTipoMantInsp(x.tipo))} · ${esc(etiquetaFrecuenciaMantInsp(x.frecuencia))}</div></td>
        <td>${esc(x.descripcion||'—')}</td>
        <td>${esc(x.responsable_nombre||'—')}</td>
        <td><div style="display:flex;gap:4px">
          <button class="icon-btn" title="Editar" data-hvmant-editar="${x.id}">${I.pen}</button>
          <button class="icon-btn danger" title="Eliminar" data-hvmant-del="${x.id}">${I.trash}</button>
        </div></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
  host.querySelectorAll('[data-hvmant-editar]').forEach(b=>{
    b.onclick = ()=> editarMantenimientoInsp(b.dataset.hvmantEditar, herramientaId, ()=>verHojaDeVidaInsp(herramientaId));

  host.querySelectorAll('[data-hvmant-del]').forEach(b=>{
    b.onclick = ()=> eliminarMantenimientoInsp(b.dataset.hvmantDel, herramientaId, ()=>verHojaDeVidaInsp(herramientaId));
  });

  if(foot) foot.insertAdjacentHTML('beforeend', `<button class="btn btn-primary" onclick="generarHojaVidaInspPDF('${herramientaId}')">${I.doc} Descargar PDF</button>`);

/* PDF resumen de la hoja de vida — tabla liviana (fecha/formato/registrado por +
   IP/dispositivo), sin fotos ni firmas de cada registro (esas ya se pueden bajar
   individualmente con el botón "Descargar PDF" de cada fila) — mismo criterio que
   el kárdex de EPP/Dotación (construirKardexPDF): un resumen rápido de generar en
   vez de un PDF pesado que una todas las inspecciones completas. */
async function construirHojaVidaInspPDF(herramientaId){
  const h = INSPECCIONES.herramientas.find(x=>x.id===herramientaId);
  if(!h) return null;
  // Mismo kárdex fusionado que verHojaDeVidaInsp: inspecciones + mantenimientos,
  // normalizados a una fecha comparable y ordenados juntos.
  const [{ data: di, error: ei }, { data: dm, error: em }] = await Promise.all([
    sb.from("insp_inspecciones").select("formato_nombre,inspector_nombre,creado_en,ip_address,dispositivo_ua").eq("herramienta_id", herramientaId).order("creado_en",{ascending:false}),
    sb.from("insp_mantenimientos").select("fecha,frecuencia,tipo,descripcion,responsable_nombre,creado_en").eq("herramienta_id", herramientaId).order("fecha",{ascending:false})
  ]);
  if(ei || em) throw new Error((ei||em).message);
  const eventosInsp = (di||[]).map(x=>({ origen:'inspeccion', fecha:(x.creado_en||'').slice(0,10),
    formato_nombre: x.formato_nombre, inspector_nombre: x.inspector_nombre, creado_en: x.creado_en,
    ip_address: x.ip_address, dispositivo_ua: x.dispositivo_ua }));
  const eventosMant = (dm||[]).map(x=>({ origen:'mantenimiento', fecha: x.fecha,
    formato_nombre: etiquetaTipoMantInsp(x.tipo)+' — '+(x.descripcion||'Sin descripción')+' ('+etiquetaFrecuenciaMantInsp(x.frecuencia)+')',
    inspector_nombre: x.responsable_nombre, creado_en: null, ip_address: null, dispositivo_ua: null }));
  const lista = [...eventosInsp, ...eventosMant].sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  if(!lista.length) return null;
  const nombreContrato = (INSPECCIONES.contratos.find(c=>c.id===h.contrato_id)||{}).nombre || "";

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const PW = 210, M = 10, RIGHT = PW - M;
  const x0=M, x1=M+28, x2=M+130, x3=RIGHT; // Fecha 28 / Formato 102 / Registrado por (resto)

  function grayHead(y,hh){ doc.setFillColor(238,241,248); doc.rect(M,y,RIGHT-M,hh,"F"); }

  function encabezado(){
    let y=M;
    const hH=24, logoW=44;
    doc.setDrawColor(150,160,190); doc.setLineWidth(0.3); doc.rect(M,y,RIGHT-M,hH);
    doc.line(M+logoW,y,M+logoW,y+hH);
    try{ doc.addImage(LOGO,"JPEG",M+4,y+2,36,36*315/570); }catch(e){}
    doc.setTextColor(20,33,90); doc.setFont("helvetica","bold"); doc.setFontSize(14);
    doc.text("HOJA DE VIDA — HERRAMIENTA/EQUIPO", M+logoW+(RIGHT-M-logoW)/2, y+13, {align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(90,90,110);
    doc.text(pdfTexto((nombreContrato?nombreContrato+" · ":"")+"Don Aseo Ltda."), M+logoW+(RIGHT-M-logoW)/2, y+19, {align:"center"});
    y += hH;

    const fh=14;
    doc.setDrawColor(150,160,190); doc.rect(M,y,RIGHT-M,fh);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(90,90,110);
    doc.text("HERRAMIENTA / EQUIPO", M+3, y+5);
    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(20,20,20);
    doc.text(pdfTexto(h.nombre||""), M+3, y+11);
    if(h.codigo){
      doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(60,60,70);
      doc.text(pdfTexto("Código: "+h.codigo), RIGHT-3, y+11, {align:"right"});
    }
    y += fh + 2;
    return y;
  }

  function tablaHead(y){
    const hh=8;
    grayHead(y,hh);
    doc.setDrawColor(150,160,190);
    [x0,x1,x2,x3].forEach(x=>doc.line(x,y,x,y+hh));
    doc.rect(M,y,RIGHT-M,hh);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(40,40,60);
    const ct=(a,b,txt)=>doc.text(txt,(a+b)/2,y+5.2,{align:"center"});
    ct(x0,x1,"FECHA"); ct(x1,x2,"FORMATO / ACTIVIDAD"); ct(x2,x3,"REGISTRADO POR");
    return y+hh;
  }

  const FOOTER_Y = 290, FOOTER_TOP = 278;
  function piePagina(pag){
    doc.setFontSize(6.6); doc.setTextColor(140,140,160);
    doc.text("Hoja de vida generada a partir de las inspecciones, preoperacionales y mantenimientos registrados en el sistema.", PW/2, FOOTER_Y, {align:"center"});
    doc.text("Generado el "+fmtDateTime(new Date())+" · Don Aseo Ltda. · Pág. "+pag, PW/2, FOOTER_Y+4, {align:"center"});
  }

  let y = encabezado();
  y = tablaHead(y);
  let pag = 1;
  for(const x of lista){
    const hora = x.creado_en ? new Date(x.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'}) : '';
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
    const wrapped = doc.splitTextToSize(pdfTexto(x.formato_nombre||'—'), x2-x1-6);
    const tieneAuditoria = !!(x.ip_address || x.dispositivo_ua);
    const rowH = Math.max(tieneAuditoria?18:12, wrapped.length*4+5);
    if(y + rowH > FOOTER_TOP){
      piePagina(pag);
      doc.addPage(); pag++;
      y = M+2; y = tablaHead(y);
    }
    doc.setDrawColor(180,188,210);
    [x0,x1,x2,x3].forEach(x=>doc.line(x,y,x,y+rowH));
    doc.line(M,y+rowH,RIGHT,y+rowH);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(20,20,20);
    doc.text(fmtDate(x.fecha), (x0+x1)/2, y+rowH/2-2, {align:"center"});
    let yAudit = y+rowH/2+2.5;
    if(hora){ doc.setFontSize(6.5); doc.setTextColor(120,120,140); doc.text(hora, (x0+x1)/2, yAudit, {align:"center"}); yAudit += 3; }
    if(tieneAuditoria){
      doc.setFontSize(5.3); doc.setTextColor(150,150,170);
      if(x.ip_address){ doc.text("IP "+x.ip_address, (x0+x1)/2, yAudit, {align:"center"}); yAudit += 2.6; }
      const disp = resumenDispositivoUA(x.dispositivo_ua);
      if(disp) doc.text(disp, (x0+x1)/2, yAudit, {align:"center"});
    }
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(20,20,20);
    doc.text(wrapped, x1+3, y+5);
    doc.setFontSize(8); doc.setTextColor(20,20,20);
    doc.text(pdfTexto(x.inspector_nombre||'—'), x2+3, y+rowH/2+1);
    y += rowH;
  }
  piePagina(pag);

  const safe = (h.nombre||"herramienta").replace(/[^\w\sáéíóúñ-]/gi,"").trim().replace(/\s+/g,"_").slice(0,40);
  return { doc, nombreBase: safe };
}

async function generarHojaVidaInspPDF(herramientaId){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  bloquear("Generando PDF…");
  try{
    const r = await construirHojaVidaInspPDF(herramientaId);
    if(!r){ toast("Esta herramienta no tiene registros todavía","err"); return; }
    r.doc.save("HojaDeVida_"+r.nombreBase+".pdf");
    toast("PDF generado","ok");
  }catch(e){ console.error(e); toast("No se pudo generar el PDF: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

    <div class="modal-head"><div><h2>Editar nombre</h2><p>Se usa en la tarjeta y en el encabezado del PDF. No afecta el nombre de la plantilla en "Formatos".${n?` Se actualizará también en ${n} registro${n===1?'':'s'} ya guardado${n===1?'':'s'} con este formulario.`:''}</p></div>

    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarRenEnlaceInsp">${I.check} Guardar</button></div></div>`);
  document.getElementById('renEnlaceNombre').focus();

/* Muestra TODOS los firmantes del formulario (no solo los de banco), identificados
   por el rol que el usuario les puso en el constructor — para los de "firma
   guardada" deja elegir cuál del banco de firmas (compartido entre todos los
   contratos, ver [[CAMBIOS_SQL_63]]); los de "firma en vivo" solo se informan (los
   firma quien llena el formulario, no hay nada que asignar). El botón que abre
   esto ya no aparece si el formato no tiene NINGÚN firmante. */
function cambiarFirmaEnlaceInsp(enlaceId){
  const en = INSPECCIONES.enlaces.find(x=>x.id===enlaceId); if(!en) return;
  const firmantesEn = Array.isArray(en.firmantes) ? en.firmantes : FIRMANTES_DEFAULT_INSP;
  if(!firmantesEn.length){ toast("Este formulario no tiene firmantes configurados","err"); return; }
  const bancoSlots = firmantesEn.filter(x=>x.origen==='banco');
  const predets = INSPECCIONES.predeterminados;
  const hayQueAsignar = bancoSlots.length && predets.length;
  openModal(`<div class="modal" style="max-width:460px">
    <div class="modal-head"><div><h2>Firmantes de este formulario</h2><p>Quién firma cada campo, según los roles que le pusiste en el formato.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      ${firmantesEn.map(slot=>{
        if(slot.origen==='banco'){
          const actual = (en.firmantes_banco||{})[slot.id] || (slot.id==='responsable' ? en.predeterminado_id : null);
          if(!predets.length){
            return `<div class="field"><label>${esc(slot.rol)} <span class="tipo">Firma guardada</span></label>
              <p class="muted-sm" style="margin:4px 0 0">Aún no tienes firmas guardadas — créala primero en "Firmas".</p></div>`;
          }
          return `<div class="field"><label>${esc(slot.rol)} <span class="tipo">Firma guardada</span></label>
            <select data-cf-banco="${esc(slot.id)}">${predets.map(p=>`<option value="${p.id}" ${p.id===actual?'selected':''}>${esc(p.nombre)} — ${esc(p.responsable_nombre)}</option>`).join('')}</select></div>`;
        }
        return `<div class="field"><label>${esc(slot.rol)} <span class="tipo">Firma en vivo</span></label>
          <p class="muted-sm" style="margin:4px 0 0">La firma quien llena el formulario — no requiere asignación.</p></div>`;
      }).join('')}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">${hayQueAsignar?'Cancelar':'Cerrar'}</button>
      ${hayQueAsignar?`<button class="btn btn-primary" id="btnGuardarFirmaEnlace">${I.check} Guardar</button>`:''}
    </div></div>`);
  const btnG = document.getElementById('btnGuardarFirmaEnlace');
  if(btnG) btnG.onclick = async ()=>{
    const firmantes_banco = { ...(en.firmantes_banco||{}) };
    document.querySelectorAll('[data-cf-banco]').forEach(sel=>{ firmantes_banco[sel.dataset.cfBanco] = sel.value; });
    const predeterminado_id = firmantes_banco['responsable'] || en.predeterminado_id || null;
    btnG.disabled=true; btnG.innerHTML="Guardando…";
    const { error } = await sb.from("insp_enlaces").update({ firmantes_banco, predeterminado_id }).eq("id", enlaceId);
    if(error){ btnG.disabled=false; btnG.innerHTML=`${I.check} Guardar`; toast("No se pudo guardar: "+error.message,"err"); return; }
    await loadInspeccionesState();
    toast("Firma actualizada","ok");
    closeModal();
    renderInspeccionesAdmin('norecarga');
  };
}

/* ---------- Detalle de un enlace: lista de inspecciones hechas a través de él ---------- */
async function abrirDetalleEnlaceInsp(enlaceId){
  const en = INSPECCIONES.enlaces.find(x=>x.id===enlaceId);
  openModal(`<div class="modal lg">
    <div class="modal-head"><div><h2>${esc(en?.nombre || en?.formato_nombre || 'Enlace')}</h2><p>${esc(en?.formato_nombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body" id="detalleEnlaceInspBody"><div class="empty"><h3>Cargando…</h3></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>
  </div>`);
  const host = document.getElementById('detalleEnlaceInspBody');
  const { data, error } = await sb.from("insp_inspecciones")
    .select("id,formato_nombre,inspector_nombre,creado_en,ip_address,dispositivo_ua")
    .eq("enlace_id", enlaceId).order("creado_en",{ascending:false});
  if(error){ host.innerHTML = `<div class="empty"><h3>No se pudo cargar</h3><p>${esc(error.message)}</p></div>`; return; }
  const lista = data || [];
  if(!lista.length){ host.innerHTML = `<div class="empty"><div class="ic">${I.box}</div><h3>Sin inspecciones todavía</h3><p>Comparte el enlace para que empiecen a llegar.</p></div>`; return; }
  host.innerHTML = `<div class="table-wrap"><table class="dt">
    <thead><tr><th>Fecha</th><th>Inspector</th><th></th></tr></thead>
    <tbody>${lista.map(x=>{
      const hora = x.creado_en ? new Date(x.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'}) : '';
      const auditLinea = (x.ip_address||x.dispositivo_ua)
        ? `<div class="muted-sm">${x.ip_address?'IP '+esc(x.ip_address):''}${x.ip_address&&x.dispositivo_ua?' · ':''}${x.dispositivo_ua?esc(resumenDispositivoUA(x.dispositivo_ua)):''}</div>` : '';
      const puedeTocar = puedoTocarInspeccionReciente(x.creado_en);
      return `<tr>
        <td>${fmtDate((x.creado_en||'').slice(0,10))}${hora?`<div class="muted-sm">${hora}</div>`:''}${auditLinea}</td>
        <td>${esc(x.inspector_nombre||'—')}</td>
        <td><div style="display:flex;gap:4px">
          <button class="icon-btn" title="Ver detalle" onclick="verInspeccion('${x.id}')">${I.eye}</button>
          <button class="icon-btn" title="Descargar PDF" onclick="generarInspeccionPDF('${x.id}')">${I.doc}</button>
          ${puedeTocar?`<button class="icon-btn" title="Editar" onclick="abrirEditarInspeccionPorId('${x.id}')">${I.pen}</button>
          <button class="icon-btn danger" title="Eliminar" onclick="eliminarInspeccion('${x.id}', ()=>abrirDetalleEnlaceInsp('${enlaceId}'))">${I.trash}</button>`:''}
        </div></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

/* ---------- Crear formulario: se elige una plantilla de "Formatos" (filtrada por tipo)
   y se copia completa a un enlace nuevo — nada de firmas acá. Quién firma se resuelve
   DESPUÉS, editando el formulario ya creado (agregar/quitar firmantes) y, para los de
   firma guardada, con "Firmantes" en su tarjeta — así crear un
   formulario es un solo paso: elegir la plantilla. */
function abrirNuevoEnlaceInsp(tipoFiltro){
  if(contratoInspActualId==='todos'){ toast("Elige un contrato específico primero","err"); return; }
  const formatos = INSPECCIONES.formatos.filter(f=>f.activo && (!tipoFiltro || f.tipo===tipoFiltro));
  const herramientas = INSPECCIONES.herramientas.filter(h=>h.activo);
  if(!formatos.length){ toast('No hay formatos activos de este tipo — créalo primero desde "Formatos"',"err"); return; }
  openModal(`<div class="modal" style="max-width:480px">
    <div class="modal-head"><div><h2>Crear formulario</h2><p>Elige la plantilla de "Formatos" que quieres usar — queda una copia independiente, lista para compartir.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Formato *</label><select id="neFormato">${formatos.map(f=>`<option value="${f.id}">${esc(f.nombre)}</option>`).join('')}</select></div>
      ${herramientas.length ? `<div class="field"><label>Herramienta/equipo <span class="opt">(opcional)</span></label>
        <select id="neHerramienta"><option value="">— Sin herramienta específica —</option>${herramientas.map(h=>`<option value="${h.id}">${esc(h.nombre)}</option>`).join('')}</select></div>` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarEnlaceInsp">${I.check} Crear formulario</button>
    </div></div>`);
  const btn = document.getElementById('btnGuardarEnlaceInsp');
  btn.onclick = async ()=>{
    const formato_id = document.getElementById('neFormato').value;
    const selHerr = document.getElementById('neHerramienta');
    const herramienta_id = (selHerr && selHerr.value) || null;
    btn.disabled = true; btn.innerHTML = "Creando…";
    // Bloqueo de pantalla a prueba de clic (sección 8.1) mientras se copia el formato y se
    // crea el enlace — son 2 idas y vueltas al servidor, sin esto el usuario podía cerrar
    // el modal o volver a hacer clic durante ese hueco.
    bloquear("Creando formulario…");
    try{
      // Tomar un formato = copiarlo completo al enlace, no referenciarlo — desde aquí queda
      // 100% independiente de la plantilla (editable sin afectarla, sobrevive si se borra).
      const { data: full, error: errFull } = await sb.from("insp_formatos").select("nombre,tiene_fotos,estructura,firmantes,color_acento,mostrar_cumplimiento,tipo,imagen_pdf").eq("id",formato_id).maybeSingle();
      if(errFull || !full){ toast("No se pudo cargar el formato elegido","err"); return; }
      // Sin campo de etiqueta al crear: el formulario nace con el mismo nombre que tenía
      // la plantilla en "Formatos" (nombre queda null, y la tarjeta cae al fallback
      // formato_nombre) — si el usuario quiere otro nombre, lo cambia después con
      // "Editar nombre" en la tarjeta.
      const { data, error } = await sb.from("insp_enlaces").insert({
        contrato_id: contratoInspActualId, formato_id, predeterminado_id: null, firmantes_banco: {}, herramienta_id, nombre: null,
        formato_nombre: full.nombre, tiene_fotos: full.tiene_fotos, estructura: full.estructura, firmantes: full.firmantes,
        color_acento: full.color_acento, mostrar_cumplimiento: full.mostrar_cumplimiento, tipo: full.tipo, imagen_pdf: full.imagen_pdf
      }).select().single();
      if(error){ toast("No se pudo crear: "+error.message,"err"); return; }
      await loadInspeccionesState();
      mostrarEnlaceCreadoInsp(data.id);
    } finally {
      desbloquear();
      btn.disabled = false; btn.innerHTML = `${I.check} Crear formulario`;
    }
  };
}

function cambiarHerramientaEnlaceInsp(enlaceId){

  const herramientas = INSPECCIONES.herramientas;
  openModal(`<div class="modal" style="max-width:420px">
    <div class="modal-head"><div><h2>Cambiar herramienta</h2><p>A qué herramienta/equipo del catálogo pertenece este enlace — así arma bien su hoja de vida.</p></div>

/* openModalOnClose (no openModal/openSubModal) a propósito: así el panel de atrás se
   refresca sin importar CÓMO se cierre este modal — botón "Cerrar", la X, o clic afuera
   — antes solo el botón "Cerrar" disparaba el refresco (con openSubModal tampoco habría
   servido: "volver" ahí significa abrir OTRO modal, nunca cerrar del todo — se probó y
   el modal se quedaba pegado en pantalla). Cerrar con la X o por fuera (la forma más
   natural) dejaba el panel viejo hasta que lo alcanzaba el auto-refresco silencioso de
   20s, dando la sensación de "tarda muchísimo". */
function mostrarEnlaceCreadoInsp(enlaceId){
  const url = linkInspeccion(enlaceId);
  openModalOnClose(`<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>¡Formulario creado!</h2><p>Compártelo con los inspectores. Antes, entra a "Editar" en su tarjeta para agregar quiénes firman.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><input readonly value="${esc(url)}" onclick="this.select()"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="btnCerrarEnlaceCreado">Cerrar</button>
      <button class="btn btn-ghost" id="btnQrEnlaceCreado">${I.qr} QR</button>
      <button class="btn btn-primary" id="btnCopiarEnlaceCreado">${I.link} Copiar enlace</button>
    </div></div>`, ()=> renderInspeccionesAdmin('norecarga'));
  document.getElementById('btnCerrarEnlaceCreado').onclick = ()=> closeModal();
  document.getElementById('btnCopiarEnlaceCreado').onclick = ()=> copyText(url, "Enlace copiado");
  document.getElementById('btnQrEnlaceCreado').onclick = ()=> mostrarQR(url, "Enlace de inspección", ()=> mostrarEnlaceCreadoInsp(enlaceId));
}

/* ---------- Firmas (predeterminados del responsable del área) — calco de
   abrirPredeterminadosModal de EPP, sin el tope PREDET_MAX (aquí se eligen de un
   <select> al crear un enlace, no de chips en un asistente). ---------- */
async function abrirPredeterminadosInsp(){
  bloquear("Cargando firmas…");
  try{ await loadInspeccionesState(); } finally{ desbloquear(); }
  openModal(`<div class="modal" style="max-width:560px">
    <div class="modal-head"><div><h2>Firmas del responsable del área</h2><p>Guarda el nombre, cargo y firma de quien responde por el área, para asociarla a un enlace de inspección. Este banco es único para todos los contratos — lo que guardes acá lo puedes usar sin importar en cuál estés parado.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <button class="btn btn-primary btn-sm" id="btnNuevoPredetInsp" style="margin-bottom:14px">${I.plus} Nueva firma</button>
      <div id="predetInspLista"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>
  </div>`);
  document.getElementById('btnNuevoPredetInsp').onclick = ()=> abrirFormPredeterminadoInsp(null);
  renderPredeterminadosInspLista();
}

function renderPredeterminadosInspLista(){
  const host = document.getElementById('predetInspLista'); if(!host) return;
  const items = INSPECCIONES.predeterminados;
  host.innerHTML = items.length ? items.map(p=>`
    <div class="cat-row">
      <img src="${p.firma}" alt="firma" style="height:34px;max-width:70px;border:1px solid var(--line);border-radius:6px;background:#fff;object-fit:contain">
      <span style="flex:1;font-weight:600;font-size:13.5px">${esc(p.nombre)}<div class="muted-sm" style="font-weight:400">${esc(p.responsable_nombre)}${p.responsable_cargo?' · '+esc(p.responsable_cargo):''}</div></span>
      <button class="icon-btn" title="Editar" data-predet-edit="${p.id}">${I.pen}</button>
      <button class="icon-btn danger" title="Eliminar" data-predet-del="${p.id}">${I.trash}</button>
    </div>`).join('') : `<p class="muted-sm">Aún no has guardado ninguna firma.</p>`;
  host.querySelectorAll('[data-predet-edit]').forEach(b=>{ b.onclick = ()=> abrirFormPredeterminadoInsp(b.dataset.predetEdit); });
  host.querySelectorAll('[data-predet-del]').forEach(b=>{ b.onclick = ()=> eliminarPredeterminadoInsp(b.dataset.predetDel); });
}

function abrirFormPredeterminadoInsp(id){
  const p = id ? INSPECCIONES.predeterminados.find(x=>x.id===id) : null;
  openSubModal(`<div class="modal" style="max-width:480px">
    <div class="modal-head"><div><h2>${p?'Editar firma':'Nueva firma'}</h2><p>Ej. "Coordinadora Corabastos"…</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Nombre de la plantilla *</label><input id="piNombre" value="${esc(p?.nombre||'')}" placeholder="Ej. Responsable turno mañana"></div>
      <div class="field row2">
        <div><label>Nombre del responsable *</label><input id="piRespNombre" value="${esc(p?.responsable_nombre||'')}" placeholder="Nombre completo"></div>
        <div><label>Cargo</label><input id="piRespCargo" value="${esc(p?.responsable_cargo||'')}" placeholder="Cargo"></div>
      </div>
      <label style="font-weight:700;font-size:13px;display:block;margin:10px 0 6px">Firma *</label>
      ${p?`<div id="piFirmaGuardada" style="text-align:center;margin-bottom:10px"><img src="${p.firma}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"></div>
      <button class="btn btn-ghost btn-sm" id="btnPiRefirmar" style="margin-bottom:10px">${I.pen} Firmar de nuevo</button>`:''}
      <div id="piPadWrap" style="${p?'display:none':''}">
        <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
        <div class="sig-actions">
          <button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btnPiAdjuntarFirma">${I.plus} Adjuntar imagen de firma</button>
        </div>
        <p class="muted-sm" style="margin-top:4px">Si ya tienes la firma guardada como foto o imagen en el computador, la puedes subir — le quitamos el fondo automáticamente.</p>
        <input type="file" id="piArchivoFirma" accept="image/*" style="display:none">
        <div id="piFirmaSubidaPreview"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarPredetInsp">${I.check} Guardar</button>
    </div></div>`, ()=>abrirPredeterminadosInsp());
  let usarPad = !p;
  let firmaSubida = null;
  if(usarPad){ initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear(); }
  const reBtn = document.getElementById('btnPiRefirmar');
  if(reBtn) reBtn.onclick = ()=>{
    document.getElementById('piFirmaGuardada').style.display='none';
    reBtn.style.display='none';
    document.getElementById('piPadWrap').style.display='block';
    usarPad = true;
    initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear();
  };
  document.getElementById('btnPiAdjuntarFirma').onclick = ()=> document.getElementById('piArchivoFirma').click();
  document.getElementById('piArchivoFirma').onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const prev = document.getElementById('piFirmaSubidaPreview');
    prev.innerHTML = `<p class="muted-sm">Procesando…</p>`;
    try{
      firmaSubida = await quitarFondoFirma(f);
      prev.innerHTML = `<div style="text-align:center;margin-top:8px;padding:10px;background:repeating-conic-gradient(#e9ecf5 0% 25%,#fff 0% 50%) 50%/16px 16px"><img src="${firmaSubida}" style="height:80px;max-width:100%"></div>`;
    }catch(err){ prev.innerHTML = `<p class="muted-sm" style="color:var(--danger)">No se pudo procesar la imagen</p>`; firmaSubida = null; }
  };
  document.getElementById('btnGuardarPredetInsp').onclick = async ()=>{
    const nombre = document.getElementById('piNombre').value.trim();
    const respNombre = document.getElementById('piRespNombre').value.trim();
    const respCargo = document.getElementById('piRespCargo').value.trim() || null;
    if(!nombre){ toast("Ponle un nombre a la plantilla","err"); return; }
    if(!respNombre){ toast("Falta el nombre del responsable","err"); return; }
    let firma = p ? p.firma : null;
    if(firmaSubida){ firma = firmaSubida; }
    else if(usarPad){
      if(!sigPad || sigPad.isEmpty()){ toast("Falta la firma","err"); return; }
      firma = sigPad.dataURL();
    }
    const btn = document.getElementById('btnGuardarPredetInsp'); btn.disabled=true; btn.innerHTML="Guardando…";
    const payload = { nombre, responsable_nombre: respNombre, responsable_cargo: respCargo, firma };
    const { error } = p
      ? await sb.from("insp_predeterminados").update(payload).eq("id", p.id)
      : await sb.from("insp_predeterminados").insert(payload);
    if(error){ btn.disabled=false; btn.innerHTML=`${I.check} Guardar`; toast("No se pudo guardar: "+error.message,"err"); return; }
    await loadInspeccionesState();
    toast(p?"Firma actualizada":"Firma creada","ok");
    closeModal();
  };
}

function eliminarPredeterminadoInsp(id){
  const p = INSPECCIONES.predeterminados.find(x=>x.id===id);
  const enUso = INSPECCIONES.enlaces.filter(e=>e.predeterminado_id===id);
  if(enUso.length){
    toast(`No se puede eliminar: la usa${enUso.length===1?' 1 enlace':' '+enUso.length+' enlaces'}. Cambia primero esos enlaces a otra firma.`,"err");
    return;
  }
  openSubModal(`<div class="modal" style="max-width:420px">
    <div class="modal-head"><div><h2>Eliminar firma</h2><p>Esta acción no se puede deshacer.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body"><p style="font-size:14.5px;color:var(--ink-2)">Se eliminará la firma <b>${esc(p?.nombre||'')}</b>.</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confDelPredetInsp">${I.trash} Sí, eliminar</button></div></div>`, ()=>abrirPredeterminadosInsp());
  document.getElementById("confDelPredetInsp").onclick = async ()=>{

/* ---------- Asistente de 3 pasos: nueva inspección ---------- */
let inspeccionDraft = null;
function claseEstadoInsp(estado, estadosTipo){
  // Si la sección ya tiene el marcado manual del usuario (estadosTipo, ver 7.111 en
  // MEMORY.md), ese manda. Si no (formatos creados antes de esa función), se cae al
  // adivinado por texto de siempre, solo para no dejar sin color a formatos viejos.
  if(estadosTipo && estadosTipo[estado]) return estadosTipo[estado];
  const e = (estado||'').trim().toLowerCase();
  if(e==='n/a' || e==='na') return 'na';
  if(e.startsWith('no')) return 'mal';
  return 'bien';
}

// % de cumplimiento de una inspección: cuenta las respuestas de TODAS las secciones
// checklist según el marcado manual (o el adivinado, para formatos viejos sin marcar
// — ver claseEstadoInsp). Los ítems marcados "na" (no cuenta) y los sin responder NO
// entran en el % (solo se cuentan conformes+no conformes como el total).
function calcularCumplimientoInsp(estructura, respuestas){
  let conformes=0, noConformes=0, neutrales=0, sinResponder=0;
  for(const s of (estructura||[])){
    if(s.tipo!=='checklist') continue;
    for(const it of (s.items||[])){
      const r = (respuestas||{})[it.id] || {};
      if(!r.estado){ sinResponder++; continue; }
      const cls = claseEstadoInsp(r.estado, s.estadosTipo);
      if(cls==='bien') conformes++;
      else if(cls==='mal') noConformes++;
      else neutrales++;
    }
  }
  const total = conformes+noConformes;
  return { conformes, noConformes, neutrales, sinResponder, pct: total ? Math.round(conformes/total*100) : null };
}

function renderInspFormBody(){
  const host = document.getElementById('inspFormBody'); if(!host) return;
  // La sección de fotos vive DENTRO de "estructura" (se puede mover como cualquier
  // otra sección) desde que se agregó esa opción — pero las inspecciones o formatos
  // guardados antes de eso nunca tuvieron esa entrada, así que si no aparece ahí
  // se respeta el comportamiento de siempre: fotos al final, controlado por el
  // booleano "tieneFotos" suelto.
  const tieneSeccionFotos = inspeccionDraft.estructura.some(s=>s.tipo==='fotos');
  host.innerHTML = inspeccionDraft.estructura.map(s=>{
    if(s.tipo==='info') return renderSeccionInfoInsp(s);
    if(s.tipo==='checklist') return renderSeccionChecklistInsp(s);
    if(s.tipo==='tabla_dinamica') return renderSeccionTablaInsp(s);
    if(s.tipo==='fotos') return renderSeccionFotosInsp(s);
    if(s.tipo==='gps') return renderSeccionGpsInsp(s);
    return '';
  }).join('') + (!tieneSeccionFotos && inspeccionDraft.tieneFotos ? renderSeccionFotosInsp() : '');
  wireInspFormBody(host);
}

// El límite y la obligatoriedad los decide el admin al armar el formato
// (checkbox + campo numérico en renderEditorSeccionFotos) — ya no hay un
// tope fijo de 5 para todos. "s" puede venir undefined (formatos viejos que
// solo tenían el booleano suelto "tieneFotos"), por eso el fallback a 5/false.
function maxFotosInsp(){
  const s = inspeccionDraft.estructura.find(x=>x.tipo==='fotos');
  return (s && s.max) ? s.max : 5;
}
function requeridoFotosInsp(){
  const s = inspeccionDraft.estructura.find(x=>x.tipo==='fotos');
  return !!(s && s.requerido);
}
function renderSeccionFotosInsp(s){
  const max = maxFotosInsp(), req = requeridoFotosInsp();
  return `<div class="panel-section" style="margin-bottom:18px">
    <div class="section-label">${esc((s&&s.titulo)||'Registro fotográfico')}${req?' *':''} <span class="muted-sm">(máximo ${max})</span></div>
    <div id="inspFotosGrid" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${fotosInspGridHTML()}</div>
    <input type="file" id="fileFotoInsp" accept="image/*" capture="environment" style="display:none">
    <button type="button" class="btn btn-ghost btn-sm" id="btnAddFotoInsp" ${inspeccionDraft.fotos.length>=max?'disabled':''}>${I.plus} Agregar foto</button>
  </div>`;
}

function renderSeccionGpsInsp(s){
  const g = inspeccionDraft.respuestas[s.id];
  return `<div class="panel-section" style="margin-bottom:18px">
    <div class="section-label">${esc(s.titulo||'Ubicación')} *</div>

}
function fotosInspGridHTML(){
  return inspeccionDraft.fotos.map((f,j)=>`<div style="position:relative"><img src="${f}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"><button type="button" class="icon-btn danger" data-foto-del="${j}" style="position:absolute;top:-6px;right:-6px;background:#fff;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.2)">${I.trash}</button></div>`).join('');

function wireFotosInspGrid(){
  document.querySelectorAll('[data-foto-del]').forEach(b=>{
    b.onclick = ()=>{
      inspeccionDraft.fotos.splice(+b.dataset.fotoDel,1);

      wireFotosInspGrid();
      const btnAdd = document.getElementById('btnAddFotoInsp'); if(btnAdd) btnAdd.disabled = inspeccionDraft.fotos.length>=maxFotosInsp();
    };

function wireInspFormBody(host){
  host.querySelectorAll('[data-campo]').forEach(el=>{
    el.oninput = el.onchange = (e)=>{ inspeccionDraft.respuestas[el.dataset.campo] = e.target.value; sincronizarFirmantesVinculadosInsp(); };
  });
  host.querySelectorAll('[data-campo-multi]').forEach(el=>{
    el.onchange = ()=>{
      const id = el.dataset.campoMulti;
      const actuales = Array.isArray(inspeccionDraft.respuestas[id]) ? inspeccionDraft.respuestas[id] : [];
      if(el.checked){ if(!actuales.includes(el.value)) actuales.push(el.value); }
      else { const idx = actuales.indexOf(el.value); if(idx>=0) actuales.splice(idx,1); }
      inspeccionDraft.respuestas[id] = actuales;
    };
  });
  host.querySelectorAll('[data-item-estado]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.itemEstado, val = b.dataset.estadoVal;
      const r = inspeccionDraft.respuestas[id] = inspeccionDraft.respuestas[id] || {};
      r.estado = r.estado===val ? null : val;
      host.querySelectorAll(`[data-item-estado="${id}"]`).forEach(x=>{
        const activa = x.dataset.estadoVal===r.estado;
        x.className = 'chip-estado' + (activa ? ' active '+x.dataset.estadoCls : '');
      });
    };
  });
  host.querySelectorAll('[data-item-obs]').forEach(el=>{
    el.oninput = ()=>{ const id=el.dataset.itemObs; const r = inspeccionDraft.respuestas[id] = inspeccionDraft.respuestas[id]||{}; r.observaciones = el.value; };
  });
  host.querySelectorAll('[data-item-marca]').forEach(el=>{
    el.oninput = ()=>{ const id=el.dataset.itemMarca; const r = inspeccionDraft.respuestas[id] = inspeccionDraft.respuestas[id]||{}; r.marca_modelo = el.value; };
  });
  host.querySelectorAll('[data-item-cantidad]').forEach(el=>{
    el.oninput = ()=>{ const id=el.dataset.itemCantidad; const r = inspeccionDraft.respuestas[id] = inspeccionDraft.respuestas[id]||{}; r.cantidad = el.value; };
  });
  host.querySelectorAll('[data-item-vence]').forEach(el=>{
    el.oninput = ()=>{ const id=el.dataset.itemVence; const r = inspeccionDraft.respuestas[id] = inspeccionDraft.respuestas[id]||{}; r.fecha_vencimiento = el.value; };
  });
  host.querySelectorAll('[data-tabla-celda]').forEach(el=>{
    el.oninput = ()=>{
      const [sid,j,colId] = el.dataset.tablaCelda.split(':');
      const arr = Array.isArray(inspeccionDraft.respuestas[sid]) ? inspeccionDraft.respuestas[sid] : (inspeccionDraft.respuestas[sid]=[]);
      arr[+j] = arr[+j] || {};
      arr[+j][colId] = el.value;
    };
  });
  host.querySelectorAll('[data-tabla-del]').forEach(b=>{
    b.onclick = ()=>{
      const [sid,j] = b.dataset.tablaDel.split(':');
      const arr = inspeccionDraft.respuestas[sid] || [];
      arr.splice(+j,1);
      renderInspFormBody();
    };
  });
  host.querySelectorAll('[data-tabla-add]').forEach(b=>{
    b.onclick = ()=>{
      const sid = b.dataset.tablaAdd;
      const arr = Array.isArray(inspeccionDraft.respuestas[sid]) ? inspeccionDraft.respuestas[sid] : (inspeccionDraft.respuestas[sid]=[]);
      arr.push({});
      renderInspFormBody();
    };
  });
  const fileFoto = host.querySelector('#fileFotoInsp');
  if(fileFoto) fileFoto.onchange = async ()=>{
    const f = fileFoto.files[0]; if(!f) return;
    const max = maxFotosInsp();
    if(inspeccionDraft.fotos.length>=max){ toast("Máximo "+max+" fotos","err"); return; }
    const comprimida = await comprimirImagen(f, 900);
    inspeccionDraft.fotos.push(comprimida);
    fileFoto.value = '';
    const grid = document.getElementById('inspFotosGrid'); if(grid) grid.innerHTML = fotosInspGridHTML();
    wireFotosInspGrid();
    const btnAdd = document.getElementById('btnAddFotoInsp'); if(btnAdd) btnAdd.disabled = inspeccionDraft.fotos.length>=max;
  };
  const btnAddFoto = host.querySelector('#btnAddFotoInsp');
  if(btnAddFoto) btnAddFoto.onclick = ()=> fileFoto.click();
  wireFotosInspGrid();
  host.querySelectorAll('[data-gps-insp]').forEach(b=>{
    b.onclick = async ()=>{
      const sid = b.dataset.gpsInsp;
      b.disabled = true; b.innerHTML = "Obteniendo ubicación…";
      const g = await obtenerGPS();
      if(!g){ toast("No se pudo obtener tu ubicación — revisa el permiso de GPS del navegador","err"); b.disabled=false; b.innerHTML = `${I.pin} Compartir mi ubicación`; return; }
      inspeccionDraft.respuestas[sid] = g;
      const box = document.getElementById('gpsBoxInsp_'+sid);
      if(box) box.innerHTML = `<div class="cap-ok">${I.check} Ubicación capturada (±${Math.round(g.precision||0)} m)</div>`;
    };
  });
}

/* Valida contra inspeccionDraft.respuestas: (1) los campos "requeridos" de las
   secciones tipo info (ej. Área inspeccionada), (2) TODOS los ítems de TODAS las
   secciones checklist — a diferencia de los campos de info, esto no es opcional
   por ítem, siempre se exige marcar algún estado, para que al inspector no se le
   pase ninguno por accidente (pedido explícito del usuario). Se reutiliza tanto
   en la página pública como en cualquier otro lugar que use este mismo draft. */
function validarCamposRequeridosInsp(){
  for(const s of inspeccionDraft.estructura){
    if(s.tipo==='info'){
      for(const c of (s.campos||[])){
        if(!c.requerido) continue;
        const v = inspeccionDraft.respuestas[c.id];
        const vacio = c.tipo==='seleccion_multiple' ? !(Array.isArray(v)&&v.length) : !v;
        if(vacio){ toast(`Falta "${c.etiqueta}"`,"err"); return false; }
      }
    } else if(s.tipo==='checklist'){
      for(const it of (s.items||[])){
        const r = inspeccionDraft.respuestas[it.id];
        if(!r || !r.estado){ toast(`Falta marcar "${it.texto}" en "${s.titulo||'checklist'}"`,"err"); return false; }
      }
    }
  }
  return true;
}

/* ---------- Historial de inspecciones del contrato, con filtro de mes (mismo
   patrón que abrirHistorialEntregasDot de EPP/Dotación, más simple porque aquí
   no hay directorio de trabajadores de por medio: se consulta directo) ---------- */
async function abrirHistorialInspecciones(mesInicial){
  if(contratoInspActualId==='todos'){ toast("Elige un contrato específico primero","err"); return; }
  const c = contratoInspActual();
  const mes0 = mesInicial || hoyLocal().slice(0,7);
  openModal(`<div class="modal lg">
    <div class="modal-head"><div><h2>Historial de inspecciones</h2><p>${esc(c?.nombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field" style="max-width:220px">
        <label>Mes</label>
        <input type="month" id="historialInspMes" value="${mes0}">
      </div>
      <div id="historialInspLista" style="margin-top:12px"><div class="empty"><h3>Cargando…</h3></div></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>
  </div>`);

  async function cargar(mes){
    const host = document.getElementById('historialInspLista');
    if(!host) return;
    host.innerHTML = `<div class="empty"><h3>Cargando…</h3></div>`;
    const { desde } = rangoDelMes(mes);
    const [y,m] = mes.split('-').map(Number);
    const siguienteMes = (m===12 ? (y+1)+'-01-01' : y+'-'+String(m+1).padStart(2,'0')+'-01');
    const { data, error } = await sb.from("insp_inspecciones")
      .select("id,formato_nombre,inspector_nombre,responsable_nombre,creado_en")
      .eq("contrato_id", contratoInspActualId)
      .gte("creado_en", desde).lt("creado_en", siguienteMes)
      .order("creado_en",{ascending:false});
    if(error){ host.innerHTML = `<div class="empty"><h3>No se pudo cargar</h3><p>${esc(error.message)}</p></div>`; return; }
    const lista = data || [];
    if(!lista.length){ host.innerHTML = `<div class="empty"><div class="ic">${I.box}</div><h3>Sin inspecciones</h3><p>No hay inspecciones registradas en ${fmtMesLabel(mes)}.</p></div>`; return; }
    host.innerHTML = `<p class="muted-sm" style="margin:0 0 8px">${lista.length} inspección(es) en ${fmtMesLabel(mes)}</p>
      <div class="table-wrap"><table class="dt">
        <thead><tr><th>Fecha</th><th>Formato</th><th>Inspector</th><th>Responsable</th><th></th></tr></thead>
        <tbody>${lista.map(x=>{
          const hora = x.creado_en ? new Date(x.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'}) : '';
          const puedeTocar = puedoTocarInspeccionReciente(x.creado_en);
          return `<tr>
            <td>${fmtDate((x.creado_en||'').slice(0,10))}${hora?`<div class="muted-sm">${hora}</div>`:''}</td>
            <td>${esc(x.formato_nombre||'—')}</td>
            <td>${esc(x.inspector_nombre||'—')}</td>
            <td>${esc(x.responsable_nombre||'—')}</td>
            <td><div style="display:flex;gap:4px">
              <button class="icon-btn" title="Ver / descargar PDF" onclick="verInspeccion('${x.id}')">${I.eye}</button>
              ${puedeTocar?`<button class="icon-btn" title="Editar" onclick="abrirEditarInspeccionPorId('${x.id}')">${I.pen}</button>
              <button class="icon-btn danger" title="Eliminar" onclick="eliminarInspeccion('${x.id}', ()=>abrirHistorialInspecciones('${mes}'))">${I.trash}</button>`:''}
            </div></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`;
  }

  document.getElementById('historialInspMes').onchange = (e)=> cargar(e.target.value);
  cargar(mes0);
}

/* ---------- Ver una inspección ya guardada (solo lectura) + descargar su PDF ---------- */
/* Admin siempre puede tocar (editar/eliminar) una inspección. Como el registro es
   100% público (nadie tiene sesión al llenarlo, "creado_por" siempre queda null),
   no hay forma de saber "quién la hizo" para aplicar la regla habitual de
   puedoTocarReciente (que exige que coincida el creador) — en su lugar, cualquier
   editor con acceso al contrato puede tocarla, pero SOLO dentro de las 24h
   siguientes a creado_en; pasado ese tiempo, solo admin. */
function puedoTocarInspeccionReciente(creadoEn){
  if(MIPERFIL.esAdmin) return true;
  if(!puedeEscribir() || !creadoEn) return false;
  return (Date.now() - new Date(creadoEn).getTime()) < 24*60*60*1000;
}

async function verInspeccion(id){
  bloquear("Cargando inspección…");
  const { data, error } = await sb.from("insp_inspecciones").select("*").eq("id",id).maybeSingle();
  desbloquear();
  if(error || !data){ toast("No se pudo cargar la inspección","err"); return; }
  const nombreContrato = INSPECCIONES.contratos.find(c=>c.id===data.contrato_id)?.nombre || '';
  const nombreEnlace = INSPECCIONES.enlaces.find(e=>e.id===data.enlace_id)?.nombre || '';
  const hora = data.creado_en ? new Date(data.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'}) : '';
  const puedeTocar = puedoTocarInspeccionReciente(data.creado_en);
  const cump = calcularCumplimientoInsp(data.estructura, data.respuestas);
  // Desde [[CAMBIOS_SQL_61]] "mostrar_cumplimiento" siempre viene congelado en la
  // propia fila (antes se buscaba en vivo en el formato cacheado).
  const mostrarCumplimientoVer = data.mostrar_cumplimiento !== false;
  // Misma compatibilidad que construirInspeccionPDF: usa el arreglo "firmantes"
  // (CAMBIOS_SQL_56) si existe, si no arma la lista equivalente desde las
  // columnas viejas fijas (inspecciones guardadas antes de esa migración).
  let firmasListaVer = Array.isArray(data.firmantes) && data.firmantes.length ? data.firmantes : [];
  if(!firmasListaVer.length){
    if(data.firma_inspector) firmasListaVer.push({ rol:'Inspector', nombre:data.inspector_nombre, cargo:null, firma:data.firma_inspector });
    if(data.firma_responsable) firmasListaVer.push({ rol:'Responsable del área', nombre:data.responsable_nombre, cargo:data.responsable_cargo, firma:data.firma_responsable });
  }
  openModal(`<div class="modal lg">
    <div class="modal-head"><div><h2>${esc(data.formato_nombre)}</h2><p>${fmtDate((data.creado_en||'').slice(0,10))}${hora?' · '+hora:''} · ${esc(nombreContrato)}${nombreEnlace?' · '+esc(nombreEnlace):''}</p></div>

        </div>

    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
      ${puedeTocar?`<button class="btn btn-ghost" id="btnEditarInspVer">${I.pen} Editar</button>
