/* ---------- Firma en canvas (mouse + touch + lápiz) ---------- */
/* Refactor mínimo: la lógica de dibujo vivía ligada a los ids fijos "sigCanvas"/
   "sigBox"/"sigPh" y al global "sigPad" — initSignature() sigue funcionando IGUAL
   para los 25+ sitios que ya la usan así (EPP, Dotación, Documentos, Asistencia,
   predeterminados...), pero ahora es un envoltorio de una versión parametrizada
   (crearFirmaPad) que Inspecciones usa para tener VARIOS pads a la vez (un
   firmante "fresco" por sección, ver 7.11x en MEMORY.md) sin tocar el sigPad global. */
function crearFirmaPad(canvasId, boxId, phId){
  const canvas = document.getElementById(canvasId);
  const box = document.getElementById(boxId);
  const ph = document.getElementById(phId);
  const ctx = canvas.getContext("2d");
  let drawing=false, hasInk=false, last=null;

  function resize(preservar){
    // Preserva lo dibujado (para no perder la firma al rotar/cambiar de tamaño)
    const prev = (preservar && hasInk) ? canvas.toDataURL() : null;
    const ratio = window.devicePixelRatio || 1;
    const w = box.clientWidth, h = 200;
    canvas.width = w*ratio; canvas.height = h*ratio;
    canvas.style.width=w+"px"; canvas.style.height=h+"px";
    ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#0e1733";
    if(prev){ const img=new Image(); img.onload=()=>{ ctx.drawImage(img,0,0,w,h); }; img.src=prev; }
  }
  let lastW = box.clientWidth;
  resize(false);
  // IMPORTANTE: en móvil, hacer scroll muestra/oculta la barra del navegador y dispara "resize";
  // solo redimensionamos si cambió el ANCHO (rotación), preservando la firma. Un cambio de alto NO borra nada.
  const onResize = ()=>{
    if(!document.body.contains(canvas)){ window.removeEventListener("resize", onResize); return; }
    const w = box.clientWidth;
    if(w === lastW) return;   // mismo ancho (scroll en móvil): no tocar el canvas
    lastW = w;
    resize(true);
  };
  window.addEventListener("resize", onResize);

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches?e.touches[0].clientX:e.clientX) - r.left;
    const cy = (e.touches?e.touches[0].clientY:e.clientY) - r.top;
    return {x:cx,y:cy};
  }
  function start(e){ e.preventDefault(); drawing=true; last=pos(e); ph.style.display="none"; }
  function move(e){ if(!drawing) return; e.preventDefault(); const p=pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; hasInk=true; }
  function end(e){ if(e) e.preventDefault(); drawing=false; }

  canvas.addEventListener("mousedown",start);
  canvas.addEventListener("mousemove",move);
  window.addEventListener("mouseup",end);
  canvas.addEventListener("touchstart",start,{passive:false});
  canvas.addEventListener("touchmove",move,{passive:false});
  canvas.addEventListener("touchend",end,{passive:false});

  return {
    isEmpty: ()=>!hasInk,
    clear: ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasInk=false; ph.style.display="grid"; },
    dataURL: ()=>{
      // Recorte sobre fondo blanco para el PDF. El canvas real mide CSS-px × devicePixelRatio
      // (hasta 3x en celulares de gama alta) — mucho más de lo que hace falta para una firma
      // que se imprime en una columna angosta del kárdex, así que se limita el ancho de salida.
      const maxW = 600;
      const escala = Math.min(1, maxW / canvas.width);
      const outW = Math.round(canvas.width * escala), outH = Math.round(canvas.height * escala);
      const tmp=document.createElement("canvas"); tmp.width=outW; tmp.height=outH;
      const tctx=tmp.getContext("2d"); tctx.fillStyle="#ffffff"; tctx.fillRect(0,0,tmp.width,tmp.height);
      tctx.drawImage(canvas,0,0,outW,outH);
      return tmp.toDataURL("image/png");
    }
  };
}
function initSignature(){ sigPad = crearFirmaPad("sigCanvas","sigBox","sigPh"); }

/* ---------- Registrar asistencia ---------- */
async function registrarAsistencia(id){
  if(!publicList || publicList.estado!=="activa"){ toast("La lista ya no acepta registros","err"); renderPublic(id); return; }

  const g = x => document.getElementById(x);
  let ok=true;
  [["p_nombre"],["p_doc"],["p_cargo"]].forEach(([fid])=>{
    const el=g(fid), fd=el.closest(".field, .row2 > div")||el.parentElement;
    if(!el.value.trim()){ fd.classList.add("invalid"); ok=false; } else fd.classList.remove("invalid");
  });
  const sigErr = g("sigErr");
  if(sigPad.isEmpty()){ sigErr.style.display="block"; ok=false; } else sigErr.style.display="none";
  if(!ok){ toast("Completa los campos y la firma","err"); return; }

  const nombre = g("p_nombre").value.trim();
  const documento = g("p_doc").value.trim();
  const btn = g("pRegistrar");
  btn.disabled = true; btn.innerHTML = "Registrando…";

  // Bloqueo por cédula: si ya está registrado en esta lista, no permitir de nuevo
  try{
    const ya = await sb.rpc("asis_ya_registrado",{ p_lista:id, p_doc:documento });
    if(ya && ya.data===true){
      btn.disabled = false; btn.innerHTML = `${I.check} Registrar asistencia`;
      mostrarYaRegistrado(documento);
      return;
    }
  }catch(e){ /* si la RPC no existe aún, el RLS igual bloquea el duplicado */ }

  const { data, error } = await sb.rpc("asis_registrar_publico", {
    p_lista_id: id,
    p_nombre: nombre,
    p_documento: documento,
    p_cargo: g("p_cargo").value.trim(),
    p_area: g("p_area").value.trim() || null,
    p_firma: sigPad.dataURL()
  });

  if(error || !data || !data.ok){
    btn.disabled = false; btn.innerHTML = `${I.check} Registrar asistencia`;
    const motivo = data && data.motivo;
    if(motivo === "ya_registrado"){ mostrarYaRegistrado(documento); return; }
    toast(motivo === "cerrada" ? "Este documento ya fue registrado, o la lista fue cerrada." : ("No se pudo registrar: "+((error&&error.message)||motivo||"")), "err");
    return;
  }

  let total = publicCount + 1;
  try{ const c = await sb.rpc("asis_contar",{ p_lista:id }); if(typeof c.data==="number") total = c.data; }catch(e){}
  publicCount = total;

  document.getElementById("pubBody").innerHTML = `
    <div class="success-screen">
      <div class="ic">${I.checkBig}</div>
      <h2>¡Asistencia registrada!</h2>
      <p>Gracias, <b>${esc(nombre)}</b>. Tu firma quedó registrada correctamente.</p>
      <div class="counter-pill">${I.users} ${total} persona(s) registrada(s)</div>
      <div style="margin-top:26px">
        <button class="btn btn-green" id="otra" style="padding:13px 26px">${I.plus} Registrar otra persona</button>
      </div>
    </div>`;
  document.getElementById("otra").onclick = ()=> renderPublic(id);
  toast("Asistencia registrada","ok");
}

/* Pantalla: este documento ya registró asistencia en esta lista */

  const body = document.getElementById("pubBody");

  const lid = publicList ? publicList.id : "";
  body.innerHTML = `

}

async function guardarFirmaResponsable(id){
  const sigErr = document.getElementById("sigErr");

  sigErr.style.display="none";
  const btn = document.getElementById("rGuardar");
  btn.disabled = true; btn.innerHTML = "Guardando…";
  let ok=false, msg="";
  try{
    const { data, error } = await sb.rpc("asis_firmar_responsable",{ p_lista:id, p_firma:sigPad.dataURL() });
    if(error){ msg=error.message; }
    else if(data && data.ok===false){ msg = data.motivo||"no_guardado"; }
    else { ok=true; }
  }catch(e){ msg = e.message||"error"; }
  if(!ok){
    btn.disabled = false; btn.innerHTML = `${I.check} Guardar firma`;
    toast("No se pudo guardar la firma: "+msg,"err");
    return;
  }
  document.getElementById("respBody").innerHTML = `

      <div class="ic">${I.checkBig}</div>
      <h2>¡Firma registrada!</h2>
      <p>Gracias. La firma del responsable quedó guardada y se incluirá en el PDF de la lista de asistencia.</p>
    </div>`;
  toast("Firma del responsable guardada","ok");
}

/* Pide (o reutiliza) la firma del responsable antes de generar el PDF de asistencia */
async function firmarYGenerarPDF(id){
  const l = getList(id); if(!l){ toast("Lista no encontrada","err"); return; }
  let guardada = null;
  try{ const {data} = await sb.from("asis_listas").select("responsable_firma").eq("id",id).maybeSingle(); guardada = data && data.responsable_firma; }catch(e){}
  // Si el responsable ya firmó (por enlace/QR o antes), generar el PDF directo sin ventana.
  if(guardada){ generarPDF(id, guardada); return; }
  openModal(`<div class="modal" style="max-width:520px">
    <div class="modal-head"><div><h2>Firma del responsable</h2><p>${esc(l.responsableNombre||'—')}${l.responsableCargo?' · '+esc(l.responsableCargo):''}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <p class="muted-sm" style="margin-bottom:10px">La firma del responsable queda estampada en el PDF.</p>
      ${guardada?`<div id="firmaGuardada" style="text-align:center;margin-bottom:12px"><img src="${guardada}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"><div class="muted-sm" style="margin-top:6px">Firma guardada del responsable</div></div>`:''}
      <div id="padWrap" style="${guardada?'display:none':''}">
        <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
        <div class="sig-actions"><button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="btnSinFirma">Generar sin firma</button>
      ${guardada?`<button class="btn btn-ghost" id="btnReFirmar">Firmar de nuevo</button>`:''}
      <button class="btn btn-green" id="btnFirmarGen">${I.check} Generar PDF</button>
    </div></div>`);
  let usarPad = !guardada;
  if(usarPad){ initSignature(); document.getElementById('sigClear').onclick=()=>sigPad.clear(); }
  const reBtn = document.getElementById('btnReFirmar');
  if(reBtn) reBtn.onclick = ()=>{
    const fg=document.getElementById('firmaGuardada'); if(fg) fg.style.display='none';
    document.getElementById('padWrap').style.display='block'; usarPad=true; reBtn.style.display='none';
    initSignature(); document.getElementById('sigClear').onclick=()=>sigPad.clear();
  };
  document.getElementById('btnSinFirma').onclick = ()=>{ closeModal(); generarPDF(id, null); };
  document.getElementById('btnFirmarGen').onclick = async ()=>{
    let firma = guardada;
    if(usarPad){
      if(!sigPad || sigPad.isEmpty()){ toast("Firma primero, o usa 'Generar sin firma'","err"); return; }
      firma = sigPad.dataURL();
      try{ await sb.from("asis_listas").update({ responsable_firma:firma }).eq("id",id); }catch(e){}
    }
    closeModal();
    generarPDF(id, firma);
  };
}

async function generarPDF(id, firmaResp){
  const l = getList(id);
  if(!l){ toast("Lista no encontrada","err"); return; }
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  bloquear("Generando PDF…");
  try{
  await cargarFirmasLista(id);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const PW = 210, M = 10, RIGHT = PW - M;
  const asis = l.asistentes || [];
  // Convertidas a JPEG antes de armar la tabla (ver firmaParaPdf) — jsPDF infla mucho
  // las firmas PNG al incrustarlas, así que se resuelven todas de una vez aquí.
  const firmasJpg = new Map();
  await Promise.all(asis.filter(a=>a && a.firma).map(async a=>{ firmasJpg.set(a.id, await firmaParaPdf(a.firma)); }));
  if(firmaResp) firmaResp = await firmaParaPdf(firmaResp);

  // columnas tabla asistentes
  const cNo = M, cNom = M+14, cCed = M+74, cCar = M+114, cFir = M+154, cEnd = RIGHT; // 14/60/40/40/36
  const ROW_H = 21; // +5mm sobre el original para dejar sitio a la línea de IP/dispositivo

  function grayHead(y,h){ doc.setFillColor(238,241,248); doc.rect(M,y,RIGHT-M,h,"F"); }
  function line(x1,y1,x2,y2){ doc.setDrawColor(200,206,224); doc.line(x1,y1,x2,y2); }

  // ---- Encabezado principal (solo pág. 1) ----
  function encabezadoPrincipal(){
    let y = M;
    const hH = 24;
    doc.setDrawColor(150,160,190); doc.setLineWidth(0.3);
    doc.rect(M, y, RIGHT-M, hH);
    const logoW = 44;
    doc.line(M+logoW, y, M+logoW, y+hH);
    doc.line(RIGHT-50, y, RIGHT-50, y+hH);
    // logo
    try{ doc.addImage(LOGO, "JPEG", M+4, y+2, 36, 36*315/570); }catch(e){}
    // título
    doc.setTextColor(20,33,90); doc.setFont("helvetica","bold"); doc.setFontSize(15);
    doc.text("REGISTRO DE ASISTENCIA", (M+logoW+RIGHT-50)/2, y+13, {align:"center"});
    // bloque código
    doc.setFontSize(8); doc.setTextColor(40,40,40);
    doc.setFont("helvetica","bold"); doc.text("Código: "+CODIGO, RIGHT-47, y+5.5);
    doc.setFont("helvetica","normal");
    doc.text("Fecha creación: 06-02-2024", RIGHT-47, y+11);
    doc.text("Versión: 001", RIGHT-47, y+16.5);
    doc.text("Página 1", RIGHT-47, y+22);
    y += hH;

    // ---- Fila centro / lugar / duración / dd mm aa ----
    const fh = 7;
    const x1=M, x2=M+62, x3=M+124, x4=M+150, x5=M+165, x6=M+182, x7=RIGHT;
    grayHead(y, fh);
    doc.setDrawColor(150,160,190);
    [x1,x2,x3,x4,x5,x6,x7].forEach(x=>doc.line(x,y,x,y+fh*2));
    doc.line(M,y,RIGHT,y); doc.line(M,y+fh,RIGHT,y+fh); doc.line(M,y+fh*2,RIGHT,y+fh*2);
    doc.setFontSize(6.6); doc.setFont("helvetica","bold"); doc.setTextColor(40,40,60);
    const ct=(a,b,t)=>doc.text(t,(a+b)/2,y+4.6,{align:"center"});
    ct(x1,x2,"CENTRO DE TRABAJO"); ct(x2,x3,"LUGAR DE LA ACTIVIDAD"); ct(x3,x4,"DURACIÓN");
    ct(x4,x5,"DD"); ct(x5,x6,"MM"); ct(x6,x7,"AA");
    // valores
    const fp=(l.fecha||"").split("-");
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(20,20,20);
    const cv=(a,b,t)=>doc.text(String(t||""),(a+b)/2,y+fh+4.8,{align:"center"});
    doc.setFontSize(7.4); cv(x1,x2,l.centroTrabajo||"DON ASEO LTDA.");
    cv(x2,x3,l.lugar||""); cv(x3,x4,l.duracion||""); 
    doc.setFontSize(8.5);
    cv(x4,x5,fp[2]||""); cv(x5,x6,fp[1]||""); cv(x6,x7,fp[0]||"");
    y += fh*2;

    // ---- Actividad realizada (checkboxes) + temas ----
    const ah = 4.6*TIPOS.length + 8;
    const colMid = M+92;
    doc.setDrawColor(150,160,190);
    doc.rect(M,y,colMid-M,ah); doc.rect(colMid,y,RIGHT-colMid,ah);
    grayHead(y, 6); doc.rect(M,y,RIGHT-M,6);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(40,40,60);
    doc.text("ACTIVIDAD REALIZADA", (M+colMid)/2, y+4, {align:"center"});
    doc.text("TEMAS TRATADOS", (colMid+RIGHT)/2, y+4, {align:"center"});
    // checkboxes
    let cy = y+10;
    doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(30,30,30);
    const tipoActual = (l.tipo||"").trim();
    const esCustom = tipoActual && !TIPOS.includes(tipoActual);
    TIPOS.forEach(t=>{
      // marca el tipo elegido; si es uno personalizado, marca "Otra"
      const checked = (tipoActual===t) || (t==="Otra" && esCustom);
      doc.setDrawColor(90,90,110); doc.rect(M+3, cy-2.6, 3, 3);
      if(checked){ doc.setLineWidth(0.4); doc.line(M+3,cy-2.6,M+6,cy+0.4); doc.line(M+6,cy-2.6,M+3,cy+0.4); doc.setLineWidth(0.3); }
      // si es "Otra" personalizada, muestra el texto escrito al lado
      const label = (t==="Otra" && esCustom) ? ("Otra:  "+tipoActual) : t;
      doc.text(label, M+8, cy);
      cy += 4.6;
    });
    // TEMAS TRATADOS: nombre de la actividad (negrita) + temas debajo
    let ty = y + 9.5;
    const colW = RIGHT - colMid - 6;
    if(l.actividad){
      doc.setFont("helvetica","bold"); doc.setFontSize(8.6); doc.setTextColor(20,33,90);
      const nombreLines = doc.splitTextToSize(l.actividad, colW);
      doc.text(nombreLines, colMid+3, ty);
      ty += nombreLines.length*4.1 + 1.8;
    }
    if(l.temas){
      doc.setFont("helvetica","normal"); doc.setFontSize(7.6); doc.setTextColor(35,35,45);
      const temasLines = doc.splitTextToSize(l.temas, colW);
      doc.text(temasLines, colMid+3, ty);
    }
    y += ah + 3;
    return y;
  }

  // ---- Cabecera tabla asistentes ----
  function tablaHead(y){
    const h=7;
    grayHead(y,h);
    doc.setDrawColor(150,160,190);
    [cNo,cNom,cCed,cCar,cFir,cEnd].forEach(x=>doc.line(x,y,x,y+h));
    doc.rect(M,y,RIGHT-M,h);
    doc.setFont("helvetica","bold"); doc.setFontSize(7.2); doc.setTextColor(40,40,60);
    const ct=(a,b,t)=>doc.text(t,(a+b)/2,y+4.6,{align:"center"});
    ct(cNo,cNom,"No"); ct(cNom,cCed,"NOMBRES Y APELLIDOS");
    ct(cCed,cCar,"CÉDULA"); ct(cCar,cFir,"CARGO"); ct(cFir,cEnd,"FIRMA");
    return y+h;
  }

  // ---- Fila asistente ----
  function fila(y, idx, a){
    const h=ROW_H;
    doc.setDrawColor(180,188,210);
    [cNo,cNom,cCed,cCar,cFir,cEnd].forEach(x=>doc.line(x,y,x,y+h));
    doc.line(M,y+h,RIGHT,y+h);
    doc.setFont("helvetica","normal"); doc.setTextColor(20,20,20); doc.setFontSize(8);
    doc.text(String(idx), (cNo+cNom)/2, y+h/2+1, {align:"center"});
    if(a){
      const nom = doc.splitTextToSize(a.nombre||"", cCed-cNom-4);
      doc.text(nom, cNom+2, y+6);
      doc.setFontSize(7.6);
      doc.text(String(a.documento||""), cCed+2, y+h/2+1);
      const car = doc.splitTextToSize(a.cargo||"", cFir-cCar-4);
      doc.text(car, cCar+2, y+6);
      doc.setFontSize(6.4); doc.setTextColor(120,120,140);
      doc.text((a.fecha||"")+" "+(a.hora||""), cNom+2, y+h-5.5);
      if(a.ipAddress||a.dispositivoUa){
        doc.setFontSize(5.6);
        const partesAudit = [a.ipAddress?"IP "+a.ipAddress:null, a.dispositivoUa?resumenDispositivoUA(a.dispositivoUa):null].filter(Boolean);
        doc.text(partesAudit.join(" · "), cNom+2, y+h-2.3);
      }
      doc.setTextColor(20,20,20);
      if(a.firma){ try{ doc.addImage(firmasJpg.get(a.id)||a.firma, "JPEG", cFir+2, y+1.5, cEnd-cFir-4, h-3); }catch(e){} }
    }
  }

  // ---- Pie: observaciones + responsable ----
  // Pie FIJO al fondo de la página: observaciones + responsable + sello (nunca se parte ni se sobrepone)
  function pieFijo(){
    let fy = 249;
    doc.setDrawColor(150,160,190);
    doc.rect(M,fy,RIGHT-M,15);
    doc.setFont("helvetica","bold"); doc.setFontSize(7.4); doc.setTextColor(40,40,60);
    doc.text("OBSERVACIONES:", M+2, fy+4.5);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(20,20,20);
    doc.text(doc.splitTextToSize(l.observaciones||"", RIGHT-M-6).slice(0,2), M+2, fy+9);
    fy += 15+4;

    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(40,40,60);
    doc.text("PERSONA RESPONSABLE DE LA ACTIVIDAD", PW/2, fy, {align:"center"});
    fy += 4;
    const w=(RIGHT-M)/3;
    doc.setDrawColor(150,160,190);
    doc.rect(M,fy,w,15); doc.rect(M+w,fy,w,15); doc.rect(M+2*w,fy,w,15);
    doc.setFontSize(6.6); doc.setTextColor(90,90,110);
    doc.text("NOMBRE", M+2, fy+4); doc.text("CARGO", M+w+2, fy+4); doc.text("FIRMA", M+2*w+2, fy+4);
    doc.setFontSize(8.4); doc.setTextColor(20,20,20); doc.setFont("helvetica","normal");
    doc.text(doc.splitTextToSize(l.responsableNombre||"", w-4)[0]||"", M+2, fy+11);
    doc.text(doc.splitTextToSize(l.responsableCargo||"", w-4)[0]||"", M+w+2, fy+11);
    if(firmaResp){ try{ doc.addImage(firmaResp,'JPEG', M+2*w+2, fy+5, w-4, 9); }catch(e){} }

    doc.setFontSize(6.6); doc.setTextColor(140,140,160);
    doc.text("Generado el "+fmtDateTime(new Date())+" · Sistema Digital "+CODIGO+" · Don Aseo Ltda.", PW/2, 293, {align:"center"});
  }

  // ---- Render ----
  const FOOTER_TOP = 247;                 // la tabla nunca baja de aquí (deja sitio al pie fijo)
  let y = encabezadoPrincipal();
  y = tablaHead(y);
  const filas = asis.length + 2;          // asistentes registrados + 2 filas en blanco (no más)
  for(let i=0;i<filas;i++){
    if(y + ROW_H > FOOTER_TOP){
      doc.setFontSize(6.4); doc.setTextColor(140,140,160);
      doc.text(CODIGO+" · Don Aseo Ltda.", PW/2, 293, {align:"center"});
      doc.addPage();
      y = M+2;
      y = tablaHead(y);
    }
    fila(y, i+1, asis[i]||null);
    y += ROW_H;
  }
  pieFijo();

  const safe = (l.actividad||"asistencia").replace(/[^\w\sáéíóúñ-]/gi,"").trim().replace(/\s+/g,"_").slice(0,40);
  doc.save("Asistencia_"+safe+"_"+(l.fecha||"")+".pdf");
  toast("PDF generado","ok");
  }finally{ desbloquear(); }
}

/* ============================================================
   ███  MÓDULO: DOCUMENTOS Y FIRMAS  ███  (Fase 1: base + panel)
   El constructor de plantillas, la firma pública y la auditoría
   se activan en las fases siguientes. NO afecta a Asistencia.
   ============================================================ */
let DOCSTATE = { documentos: [], plantillas: [], firmantes: [] };

async function loadDocsState(){
  const [d, p, f] = await Promise.all([
    sb.from("doc_documentos").select("id,nombre,estado,fecha_limite,creado_en,lista_id,abierto,contenido,creado_por").order("creado_en",{ascending:false}),
    sb.from("doc_plantillas").select("id,nombre,categoria,creada_en,contenido,creada_por").order("creada_en",{ascending:false}),
    sb.from("doc_firmantes").select("id,documento_id,estado")
  ]);
  const err = d.error || p.error || f.error;
  if(err){ console.warn(err); toast("Error cargando documentos: "+err.message,"err"); }
  DOCSTATE.documentos = d.data || [];
  DOCSTATE.plantillas = p.data || [];
  DOCSTATE.firmantes  = f.data || [];
}

let _docsTimer = null;
function _tickDocs(){
  if(location.hash!=="#/docs"){ if(_docsTimer){ clearInterval(_docsTimer); _docsTimer=null; } return; }
  if(document.hidden) return;              // no refrescar en segundo plano
  renderDocsAdmin(true);                   // refresco silencioso (sin reloj de arena)
}
/* Mismo patrón que _tickDocs, replicado para los otros 3 módulos (Asistencia,
   EPP, Dotación) — antes solo Documentos tenía este refresco periódico cada
   20s; los demás solo se refrescaban (silenciosos) al volver a la pestaña. */
let _asisTimer = null;
function _tickAsis(){
  if(!(location.hash===""||location.hash==="#"||location.hash==="#/")){ if(_asisTimer){ clearInterval(_asisTimer); _asisTimer=null; } return; }
  if(document.hidden) return;
  loadState().then(()=> renderAdmin(true));
}
let _dotTimer = null;
function _tickDot(){
  if(location.hash!=="#/dotacion"){ if(_dotTimer){ clearInterval(_dotTimer); _dotTimer=null; } return; }
  if(document.hidden) return;
  renderDotacionAdmin(true);
}
let _dtlTimer = null;
function _tickDtl(){
  if(location.hash!=="#/dotacionlegal"){ if(_dtlTimer){ clearInterval(_dtlTimer); _dtlTimer=null; } return; }
  if(document.hidden) return;
  renderDtlAdmin(true);
}
let _inspTimer = null;
function _tickInsp(){
  if(location.hash!=="#/inspecciones"){ if(_inspTimer){ clearInterval(_inspTimer); _inspTimer=null; } return; }
  if(document.hidden) return;
  renderInspeccionesAdmin(true);
}

async function renderDocsAdmin(silent){
  const scrollY = window.scrollY;
  if(silent){ await loadDocsState(); }
  else { bloquear("Cargando documentos…"); try{ await loadDocsState(); } finally{ desbloquear(); } }
  const docs = DOCSTATE.documentos, firmas = DOCSTATE.firmantes, plantillas = DOCSTATE.plantillas;
  const hoy = hoyLocal();
  const creados    = docs.length;
  const enviados   = docs.filter(d=>["enviado","finalizado"].includes(d.estado)).length;
  const completas  = firmas.filter(f=>f.estado==="firmado").length;
  const pendientes = firmas.filter(f=>f.estado!=="firmado").length;
  const vencidos   = docs.filter(d=>d.estado!=="finalizado" && d.fecha_limite && d.fecha_limite < hoy).length;

  document.getElementById("app").innerHTML = `
    ${topbar('docs')}
    <div class="wrap">
      <div class="page-head">
        <div>
          <h1>Documentos y Firmas</h1>
          <p>Crea plantillas, genera documentos y recolecta firmas digitales con evidencia.</p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${puedeEscribir()?`<button class="btn btn-ghost" id="btnNuevaPlantilla">${I.doc} Nueva plantilla</button>
          <button class="btn btn-primary" id="btnNuevoDoc">${I.plus} Nuevo documento</button>`:''}
        </div>
      </div>

      <div class="stats cinco">
        <div class="stat s-total"><div class="label">Creados</div><div class="value">${creados}</div></div>
        <div class="stat s-act"><div class="label">Enviados</div><div class="value">${enviados}</div></div>
        <div class="stat s-asi"><div class="label">Firmas completadas</div><div class="value">${completas}</div></div>
        <div class="stat s-clo"><div class="label">Firmas pendientes</div><div class="value">${pendientes}</div></div>
        <div class="stat s-venc"><div class="label">Vencidos</div><div class="value">${vencidos}</div></div>
      </div>

      <div class="sec-bar"><h2>Plantillas</h2><span class="muted-sm">${plantillas.length} guardada(s)</span></div>
      ${plantillas.length
        ? `<div class="grid">${plantillas.map(plantillaCard).join("")}</div>`
        : `<div class="empty"><div class="ic">${I.doc}</div><h3>Sin plantillas todavía</h3><p>Crea tu primera plantilla con el botón “Nueva plantilla”. Podrás reutilizarla para generar documentos.</p></div>`}

      <div class="sec-bar" style="margin-top:30px"><h2>Documentos</h2><span class="muted-sm">${docs.length} creado(s)</span></div>
      ${docs.length
        ? `<div class="grid">${docs.map(documentoCard).join("")}</div>`
        : `<div class="empty"><div class="ic">${I.pdf}</div><h3>Sin documentos todavía</h3><p>Crea un documento con “Nuevo documento”, o desde el botón ➕ de una plantilla.</p></div>`}
    </div>`;

  wireLogout();
  const btnNuevaPlantilla = document.getElementById("btnNuevaPlantilla"); if(btnNuevaPlantilla) btnNuevaPlantilla.onclick = ()=> location.hash = "#/docs/plantilla/nueva";
  const btnNuevoDoc = document.getElementById("btnNuevoDoc"); if(btnNuevoDoc) btnNuevoDoc.onclick = ()=> location.hash = "#/docs/documento/nuevo";
  document.querySelectorAll("[data-pl]").forEach(b=>{
    b.onclick = ()=>{
      const id=b.dataset.id, act=b.dataset.pl;
      if(act==="edit") location.hash = "#/docs/plantilla/"+id;
      else if(act==="del") eliminarPlantilla(id);
      else if(act==="usar"){ nuevoDocPlantillaId=id; location.hash="#/docs/documento/nuevo"; }
    };
  });
  document.querySelectorAll("[data-doc]").forEach(b=>{
    b.onclick = ()=>{
      const id=b.dataset.id, act=b.dataset.doc;
      if(act==="ver") abrirDocumento(id);
      else if(act==="link") copiarTexto(linkFirmaDoc(id));
      else if(act==="qr") mostrarQR(linkFirmaDoc(id), "Firma del documento");
      else if(act==="pdf") generarPDFDocDirecto(id);
      else if(act==="del") eliminarDocumento(id);
    };
  });
  if(silent) window.scrollTo(0, scrollY);   // conservar la posición en el refresco silencioso
  // Refresco automático silencioso de los números (sin overlay) mientras se está en el home
  if(!silent){ if(_docsTimer) clearInterval(_docsTimer); _docsTimer = setInterval(_tickDocs, 20000); }
}

    <h3>${esc(p.nombre)}</h3>

function eliminarPlantilla(id){
  const p = DOCSTATE.plantillas.find(x=>x.id===id);
  openModal(`
    <div class="modal" style="max-width:440px">
      <div class="modal-head"><div><h2>Eliminar plantilla</h2><p>Esta acción no se puede deshacer.</p></div>
        <button class="close-x" onclick="closeModal()">${I.close}</button></div>
      <div class="modal-body"><p style="font-size:14.5px;color:var(--ink-2)">Se eliminará la plantilla <b>${esc(p?p.nombre:"")}</b>. Los documentos ya creados a partir de ella no se ven afectados.</p></div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-danger" id="confDelPl">${I.trash} Sí, eliminar</button></div>
    </div>`);
  document.getElementById("confDelPl").onclick = async ()=>{
    const btn=document.getElementById("confDelPl"); btn.disabled=true; btn.innerHTML="Eliminando…";
    const { error } = await sb.from("doc_plantillas").delete().eq("id", id);
    if(error){ btn.disabled=false; btn.innerHTML=`${I.trash} Sí, eliminar`; toast("No se pudo eliminar: "+error.message,"err"); return; }
    closeModal(); toast("Plantilla eliminada","ok"); renderDocsAdmin();
  };
}

function pedirPdf(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/pdf';
  inp.onchange=()=>{ const f=inp.files[0]; if(f) cargarPdfArchivo(f); };
  inp.click();
}

function cargarPdfArchivo(file){
  if(file.type!=='application/pdf'){ toast("Debe ser un archivo PDF","err"); return; }
  if(file.size > 8*1024*1024){ toast("El PDF es muy grande (máx 8 MB)","err"); return; }
  bloquear("Cargando PDF…");
  const rd=new FileReader();
  rd.onload=async ()=>{ try{ pdfEditor.pdfData = rd.result; pdfEditor.campos = []; await renderPdfEditor(); toast("PDF cargado. Arrastra los campos sobre el documento.","ok"); } finally{ desbloquear(); } };
  rd.onerror=()=>{ desbloquear(); toast("No se pudo leer el archivo","err"); };
  rd.readAsDataURL(file);
}

async function renderPdfEditor(){
  const zone = document.getElementById("pdfZone");
  zone.innerHTML = `
    <div class="paleta"><b>Añade un campo y arrástralo sobre el documento donde quieras:</b>
      ${Object.entries(FIELD_TYPES).map(([k,v])=>`<button data-tipo="${k}">${v.icon} ${v.label}</button>`).join("")}
    </div>
    <div class="pdf-cont" id="pdfCont"><div class="muted-sm" style="text-align:center;padding:24px">Cargando PDF…</div></div>`;
  zone.querySelectorAll(".paleta [data-tipo]").forEach(b=> b.onclick = ()=> addCampo(b.dataset.tipo));

  const cont = document.getElementById("pdfCont");
  try{
    const bytes = Uint8Array.from(atob(pdfEditor.pdfData.split(',')[1]), c=>c.charCodeAt(0));
    const pdf = await window.pdfjsLib.getDocument({data:bytes}).promise;
    pdfEditor.numPages = pdf.numPages;
    cont.innerHTML = "";
    const W = Math.min(820, Math.max(360, (cont.clientWidth||760) - 36));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const vp1 = page.getViewport({scale:1});
      const vp = page.getViewport({scale: W/vp1.width});
      const wrap = document.createElement('div'); wrap.className='pdf-page'; wrap.dataset.page=i-1;
      wrap.style.width=vp.width+'px'; wrap.style.height=vp.height+'px';
      const canvas = document.createElement('canvas');
      canvas.width=Math.floor(vp.width*dpr); canvas.height=Math.floor(vp.height*dpr);
      canvas.style.width=vp.width+'px'; canvas.style.height=vp.height+'px';
      wrap.appendChild(canvas); cont.appendChild(wrap);
      await page.render({ canvasContext:canvas.getContext('2d'), viewport:vp, transform: dpr!==1 ? [dpr,0,0,dpr,0,0] : undefined }).promise;
    }
    renderCampos();
  }catch(e){ console.error(e); cont.innerHTML = `<div class="empty"><div class="ic">${I.pdf}</div><h3>No se pudo leer el PDF</h3><p>${esc(e.message||'Archivo no válido')}</p></div>`; }
}

function addCampo(tipo){
  if(!pdfEditor.numPages){ toast("Sube un PDF primero","err"); return; }
  const ft=FIELD_TYPES[tipo];
  // Coloca el campo en la página que está viendo el usuario (no siempre la primera)
  let page=0; const midY=window.innerHeight/2;
  const pages=Array.from(document.querySelectorAll('#pdfCont .pdf-page'));
  const vis=pages.find(pg=>{ const r=pg.getBoundingClientRect(); return r.top<=midY && r.bottom>=midY; })
          || pages.find(pg=>{ const r=pg.getBoundingClientRect(); return r.bottom>0 && r.top<window.innerHeight; });
  if(vis) page=+vis.dataset.page;
  const nuevo = { id:uid(), tipo, page, x:50-ft.w/2, y:10, w:ft.w, h:ft.h };
  pdfEditor.campos.push(nuevo);
  renderCampos();
  const el = document.querySelector(`.campo-ov[data-id="${nuevo.id}"]`);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  toast("Campo agregado en la página "+(page+1)+". Arrástralo donde quieras (puedes pasarlo a otra página).","ok");
}

function renderCampos(){
  document.querySelectorAll('.campo-ov').forEach(e=>e.remove());
  pdfEditor.campos.forEach(c=>{
    const wrap = document.querySelector(`.pdf-page[data-page="${c.page}"]`);
    if(!wrap) return;
    const ft = FIELD_TYPES[c.tipo]||FIELD_TYPES.texto;
    const el = document.createElement('div');
    el.className='campo-ov'; el.dataset.id=c.id;
    el.style.left=c.x+'%'; el.style.top=c.y+'%'; el.style.width=c.w+'%'; el.style.height=c.h+'%';
    el.style.borderColor=ft.color; el.style.color=ft.color;
    const pgBtn = pdfEditor.numPages>1 ? `<span class="co-pg" title="Cambiar de página">Pág ${c.page+1}/${pdfEditor.numPages} ⇄</span>` : '';
    el.innerHTML=`<span class="co-lbl">${ft.icon} ${ft.label}</span><span class="co-del" title="Quitar">✕</span>${pgBtn}<span class="co-rz"></span>`;
    wrap.appendChild(el);
    const pg = el.querySelector('.co-pg');
    if(pg) pg.onclick=(ev)=>{ ev.stopPropagation(); ev.preventDefault(); c.page=(c.page+1)%pdfEditor.numPages; renderCampos(); const nuevo=document.querySelector(`.campo-ov[data-id="${c.id}"]`); if(nuevo) nuevo.scrollIntoView({behavior:'smooth',block:'center'}); toast("Campo movido a la página "+(c.page+1),"ok"); };
    // Vista previa del tamaño de letra para campos de texto (así se ve cómo quedará en el PDF)
    const muestras = { nombre:'Nombre Apellido', texto:'Texto de ejemplo', fecha:new Date().toLocaleDateString('es-CO'), nombre_part:'Nombre del Participante', cedula_part:'1.234.567.890' };
    if(muestras[c.tipo]!=null){
      const prev=document.createElement('span'); prev.className='co-preview'; prev.textContent=muestras[c.tipo];
      el.appendChild(prev);
      const hpx = el.clientHeight || ((c.h/100)*(wrap.clientHeight||600));
      prev.style.fontSize = Math.max(8, Math.min(hpx*0.62, 60)) + 'px';
    }
    el.querySelector('.co-del').onclick=(ev)=>{ ev.stopPropagation(); pdfEditor.campos=pdfEditor.campos.filter(x=>x.id!==c.id); renderCampos(); };
    hacerArrastrable(el, c, wrap);
  });
}

function hacerArrastrable(el, c, wrap){
  let mode=null, sx, sy, ow, oh, gx=0, gy=0, curWrap=wrap, lastX=0, lastY=0, scrollTimer=null;
  const actualizarPreview=()=>{ const prev=el.querySelector('.co-preview'); if(prev){ prev.style.fontSize = Math.max(8, Math.min((el.clientHeight||0)*0.62, 60)) + 'px'; } };
  const paginaEn=(x,y)=>{
    const pages = Array.from(document.querySelectorAll('#pdfCont .pdf-page'));
    return pages.find(pg=>{ const r=pg.getBoundingClientRect(); return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom; });
  };
  const reposicionar=()=>{
    // Si el cursor está sobre otra página, mueve el campo a esa página (¡pasa a hoja 2, 3, …!)
    const target = paginaEn(lastX, lastY);
    if(target && target!==curWrap){ curWrap=target; c.page=+target.dataset.page; curWrap.appendChild(el); }
    const r=curWrap.getBoundingClientRect();
    c.x = Math.max(0, Math.min(100-c.w, (lastX-r.left)/r.width*100 - gx));
    c.y = Math.max(0, Math.min(100-c.h, (lastY-r.top)/r.height*100 - gy));
    el.style.left=c.x+'%'; el.style.top=c.y+'%'; actualizarPreview();
  };
  const onMove=(e)=>{
    const p = e.touches?e.touches[0]:e; lastX=p.clientX; lastY=p.clientY;
    if(mode==='move'){ reposicionar(); }
    else { const r=curWrap.getBoundingClientRect(); const dxP=(p.clientX-sx)/r.width*100, dyP=(p.clientY-sy)/r.height*100;
      c.w=Math.max(6,Math.min(100-c.x, ow+dxP)); c.h=Math.max(3,Math.min(100-c.y, oh+dyP)); el.style.width=c.w+'%'; el.style.height=c.h+'%'; actualizarPreview(); }
    e.preventDefault();
  };
  const onUp=()=>{ mode=null; if(scrollTimer){ clearInterval(scrollTimer); scrollTimer=null; } document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); document.removeEventListener('touchmove',onMove); document.removeEventListener('touchend',onUp); };
  const onDown=(e)=>{
    if(e.target.classList.contains('co-del') || e.target.classList.contains('co-pg')) return;
    mode = e.target.classList.contains('co-rz') ? 'resize' : 'move';
    const p = e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY; ow=c.w; oh=c.h; lastX=p.clientX; lastY=p.clientY;
    const r=curWrap.getBoundingClientRect(); gx=(p.clientX-r.left)/r.width*100 - c.x; gy=(p.clientY-r.top)/r.height*100 - c.y;
    e.preventDefault();
    document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
    document.addEventListener('touchmove',onMove,{passive:false}); document.addEventListener('touchend',onUp);
    // Auto-scroll cerca de los bordes para poder arrastrar hasta páginas de abajo/arriba
    if(mode==='move'){ scrollTimer=setInterval(()=>{ const m=70; if(lastY<m){ window.scrollBy(0,-16); reposicionar(); } else if(lastY>window.innerHeight-m){ window.scrollBy(0,16); reposicionar(); } }, 16); }
  };
  el.addEventListener('mousedown',onDown); el.addEventListener('touchstart',onDown,{passive:false});
}

/* Convierte una foto/captura de una firma en papel (fondo blanco/claro con tinta oscura)
   en un PNG con fondo TRANSPARENTE, para que se vea igual de limpia que una firma hecha
   a mano en el lienzo — usado en las plantillas de firma de EPP/Dotación. Los píxeles
   claros (papel) se vuelven transparentes; los oscuros (tinta) quedan opacos, con una
   franja intermedia para que el borde del trazo no se vea dentado. */
function quitarFondoFirma(file){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const sc = Math.min(1, maxW/img.width);
        const w = Math.max(1, Math.round(img.width*sc)), h = Math.max(1, Math.round(img.height*sc));
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        let imgData;
        try{ imgData = ctx.getImageData(0,0,w,h); }catch(e){ rej(e); return; }
        const d = imgData.data;
        const claro = 205, oscuro = 130; // umbral papel/tinta, con transición suave entre los dos
        for(let i=0;i<d.length;i+=4){
          const luminancia = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          let alpha;
          if(luminancia >= claro) alpha = 0;
          else if(luminancia <= oscuro) alpha = 255;
          else alpha = Math.round(255 * (claro - luminancia) / (claro - oscuro));
          d[i]=14; d[i+1]=23; d[i+2]=51; // mismo azul-tinta que usa la firma dibujada a mano (#0e1733)
          d[i+3] = Math.round(alpha * (d[i+3]/255)); // respeta también la transparencia que ya trajera el archivo
        }
        ctx.putImageData(imgData,0,0);
        res(cv.toDataURL('image/png'));
      };
      img.onerror = () => rej(new Error('No se pudo leer la imagen'));
      img.src = rd.result;
    };
    rd.onerror = () => rej(new Error('No se pudo leer el archivo'));
    rd.readAsDataURL(file);
  });
}

/* jsPDF NO reconstruye el PNG comprimido tal cual — lo decodifica a píxeles crudos y lo
   vuelve a comprimir por su cuenta, mucho peor que el PNG original (una firma de ~15KB
   puede terminar pesando ~480KB DENTRO del PDF). Las firmas (dibujadas a mano, siempre
   con fondo blanco de sigPad.dataURL(); o subidas con quitarFondoFirma(), con fondo
   TRANSPARENTE) se convierten aquí a JPEG justo antes de meterlas al PDF — jsPDF sí
   respeta la compresión JPEG tal cual viene, así que el peso final es el real de la
   imagen. Se rellena blanco primero SIEMPRE (haga falta o no) para que una firma con
   fondo transparente no salga con fondo negro al perder el canal alfa en JPEG. Calidad
   alta (0.92) porque una firma es casi puro blanco+trazo fino: sigue pesando poquísimo
   incluso a esa calidad, y así no se le resta nitidez a algo que es evidencia legal. */
function firmaParaPdf(dataUrlPng){
  return new Promise(res=>{
    if(!dataUrlPng){ res(dataUrlPng); return; }
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas"); cv.width = img.width; cv.height = img.height;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(img,0,0);
      res(cv.toDataURL("image/jpeg", 0.92));
    };
    img.onerror = () => res(dataUrlPng);
    img.src = dataUrlPng;
  });
}

function comprimirImagen(file, maxW, calidad){
  return new Promise(res=>{
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image(); img.onload=()=>{
      const sc=Math.min(1, maxW/img.width), w=Math.round(img.width*sc), h=Math.round(img.height*sc);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      res(cv.toDataURL("image/jpeg", calidad||0.85));
    }; img.onerror=()=>res(rd.result); img.src=rd.result; };
    rd.readAsDataURL(file);
  });
}

function descargarPlantillaFirmantes(){
  if(!window.XLSX){ toast("No se pudo cargar el generador de Excel (revisa tu conexión)","err"); return; }
  const datos = [
    ["Nombre completo","Identificación","Correo","Cargo"],
    ["Juan Pérez Gómez","1094567890","juan@ejemplo.com","Operario"],
    ["María López Ruiz","43567123","","Auxiliar"]
  ];
  const ws = XLSX.utils.aoa_to_sheet(datos);
  ws["!cols"] = [{wch:28},{wch:16},{wch:26},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Firmantes");
  XLSX.writeFile(wb, "Plantilla_firmantes.xlsx");
  toast("Plantilla descargada","ok");
}

async function cargarFirmantesExcel(file){
  if(!window.XLSX){ toast("No se pudo cargar el lector de Excel (revisa tu conexión)","err"); return; }
  bloquear("Leyendo archivo…");
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
    if(!filas.length){ toast("El archivo está vacío","err"); return; }
    const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
    const head = (filas[0]||[]).map(norm);
    const findCol = (...alts)=> head.findIndex(h => alts.some(a => h.includes(a)));
    let cNom = findCol("nombre"), cId = findCol("identificacion","cedula","documento","cc"),
        cCor = findCol("correo","email","mail"), cCar = findCol("cargo");
    let start = 1;
    if(cNom === -1 && cId === -1){ cNom=0; cId=1; cCor=2; cCar=3; start=0; }
    const nuevos = []; let ignoradas = 0;
    for(let i=start;i<filas.length;i++){
      const r = filas[i]; if(!r) continue;
      const nombre = String(cNom>=0?r[cNom]:"").trim();
      const identificacion = String(cId>=0?r[cId]:"").trim();
      const correo = String(cCor>=0?r[cCor]:"").trim();
      const cargo = String(cCar>=0?r[cCar]:"").trim();
      if(!nombre && !identificacion) continue;
      if(!nombre || !identificacion){ ignoradas++; continue; }
      nuevos.push({ nombre, correo, identificacion, cargo });
    }
    if(!nuevos.length){ toast("No se encontraron filas válidas (se requiere nombre e identificación)","err"); return; }
    const keyOf = s => s.replace(/[^0-9A-Za-z]/g,"").toLowerCase();
    const vistos = new Set(docFirmantes.filter(f=>f.identificacion.trim()).map(f=>keyOf(f.identificacion)));
    const base = docFirmantes.filter(f=>f.nombre.trim()||f.identificacion.trim());
    let dup=0;
    nuevos.forEach(n=>{ const k=keyOf(n.identificacion); if(vistos.has(k)){ dup++; return; } vistos.add(k); base.push(n); });
    docFirmantes = base.length ? base : [{nombre:'',correo:'',identificacion:'',cargo:''}];
    renderFirmantes();
    let msg = `${nuevos.length-dup} firmante(s) cargado(s)`;
    if(ignoradas) msg += ` · ${ignoradas} sin nombre/cédula omitida(s)`;
    if(dup) msg += ` · ${dup} duplicada(s)`;
    toast(msg,"ok");
  }catch(e){ console.error(e); toast("No se pudo leer el archivo: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

function renderFirmantes(){
  const host = document.getElementById("firmantesList");
  if(!host) return;
  host.innerHTML = docFirmantes.map((f,i)=>`
    <div class="firmante-row" data-i="${i}">
      <span class="firmante-num">${i+1}</span>
      <input data-f="nombre" placeholder="Nombre completo" value="${esc(f.nombre)}">
      <input data-f="correo" placeholder="Correo" value="${esc(f.correo)}">
      <input data-f="identificacion" placeholder="Identificación" value="${esc(f.identificacion)}">
      <input data-f="cargo" placeholder="Cargo" value="${esc(f.cargo)}">
      <button class="icon-btn danger" data-del="${i}" title="Quitar" ${docFirmantes.length<=1?'disabled':''}>${I.trash}</button>
    </div>`).join("");
  host.querySelectorAll("input[data-f]").forEach(inp=>{
    inp.oninput=()=>{ const i=+inp.closest(".firmante-row").dataset.i; docFirmantes[i][inp.dataset.f]=inp.value; };
  });
  host.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick=()=>{ if(docFirmantes.length<=1) return; docFirmantes.splice(+b.dataset.del,1); renderFirmantes(); };
  });
}

async function guardarDocumento(enviar){
  const plantillaId = document.getElementById("docPlantilla").value;
  const nombre = document.getElementById("docNombre").value.trim();
  const fecha_limite = document.getElementById("docLimite").value || null;
  const firma_ordenada = document.getElementById("docOrden").checked;
  if(!nombre){ toast("Ponle un nombre al documento","err"); document.getElementById("docNombre").focus(); return; }
  const abierto = !!(document.getElementById("docAbierto") && document.getElementById("docAbierto").checked);
  const validos = abierto ? [] : docFirmantes.filter(f=>f.nombre.trim() && f.identificacion.trim());
  if(enviar && !abierto && !validos.length){ toast("Agrega al menos un participante con nombre e identificación (o marca 'Documento abierto')","err"); return; }

  const config={}; document.querySelectorAll("[data-seg]").forEach(c=> config[c.dataset.seg]=c.checked);

  const btnE=document.getElementById("btnCrearEnviar"), btnB=document.getElementById("btnGuardarBorrador");
  btnE.disabled=true; btnB.disabled=true; btnE.innerHTML="Guardando…";
  bloquear(enviar?"Creando documento y enlaces…":"Guardando borrador…");

  // Congela el documento: copia el PDF y los campos de la plantilla (el dashboard no carga el pdf)
  let contenido = [], pdfSnap = null;
  { const { data:plFull } = await sb.from("doc_plantillas").select("contenido,pdf").eq("id", plantillaId).maybeSingle();
    if(plFull){ if(Array.isArray(plFull.contenido)) contenido = plFull.contenido; pdfSnap = plFull.pdf||null; } }
  if(!pdfSnap){ desbloquear(); btnE.disabled=false; btnB.disabled=false; btnE.innerHTML=`${I.check} Crear y generar enlaces`; toast("La plantilla no tiene un PDF cargado","err"); return; }

  const { data:doc, error } = await sb.from("doc_documentos").insert({
    plantilla_id: plantillaId, nombre, estado: enviar?'enviado':'borrador',
    config, contenido, pdf: pdfSnap, fecha_limite, firma_ordenada, abierto, lista_id: currentDocListaId || null
  }).select().single();
  if(error){ desbloquear(); btnE.disabled=false; btnB.disabled=false; btnE.innerHTML=`${I.check} Crear y generar enlaces`; toast("No se pudo crear: "+error.message,"err"); return; }

  if(validos.length){
    const rows = validos.map((f,idx)=>({
      documento_id:doc.id, nombre:f.nombre.trim(),
      correo:f.correo.trim()||null, identificacion:f.identificacion.trim()||null,
      cargo:f.cargo.trim()||null, orden:idx
    }));
    const { error:e2 } = await sb.from("doc_firmantes").insert(rows);
    if(e2) toast("Documento creado, pero error guardando firmantes: "+e2.message,"err");
  }
  await sb.from("doc_eventos").insert({ documento_id:doc.id, tipo:'creado', detalle:{nombre} });
  if(enviar) await sb.from("doc_eventos").insert({ documento_id:doc.id, tipo:'enviado', detalle:{firmantes:validos.length} });

  desbloquear();
  toast(enviar?(abierto?"Documento abierto creado — comparte el enlace general":"Documento creado y listo para firmar"):"Borrador guardado","ok");
  location.hash="#/docs";
  if(enviar) setTimeout(()=>abrirDocumento(doc.id), 350);
}

/* Rellena las miniaturas de firma y foto en la tabla del detalle, sin bloquear la apertura */
async function cargarMiniaturasFirmantes(docId, conSelfie){
  try{
    const cols = conSelfie ? "id,firma,selfie" : "id,firma";
    const { data } = await sb.from("doc_firmantes").select(cols).eq("documento_id",docId);
    if(!data) return;
    // Si el modal ya cambió (cerró/abrió otro doc), no hacer nada
    if(!document.querySelector(`[data-firma-cell]`)) return;
    data.forEach(r=>{
      const f=(docDetalleFirmantes||[]).find(x=>x.id===r.id); if(f){ f.firma=r.firma; f.selfie=r.selfie; }
      const fc=document.querySelector(`[data-firma-cell="${r.id}"]`);
      if(fc) fc.innerHTML = r.firma ? `<img class="sig-thumb" src="${r.firma}" alt="firma">` : '<span class="muted-sm">—</span>';
      const pc=document.querySelector(`[data-foto-cell="${r.id}"]`);
      if(pc) pc.innerHTML = r.selfie ? `<img class="foto-thumb" src="${r.selfie}" alt="foto">` : '<span class="muted-sm">—</span>';
    });
  }catch(e){ console.warn('miniaturas', e); }
}

/* Carga bajo demanda lo pesado (PDF + imágenes de firmas) solo cuando se necesita */
async function cargarPesadoDoc(){
  const doc = docDetalleActual; if(!doc) return;
  if(_docPesadoId === doc.id) return;
  const { data:dp } = await sb.from("doc_documentos").select("pdf").eq("id",doc.id).maybeSingle();
  if(dp) doc.pdf = dp.pdf;
  const { data:imgs } = await sb.from("doc_firmantes").select("id,firma,selfie,foto_id").eq("documento_id",doc.id);
  if(imgs){ const m={}; imgs.forEach(r=>m[r.id]=r); (docDetalleFirmantes||[]).forEach(f=>{ const r=m[f.id]; if(r){ f.firma=r.firma; f.selfie=r.selfie; f.foto_id=r.foto_id; } }); }
  _docPesadoId = doc.id;
}

function descargarBlobPdf(bytes, nombre){
  const blob = new Blob([bytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url;
  a.download = 'Documento_'+String(nombre||'doc').replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,50)+'.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

async function descargarMiFirmado(){
  const doc = firmaState && firmaState.doc, f = firmaState && firmaState._miFirmado;

/* #3 — Envía el enlace de firma al correo del firmante (automático vía EmailJS) */
async function enviarPorCorreo(id){
  const f = (docDetalleFirmantes||[]).find(x=>x.id===id);
  if(!f || !f.correo){ toast("Este firmante no tiene correo registrado","err"); return; }
  const link = linkFirma(f.token);
  if(window.emailjs && EMAILJS_SERVICE){
    toast("Enviando correo a "+f.correo+"…","",2500);
    try{
      await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
        to_email: f.correo,
        to_name: f.nombre || "",
        email: f.correo,
        documento_nombre: (docDetalleActual && docDetalleActual.nombre) || "",
        firma_link: link,

      });
      try{ if(docDetalleActual) await sb.from("doc_eventos").insert({ documento_id:docDetalleActual.id, firmante_id:f.id, tipo:'enviado', detalle:{correo:f.correo} }); }catch(e){}

      return;
    }catch(e){ console.error("EmailJS:", e); toast("No se pudo enviar automáticamente, abro tu correo…","err"); }
  }
  // respaldo: abrir la app de correo del usuario
  const asunto = encodeURIComponent("Documento para firmar — Don Aseo Ltda.");
  const cuerpo = encodeURIComponent("Hola "+(f.nombre||"")+",\n\nTienes un documento pendiente de firma: \""+((docDetalleActual&&docDetalleActual.nombre)||"")+"\".\n\nAbre este enlace para firmarlo desde tu celular o computador:\n"+link+"\n\nGracias,\nDon Aseo Ltda.");

}

async function guardarEdicionDocumento(id){
  const nombre = document.getElementById("edNombre").value.trim();
  if(!nombre){ toast("Ponle un nombre al documento","err"); document.getElementById("edNombre").focus(); return; }
  const fecha_limite = document.getElementById("edLimite").value || null;
  const firma_ordenada = document.getElementById("edOrden").checked;
  const config={}; document.querySelectorAll("[data-seg]").forEach(c=> config[c.dataset.seg]=c.checked);
  const btn=document.getElementById("btnGuardarEdit"); btn.disabled=true; btn.innerHTML="Guardando…";
  bloquear("Guardando cambios…");

  const { error:e1 } = await sb.from("doc_documentos").update({ nombre, fecha_limite, firma_ordenada, config }).eq("id",id);
  if(e1){ desbloquear(); btn.disabled=false; btn.innerHTML=`${I.check} Guardar cambios`; toast("No se pudo guardar: "+e1.message,"err"); return; }

  // Firmantes: borrar pendientes quitados, actualizar existentes, insertar nuevos
  const conNombre = editDocFirmantes.filter(f=> f.estado==='firmado' || f.nombre.trim());
  const idsActuales = conNombre.filter(f=>f.id).map(f=>f.id);
  const { data:orig } = await sb.from("doc_firmantes").select("id,estado").eq("documento_id",id);
  const borrar = (orig||[]).filter(o=> o.estado!=='firmado' && !idsActuales.includes(o.id)).map(o=>o.id);
  if(borrar.length){ await sb.from("doc_firmantes").delete().in("id", borrar); }
  for(let i=0;i<conNombre.length;i++){
    const f=conNombre[i];
    if(f.estado==='firmado'){ if(f.id) await sb.from("doc_firmantes").update({ orden:i }).eq("id",f.id); continue; }
    const datos = { nombre:f.nombre.trim(), correo:f.correo.trim()||null, identificacion:f.identificacion.trim()||null, cargo:f.cargo.trim()||null, orden:i };
    if(f.id){ await sb.from("doc_firmantes").update(datos).eq("id",f.id); }
    else if(f.nombre.trim()){ await sb.from("doc_firmantes").insert({ documento_id:id, ...datos }); }
  }
  await sb.from("doc_eventos").insert({ documento_id:id, tipo:'editado', detalle:{} });
  desbloquear();
  toast("Documento actualizado","ok");
  location.hash="#/docs"; setTimeout(()=>abrirDocumento(id), 150);
}

/* === Componer el PDF FIRMADO: estampa firma/fotos/textos en cada campo (pdf-lib) === */
function _dataUrlABytes(u){ return Uint8Array.from(atob(u.split(',')[1]), c=>c.charCodeAt(0)); }

/* Ver el archivo adjunto de una entrega escaneada (EPP o Dotación) — se carga bajo
   demanda, nunca en la consulta de lista (es un base64 pesado, igual que firma/foto). */
async function verAdjuntoEntrega(entregaId, tabla){
  bloquear("Cargando archivo…");
  const { data, error } = await sb.from(tabla).select("adjunto_archivo,adjunto_tipo,adjunto_titulo").eq("id",entregaId).maybeSingle();
  desbloquear();
  if(error || !data || !data.adjunto_archivo){ toast("No se pudo cargar el archivo","err"); return; }
  if(data.adjunto_tipo === 'application/pdf'){
    try{
      const blob = new Blob([_dataUrlABytes(data.adjunto_archivo)], { type:'application/pdf' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    }catch(e){ toast("No se pudo abrir el archivo","err"); }
  } else {
    openModal(`<div class="modal" style="max-width:600px">
      <div class="modal-head"><div><h2>${esc(data.adjunto_titulo||'Adjunto')}</h2></div>
        <button class="close-x" onclick="closeModal()">${I.close}</button></div>
      <div class="modal-body" style="text-align:center"><img src="${data.adjunto_archivo}" style="max-width:100%;border-radius:8px"></div>
    </div>`);
  }
}

/* Editar una entrega escaneada: corregir el título y/o reemplazar el archivo. Compartida
   entre EPP y Dotación (recibe la tabla). Admin siempre; editor solo lo que él mismo
   registró, sin límite de tiempo desde CAMBIOS_SQL_55 — ver nota en puedoTocar(). */
async function abrirEditarEntregaEscaneada(entregaId, trabajadorId, tabla){
  bloquear("Cargando…");
  const { data, error } = await sb.from(tabla).select("adjunto_titulo,adjunto_tipo").eq("id",entregaId).maybeSingle();
  desbloquear();
  if(error || !data){ toast("No se pudo cargar la entrega","err"); return; }
  editEscaneadaState = { entregaId, trabajadorId, tabla, archivoNuevo:null, archivoNuevoTipo:null };
  openModal(`<div class="modal" style="max-width:480px">
    <div class="modal-head"><div><h2>Editar entrega escaneada</h2><p>Corrige el título o reemplaza el archivo.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Título *</label><input id="editEscTitulo" value="${esc(data.adjunto_titulo||'')}"></div>
      <div class="field">
        <label>Reemplazar archivo <span class="opt">(opcional)</span></label>

        <input type="file" id="editEscArchivo" accept="image/*,.pdf" style="display:none">
        <button type="button" class="btn btn-ghost btn-sm" id="editEscBtnArchivo" style="margin-top:8px">${I.plus} Elegir archivo nuevo</button>
      </div>
      <div id="editEscError" class="login-err"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarEditEsc">${I.check} Guardar</button>
    </div></div>`);
  document.getElementById('editEscBtnArchivo').onclick = ()=> document.getElementById('editEscArchivo').click();
  document.getElementById('editEscArchivo').onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const esPdf = f.type==='application/pdf' || /\.pdf$/i.test(f.name||'');
    if(esPdf){
      const rd = new FileReader();
      editEscaneadaState.archivoNuevo = await new Promise(res=>{ rd.onload=()=>res(rd.result); rd.readAsDataURL(f); });
      editEscaneadaState.archivoNuevoTipo = 'application/pdf';
      document.getElementById('editEscPreview').innerHTML = `<div class="muted-sm" style="margin-top:6px">${I.pdf} ${esc(f.name)} (PDF nuevo cargado)</div>`;
    } else {
      editEscaneadaState.archivoNuevo = await comprimirImagen(f, 1400);

      document.getElementById('editEscPreview').innerHTML = `<img src="${editEscaneadaState.archivoNuevo}" style="max-width:100%;max-height:220px;border:1px solid var(--line);border-radius:8px;margin-top:6px">`;
    }
  };
  document.getElementById('btnGuardarEditEsc').onclick = guardarEditarEntregaEscaneada;
}

async function guardarEditarEntregaEscaneada(){
  const err = document.getElementById('editEscError'); err.textContent='';
  const titulo = document.getElementById('editEscTitulo').value.trim();
  if(!titulo){ err.textContent = 'Escribe un título.'; return; }
  const btn = document.getElementById('btnGuardarEditEsc'); btn.disabled=true; btn.innerHTML='Guardando…';
  const payload = { adjunto_titulo: titulo };
  if(editEscaneadaState.archivoNuevo){
    payload.adjunto_archivo = editEscaneadaState.archivoNuevo;
    payload.adjunto_tipo = editEscaneadaState.archivoNuevoTipo;
  }
  const { error } = await sb.from(editEscaneadaState.tabla).update(payload).eq("id", editEscaneadaState.entregaId);
  if(error){
    btn.disabled=false; btn.innerHTML=`${I.check} Guardar`;
    toast("No se pudo guardar: "+error.message,"err");
    return;
  }
  const { trabajadorId, tabla } = editEscaneadaState;
  closeModal();
  toast("Entrega actualizada","ok");
  if(tabla === 'dot_entregas'){ renderFichaTrabajador(trabajadorId); } else { renderFichaTrabajadorDtl(trabajadorId); }

/* Descarga en un ZIP todos los archivos escaneados de UN trabajador — reemplaza al
   kárdex PDF cuando su contrato/entidad está en modo "escaneado" (no tiene sentido
   armar el formato de kárdex digital si no hay ítems/firmas capturadas). */
async function descargarZipAdjuntosTrabajador(tabla, trabajadorId, nombreTrabajador){
  if(!window.JSZip){ toast("No se pudo cargar el compresor ZIP (revisa tu conexión)","err"); return; }
  bloquear("Preparando ZIP…");
  try{
    const { data, error } = await sb.from(tabla)
      .select("id,fecha,adjunto_titulo,adjunto_archivo,adjunto_tipo")
      .eq("trabajador_id", trabajadorId).eq("tipo_registro","escaneado").order("fecha",{ascending:true});
    if(error){ toast("No se pudo cargar los adjuntos: "+error.message,"err"); return; }
    const lista = (data||[]).filter(e=>e.adjunto_archivo);
    if(!lista.length){ toast("Este trabajador no tiene adjuntos guardados todavía","err"); return; }
    const zip = new JSZip();
    const usados = {};
    lista.forEach((e,i)=>{
      const ext = e.adjunto_tipo==='application/pdf' ? '.pdf' : '.jpg';
      let base = (e.adjunto_titulo||('Entrega_'+(i+1))).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,60) || ('adjunto_'+(i+1));
      if(usados[base]!=null){ usados[base]++; base = base+'_'+usados[base]; } else usados[base]=0;
      try{ zip.file(base+ext, _dataUrlABytes(e.adjunto_archivo)); }catch(err){}
    });
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url;
    const nombreBase = (nombreTrabajador||'trabajador').replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,50);
    a.download = 'Adjuntos_'+nombreBase+'.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 6000);
    toast(`ZIP con ${lista.length} adjunto(s) generado`,"ok");
  }catch(e){ console.error(e); toast("No se pudo generar el ZIP: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* ---------- Historial de entregas por contrato/entidad, con filtro de mes (EPP y Dotación) ---------- */
/* "YYYY-MM" (lo que da <input type="month">) -> {desde, hasta} en "YYYY-MM-DD", el primer y último día de ese mes */
function rangoDelMes(mesStr){
  const [y,m] = mesStr.split('-').map(Number);
  const desde = mesStr+'-01';
  const ultimoDia = new Date(y, m, 0).getDate();
  const hasta = mesStr+'-'+String(ultimoDia).padStart(2,'0');
  return { desde, hasta };
}
function fmtMesLabel(mesStr){
  const nombres = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const [y,m] = mesStr.split('-').map(Number);
  return nombres[m-1]+' de '+y;
}

/* ZIP de todos los adjuntos escaneados de TODOS los trabajadores de un contrato/entidad
   (no solo uno), opcionalmente acotado a un rango de fechas — usado por el filtro de mes
   del historial. mapaNombres: { trabajador_id: nombre } para nombrar los archivos. */
async function descargarZipAdjuntosContrato(tabla, idsTrabajadores, mapaNombres, filtroFechas, nombreZip){
  if(!window.JSZip){ toast("No se pudo cargar el compresor ZIP (revisa tu conexión)","err"); return; }
  if(!idsTrabajadores.length){ toast("No hay trabajadores en este contrato","err"); return; }
  bloquear("Preparando ZIP…");
  try{
    let todas = [];
    const { error } = await porLotes(idsTrabajadores, async (lote)=>{
      let q = sb.from(tabla).select("id,trabajador_id,adjunto_titulo,adjunto_archivo,adjunto_tipo")
        .in("trabajador_id", lote).eq("tipo_registro","escaneado");
      if(filtroFechas){ q = q.gte("fecha", filtroFechas.desde).lte("fecha", filtroFechas.hasta); }
      const { data, error } = await q;
      if(error) return { error };
      todas = todas.concat(data||[]);
      return { error: null };
    });
    if(error){ toast("No se pudo cargar los adjuntos: "+error.message,"err"); return; }
    const lista = todas.filter(e=>e.adjunto_archivo);
    if(!lista.length){ toast("No hay adjuntos guardados en ese rango de fechas","err"); return; }
    const zip = new JSZip();
    const usados = {};
    lista.forEach((e,i)=>{
      const ext = e.adjunto_tipo==='application/pdf' ? '.pdf' : '.jpg';
      const nombreTrab = (mapaNombres[e.trabajador_id]||'Trabajador').replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,35);
      let base = nombreTrab+'_'+((e.adjunto_titulo||('Entrega_'+(i+1))).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,45));
      if(usados[base]!=null){ usados[base]++; base = base+'_'+usados[base]; } else usados[base]=0;
      try{ zip.file(base+ext, _dataUrlABytes(e.adjunto_archivo)); }catch(err){}
    });
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download = nombreZip;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 6000);
    toast(`ZIP con ${lista.length} adjunto(s) generado`,"ok");
  }catch(e){ console.error(e); toast("No se pudo generar el ZIP: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* ZIP de kárdex de una lista de trabajadores (ya filtrada por contrato/entidad), cada uno
   acotado al mismo rango de fechas opcional — usado por el filtro de mes del historial.
   modulo: 'dot' (EPP) o 'dtl' (Dotación), decide qué construirKardex...PDF llamar. */
async function descargarZipKardexContratoFiltrado(modulo, trabajadores, filtroFechas, nombreZip){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  if(!window.JSZip){ toast("No se pudo cargar el compresor ZIP (revisa tu conexión)","err"); return; }
  if(!trabajadores.length){ toast("No hay trabajadores para exportar","err"); return; }
  bloquear("Preparando ZIP…");
  try{
    const zip = new JSZip();
    const usados = {};
    let incluidos = 0;
    for(let i=0;i<trabajadores.length;i++){
      const t = trabajadores[i];
      bloquearMsg(`Generando kárdex ${i+1} de ${trabajadores.length}…`);
      try{
        const r = modulo==='dot' ? await construirKardexPDF(t.id, filtroFechas) : await construirKardexDtlPDF(t.id, filtroFechas);
        if(!r) continue;
        let base = r.nombreBase || ('trabajador_'+(i+1));
        if(usados[base]!=null){ usados[base]++; base = base+'_'+usados[base]; } else usados[base]=0;
        zip.file(base+'.pdf', r.doc.output('arraybuffer'));
        incluidos++;
      }catch(e){ console.warn('kardex zip filtrado', t.id, e); }
    }
    if(!incluidos){ toast("Nadie tiene entregas registradas en ese rango de fechas","err"); return; }
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download = nombreZip;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 6000);
    toast(`ZIP con ${incluidos} kárdex generado`,"ok");
  }catch(e){ console.error(e); toast("No se pudo generar el ZIP: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

async function componerPdfFirmado(doc, firmantes){
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const pdfDoc = await PDFDocument.load(_dataUrlABytes(doc.pdf));
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const pages = pdfDoc.getPages();
  const firmados = (firmantes||[]).filter(f=>f.estado==='firmado');
  const idxTipo = { firma:0, selfie:0, foto_id:0, nombre_part:0, cedula_part:0 };
  for(const campo of (doc.contenido||[])){
    const page = pages[campo.page]; if(!page) continue;
    const { width:pw, height:ph } = page.getSize();
    const x=(campo.x/100)*pw, w=(campo.w/100)*pw, h=(campo.h/100)*ph, y=ph-(campo.y/100)*ph-h;
    if(campo.tipo==='firma' || campo.tipo==='selfie' || campo.tipo==='foto_id'){
      const key = campo.tipo;
      const signer = firmados[idxTipo[key]] || firmados[0];
      idxTipo[key]++;
      const du = signer && (key==='foto_id' ? signer.foto_id : signer[key]);
      if(du){
        try{
          const ib=_dataUrlABytes(du);
          const img = du.startsWith('data:image/png') ? await pdfDoc.embedPng(ib) : await pdfDoc.embedJpg(ib);
          const ar=img.width/img.height; let dw=w, dh=w/ar; if(dh>h){ dh=h; dw=h*ar; }
          page.drawImage(img, { x:x+(w-dw)/2, y:y+(h-dh)/2, width:dw, height:dh });
        }catch(e){ console.warn('img campo', e); }
      }
    } else if(campo.tipo==='nombre_part' || campo.tipo==='cedula_part'){
      // Auto-relleno con los datos del participante (aunque aún no haya firmado)
      const todos = firmantes||[];
      const signer = todos[idxTipo[campo.tipo]] || todos[0];
      idxTipo[campo.tipo]++;
      let val = signer ? (campo.tipo==='nombre_part' ? (signer.nombre||'') : (signer.identificacion||'')) : '';
      if(val){
        let fs = Math.max(7, Math.min(h*0.62, 60));
        try{ page.drawText(pdfTexto(val), { x:x+2, y:y+(h-fs)/2+1, size:fs, font, color:rgb(0.1,0.1,0.16) }); }catch(e){}
      }
    } else {
      let val='';
      const s = firmados.find(f=>f.evidencia && f.evidencia.campos && f.evidencia.campos[campo.id]!=null);
      if(s) val = s.evidencia.campos[campo.id];
      else if(campo.tipo==='fecha') val = new Date().toLocaleDateString('es-CO');
      else if(campo.tipo==='nombre' && firmados[0]) val = firmados[0].nombre||'';
      if(val){
        let fs = Math.max(7, Math.min(h*0.62, 60));
        try{ page.drawText(pdfTexto(val), { x:x+2, y:y+(h-fs)/2+1, size:fs, font, color:rgb(0.1,0.1,0.16) }); }catch(e){}
      }
    }
  }

  // Constancia de firma electrónica al pie de la última página (IP, fecha y hora
  // exactas, dispositivo/SO, y ubicación GPS cuando la plantilla la pidió — cada
  // firmante puede aportar 1 o 2 líneas, así que primero se arma la lista completa
  // y de ahí se calcula el alto real del bloque, en vez de asumir una línea fija.
  if(firmados.length){
    const last = pages[pages.length-1];
    const { width:lpw } = last.getSize();
    const lineH = 8.2, baseY = 20;
    const lineas = [];
    firmados.forEach(f=>{
      const ev=f.evidencia||{};
      const fhRaw = ev.fecha_hora || f.firmado_en;
      const fh = fhRaw ? new Date(fhRaw).toLocaleString('es-CO') : '-';
      const disp = f.dispositivo_ua ? resumenDispositivoUA(f.dispositivo_ua) : null;
      lineas.push({ x:26, texto: pdfTexto((f.nombre||'-')+'   |   C.C. '+(f.identificacion||'-')+'   |   Firmado: '+fh+'   |   IP: '+(f.ip_address||ev.ip||'-')+(disp?'   |   '+disp:'')) });
      if(ev.gps && ev.gps.lat!=null && ev.gps.lng!=null){
        lineas.push({ x:32, texto: pdfTexto('Ubicación: '+(+ev.gps.lat).toFixed(5)+', '+(+ev.gps.lng).toFixed(5)+(ev.gps.precision?' (±'+Math.round(ev.gps.precision)+' m)':'')) });
      }
    });
    const blockH = baseY + lineas.length*lineH + 12;
    last.drawRectangle({ x:0, y:0, width:lpw, height:blockH, color:rgb(1,1,1), opacity:0.9 });
    last.drawLine({ start:{x:26,y:blockH-3}, end:{x:lpw-26,y:blockH-3}, thickness:0.5, color:rgb(0.7,0.7,0.78) });
    try{ last.drawText('Constancia de firma electrónica - Don Aseo Ltda.', { x:26, y:blockH-10, size:6.8, font, color:rgb(0.45,0.45,0.55) }); }catch(e){}
    lineas.forEach((l,i)=>{
      try{ last.drawText(l.texto, { x:l.x, y:baseY + (lineas.length-1-i)*lineH, size:6.8, font, color:rgb(0.28,0.28,0.36) }); }catch(e){}
    });
  }

  return await pdfDoc.save();
}

async function renderPdfEnCont(src, cont){
  const bytes = (src instanceof Uint8Array) ? src : _dataUrlABytes(src);
  const pdf = await window.pdfjsLib.getDocument({data:bytes}).promise;
  cont.innerHTML="";
  const W = Math.min(820, Math.max(360, (cont.clientWidth||760)-36));
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i); const vp1=page.getViewport({scale:1}); const vp=page.getViewport({scale:W/vp1.width});
    const wrap=document.createElement('div'); wrap.className='pdf-page'; wrap.style.width=vp.width+'px'; wrap.style.height=vp.height+'px';
    const cv=document.createElement('canvas');
    cv.width=Math.floor(vp.width*dpr); cv.height=Math.floor(vp.height*dpr);
    cv.style.width=vp.width+'px'; cv.style.height=vp.height+'px';
    wrap.appendChild(cv); cont.appendChild(wrap);
    await page.render({ canvasContext:cv.getContext('2d'), viewport:vp, transform: dpr!==1 ? [dpr,0,0,dpr,0,0] : undefined }).promise;
  }
}

/* Descarga un ZIP con la copia firmada de CADA trabajador (una por firmante que ya firmó) */
async function descargarZipFirmados(){
  const doc = docDetalleActual;
  if(!doc){ toast("Abre el documento primero","err"); return; }
  if(!window.PDFLib){ toast("No se pudo cargar el generador de PDF","err"); return; }
  if(!window.JSZip){ toast("No se pudo cargar el compresor ZIP (revisa tu conexión)","err"); return; }
  bloquear("Preparando ZIP…");
  try{
    await cargarPesadoDoc();
    if(!doc.pdf){ toast("Este documento no tiene PDF asociado","err"); return; }
    const firmados = (docDetalleFirmantes||[]).filter(f=>f.estado==='firmado');
    if(!firmados.length){ toast("Aún no hay firmas para descargar","err"); return; }
    const zip = new JSZip();
    const usados = {};
    for(let i=0;i<firmados.length;i++){
      const f = firmados[i];
      bloquearMsg(`Generando PDF ${i+1} de ${firmados.length}…`);
      try{
        const signed = await componerPdfFirmado(doc, [f]);
        let base = String((f.nombre||'firmante')+'_'+(f.identificacion||'')).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,60) || ('firmante_'+(i+1));
        if(usados[base]!=null){ usados[base]++; base = base+'_'+usados[base]; } else usados[base]=0;
        zip.file(base+'.pdf', signed);
      }catch(e){ console.warn('zip firmante', f.id, e); }
    }
    bloquearMsg("Comprimiendo ZIP…");
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url;
    a.download = 'Firmados_'+String(doc.nombre||'documento').replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,50)+'.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 6000);
    toast(`ZIP con ${firmados.length} documento(s) generado`,"ok");
  }catch(e){ console.error(e); toast("No se pudo generar el ZIP: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* Genera el PDF firmado directamente desde la tarjeta del panel (sin abrir el documento) */
async function generarPDFDocDirecto(id){
  if(!window.PDFLib){ toast("No se pudo cargar el generador de PDF","err"); return; }
  bloquear("Generando PDF…");
  try{
    const { data:doc } = await sb.from("doc_documentos")
      .select("id,nombre,estado,config,contenido,pdf,plantilla_id").eq("id",id).maybeSingle();
    if(!doc){ toast("Documento no encontrado","err"); return; }
    if((!Array.isArray(doc.contenido)||!doc.contenido.length) && doc.plantilla_id){
      const { data:pl } = await sb.from("doc_plantillas").select("contenido").eq("id",doc.plantilla_id).maybeSingle();
      if(pl && Array.isArray(pl.contenido)) doc.contenido = pl.contenido;
    }
    if(!doc.pdf){ toast("Este documento no tiene PDF asociado","err"); return; }
    const { data:fs } = await sb.from("doc_firmantes")
      .select("id,nombre,identificacion,cargo,orden,estado,firma,selfie,foto_id,evidencia,firmado_en,ip_address,dispositivo_ua")
      .eq("documento_id",id).order("orden",{ascending:true});
    const signed = await componerPdfFirmado(doc, fs||[]);
    descargarBlobPdf(signed, doc.nombre);
    toast("PDF generado","ok");
  }catch(e){ console.error(e); toast("No se pudo generar el PDF: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* ¿El documento es de "copia por persona" (circular masiva)? Si sí, el PDF/vista COMBINADO no tiene sentido
   (solo mostraría al 1er firmante). Se detecta cuando hay más firmantes que campos de firma, o si es abierto. */
function docEsMultiCopia(doc, nFirmantes){
  if(doc && doc.abierto) return true;
  const slots = (doc && Array.isArray(doc.contenido)) ? doc.contenido.filter(c=>c.tipo==='firma').length : 0;
  return (nFirmantes||0) > Math.max(1, slots);
}

/* ============================================================
   FLUJO DE FIRMA PÚBLICO  (#/firmar/<token>)  — Fase 4
   Acceso sin login mediante funciones RPC por token.
   ============================================================ */
let firmaState = { token:null, doc:null, firmante:null, config:{}, selfie:null, fotoId:null, gps:null };

function detectarNavegador(){
  const ua = navigator.userAgent;
  let nav="Desconocido";
  if(/Edg\//.test(ua)) nav="Edge";
  else if(/OPR\//.test(ua)||/Opera/.test(ua)) nav="Opera";
  else if(/Chrome\//.test(ua)) nav="Chrome";
  else if(/Firefox\//.test(ua)) nav="Firefox";
  else if(/Safari\//.test(ua)) nav="Safari";
  let so="Desconocido";
  if(/Windows NT 10/.test(ua)) so="Windows 10/11";
  else if(/Windows/.test(ua)) so="Windows";
  else if(/Android/.test(ua)) so="Android";
  else if(/iPhone|iPad|iPod/.test(ua)) so="iOS";
  else if(/Mac OS X/.test(ua)) so="macOS";
  else if(/Linux/.test(ua)) so="Linux";
  return { navegador:nav, so:so };
}
function obtenerGPS(){
  return new Promise(res=>{
    if(!navigator.geolocation){ res(null); return; }
    navigator.geolocation.getCurrentPosition(
      p=>res({ lat:p.coords.latitude, lng:p.coords.longitude, precision:p.coords.accuracy }),
      ()=>res(null), { timeout:9000, enableHighAccuracy:true });
  });
}

function tieneCampo(tipo){ return (firmaState.doc.contenido||[]).some(x=>x.tipo===tipo); }

function extraFieldsHTML(c, f){
  let h='';
  if(c.correo)         h+=`<div class="field"><label>Correo electrónico *</label><input id="ff_correo" type="email" value="${esc(f.correo||'')}" placeholder="correo@ejemplo.com"></div>`;
  if(c.identificacion) h+=`<div class="field"><label>Número de identificación *</label><input id="ff_id" value="${esc(f.identificacion||'')}" placeholder="C.C. / documento"></div>`;

/* Formulario de firma DEBAJO del PDF (sin campos sobrepuestos): datos + texto + pad de firma + capturas */
function formularioFirmaHTML(c, f, pedirId){
  f = f || {};
  let datos = `<div class="field"><label>Nombre completo *</label><input id="ff_nombre" value="${esc(f.nombre||'')}" placeholder="Nombre completo"></div>`;
  if(pedirId || c.identificacion) datos += `<div class="field"><label>Número de identificación (cédula) *</label><input id="ff_id" inputmode="numeric" value="${esc(f.identificacion||'')}" placeholder="C.C. / documento"></div>`;
  if(c.correo) datos += `<div class="field"><label>Correo electrónico *</label><input id="ff_correo" type="email" value="${esc(f.correo||'')}" placeholder="correo@ejemplo.com"></div>`;
  if(c.cargo)  datos += `<div class="field"><label>Cargo *</label><input id="ff_cargo" value="${esc(f.cargo||'')}" placeholder="Tu cargo"></div>`;
  let html = `<div class="firma-sec"><h3>Tus datos</h3>${datos}</div>`;
  const textos = (firmaState.doc.contenido||[]).filter(x=>x.tipo==='texto');
  if(textos.length){
    let ti='';
    textos.forEach((t,i)=>{ ti += `<div class="field"><label>Texto${textos.length>1?(' '+(i+1)):''}</label><input data-txt="${t.id}" value="${esc(firmaState.campos[t.id]||'')}" placeholder="Escribe aquí…"></div>`; });
    html += `<div class="firma-sec"><h3>Datos del documento</h3>${ti}</div>`;
  }
  if(c.firma   || tieneCampo('firma'))   html += firmaPadHTML();
  if(c.selfie  || tieneCampo('selfie'))  html += capturaHTML('selfie','Selfie', I.user);
  if(c.foto_id || tieneCampo('foto_id')) html += capturaHTML('fotoId','Documento de identidad', I.doc);
  if(c.gps) html += gpsHTML();
  html += declaracionLegalHTML();
  return html;
}

function wireFormularioFirma(){
  document.querySelectorAll('#firmaExtra [data-cap]').forEach(btn=>{ btn.onclick=()=>tomarFotoCampo(btn.dataset.cap); });

  if(acepto && btn){ btn.disabled=true; btn.style.opacity='.55'; acepto.onchange=()=>{ btn.disabled=!acepto.checked; btn.style.opacity=acepto.checked?'1':'.55'; }; }
}

  if(error || !data || !data.ok){
