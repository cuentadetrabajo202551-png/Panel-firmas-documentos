async function renderFirmaPdf(){
  const cont = document.getElementById('firmaPdf');
  const d = firmaState.doc;
  if(!d.pdf){ cont.innerHTML = `<div class="muted-sm" style="text-align:center;padding:20px">Este documento no tiene PDF asociado.</div>`; return; }
  try{
    const bytes = Uint8Array.from(atob(d.pdf.split(',')[1]), ch=>ch.charCodeAt(0));
    const pdf = await window.pdfjsLib.getDocument({data:bytes}).promise;
    cont.innerHTML = "";
    const W = Math.min(820, Math.max(360, (cont.clientWidth||760)-36));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);   // nitidez en pantallas de alta densidad (móviles)
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i); const vp1=page.getViewport({scale:1}); const vp=page.getViewport({scale:W/vp1.width});
      const wrap=document.createElement('div'); wrap.className='pdf-page'; wrap.dataset.page=i-1; wrap.style.width=vp.width+'px'; wrap.style.height=vp.height+'px';
      const cv=document.createElement('canvas');
      cv.width=Math.floor(vp.width*dpr); cv.height=Math.floor(vp.height*dpr);
      cv.style.width=vp.width+'px'; cv.style.height=vp.height+'px';
      wrap.appendChild(cv); cont.appendChild(wrap);
      await page.render({ canvasContext:cv.getContext('2d'), viewport:vp, transform: dpr!==1 ? [dpr,0,0,dpr,0,0] : undefined }).promise;
    }
    // Sin campos sobrepuestos: el firmante ve el PDF limpio y firma en el formulario de abajo.
  }catch(e){ console.error(e); cont.innerHTML = `<div class="muted-sm" style="text-align:center;padding:20px">No se pudo mostrar el documento.</div>`; }
}

function renderCamposFirma(){
  (firmaState.doc.contenido||[]).forEach(c=>{
    const wrap = document.querySelector(`#firmaPdf .pdf-page[data-page="${c.page}"]`); if(!wrap) return;
    const ft = FIELD_TYPES[c.tipo]||FIELD_TYPES.texto;
    const el = document.createElement('div'); el.className='campo-firma'; el.dataset.id=c.id; el.dataset.tipo=c.tipo;
    el.style.left=c.x+'%'; el.style.top=c.y+'%'; el.style.width=c.w+'%'; el.style.height=c.h+'%'; el.style.borderColor=ft.color;
    wrap.appendChild(el);
    pintarCampoFirma(el, c);
  });
}

function pintarCampoFirma(el, c){
  const ft = FIELD_TYPES[c.tipo]||FIELD_TYPES.texto;
  if(c.tipo==='firma'){
    el.innerHTML = firmaState.firma ? `<img src="${firmaState.firma}">` : `<span class="cf-hint">${ft.icon} Toca para firmar</span>`;
    el.onclick = ()=> abrirPadFirma();
  } else if(c.tipo==='selfie' || c.tipo==='foto_id'){
    const key = c.tipo==='selfie' ? 'selfie' : 'fotoId';
    el.innerHTML = firmaState[key] ? `<img src="${firmaState[key]}">` : `<span class="cf-hint">${ft.icon} Tocar</span>`;
    el.onclick = ()=> tomarFotoCampo(key);
  } else if(c.tipo==='fecha'){
    if(firmaState.campos[c.id]==null) firmaState.campos[c.id]=new Date().toLocaleDateString('es-CO');
    el.innerHTML = `<span class="cf-val">${esc(firmaState.campos[c.id])}</span>`;
    el.onclick = null;
  } else if(c.tipo==='nombre_part' || c.tipo==='cedula_part'){
    const val = c.tipo==='nombre_part' ? (firmaState.firmante.nombre||'') : (firmaState.firmante.identificacion||'');
    el.innerHTML = val ? `<span class="cf-val">${esc(val)}</span>` : `<span class="cf-hint">${ft.icon} ${esc(ft.label)} (automático)</span>`;
    el.onclick = null;
  } else {
    const ph = c.tipo==='nombre' ? 'Tu nombre' : 'Escribe aquí';
    let v = firmaState.campos[c.id];
    if(v==null){ v = c.tipo==='nombre' ? (firmaState.firmante.nombre||'') : ''; if(v) firmaState.campos[c.id]=v; }
    el.innerHTML = `<input class="cf-input" value="${esc(v)}" placeholder="${ph}">`;
    el.querySelector('input').oninput = (ev)=>{ firmaState.campos[c.id]=ev.target.value; };
  }
}

function abrirPadFirma(){
  openModal(`<div class="modal" style="max-width:520px">

  initSignature();

function tomarFotoCampo(key){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.setAttribute('capture', key==='fotoId' ? 'environment' : 'user');
  // El input DEBE estar en el DOM para que en móvil el onchange dispare de forma confiable (si no, a veces falla la 1ª vez)
  inp.style.position='fixed'; inp.style.left='-9999px'; inp.style.opacity='0';
  document.body.appendChild(inp);
  inp.onchange=async ()=>{
    try{
      const file=inp.files[0]; if(!file) return;
      const box=document.getElementById('cap_'+key);
      if(box) box.innerHTML=`<div class="muted-sm" style="padding:8px">Procesando imagen…</div>`;
      firmaState[key] = await comprimirImagen(file, key==='fotoId'?1000:600);
      const box2=document.getElementById('cap_'+key);
      if(box2){ box2.innerHTML=`<div class="cap-prev"><img src="${firmaState[key]}"><button class="btn btn-ghost btn-sm" data-recap="${key}">Cambiar</button></div>`; box2.querySelector('[data-recap]').onclick=()=>tomarFotoCampo(key); }
      toast(key==='selfie'?"Selfie lista":"Foto lista","ok");
    }catch(e){ console.error(e); toast("No se pudo procesar la imagen, intenta de nuevo","err"); }
    finally{ inp.remove(); }
  };
  inp.click();
}

function wireFirmaExtra(){
  document.querySelectorAll('#firmaExtra [data-cap]').forEach(btn=>{ btn.onclick=()=>tomarFotoCampo(btn.dataset.cap); });
  const gbtn=document.getElementById('btnGps');
  if(gbtn) gbtn.onclick = async ()=>{
    gbtn.disabled=true; gbtn.innerHTML='Obteniendo ubicación…';
    const gps = await obtenerGPS();
    if(gps){ firmaState.gps=gps; document.getElementById('gpsBox').innerHTML=`<div class="cap-ok">${I.check} Ubicación capturada (±${Math.round(gps.precision)} m)</div>`; }
    else { gbtn.disabled=false; gbtn.innerHTML=`${I.pin} Reintentar ubicación`; toast("No se pudo obtener la ubicación. Revisa los permisos.","err"); }
  };
}

async function confirmarFirma(){
  const c = firmaState.config, d = firmaState.doc, g = id => document.getElementById(id);
  if(!g('ff_acepto')?.checked){ toast("Debes aceptar la declaración para poder firmar","err"); return; }
  const camposDoc = d.contenido||[];
  const campoNombre = camposDoc.find(x=>x.tipo==='nombre');
  const nombre = (g('ff_nombre')?.value||"").trim() || (campoNombre ? (firmaState.campos[campoNombre.id]||'') : '').trim() || firmaState.firmante.nombre || "";
  const correo = (g('ff_correo')?.value||"").trim() || firmaState.firmante.correo || "";
  const identificacion = (g('ff_id')?.value||"").trim() || firmaState.firmante.identificacion || "";
  const cargo = (g('ff_cargo')?.value||"").trim() || firmaState.firmante.cargo || "";
  if(!nombre){ toast("Falta tu nombre","err"); return; }
  if(c.correo && !correo){ toast("El correo es obligatorio","err"); return; }
  if(c.identificacion && !identificacion){ toast("La identificación es obligatoria","err"); return; }
  if(c.cargo && !cargo){ toast("El cargo es obligatorio","err"); return; }
  if(campoNombre) firmaState.campos[campoNombre.id] = nombre;
  const exigeFirma = c.firma || camposDoc.some(x=>x.tipo==='firma');
  if(exigeFirma && (!sigPad || sigPad.isEmpty())){ toast("Debes firmar en el recuadro de abajo","err"); return; }
  if(sigPad && !sigPad.isEmpty()) firmaState.firma = sigPad.dataURL();
  if(c.selfie && !firmaState.selfie){ toast("Falta la selfie","err"); return; }
  if(c.foto_id && !firmaState.fotoId){ toast("Falta la foto de tu documento de identidad","err"); return; }
  if(c.gps && !firmaState.gps){ toast("Comparte tu ubicación","err"); return; }

  const det = detectarNavegador();
  let ip=null;
  if(c.ip){ try{ const r=await fetch('https://api.ipify.org?format=json'); ip=(await r.json()).ip; }catch(e){} }
  const evidencia = {
    fecha_hora: c.fecha_hora ? new Date().toISOString() : null,
    ip: c.ip ? ip : null,
    navegador: c.navegador ? det.navegador : null,
    so: c.so ? det.so : null,
    gps: c.gps ? firmaState.gps : null,
    campos: firmaState.campos,
    aceptacion: { texto:'Declaración de firma electrónica - Ley 527 de 1999', aceptado:true, fecha:new Date().toISOString() }
  };

  const btn=g('btnConfirmarFirma'); btn.disabled=true; btn.innerHTML="Registrando firma…";
  const { data, error } = await sb.rpc("firma_registrar", {
    p_token: firmaState.token, p_nombre:nombre, p_correo:correo, p_identificacion:identificacion, p_cargo:cargo,
    p_firma:firmaState.firma, p_selfie:firmaState.selfie, p_foto_id:firmaState.fotoId, p_evidencia:evidencia
  });
  if(error || !data || !data.ok){
    btn.disabled=false; btn.innerHTML=`${I.check} Confirmar y firmar`;
    const m = data && data.motivo;
    toast(m==='ya_firmado'?"Este documento ya fue firmado":m==='no_es_turno'?"Aún no es tu turno":m==='no_disponible'?"El documento no está disponible":"No se pudo registrar la firma","err");
    return;
  }
  firmaState._miFirmado = { estado:'firmado', nombre, correo, identificacion, cargo, firma:firmaState.firma, selfie:firmaState.selfie, foto_id:firmaState.fotoId, evidencia, firmado_en:new Date().toISOString() };
  document.getElementById('firmaBody').innerHTML = `
    <div class="success-screen">
      <div class="ic">${I.checkBig}</div>
      <h2>¡Documento firmado!</h2>
      <p>Gracias, <b>${esc(nombre)}</b>. Tu firma y la evidencia quedaron registradas de forma segura.${data.finalizado?' El documento está completo.':''}</p>
      <div style="margin-top:22px"><button class="btn btn-green" id="btnDescargarMio" style="padding:13px 26px">${I.pdf} Descargar documento firmado</button></div>
    </div>`;
  const bd=document.getElementById('btnDescargarMio'); if(bd) bd.onclick = descargarMiFirmado;
  setTimeout(descargarMiFirmado, 400);
}

   FIRMA POR ENLACE GENERAL DEL DOCUMENTO (una sola URL/QR)
   - Documento abierto: cualquiera firma y queda registrado.
   - Documento con participantes: solo firma si su cédula está en la lista.
   ============================================================ */
function extraFieldsDocHTML(c){
  let h = `<div class="field"><label>Nombre completo *</label><input id="ff_nombre" placeholder="Nombre completo"></div>`;
  h += `<div class="field"><label>Número de identificación (cédula) *</label><input id="ff_id" inputmode="numeric" placeholder="C.C. / documento"></div>`;
  if(c.correo) h += `<div class="field"><label>Correo electrónico *</label><input id="ff_correo" type="email" placeholder="correo@ejemplo.com"></div>`;
  if(c.cargo)  h += `<div class="field"><label>Cargo *</label><input id="ff_cargo" placeholder="Tu cargo"></div>`;
  let extra = `<div class="firma-sec"><h3>Tus datos</h3>${h}</div>`;
  if(c.selfie  && !tieneCampo('selfie'))  extra += capturaHTML('selfie','Selfie', I.user);
  if(c.foto_id && !tieneCampo('foto_id')) extra += capturaHTML('fotoId','Documento de identidad', I.doc);
  if(c.gps) extra += gpsHTML();
  return extra;
}

/* Rutas de formulario/edición donde re-renderizar borraría lo que el usuario escribe */
function esRutaEdicion(){
  const h = location.hash;
  return h === "#/docs/documento/nuevo"
    || /^#\/docs\/documento\/.+\/editar$/.test(h)
    || h.startsWith("#/docs/plantilla/")
    || h.startsWith("#/inspecciones/formato/")
    || h.startsWith("#/inspecciones/enlace/");
}

/* ============================================================
   MÓDULO DOTACIÓN · Entrega de EPP/uniformes con firma digital
   Directorio de trabajadores + catálogo de ítems + entregas
   (firma en persona, mismo dispositivo) + kárdex imprimible.
   ============================================================ */
let DOTACION = { contratos: [], trabajadores: [], catalogo: [], entregas: [], entregaItems: [], predeterminados: [] };
let dotQuery = "";
let entregaDraft = null;
let dotEscaneadaState = null;
let editEscaneadaState = null; /* compartido EPP/Dotación — la tabla ("dot_entregas"/"dtl_entregas") ya distingue cuál es */
let contratoActualId = localStorage.getItem('dot_contrato_actual') || null; // null hasta que se carguen los contratos; "todos" = vista combinada
/* Selección múltiple para marcar inactivos / eliminar en bloque (solo admin) */
let dotMostrarInactivos = false;
let seleccionadosDot = new Set();

async function loadDotacionState(){
  const [co, t, e, ei] = await Promise.all([
    sb.from("dot_contratos").select("id,nombre,activo,creado_en,modo_registro,link_nuevos_activo").order("nombre",{ascending:true}),
    cargarTodasFilas(()=> sb.from("dot_trabajadores").select("id,nombre,identificacion,cargo,area,contrato_id,fecha_ingreso,fecha_salida,aviso_cedula_rh,activo,inactivo_por_archivo,creado_en").order("nombre",{ascending:true}).order("id",{ascending:true})),
    cargarTodasFilas(()=> sb.from("dot_entregas").select("id,trabajador_id,fecha").order("fecha",{ascending:false}).order("id",{ascending:true})),
    cargarTodasFilas(()=> sb.from("dot_entrega_items").select("entrega_id,nombre_item,cantidad").order("id",{ascending:true}))
  ]);
  const err = co.error || t.error || e.error || ei.error;
  if(err){ console.warn(err); toast("Error cargando EPP: "+err.message,"err"); }
  DOTACION.contratos = co.data || [];
  DOTACION.trabajadores = t.data || [];
  DOTACION.entregas = e.data || [];
  DOTACION.entregaItems = ei.data || [];
  // Si el contrato guardado ya no existe (o nunca se eligió uno), cae al primero activo, o al primero que haya
  const existe = contratoActualId==='todos' || DOTACION.contratos.some(x=>x.id===contratoActualId);
  if(!existe){
    const primero = DOTACION.contratos.find(x=>x.activo) || DOTACION.contratos[0];
    contratoActualId = primero ? primero.id : null;
    if(contratoActualId) localStorage.setItem('dot_contrato_actual', contratoActualId);
  }
  // El catálogo y los predeterminados son POR CONTRATO — se cargan después de tener
  // contratoActualId ya resuelto. En modo "todos" (o sin contrato) quedan vacíos.
  if(contratoActualId && contratoActualId!=='todos'){
    const [{ data:c, error:ec }, { data:pd, error:epd }] = await Promise.all([
      sb.from("dot_catalogo").select("*").eq("contrato_id", contratoActualId).order("nombre",{ascending:true}),
      sb.from("dot_predeterminados").select("id,nombre,responsable_nombre,responsable_cargo,firma").eq("contrato_id", contratoActualId).order("creado_en",{ascending:true})
    ]);
    if(ec) console.warn(ec);
    if(epd) console.warn(epd);
    DOTACION.catalogo = c || [];
    DOTACION.predeterminados = pd || [];
  } else {
    DOTACION.catalogo = [];
    DOTACION.predeterminados = [];
  }
}

function contratoActual(){ return DOTACION.contratos.find(x=>x.id===contratoActualId) || null; }
/* Trabajadores del contrato seleccionado (o todos, en vista combinada) */
function trabajadoresDelContrato(){
  return contratoActualId==='todos' ? DOTACION.trabajadores : DOTACION.trabajadores.filter(t=>t.contrato_id===contratoActualId);
}

/* ---------- Panel principal ---------- */
function entregasDelContrato(){
  if(contratoActualId==='todos') return DOTACION.entregas;
  const ids = new Set(trabajadoresDelContrato().map(t=>t.id));
  return DOTACION.entregas.filter(e=>ids.has(e.trabajador_id));
}

async function renderDotacionAdmin(silent){
  const scrollY = window.scrollY;
  if(silent){ await loadDotacionState(); }
  else { bloquear("Cargando EPP…"); try{ await loadDotacionState(); } finally{ desbloquear(); } }

  if(!DOTACION.contratos.length){
    document.getElementById("app").innerHTML = MIPERFIL.esAdmin ? `${topbar('dotacion')}
      <div class="wrap"><div class="empty"><div class="ic">${I.box}</div>
        <h3>Crea tu primer contrato</h3>
        <p>Cada contrato (ej. "Hospital de Medellín") tiene su propio directorio de trabajadores y entregas.</p>
        <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" id="btnPrimerContrato">${I.plus} Crear contrato</button>
          <button class="btn btn-ghost" id="btnCargaMasivaVacioDot">${I.doc} Carga masiva desde Excel</button>

        <h3>Aún no tienes ningún contrato asignado</h3>

    wireLogout();
    const bpc=document.getElementById("btnPrimerContrato"); if(bpc) bpc.onclick = ()=> abrirFormContrato(null, ()=> renderDotacionAdmin(), true);
    const bcmv=document.getElementById("btnCargaMasivaVacioDot"); if(bcmv) bcmv.onclick = abrirCargaMasivaDot;
    const bpv=document.getElementById("btnPlantillaVacioDot"); if(bpv) bpv.onclick = descargarPlantillaTrabajadoresDot;
    return;
  }

  const trabs = trabajadoresDelContrato();
  const entregasC = entregasDelContrato();
  const totalTrab = trabs.filter(t=>t.activo!==false).length;
  const totalEntregas = entregasC.length;
  const mesActual = hoyLocal().slice(0,7);

/* Lista actualmente visible (contrato + búsqueda + filtro de inactivos) — la usan tanto
   la grilla como la casilla "Todos", para que seleccione justo lo que se está viendo. */
function trabajadoresFiltradosDot(){
  let db = trabajadoresDelContrato();
  if(!dotMostrarInactivos) db = db.filter(t=>t.activo!==false);
  const q = dotQuery.trim().toLowerCase();
  if(q) db = db.filter(t=>
    (t.nombre||"").toLowerCase().includes(q) ||
    (t.identificacion||"").toLowerCase().includes(q) ||
    (t.cargo||"").toLowerCase().includes(q) ||
    (t.area||"").toLowerCase().includes(q)
  );
  return db;
}

function actualizarContadorSeleccionDot(){
  const el = document.getElementById('contadorSeleccionDot');
  if(el) el.textContent = seleccionadosDot.size+' seleccionado(s)';
}

/* Se llama cada vez que cambia la selección (una tarjeta o la casilla "Todos"): muestra/oculta
   la barra de acciones en bloque y sincroniza la casilla "Todos" sin recargar toda la grilla. */
function actualizarBarraSeleccionDot(){
  const barra = document.getElementById('barraSeleccionDot');
  if(barra) barra.style.display = seleccionadosDot.size ? 'flex' : 'none';
  actualizarContadorSeleccionDot();
  const chkTodos = document.getElementById('chkTodosDot');
  if(chkTodos){
    const visibles = trabajadoresFiltradosDot();
    chkTodos.checked = visibles.length>0 && visibles.every(t=>seleccionadosDot.has(t.id));
  }
}

  host.innerHTML = `<div class="grid">${db.map(trabajadorCard).join("")}</div>`;

    chk.onchange = ()=>{

async function reactivarSeleccionDot(){
  if(!seleccionadosDot.size){ toast("Selecciona al menos un trabajador","err"); return; }
  const ids = Array.from(seleccionadosDot);
  bloquear("Reactivando…");
  try{
    const { error } = await porLotes(ids, lote=> sb.from("dot_trabajadores").update({ activo:true, inactivo_por_archivo:false }).in("id", lote));
    if(error){
      const dup = /duplicate|unique/i.test(error.message||"");
      toast(dup?"No se pudo reactivar a alguno de los seleccionados: ya está activo con esa cédula en otro contrato. Reactívalos de a uno para identificar cuál":"No se pudo reactivar: "+error.message,"err");
      return;
    }
    await loadDotacionState();
    seleccionadosDot.clear();
    toast(`${ids.length} trabajador(es) reactivados`,"ok");
    renderDotacionAdmin();
  } finally { desbloquear(); }
}

/* Si al borrar trabajadores un contrato queda en CERO trabajadores, el contrato
   también se borra — pedido explícito del usuario: un contrato vacío no tiene
   razón para seguir en el selector. Requiere CAMBIOS_SQL_26.sql (agrega "on
   delete cascade" en catálogo/firmas predeterminadas, si no la borrada del
   contrato falla porque esas tablas todavía lo referencian). */
async function borrarContratosVaciosDot(contratoIdsTocados){
  const ids = [...new Set(contratoIdsTocados)].filter(Boolean);
  if(!ids.length) return;
  const { data: restantes } = await sb.from("dot_trabajadores").select("contrato_id").in("contrato_id", ids);
  const conGente = new Set((restantes||[]).map(r=>r.contrato_id));
  const vacios = ids.filter(cid=>!conGente.has(cid));
  if(!vacios.length) return;
  const nombres = vacios.map(cid=>DOTACION.contratos.find(c=>c.id===cid)?.nombre).filter(Boolean);
  const { error } = await sb.from("dot_contratos").delete().in("id", vacios);
  if(error){ console.warn(error); toast("No se pudo borrar el contrato que quedó vacío: "+error.message,"err"); return; }
  if(vacios.includes(contratoActualId)){ contratoActualId='todos'; localStorage.setItem('dot_contrato_actual','todos'); }
  toast(`${nombres.length===1?`Contrato "${nombres[0]}" eliminado`:nombres.length+' contratos eliminados'} por quedar sin trabajadores`,"ok");
}

async function eliminarSeleccionDot(){
  if(!seleccionadosDot.size){ toast("Selecciona al menos un trabajador","err"); return; }
  const ids = Array.from(seleccionadosDot);
  openModal(`<div class="modal" style="max-width:460px">
    <div class="modal-head"><div><h2>Eliminar trabajadores</h2><p>Esta acción no se puede deshacer.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body"><p style="font-size:14.5px;color:var(--ink-2)">Se eliminarán <b>${ids.length}</b> trabajador(es) del directorio junto con <b>todo su historial de entregas y firmas</b>. Si solo quieres dejar de verlos sin perder su historial, usa "Marcar como inactivo" en vez de esto. Si algún contrato queda sin trabajadores, también se elimina.</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confEliminarSeleccionDot">${I.trash} Sí, eliminar ${ids.length}</button></div></div>`);
  document.getElementById('confEliminarSeleccionDot').onclick = async ()=>{
    const btn=document.getElementById("confEliminarSeleccionDot"); btn.disabled=true; btn.innerHTML="Eliminando…";
    bloquear("Eliminando…");
    try{
      const contratosTocados = ids.map(id=>DOTACION.trabajadores.find(t=>t.id===id)?.contrato_id);
      const { error } = await porLotes(ids, lote=> sb.from("dot_trabajadores").delete().in("id", lote));
      if(error){ toast("No se pudo eliminar: "+error.message,"err"); return; }
      await borrarContratosVaciosDot(contratosTocados);
      await loadDotacionState();
      seleccionadosDot.clear();
      closeModal();
      toast(`${ids.length} trabajador(es) eliminados`,"ok");
      renderDotacionAdmin();
    } finally { desbloquear(); }
  };
}

/* "Entregas de hoy" — pensado para que el admin no tenga que hacer scroll ni
   buscar quién recibió algo hoy: usa DOTACION.entregas (ya cargado, liviano) solo
   para saber CUÁLES entregas son de hoy, y trae el detalle (hora/responsable/vía)
   bajo demanda, solo de esas — nunca carga esas columnas para el listado completo. */
async function abrirEntregasHoyDot(){
  const hoy = hoyLocal();
  const idsHoy = entregasDelContrato().filter(e=>e.fecha===hoy).map(e=>e.id);
  const nombreContratoActual = contratoActualId==='todos' ? null : contratoActual()?.nombre;
  openModal(`<div class="modal" style="max-width:520px">
    <div class="modal-head"><div><h2>Entregas de hoy</h2><p>${fmtDate(hoy)}${nombreContratoActual?' · '+esc(nombreContratoActual):''}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body" id="entregasHoyDotBody"><div class="empty"><h3>Cargando…</h3></div></div>
  </div>`);
  const host = document.getElementById('entregasHoyDotBody');
  if(!idsHoy.length){ host.innerHTML = `<div class="empty"><div class="ic">${I.box}</div><h3>Sin entregas hoy</h3><p>Todavía no se ha registrado ninguna entrega de EPP hoy.</p></div>`; return; }
  const { data, error } = await sb.from("dot_entregas").select("id,trabajador_id,creado_en,responsable_nombre,via").in("id", idsHoy).order("creado_en",{ascending:false});
  if(error){ host.innerHTML = `<div class="empty"><h3>No se pudo cargar</h3><p>${esc(error.message)}</p></div>`; return; }
  host.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px">${data.map(e=>{
    const t = DOTACION.trabajadores.find(x=>x.id===e.trabajador_id);
    const contrato = DOTACION.contratos.find(c=>c.id===t?.contrato_id)?.nombre;
    const hora = e.creado_en ? new Date(e.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'}) : '—';
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px">
      <div><div style="font-weight:700;font-size:13.5px">${esc(t?.nombre||'—')}${contrato?` <span class="muted-sm" style="font-weight:600">· ${esc(contrato)}</span>`:''}</div>
        <div class="muted-sm">${e.via==='remoto'?'Por enlace remoto':'Entregado por '+esc(e.responsable_nombre||'—')}</div></div>
      <span class="muted-sm" style="white-space:nowrap">${hora}</span>
    </div>`;
  }).join('')}</div>`;
}

/* Historial de entregas de TODO el contrato actual, con filtro de mes — para supervisores que
   necesitan revisar/descargar solo lo que hicieron en un mes específico. El ZIP respeta el modo
   del contrato: escaneado -> adjuntos originales, digital -> kárdex recortado a ese mes. */

  if(contratoActualId==='todos'){ toast("Elige un contrato específico primero","err"); return; }
  const c = contratoActual();
  const mesInicial = hoyLocal().slice(0,7);
  openModal(`<div class="modal lg">
    <div class="modal-head"><div><h2>Historial de entregas</h2><p>${esc(c?.nombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field" style="max-width:220px">
        <label>Mes</label>
        <input type="month" id="historialDotMes" value="${mesInicial}">
      </div>
      <div id="historialDotLista" style="margin-top:12px"><div class="empty"><h3>Cargando…</h3></div></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-primary" id="btnDescargarHistorialDot">${I.doc} Descargar ZIP</button>
    </div>
  </div>`);

  async function cargar(mes){
    const host = document.getElementById('historialDotLista');
    if(!host) return;
    host.innerHTML = `<div class="empty"><h3>Cargando…</h3></div>`;
    const { desde, hasta } = rangoDelMes(mes);
    const trabajadores = trabajadoresDelContrato();
    const idsTrab = trabajadores.map(t=>t.id);
    if(!idsTrab.length){ host.innerHTML = `<div class="empty"><div class="ic">${I.box}</div><h3>Sin trabajadores</h3></div>`; return; }
    let todas = [];
    const { error } = await porLotes(idsTrab, async (lote)=>{
      const { data, error } = await sb.from("dot_entregas")
        .select("id,trabajador_id,fecha,creado_en,creado_por,responsable_nombre,via,tipo_registro,adjunto_titulo")
        .in("trabajador_id", lote).gte("fecha", desde).lte("fecha", hasta);
      if(error) return { error };
      todas = todas.concat(data||[]);
      return { error: null };
    });
    if(error){ host.innerHTML = `<div class="empty"><h3>No se pudo cargar</h3><p>${esc(error.message)}</p></div>`; return; }
    todas.sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||'') || (b.creado_en||'').localeCompare(a.creado_en||''));
    if(!todas.length){ host.innerHTML = `<div class="empty"><div class="ic">${I.box}</div><h3>Sin entregas</h3><p>No hay entregas registradas en ${fmtMesLabel(mes)}.</p></div>`; return; }
    host.innerHTML = `<p class="muted-sm" style="margin:0 0 8px">${todas.length} entrega(s) en ${fmtMesLabel(mes)}</p>
      <div style="display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto">${todas.map(e=>{
        const t = trabajadores.find(x=>x.id===e.trabajador_id);
        const esEscaneada = e.tipo_registro==='escaneado';
        const responsable = esEscaneada ? nombreDe(e.creado_por) : (e.via==='remoto'?'(entrega remota)':(e.responsable_nombre||'—'));
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px">
          <div><div style="font-weight:700;font-size:13.5px">${esc(t?.nombre||'—')}</div>
            <div class="muted-sm">${esEscaneada?'Escaneado: '+esc(e.adjunto_titulo||''):'Entregado por '+esc(responsable)}</div></div>
          <span class="muted-sm" style="white-space:nowrap">${fmtDate(e.fecha)}</span>
        </div>`;
      }).join('')}</div>`;
  }

  document.getElementById('historialDotMes').onchange = (e)=> cargar(e.target.value);
  document.getElementById('btnDescargarHistorialDot').onclick = ()=>{
    const mesInput = document.getElementById('historialDotMes');
    const mes = (mesInput && mesInput.value) || mesInicial;
    const filtroFechas = rangoDelMes(mes);
    const trabajadores = trabajadoresDelContrato();
    const nombreSafe = String(c?.nombre||'contrato').replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,40);
    const nombreZip = 'Historial_EPP_'+nombreSafe+'_'+mes+'.zip';
    if(c?.modo_registro==='escaneado'){
      const mapaNombres = {}; trabajadores.forEach(t=>{ mapaNombres[t.id]=t.nombre; });
      descargarZipAdjuntosContrato('dot_entregas', trabajadores.map(t=>t.id), mapaNombres, filtroFechas, nombreZip);
    } else {
      descargarZipKardexContratoFiltrado('dot', trabajadores, filtroFechas, nombreZip);
    }
  };

  cargar(mesInicial);
}

/* ---------- Contratos (clientes) ---------- */
/* comoRaiz=true: se abre SIN modal "padre" al que volver (ej. desde la pantalla
   vacía "Crea tu primer contrato") — la X/Cancelar debe cerrar de una, no intentar
   volver a ningún lado. Sin esto, openSubModal deja pendiente un "volver" que la
   primera X consume sin cerrar nada (hay que darle una segunda vez). */
function abrirFormContrato(id, alGuardar, comoRaiz){
  const c = id ? DOTACION.contratos.find(x=>x.id===id) : null;
  const html = `<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>${c?'Renombrar contrato':'Nuevo contrato'}</h2><p>Ej. "Hospital de Medellín", "Colegio San José"…</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Nombre del contrato *</label><input id="ctNombre" value="${esc(c?.nombre||'')}" placeholder="Nombre del cliente o contrato"></div>
      <div class="field">
        <label>Modo de registro</label>
        <select id="ctModoRegistro">
          <option value="digital" ${(!c||c.modo_registro!=='escaneado')?'selected':''}>Digital (normal, con firmas capturadas en el celular)</option>
          <option value="escaneado" ${c&&c.modo_registro==='escaneado'?'selected':''}>Escaneado (subir formato físico ya firmado, sin señal)</option>
        </select>
        <div class="muted-sm" style="margin-top:6px">Si eliges "Escaneado", nadie podrá registrar entregas digitales en este contrato — todas quedan como archivo adjunto. Pensado para supervisores sin señal en campo.</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarContrato">${I.check} Guardar</button>
    </div></div>`;
  if(comoRaiz) openModal(html); else openSubModal(html, ()=>{ if(alGuardar) alGuardar(); else abrirGestionContratos(); });
  document.getElementById('btnGuardarContrato').onclick = async ()=>{
    const nombre = document.getElementById('ctNombre').value.trim();
    if(!nombre){ toast("Escribe el nombre del contrato","err"); return; }
    const modo_registro = document.getElementById('ctModoRegistro').value;
    const btn = document.getElementById('btnGuardarContrato'); btn.disabled=true; btn.innerHTML="Guardando…";
    let error, data;
    if(c){ ({error} = await sb.from("dot_contratos").update({nombre,modo_registro}).eq("id",c.id)); }
    else { ({data,error} = await sb.from("dot_contratos").insert({nombre,modo_registro}).select().single()); }
    if(error){ btn.disabled=false; btn.innerHTML=`${I.check} Guardar`; toast("No se pudo guardar: "+error.message,"err"); return; }
    await loadDotacionState();
    if(!c && data) { contratoActualId = data.id; localStorage.setItem('dot_contrato_actual', data.id); }
    toast(c?"Contrato actualizado":"Contrato creado","ok");
    closeModal(); // no-comoRaiz: vuelve a "alGuardar" (gestión de contratos) solo por el _modalVolver
    if(comoRaiz && alGuardar) alGuardar(); // comoRaiz no deja _modalVolver puesto, así que aquí se llama directo
  };
}

/* ---------- Corregir cargos en bloque — útil cuando la carga masiva trajo el mismo
   error de tipeo repetido en muchos trabajadores (ej. "OPERARRIO" en vez de "OPERARIO").
   Renombra el cargo en TODOS los trabajadores que lo tengan escrito exactamente igual,
   dentro del contrato actual (o de todos, en modo "todos los contratos"). ---------- */
function abrirCorregirCargosDot(){
  const trabs = trabajadoresDelContrato();
  const porCargo = {};
  trabs.forEach(t=>{
    const k = (t.cargo||'').trim();
    porCargo[k] = (porCargo[k]||0) + 1;
  });
  const lista = Object.keys(porCargo).sort((a,b)=> porCargo[b]-porCargo[a]);
  openModal(`<div class="modal" style="max-width:520px">
    <div class="modal-head"><div><h2>Corregir cargos</h2><p>Renombra un cargo y se corrige de una vez en todos los trabajadores que lo tengan escrito igual.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      ${lista.length ? lista.map(c=>`
        <div class="cat-row">
          <span style="flex:1;font-weight:600;font-size:13.5px">${c?esc(c):'<span class="muted-sm">(sin cargo)</span>'} <span class="muted-sm">— ${porCargo[c]} trabajador${porCargo[c]===1?'':'es'}</span></span>
          <button class="icon-btn" title="Renombrar" data-cargo-edit="${esc(c)}">${I.pen}</button>
        </div>`).join('') : '<p class="muted-sm">No hay trabajadores en este contrato.</p>'}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>
  </div>`);
  document.querySelectorAll('[data-cargo-edit]').forEach(b=>{
    const cargoActual = b.dataset.cargoEdit;
    b.onclick = ()=> abrirRenombrarCargoDot(cargoActual, porCargo[cargoActual]);
  });
}
function abrirRenombrarCargoDot(cargoActual, cantidad){
  openSubModal(`<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>Renombrar cargo</h2><p>Se corregirá en ${cantidad} trabajador${cantidad===1?'':'es'} de este contrato.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Texto correcto *</label><input id="cargoNuevo" value="${esc(cargoActual)}" placeholder="Cargo"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarCargo">${I.check} Corregir</button>
    </div></div>`, ()=> abrirCorregirCargosDot());
  document.getElementById('btnGuardarCargo').onclick = async ()=>{
    const nuevo = document.getElementById('cargoNuevo').value.trim();
    if(!nuevo){ toast("Escribe el texto correcto","err"); return; }
    if(nuevo === cargoActual){ toast("No cambiaste nada","err"); return; }
    const btn = document.getElementById('btnGuardarCargo'); btn.disabled=true; btn.innerHTML="Corrigiendo…";
    bloquear("Corrigiendo cargo…");
    try{
      const ids = trabajadoresDelContrato().filter(t=>(t.cargo||'').trim()===cargoActual).map(t=>t.id);
      const { error } = await porLotes(ids, lote=> sb.from("dot_trabajadores").update({ cargo: nuevo }).in("id", lote));
      if(error){ toast("No se pudo corregir: "+error.message,"err"); return; }
      await loadDotacionState();
      toast(`Cargo corregido en ${ids.length} trabajador(es)`,"ok");
      closeModal();
      renderDotacionBody();
    } finally { desbloquear(); }
  };
}

function cerrarGestionContratos(){
  closeModal();

function renderContratosLista(){
  const host = document.getElementById('contratosLista'); if(!host) return;
  host.innerHTML = DOTACION.contratos.map(c=>{
    const n = DOTACION.trabajadores.filter(t=>t.contrato_id===c.id).length;
    return `<div class="cat-row">
      <span style="flex:1;font-weight:600;font-size:13.5px;${c.activo?'':'opacity:.5'}">${esc(c.nombre)}${c.activo?'':' · archivado'}</span>
      <span class="muted-sm" style="width:90px">${n} trabajador${n===1?'':'es'}</span>
      <button class="icon-btn" title="Renombrar" data-ct-edit="${c.id}">${I.pen}</button>
      <button class="icon-btn" title="${c.activo?'Archivar':'Reactivar'}" data-ct-toggle="${c.id}">${c.activo?I.lock:I.check}</button>
      <button class="icon-btn danger" title="${n?'No se puede eliminar: tiene trabajadores asociados':'Eliminar'}" data-ct-del="${c.id}" ${n?'disabled':''}>${I.trash}</button>
    </div>`;
  }).join('');
  host.querySelectorAll('[data-ct-edit]').forEach(b=>{ b.onclick = ()=> abrirFormContrato(b.dataset.ctEdit, ()=>abrirGestionContratos()); });
  host.querySelectorAll('[data-ct-del]').forEach(b=>{ b.onclick = ()=> eliminarContratoDot(b.dataset.ctDel); });
  host.querySelectorAll('[data-ct-toggle]').forEach(b=>{
    b.onclick = async ()=>{
      const c = DOTACION.contratos.find(x=>x.id===b.dataset.ctToggle);
      const archivando = c.activo;
      const { error } = await sb.from("dot_contratos").update({activo: !c.activo}).eq("id", c.id);
      if(error){ toast("No se pudo actualizar: "+error.message,"err"); return; }
      let nTocados = 0;
      if(archivando){
        // Al archivar un contrato, sus trabajadores dejan de tener sentido en la vista
        // normal — se marcan inactivos igual que si el admin los hubiera seleccionado
        // uno por uno (se conserva todo su historial de entregas y firmas). Se marcan
        // con inactivo_por_archivo:true para poder reactivar EXACTAMENTE a estos (y no a
        // alguien que ya estaba inactivo por otra razón desde antes de archivar).
        const idsTrab = DOTACION.trabajadores.filter(t=>t.contrato_id===c.id && t.activo!==false).map(t=>t.id);
        nTocados = idsTrab.length;
        if(nTocados){
          const { error: e2 } = await porLotes(idsTrab, lote=> sb.from("dot_trabajadores").update({activo:false, inactivo_por_archivo:true}).in("id", lote));
          if(e2){ toast("Contrato archivado, pero no se pudo marcar a los trabajadores como inactivos: "+e2.message,"err"); }
        }
      } else {
        // Al reactivar, solo se reactivan los que quedaron inactivos POR archivar este
        // contrato — no a quien ya estaba inactivo antes por otro motivo.
        const idsTrab = DOTACION.trabajadores.filter(t=>t.contrato_id===c.id && t.inactivo_por_archivo).map(t=>t.id);
        nTocados = idsTrab.length;
        if(nTocados){
          const { error: e2 } = await porLotes(idsTrab, lote=> sb.from("dot_trabajadores").update({activo:true, inactivo_por_archivo:false}).in("id", lote));
          if(e2){ toast("Contrato reactivado, pero no se pudo reactivar a sus trabajadores: "+e2.message,"err"); }
        }
      }
      await loadDotacionState();
      renderContratosLista();
      toast(archivando
        ?`Contrato archivado${nTocados?` — ${nTocados} trabajador(es) marcados como inactivos`:''}`
        :`Contrato reactivado${nTocados?` — ${nTocados} trabajador(es) reactivados`:''}`,"ok");
    };
  });
}

/* Eliminar un contrato en duro — la base de datos ya lo bloquea (llave foránea, sin
   cascade) si todavía tiene algún trabajador asociado, activo o inactivo. Solo
   funciona para un contrato que quedó vacío (ej. se creó por error). */
function eliminarContratoDot(id){
  const c = DOTACION.contratos.find(x=>x.id===id); if(!c) return;
  openSubModal(`<div class="modal" style="max-width:420px">
    <div class="modal-head"><div><h2>Eliminar contrato</h2><p>Esta acción no se puede deshacer.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body"><p style="font-size:14.5px;color:var(--ink-2)">Se eliminará el contrato "<b>${esc(c.nombre)}</b>". Solo se puede eliminar si no tiene ningún trabajador asociado (ni activo ni inactivo).</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confDelContratoDot">${I.trash} Sí, eliminar</button></div></div>`, ()=> abrirGestionContratos());
  document.getElementById('confDelContratoDot').onclick = async ()=>{
    const btn = document.getElementById('confDelContratoDot'); btn.disabled=true; btn.innerHTML="Eliminando…";
    const { error } = await sb.from("dot_contratos").delete().eq("id", id);
    if(error){
      btn.disabled=false; btn.innerHTML=`${I.trash} Sí, eliminar`;
      const fk = /foreign key|violat/i.test(error.message||"");
      toast(fk?"No se puede eliminar: todavía tiene trabajadores asociados. Archívalo en vez de eliminarlo, o elimina primero a sus trabajadores.":"No se pudo eliminar: "+error.message,"err");
      return;
    }
    if(id===contratoActualId){ contratoActualId='todos'; localStorage.setItem('dot_contrato_actual','todos'); }
    await loadDotacionState();
    toast("Contrato eliminado","ok");
    closeModal();
  };
}

async function guardarTrabajador(id){
  const contrato_id = document.getElementById('tContrato').value;
  const nombre = document.getElementById('tNombre').value.trim();
  const identificacion = document.getElementById('tCedula').value.trim();
  const cargo = document.getElementById('tCargo').value.trim() || null;
  const fecha_ingreso = document.getElementById('tFechaIngreso').value || null;
  if(!contrato_id){ toast("Selecciona el contrato","err"); return; }
  if(!nombre){ toast("Falta el nombre","err"); return; }
  if(!identificacion){ toast("Falta la identificación","err"); return; }
  const btn = document.getElementById('btnGuardarTrab'); btn.disabled=true; btn.innerHTML="Guardando…";
  bloquear("Guardando…");
  let error;
  if(id){ ({error} = await sb.from("dot_trabajadores").update({nombre,identificacion,cargo,contrato_id,fecha_ingreso}).eq("id",id)); }
  else { ({error} = await sb.from("dot_trabajadores").insert({nombre,identificacion,cargo,contrato_id,fecha_ingreso})); }
  desbloquear();
  if(error){
    btn.disabled=false; btn.innerHTML=`${I.check} Guardar`;
    const dup = /duplicate|unique/i.test(error.message||"");

async function cargarTrabajadoresExcelDot(file){
  if(!window.XLSX){ toast("No se pudo cargar el lector de Excel (revisa tu conexión)","err"); return; }
  if(contratoActualId==='todos'){ toast("Selecciona un contrato específico antes de cargar trabajadores","err"); return; }
  bloquear("Leyendo archivo…");
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
    if(!filas.length){ toast("El archivo está vacío","err"); return; }
    const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
    const head = (filas[0]||[]).map(norm);
    const findCol = (...alts)=> head.findIndex(h => alts.some(a => h.includes(a)));
    let cNom = findCol("nombre"), cId = findCol("identificacion","cedula","documento","cc"),
        cCar = findCol("cargo"),
        cFec = findCol("fecha de ingreso","fecha ingreso","ingreso");
    let start = 1;
    if(cNom === -1 && cId === -1){ cNom=0; cId=1; cCar=2; cFec=3; start=0; }
    const filasValidas = []; let ignoradas = 0;
    for(let i=start;i<filas.length;i++){
      const r = filas[i]; if(!r) continue;
      const nombre = String(cNom>=0?r[cNom]:"").trim();
      const identificacion = String(cId>=0?r[cId]:"").trim();
      const cargo = String(cCar>=0?r[cCar]:"").trim();
      const fecha_ingreso = cFec>=0 ? parseFechaExcelDtl(r[cFec]) : null;
      if(!nombre && !identificacion) continue;
      if(!nombre || !identificacion){ ignoradas++; continue; }
      filasValidas.push({ nombre, identificacion, cargo:cargo||null, fecha_ingreso });
    }
    if(!filasValidas.length){ toast("No se encontraron filas válidas (se requiere nombre e identificación)","err"); return; }
    const keyOf = s => s.replace(/[^0-9A-Za-z]/g,"").toLowerCase();
    // La cédula es única POR CONTRATO: solo comparamos contra los trabajadores de este mismo contrato
    const existentes = {}; trabajadoresDelContrato().forEach(t=>{ existentes[keyOf(t.identificacion)] = t; });
    const nuevos = [], actualizaciones = [];
    const vistosEnArchivo = new Set(); let dup = 0;
    filasValidas.forEach(f=>{
      const k = keyOf(f.identificacion);
      if(vistosEnArchivo.has(k)){ dup++; return; }
      vistosEnArchivo.add(k);
      if(existentes[k]){ actualizaciones.push({ id: existentes[k].id, ...f }); }
      else { nuevos.push({ ...f, contrato_id: contratoActualId }); }
    });
    let errores = 0;
    if(nuevos.length){
      const { error } = await sb.from("dot_trabajadores").insert(nuevos);
      if(error){ errores++; console.error(error); }
    }
    for(const a of actualizaciones){
      const { id, ...datos } = a;
      const { error } = await sb.from("dot_trabajadores").update(datos).eq("id", id);
      if(error) errores++;
    }
    await loadDotacionState();
    renderDotTrabajadoresGrid();
    let msg = `${nuevos.length} nuevo(s), ${actualizaciones.length} actualizado(s)`;
    if(ignoradas) msg += ` · ${ignoradas} sin nombre/cédula omitida(s)`;
    if(dup) msg += ` · ${dup} duplicada(s) en el archivo`;
    if(errores) msg += ` · ${errores} error(es)`;
    toast(msg, errores?"err":"ok");
  }catch(e){ console.error(e); toast("No se pudo leer el archivo: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

async function cargarCatalogoExcelDot(file){
  if(!window.XLSX){ toast("No se pudo cargar el lector de Excel (revisa tu conexión)","err"); return; }
  bloquear("Leyendo archivo…");
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
    if(!filas.length){ toast("El archivo está vacío","err"); return; }
    const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
    const head = (filas[0]||[]).map(norm);
    const findCol = (...alts)=> head.findIndex(h => alts.some(a => h.includes(a)));
    let cNom = findCol("nombre","item","ítem"), cUn = findCol("unidad");
    let start = 1;
    if(cNom === -1){ cNom=0; cUn=1; start=0; }
    const nombresValidos = []; let ignoradas = 0;
    for(let i=start;i<filas.length;i++){
      const r = filas[i]; if(!r) continue;
      const nombre = String(cNom>=0?r[cNom]:"").trim();
      const unidad = String(cUn>=0?r[cUn]:"").trim();
      if(!nombre){ if(r.some(v=>String(v||"").trim())) ignoradas++; continue; }
      nombresValidos.push({ nombre, unidad: unidad||null, contrato_id: contratoActualId });
    }
    if(!nombresValidos.length){ toast("No se encontraron filas válidas (se requiere el nombre del ítem)","err"); return; }
    const keyOf = s => s.trim().toLowerCase();
    const existentes = new Set(DOTACION.catalogo.map(c=>keyOf(c.nombre)));
    const vistosEnArchivo = new Set(); let dup = 0, yaExistian = 0;
    const nuevos = [];
    nombresValidos.forEach(it=>{
      const k = keyOf(it.nombre);
      if(vistosEnArchivo.has(k)){ dup++; return; }
      vistosEnArchivo.add(k);
      if(existentes.has(k)){ yaExistian++; return; }
      nuevos.push(it);
    });
    if(nuevos.length){
      const { error } = await sb.from("dot_catalogo").insert(nuevos);
      if(error){ toast("No se pudo cargar el catálogo: "+error.message,"err"); return; }
    }
    await loadDotacionState();
    renderCatalogoLista();
    let msg = `${nuevos.length} ítem(s) nuevo(s) agregado(s)`;
    if(yaExistian) msg += ` · ${yaExistian} ya existían (sin cambios)`;
    if(ignoradas) msg += ` · ${ignoradas} fila(s) sin nombre omitida(s)`;
    if(dup) msg += ` · ${dup} duplicada(s) en el archivo`;
    toast(msg,"ok");
  }catch(e){ console.error(e); toast("No se pudo leer el archivo: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

function abrirFormPredeterminado(id){
  const p = id ? DOTACION.predeterminados.find(x=>x.id===id) : null;
  openSubModal(`<div class="modal" style="max-width:480px">
    <div class="modal-head"><div><h2>${p?'Editar plantilla':'Nueva plantilla'}</h2><p>Ej. "Plantilla1", "Turno mañana"…</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Nombre de la plantilla *</label><input id="pdNombre" value="${esc(p?.nombre||'')}" placeholder="Ej. Plantilla1"></div>
      <div class="field row2">
        <div><label>Nombre del responsable *</label><input id="pdRespNombre" value="${esc(p?.responsable_nombre||'')}" placeholder="Nombre completo"></div>
        <div><label>Cargo</label><input id="pdRespCargo" value="${esc(p?.responsable_cargo||'')}" placeholder="Cargo"></div>
      </div>
      <label style="font-weight:700;font-size:13px;display:block;margin:10px 0 6px">Firma *</label>
      ${p?`<div id="pdFirmaGuardada" style="text-align:center;margin-bottom:10px"><img src="${p.firma}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"></div>
      <button class="btn btn-ghost btn-sm" id="btnPdRefirmar" style="margin-bottom:10px">${I.pen} Firmar de nuevo</button>`:''}
      <div id="pdPadWrap" style="${p?'display:none':''}">
        <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
        <div class="sig-actions">
          <button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btnPdAdjuntarFirma">${I.plus} Adjuntar imagen de firma</button>
        </div>
        <p class="muted-sm" style="margin-top:4px">Si ya tienes tu firma guardada como foto o imagen en el computador, la puedes subir — le quitamos el fondo automáticamente para que quede igual de limpia que si la dibujaras aquí.</p>
        <input type="file" id="pdArchivoFirma" accept="image/*" style="display:none">
        <div id="pdFirmaSubidaPreview"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarPredet">${I.check} Guardar</button>
    </div></div>`, ()=>abrirPredeterminadosModal());
  let usarPad = !p;
  let firmaSubida = null;
  if(usarPad){ initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear(); }
  const reBtn = document.getElementById('btnPdRefirmar');
  if(reBtn) reBtn.onclick = ()=>{
    document.getElementById('pdFirmaGuardada').style.display='none';
    reBtn.style.display='none';
    document.getElementById('pdPadWrap').style.display='block';
    usarPad = true;
    initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear();
  };
  document.getElementById('btnPdAdjuntarFirma').onclick = ()=> document.getElementById('pdArchivoFirma').click();
  document.getElementById('pdArchivoFirma').onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const prev = document.getElementById('pdFirmaSubidaPreview');
    prev.innerHTML = `<p class="muted-sm">Procesando…</p>`;
    try{
      firmaSubida = await quitarFondoFirma(f);
      prev.innerHTML = `<div style="text-align:center;margin-top:8px;padding:10px;background:repeating-conic-gradient(#e9ecf5 0% 25%,#fff 0% 50%) 50%/16px 16px"><img src="${firmaSubida}" style="height:80px;max-width:100%"></div>`;
    }catch(err){ prev.innerHTML = `<p class="muted-sm" style="color:var(--danger)">No se pudo procesar la imagen</p>`; firmaSubida = null; }
  };
  document.getElementById('btnGuardarPredet').onclick = async ()=>{
    const nombre = document.getElementById('pdNombre').value.trim();
    const respNombre = document.getElementById('pdRespNombre').value.trim();
    const respCargo = document.getElementById('pdRespCargo').value.trim() || null;
    if(!nombre){ toast("Ponle un nombre a la plantilla","err"); return; }
    if(!respNombre){ toast("Falta el nombre del responsable","err"); return; }
    if(!p && DOTACION.predeterminados.length>=PREDET_MAX){ toast(`Ya tienes el máximo de ${PREDET_MAX} plantillas`,"err"); return; }
    let firma = p ? p.firma : null;
    if(firmaSubida){ firma = firmaSubida; }
    else if(usarPad){
      if(!sigPad || sigPad.isEmpty()){ toast("Falta la firma","err"); return; }
      firma = sigPad.dataURL();
    }
    const btn = document.getElementById('btnGuardarPredet'); btn.disabled=true; btn.innerHTML="Guardando…";
    const payload = { nombre, responsable_nombre: respNombre, responsable_cargo: respCargo, firma };
    const { error } = p
      ? await sb.from("dot_predeterminados").update(payload).eq("id", p.id)
      : await sb.from("dot_predeterminados").insert({ ...payload, contrato_id: contratoActualId });
    if(error){ btn.disabled=false; btn.innerHTML=`${I.check} Guardar`; toast("No se pudo guardar: "+error.message,"err"); return; }
    await loadDotacionState();
    toast(p?"Plantilla actualizada":"Plantilla creada","ok");
    closeModal();
  };
}

  openSubModal(`<div class="modal" style="max-width:420px">
    <div class="modal-head"><div><h2>Eliminar plantilla</h2><p>Esta acción no se puede deshacer.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>

/* ---------- Nueva entrega (asistente de 3 pasos, en persona / mismo dispositivo) ---------- */
function abrirNuevaEntrega(trabajadorId){
  if(contratoActualId==='todos'){
    toast("Selecciona primero un contrato específico","err");
    return;
  }
  if(contratoActual()?.modo_registro==='escaneado'){
    abrirNuevaEntregaEscaneada(trabajadorId);
    return;
  }
  if(!DOTACION.catalogo.some(c=>c.activo)){
    toast("Primero agrega ítems al catálogo (botón 'Catálogo de ítems')","err");
    return;
  }
  entregaDraft = {
    trabajadorId: trabajadorId || null,
    fecha: hoyLocal(),
    responsableNombre: '',
    responsableCargo: '',
    predeterminadoId: null,
    observaciones: '',
    items: [{ catalogoId:'', cantidad:1, talla:'' }],
    firmaTrabajador: null,
    fotoTrabajador: null
  };
  renderPasoEntrega1();
}

/* ---------- Nueva entrega ESCANEADA (contrato en modo "escaneado": sin señal en campo,
   se sube el formato físico ya firmado en vez de capturar firmas/ítems digitales) ---------- */
function abrirNuevaEntregaEscaneada(trabajadorId){
  const t = trabajadorId ? DOTACION.trabajadores.find(x=>x.id===trabajadorId) : null;
  const opcionesTrab = trabajadoresDelContrato().map(x=>`<option value="${x.id}" ${x.id===trabajadorId?'selected':''}>${esc(x.nombre)} — C.C. ${esc(x.identificacion)}</option>`).join('');
  const nSugerido = (t ? DOTACION.entregas.filter(e=>e.trabajador_id===t.id).length : 0) + 1;
  const tituloSugerido = `Entrega #${nSugerido} · ${fmtDate(hoyLocal())}`;
  dotEscaneadaState = { trabajadorId: trabajadorId || null, archivo: null, archivoTipo: null, archivoNombre: null };
  openModal(`<div class="modal" style="max-width:480px">
    <div class="modal-head"><div><h2>Registrar entrega escaneada</h2><p>Este contrato usa formato físico — sube la foto o el PDF ya firmado.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      ${t ? `<div class="trab-summary" style="margin-bottom:14px"><div class="tk">Trabajador</div><div class="tv">${esc(t.nombre)} — C.C. ${esc(t.identificacion)}</div></div>`
          : `<div class="field" style="margin-bottom:14px"><label>Trabajador *</label><select id="entEscTrabajador"><option value="">Selecciona…</option>${opcionesTrab}</select></div>`}
      <div class="field row2">
        <div><label>Fecha *</label><input type="date" id="entEscFecha" value="${hoyLocal()}"></div>
        <div><label>Título *</label><input id="entEscTitulo" value="${esc(tituloSugerido)}" placeholder="Ej. Entrega #3 · 26/07/2026"></div>
      </div>
      <div class="field">
        <label>Archivo escaneado (foto o PDF) *</label>
        <div id="entEscPreview"></div>
        <input type="file" id="entEscArchivo" accept="image/*,.pdf" style="display:none">
        <button type="button" class="btn btn-ghost btn-sm" id="entEscBtnArchivo" style="margin-top:8px">${I.plus} Elegir archivo</button>
      </div>
      <div id="entEscError" class="login-err"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarEntEsc">${I.check} Guardar</button>
    </div></div>`);
  document.getElementById('entEscBtnArchivo').onclick = ()=> document.getElementById('entEscArchivo').click();
  document.getElementById('entEscArchivo').onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const esPdf = f.type==='application/pdf' || /\.pdf$/i.test(f.name||'');
    if(esPdf){
      const rd = new FileReader();
      dotEscaneadaState.archivo = await new Promise(res=>{ rd.onload=()=>res(rd.result); rd.readAsDataURL(f); });
      dotEscaneadaState.archivoTipo = 'application/pdf';
    } else {
      dotEscaneadaState.archivo = await comprimirImagen(f, 1400);
      dotEscaneadaState.archivoTipo = 'image/jpeg';
    }
    dotEscaneadaState.archivoNombre = f.name;
    renderEntEscPreview();
  };
  renderEntEscPreview();
  document.getElementById('btnGuardarEntEsc').onclick = guardarEntregaEscaneada;
}

function renderEntEscPreview(){
  const host = document.getElementById('entEscPreview'); if(!host) return;
  if(!dotEscaneadaState.archivo){ host.innerHTML = '<p class="muted-sm" style="margin-top:6px">Ningún archivo elegido todavía.</p>'; return; }
  if(dotEscaneadaState.archivoTipo === 'application/pdf'){
    host.innerHTML = `<div class="muted-sm" style="margin-top:6px">${I.pdf} ${esc(dotEscaneadaState.archivoNombre||'archivo.pdf')} (PDF cargado)</div>`;
  } else {
    host.innerHTML = `<img src="${dotEscaneadaState.archivo}" style="max-width:100%;max-height:220px;border:1px solid var(--line);border-radius:8px;margin-top:6px">`;
  }
}

async function guardarEntregaEscaneada(){
  const err = document.getElementById('entEscError'); err.textContent='';
  const selTrab = document.getElementById('entEscTrabajador');
  const trabajadorId = dotEscaneadaState.trabajadorId || (selTrab ? selTrab.value : null);
  if(!trabajadorId){ err.textContent = 'Selecciona el trabajador.'; return; }
  const fecha = document.getElementById('entEscFecha').value || hoyLocal();
  const titulo = document.getElementById('entEscTitulo').value.trim();
  if(!titulo){ err.textContent = 'Escribe un título.'; return; }
  if(!dotEscaneadaState.archivo){ err.textContent = 'Sube el archivo escaneado.'; return; }
  const btn = document.getElementById('btnGuardarEntEsc'); btn.disabled=true; btn.innerHTML='Guardando…';
  const { error } = await sb.rpc('dot_entrega_escaneada_registrar', {
    p_trabajador_id: trabajadorId,
    p_fecha: fecha,
    p_adjunto_titulo: titulo,
    p_adjunto_archivo: dotEscaneadaState.archivo,
    p_adjunto_tipo: dotEscaneadaState.archivoTipo
  });
  if(error){
    btn.disabled=false; btn.innerHTML=`${I.check} Guardar`;
    toast("No se pudo guardar: "+error.message,"err");
    return;
  }
  await loadDotacionState();
  closeModal();
  toast("Entrega escaneada guardada","ok");
  const yaEstabaEnFicha = location.hash === "#/dotacion/trabajador/"+trabajadorId;
  if(yaEstabaEnFicha){ renderFichaTrabajador(trabajadorId); }
  else { location.hash = "#/dotacion/trabajador/"+trabajadorId; }
}

function wireEntPredetChips(){
  document.querySelectorAll('#predetChips [data-predet-id]').forEach(chip=>{
    chip.onclick = ()=>{
      const id = chip.dataset.predetId;
      const yaActivo = entregaDraft.predeterminadoId === id;
      entregaDraft.predeterminadoId = yaActivo ? null : id;
      document.querySelectorAll('#predetChips [data-predet-id]').forEach(c=> c.classList.toggle('active', c.dataset.predetId===entregaDraft.predeterminadoId));
      const nombreInput = document.getElementById('entRespNombre'), cargoInput = document.getElementById('entRespCargo');
      if(entregaDraft.predeterminadoId){
        const p = DOTACION.predeterminados.find(x=>x.id===entregaDraft.predeterminadoId);
        nombreInput.value = p.responsable_nombre; cargoInput.value = p.responsable_cargo||'';
        nombreInput.setAttribute('readonly',''); cargoInput.setAttribute('readonly','');
      } else {
        nombreInput.removeAttribute('readonly'); cargoInput.removeAttribute('readonly');
      }
      actualizarQuienFirma();
    };
  });
}

function actualizarQuienFirma(){
  const el = document.getElementById('entQuienFirma'); if(!el) return;
  const p = entregaDraft.predeterminadoId ? DOTACION.predeterminados.find(x=>x.id===entregaDraft.predeterminadoId) : null;
  el.textContent = p ? `Firmará: ${p.responsable_nombre} — usando la firma guardada de "${p.nombre}", no se pedirá de nuevo.` : '';
}

function renderItemsList(){
  const host = document.getElementById('itemsList'); if(!host) return;
  const activos = DOTACION.catalogo.filter(c=>c.activo);
  host.innerHTML = entregaDraft.items.map((it,i)=>`
    <div class="item-row" data-i="${i}">
      <span class="firmante-num">${i+1}</span>
      <select data-f="catalogoId">
        <option value="">Elige el ítem…</option>
        ${activos.map(c=>`<option value="${c.id}" ${c.id===it.catalogoId?'selected':''}>${esc(c.nombre)}</option>`).join('')}
      </select>
      <input data-f="cantidad" type="number" min="1" step="1" value="${it.cantidad}" placeholder="Cant.">
      <input data-f="talla" value="${esc(it.talla||'')}" placeholder="Talla (opc.)">
      <button class="icon-btn danger" data-del="${i}" title="Quitar" ${entregaDraft.items.length<=1?'disabled':''}>${I.trash}</button>
    </div>`).join('');
  host.querySelectorAll('select[data-f], input[data-f]').forEach(el=>{
    el.oninput = el.onchange = ()=>{
      const i = +el.closest('.item-row').dataset.i;
      const val = el.dataset.f==='cantidad' ? (+el.value||0) : el.value;
      entregaDraft.items[i][el.dataset.f] = val;
    };
  });
  host.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{ if(entregaDraft.items.length<=1) return; entregaDraft.items.splice(+b.dataset.del,1); renderItemsList(); };
  });
}

function validarYContinuarPaso1(){
  const selTrab = document.getElementById('entTrabajador');
  if(selTrab){ entregaDraft.trabajadorId = selTrab.value || null; }
  if(!entregaDraft.trabajadorId){ toast("Selecciona el trabajador","err"); return; }
  entregaDraft.fecha = document.getElementById('entFecha').value || hoyLocal();
  entregaDraft.responsableNombre = document.getElementById('entRespNombre').value.trim();
  entregaDraft.responsableCargo = document.getElementById('entRespCargo').value.trim();
  entregaDraft.observaciones = document.getElementById('entObs').value.trim();
  if(!entregaDraft.responsableNombre){ toast("Falta el nombre del responsable que entrega","err"); return; }
  const validos = entregaDraft.items.filter(it=>it.catalogoId && it.cantidad>0);
  if(!validos.length){ toast("Agrega al menos un ítem con cantidad","err"); return; }
  entregaDraft.items = validos;
  renderPasoEntregaFirmaTrabajador();
}

      </div>

      ${guardada?`<div id="firmaTGuardada" style="text-align:center;margin-bottom:12px"><img src="${guardada}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"></div>`:''}
      <div id="padWrapT" style="${guardada?'display:none':''}">
        <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
        <div class="sig-actions"><button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button></div>
      </div>
      ${guardada?`<button class="btn btn-ghost btn-sm" id="btnRefirmarT">${I.pen} Firmar de nuevo</button>`:''}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="renderPasoEntrega1()">${I.back} Atrás</button>
      <button class="btn btn-green" id="btnFirmaTrabOk">${I.check} ${guardada?'Continuar':'Firmar y continuar'}</button>
    </div>
  </div>`);
  wireFotoTrabPreview();
  let usarPad = !guardada;
  if(usarPad){ initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear(); }
  const reBtn = document.getElementById('btnRefirmarT');
  if(reBtn) reBtn.onclick = ()=>{
    document.getElementById('firmaTGuardada').style.display='none';
    document.getElementById('padWrapT').style.display='block';
    usarPad = true; reBtn.style.display='none';
    initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear();
  };
  document.getElementById('btnFirmaTrabOk').onclick = ()=>{
    if(APP_CONFIG.eppFotoObligatoria && !entregaDraft.fotoTrabajador){ toast("La foto del trabajador es obligatoria","err"); return; }
    if(usarPad){
      if(!sigPad || sigPad.isEmpty()){ toast("El trabajador debe firmar primero","err"); return; }
      entregaDraft.firmaTrabajador = sigPad.dataURL();
    }
    renderPasoEntregaFirmaResponsable();
  };
}
