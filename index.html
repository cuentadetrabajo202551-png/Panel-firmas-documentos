      const id = chip.dataset.predetId;
      const yaActivo = entregaDraft.predeterminadoId === id;
      entregaDraft.predeterminadoId = yaActivo ? null : id;
      document.querySelectorAll('#predetChips [data-predet-id]').forEach(c=> c.classList.toggle('active', c.dataset.predetId===entregaDraft.predeterminadoId));
      const nombreInput = document.getElementById('entRespNombre'), cargoInput = document.getElementById('entRespCargo');
      if(entregaDraft.predeterminadoId){
        const p = DOTACION.predeterminados.find(x=>x.id===entregaDraft.predeterminadoId);
        nombreInput.value = p.responsable_nombre; cargoInput.value = p.responsable_cargo||'';
        nombreInput.setAttribute('readonly',''); cargoInput.setAttribute('readonly','');
      } else {
        nombreInput.removeAttribute('readonly'); cargoInput.removeAttribute('readonly');
      }
      actualizarQuienFirma();
    };
  });
}

function actualizarQuienFirma(){
  const el = document.getElementById('entQuienFirma'); if(!el) return;
  const p = entregaDraft.predeterminadoId ? DOTACION.predeterminados.find(x=>x.id===entregaDraft.predeterminadoId) : null;
  el.textContent = p ? `Firmará: ${p.responsable_nombre} — usando la firma guardada de "${p.nombre}", no se pedirá de nuevo.` : '';
}

function renderItemsList(){
  const host = document.getElementById('itemsList'); if(!host) return;
  const activos = DOTACION.catalogo.filter(c=>c.activo);
  host.innerHTML = entregaDraft.items.map((it,i)=>`
    <div class="item-row" data-i="${i}">
      <span class="firmante-num">${i+1}</span>
      <select data-f="catalogoId">
        <option value="">Elige el ítem…</option>
        ${activos.map(c=>`<option value="${c.id}" ${c.id===it.catalogoId?'selected':''}>${esc(c.nombre)}</option>`).join('')}
      </select>
      <input data-f="cantidad" type="number" min="1" step="1" value="${it.cantidad}" placeholder="Cant.">
      <input data-f="talla" value="${esc(it.talla||'')}" placeholder="Talla (opc.)">
      <button class="icon-btn danger" data-del="${i}" title="Quitar" ${entregaDraft.items.length<=1?'disabled':''}>${I.trash}</button>
    </div>`).join('');
  host.querySelectorAll('select[data-f], input[data-f]').forEach(el=>{
    el.oninput = el.onchange = ()=>{
      const i = +el.closest('.item-row').dataset.i;
      const val = el.dataset.f==='cantidad' ? (+el.value||0) : el.value;
      entregaDraft.items[i][el.dataset.f] = val;
    };
  });
  host.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{ if(entregaDraft.items.length<=1) return; entregaDraft.items.splice(+b.dataset.del,1); renderItemsList(); };
  });
}

function validarYContinuarPaso1(){
  const selTrab = document.getElementById('entTrabajador');
  if(selTrab){ entregaDraft.trabajadorId = selTrab.value || null; }
  if(!entregaDraft.trabajadorId){ toast("Selecciona el trabajador","err"); return; }
  entregaDraft.fecha = document.getElementById('entFecha').value || hoyLocal();
  entregaDraft.responsableNombre = document.getElementById('entRespNombre').value.trim();
  entregaDraft.responsableCargo = document.getElementById('entRespCargo').value.trim();
  entregaDraft.observaciones = document.getElementById('entObs').value.trim();
  if(!entregaDraft.responsableNombre){ toast("Falta el nombre del responsable que entrega","err"); return; }
  const validos = entregaDraft.items.filter(it=>it.catalogoId && it.cantidad>0);
  if(!validos.length){ toast("Agrega al menos un ítem con cantidad","err"); return; }
  entregaDraft.items = validos;
  localStorage.setItem('dot_ultimo_responsable', JSON.stringify({ nombre: entregaDraft.responsableNombre, cargo: entregaDraft.responsableCargo }));
  renderPasoEntregaFirmaTrabajador();
}

function renderPasoEntregaFirmaTrabajador(){
  const t = DOTACION.trabajadores.find(x=>x.id===entregaDraft.trabajadorId);
  const resumen = entregaDraft.items.map(it=>{
    const c = DOTACION.catalogo.find(x=>x.id===it.catalogoId);
    return `<span class="entrega-item-tag">${esc(c?c.nombre:'Ítem')} × ${it.cantidad}${it.talla?' · '+esc(it.talla):''}</span>`;

    <div class="modal-head"><div><h2>Firma del trabajador</h2><p>Paso 2 de 3 — ${esc(t?.nombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div style="margin-bottom:14px">${resumen}</div>
      <div style="margin-bottom:14px">
        <p class="muted-sm" style="margin-bottom:6px">Foto del trabajador recibiendo ${APP_CONFIG.eppFotoObligatoria?'<span style="color:var(--danger);font-weight:700">(obligatoria)</span>':'<span class="opt">(opcional)</span>'}</p>
        <div id="fotoTrabPreview">${fotoTrabPreviewHTML()}</div>
        <input type="file" id="fileFotoTrab" accept="image/*" capture="user" style="display:none">
      </div>
      <p class="muted-sm" style="margin-bottom:10px">Recibí a satisfacción los elementos anteriores. Firma aquí:</p>
      ${guardada?`<div id="firmaTGuardada" style="text-align:center;margin-bottom:12px"><img src="${guardada}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"></div>`:''}
      <div id="padWrapT" style="${guardada?'display:none':''}">
        <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
        <div class="sig-actions"><button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button></div>
      </div>
      ${guardada?`<button class="btn btn-ghost btn-sm" id="btnRefirmarT">${I.pen} Firmar de nuevo</button>`:''}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="renderPasoEntrega1()">${I.back} Atrás</button>
      <button class="btn btn-green" id="btnFirmaTrabOk">${I.check} ${guardada?'Continuar':'Firmar y continuar'}</button>
    </div>
  </div>`);
  wireFotoTrabPreview();

    if(usarPad){
      if(!sigPad || sigPad.isEmpty()){ toast("El trabajador debe firmar primero","err"); return; }

/* Foto opcional del trabajador (paso 2 del asistente de entrega) */
function fotoTrabPreviewHTML(){

    ? `<div class="cap-prev"><img src="${entregaDraft.fotoTrabajador}"><button class="btn btn-ghost btn-sm" id="btnCambiarFotoTrab">${I.pen} Cambiar foto</button></div>`

}
function wireFotoTrabPreview(){
  const inp = document.getElementById('fileFotoTrab');
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    entregaDraft.fotoTrabajador = await comprimirImagen(f, 700);
    inp.value = '';
    document.getElementById('fotoTrabPreview').innerHTML = fotoTrabPreviewHTML();
    wireFotoTrabPreview();
  };
  const bt = document.getElementById('btnTomarFotoTrab'); if(bt) bt.onclick = ()=> inp.click();

function renderPasoEntregaFirmaResponsable(){
  const plantilla = entregaDraft.predeterminadoId ? DOTACION.predeterminados.find(x=>x.id===entregaDraft.predeterminadoId) : null;
  openModal(`<div class="modal" style="max-width:560px">
    <div class="modal-head"><div><h2>Firma del responsable</h2><p>Paso 3 de 3 — ${esc(entregaDraft.responsableNombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <p class="muted-sm" style="margin-bottom:10px">Confirma que hiciste la entrega.</p>
      ${plantilla?`
      <div id="firmaRGuardada" style="text-align:center;margin-bottom:12px"><img src="${plantilla.firma}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"></div>
      <p class="muted-sm" style="text-align:center;margin-bottom:10px">Firma guardada en "${esc(plantilla.nombre)}"</p>
      <div style="display:flex;justify-content:center;margin-bottom:6px">
        <button class="btn btn-ghost btn-sm" id="btnRefirmarR">${I.pen} Firmar de nuevo (solo para esta entrega)</button>
      </div>`:''}
      <div id="padWrapR" style="${plantilla?'display:none':''}">
        <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
        <div class="sig-actions"><button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button></div>
        ${!plantilla && DOTACION.predeterminados.length<PREDET_MAX?`
        <label class="chk" style="margin-top:8px" id="chkWrapGuardarPredet"><input type="checkbox" id="chkGuardarPredet" checked> Guardar como plantilla predeterminada (Predeterminado)</label>
        <div class="field" id="nuevaPredetNombreWrap" style="margin-top:6px"><input id="nuevaPredetNombre" placeholder="Nombre de la plantilla, ej. Plantilla1"></div>`:''}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="renderPasoEntregaFirmaTrabajador()">${I.back} Atrás</button>
      <button class="btn btn-green" id="btnFirmaRespOk">${I.check} Guardar entrega</button>
    </div>
  </div>`);
  let usarGuardada = !!plantilla;
  if(!usarGuardada){ initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear(); }
  const chkGuardarPredet = document.getElementById('chkGuardarPredet');
  if(chkGuardarPredet) chkGuardarPredet.onchange = ()=>{
    document.getElementById('nuevaPredetNombreWrap').style.display = chkGuardarPredet.checked ? 'block' : 'none';
  };
  const reBtn = document.getElementById('btnRefirmarR');
  if(reBtn) reBtn.onclick = ()=>{
    document.getElementById('firmaRGuardada').style.display='none';
    reBtn.parentElement.style.display='none';
    document.getElementById('padWrapR').style.display='block';
    usarGuardada = false;
    initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear();
  };
  document.getElementById('btnFirmaRespOk').onclick = async ()=>{
    let firma;
    if(usarGuardada){
      firma = plantilla.firma;
    } else {
      if(!sigPad || sigPad.isEmpty()){ toast("Falta la firma del responsable","err"); return; }
      firma = sigPad.dataURL();
      const chk = document.getElementById('chkGuardarPredet');
      if(chk && chk.checked){
        const nombrePlantilla = document.getElementById('nuevaPredetNombre').value.trim() || ('Plantilla '+(DOTACION.predeterminados.length+1));
        const { error } = await sb.from("dot_predeterminados").insert({
          nombre: nombrePlantilla,
          responsable_nombre: entregaDraft.responsableNombre || '',
          responsable_cargo: entregaDraft.responsableCargo || null,
          firma,
          contrato_id: contratoActualId
        });
        if(error) toast("La entrega se va a guardar, pero no se pudo guardar la plantilla: "+error.message,"err");
        else await loadDotacionState();
      }
    }
    const btn=document.getElementById('btnFirmaRespOk'); btn.disabled=true; btn.innerHTML="Guardando…";
    await guardarEntregaFinal(firma);

}

async function guardarEntregaFinal(firmaResponsable){
  bloquear("Guardando entrega…");
  try{
    const { data: entrega, error } = await sb.from("dot_entregas").insert({
      trabajador_id: entregaDraft.trabajadorId,
      fecha: entregaDraft.fecha,
      responsable_nombre: entregaDraft.responsableNombre || null,
      responsable_cargo: entregaDraft.responsableCargo || null,
      observaciones: entregaDraft.observaciones || null,
      firma_trabajador: entregaDraft.firmaTrabajador,
      firma_responsable: firmaResponsable,
      foto_trabajador: entregaDraft.fotoTrabajador
    }).select().single();
    if(error){ toast("No se pudo guardar la entrega: "+error.message,"err"); return; }
    const rows = entregaDraft.items.map(it=>{
      const c = DOTACION.catalogo.find(x=>x.id===it.catalogoId);
      return { entrega_id: entrega.id, nombre_item: c?c.nombre:'Ítem', cantidad: it.cantidad, talla: it.talla||null };
    });
    const { error: e2 } = await sb.from("dot_entrega_items").insert(rows);
    if(e2) toast("Entrega guardada, pero hubo un error con los ítems: "+e2.message,"err");
    const trabId = entregaDraft.trabajadorId;
    const yaEstabaEnFicha = location.hash === "#/dotacion/trabajador/"+trabId;
    entregaDraft = null;
    await loadDotacionState();
    closeModal();
    toast("Entrega registrada correctamente","ok");
    if(yaEstabaEnFicha){ await renderFichaTrabajador(trabId); }
    else { location.hash = "#/dotacion/trabajador/"+trabId; }
  } finally { desbloquear(); }
}

/* ---------- Ficha del trabajador: historial completo + kárdex imprimible ---------- */
async function renderFichaTrabajador(id){
  bloquear("Cargando ficha…");
  try{
    await loadDotacionState();
    const t = DOTACION.trabajadores.find(x=>x.id===id);
    if(!t){ toast("Trabajador no encontrado","err"); location.hash="#/dotacion"; return; }
    const { data: entregas } = await sb.from("dot_entregas")
      .select("id,fecha,responsable_nombre,responsable_cargo,observaciones,creado_en,creado_por")
      .eq("trabajador_id", id).order("fecha",{ascending:false});
    const listaEntregas = entregas || [];
    const idsEnt = listaEntregas.map(e=>e.id);
    const { data: items } = idsEnt.length
      ? await sb.from("dot_entrega_items").select("entrega_id,nombre_item,cantidad,talla").in("entrega_id", idsEnt)
      : { data: [] };
    const itemsPorEntrega = {};
    (items||[]).forEach(it=>{ (itemsPorEntrega[it.entrega_id] = itemsPorEntrega[it.entrega_id]||[]).push(it); });

    const filas = listaEntregas.map(e=>{
      const its = (itemsPorEntrega[e.id]||[]).map(it=>`${esc(it.nombre_item)} × ${it.cantidad}${it.talla?' ('+esc(it.talla)+')':''}`).join(', ');
      return `<tr>
        <td>${fmtDate(e.fecha)}</td>
        <td>${its||'—'}</td>
        <td>${esc(e.responsable_nombre||'—')}</td>
        <td>${puedoTocarReciente(e.creado_en, e.creado_por)?`<button class="icon-btn" title="Editar entrega" onclick="abrirEditarEntrega('${e.id}','${t.id}')">${I.pen}</button>
        <button class="icon-btn danger" title="Eliminar entrega" onclick="eliminarEntrega('${e.id}','${t.id}')">${I.trash}</button>`:''}</td>
      </tr>`;
    }).join('');

    document.getElementById("app").innerHTML = `
      ${topbar('dotacion')}
      <div class="wrap">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" id="btnVolverDot">${I.back} Volver</button>
        </div>
        <div class="page-head">
          <div><h1>${esc(t.nombre)}</h1><p>C.C. ${esc(t.identificacion)}${t.cargo?' · '+esc(t.cargo):''}${t.area?' · '+esc(t.area):''} · ${esc(DOTACION.contratos.find(c=>c.id===t.contrato_id)?.nombre||'—')}</p></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            ${MIPERFIL.esAdmin?`<button class="btn btn-ghost" id="btnEditarTrab">${I.pen} Editar datos</button>`:''}
            ${listaEntregas.length?`<button class="btn btn-ghost" id="btnKardex">${I.pdf} Imprimir kárdex</button>`:''}
            ${puedeEscribir()?`<button class="btn btn-primary" id="btnNuevaEntregaFicha">${I.plus} Registrar entrega</button>`:''}
          </div>
        </div>
        <div class="sec-bar"><h2>Historial de entregas</h2><span class="muted-sm">${listaEntregas.length} registrada(s)</span></div>
        ${listaEntregas.length?`<div class="table-wrap"><table class="dt"><thead><tr><th>Fecha</th><th>Ítems entregados</th><th>Responsable</th><th>Acciones</th></tr></thead><tbody>${filas}</tbody></table></div>`
          :`<div class="empty"><div class="ic">${I.box}</div><h3>Sin entregas todavía</h3><p>Registra la primera entrega de EPP para este trabajador.</p></div>`}
      </div>`;
    wireLogout();
    document.getElementById('btnVolverDot').onclick = ()=> location.hash="#/dotacion";
    const bet = document.getElementById('btnEditarTrab'); if(bet) bet.onclick = ()=> abrirTrabajadorForm(t.id);
    const bk = document.getElementById('btnKardex'); if(bk) bk.onclick = ()=> generarKardexPDF(t.id);
    const bnef = document.getElementById('btnNuevaEntregaFicha'); if(bnef) bnef.onclick = ()=> abrirNuevaEntrega(t.id);
  } finally { desbloquear(); }
}

function eliminarEntrega(entregaId, trabajadorId){
  openModal(`<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>Eliminar entrega</h2><p>Esta acción no se puede deshacer.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body"><p style="font-size:14.5px;color:var(--ink-2)">Se eliminará este registro de entrega junto con sus firmas. Úsalo solo si fue un error (ej. se registró a la persona equivocada).</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confDelEnt">${I.trash} Sí, eliminar</button></div></div>`);
  document.getElementById("confDelEnt").onclick = async ()=>{
    const btn=document.getElementById("confDelEnt"); btn.disabled=true; btn.innerHTML="Eliminando…";

/* ---------- Editar una entrega ya registrada (fecha/ítems/responsable/observaciones).
   La firma y la foto NO se pueden modificar aquí — son evidencia de lo que se firmó. ---------- */
let editarEntregaDraft = null;
async function abrirEditarEntrega(entregaId, trabajadorId){
  bloquear("Cargando…");
  let entrega, items;
  try{
    const { data:e } = await sb.from("dot_entregas").select("id,fecha,responsable_nombre,responsable_cargo,observaciones").eq("id",entregaId).maybeSingle();
    const { data:it } = await sb.from("dot_entrega_items").select("id,nombre_item,cantidad,talla").eq("entrega_id",entregaId);
    entrega = e; items = it||[];
  } finally { desbloquear(); }
  if(!entrega){ toast("Entrega no encontrada","err"); return; }
  editarEntregaDraft = {
    id: entrega.id, trabajadorId,
    fecha: entrega.fecha,
    responsableNombre: entrega.responsable_nombre || '',
    responsableCargo: entrega.responsable_cargo || '',
    observaciones: entrega.observaciones || '',
    items: items.length ? items.map(it=>({ nombreItem: it.nombre_item, cantidad: it.cantidad, talla: it.talla||'' })) : [{ nombreItem:'', cantidad:1, talla:'' }]
  };
  renderFormEditarEntrega();
}

function renderEeItemsList(){

    <div class="item-row" data-i="${i}">

      <input data-f="cantidad" type="number" min="1" step="1" value="${it.cantidad}" placeholder="Cant.">
      <input data-f="talla" value="${esc(it.talla||'')}" placeholder="Talla (opc.)">
      <button class="icon-btn danger" data-del="${i}" title="Quitar" ${editarEntregaDraft.items.length<=1?'disabled':''}>${I.trash}</button>
    </div>`).join('');
  host.querySelectorAll('input[data-f]').forEach(el=>{
    el.oninput = ()=>{
      const i = +el.closest('.item-row').dataset.i;
      const val = el.dataset.f==='cantidad' ? (+el.value||0) : el.value;
      editarEntregaDraft.items[i][el.dataset.f] = val;
    };
  });
  host.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{ if(editarEntregaDraft.items.length<=1) return; editarEntregaDraft.items.splice(+b.dataset.del,1); renderEeItemsList(); };
  });
}

async function guardarEdicionEntrega(){
  const fecha = document.getElementById('eeFecha').value;
  const responsableNombre = document.getElementById('eeRespNombre').value.trim();
  const responsableCargo = document.getElementById('eeRespCargo').value.trim();
  const observaciones = document.getElementById('eeObs').value.trim();

  const btn = document.getElementById('btnEeGuardar'); btn.disabled=true; btn.innerHTML="Guardando…";

  try{
    const { error:e1 } = await sb.from("dot_entregas").update({
      fecha, responsable_nombre: responsableNombre||null, responsable_cargo: responsableCargo||null, observaciones: observaciones||null
    }).eq("id", editarEntregaDraft.id);

    await sb.from("dot_entrega_items").delete().eq("entrega_id", editarEntregaDraft.id);
    const { error:e2 } = await sb.from("dot_entrega_items").insert(validos.map(it=>({ entrega_id: editarEntregaDraft.id, nombre_item: it.nombreItem, cantidad: it.cantidad, talla: it.talla||null })));

}

async function confirmarEntregaDotPublica(){
  const err = document.getElementById('epError'); err.textContent = '';
  const items = [];
  dotPublicoState.catalogo.forEach(c=>{
    const chk = document.querySelector(`[data-epinc="${c.id}"]`);
    if(chk && chk.checked){
      const cant = +document.querySelector(`[data-epcant="${c.id}"]`).value || 0;

  const btn = document.getElementById('epConfirmarBtn'); btn.disabled=true; btn.innerHTML='Guardando…';
  const firma = sigPad.dataURL();
  const observaciones = document.getElementById('epObs').value.trim();
  const { data, error } = await sb.rpc('dot_publico_registrar', {
    p_contrato_id: dotPublicoState.contratoId,
    p_trabajador_id: dotPublicoState.trabajador.id,

  });

    err.textContent = (error && error.message) ? error.message : 'No se pudo registrar la entrega. Intenta de nuevo.';

/* Dimensiones naturales (px) de una imagen data-URL, para no distorsionar su proporción al estamparla en el PDF */
function getImageSize(dataUrl){
  return new Promise(res=>{
    if(!dataUrl){ res(null); return; }
    const img = new Image();
    img.onload = ()=> res({ w:img.naturalWidth, h:img.naturalHeight });
    img.onerror = ()=> res(null);
    img.src = dataUrl;
  });
}

/* ---------- Kárdex acumulado en PDF (evidencia por si hay un reclamo) ---------- */
/* Arma el PDF del kárdex de UN trabajador. Devuelve {doc, nombreBase} o null si no tiene entregas.
   No guarda el archivo — lo reutilizan tanto la descarga individual como el ZIP masivo. */
async function construirKardexPDF(trabajadorId){
  const { data: t } = await sb.from("dot_trabajadores").select("id,nombre,identificacion,cargo,area,contrato_id").eq("id",trabajadorId).maybeSingle();
  if(!t) return null;
  const { data: entregas } = await sb.from("dot_entregas")
    .select("id,fecha,responsable_nombre,responsable_cargo,firma_trabajador,firma_responsable,foto_trabajador,creado_en,via,ip_address,dispositivo_ua")
    .eq("trabajador_id", trabajadorId).order("fecha",{ascending:true});
  const listaEntregas = entregas || [];
  if(!listaEntregas.length) return null;
  const ids = listaEntregas.map(e=>e.id);
  const { data: items } = await sb.from("dot_entrega_items").select("entrega_id,nombre_item,cantidad,talla").in("entrega_id", ids);
  const itemsPorEntrega = {};
  (items||[]).forEach(it=>{ (itemsPorEntrega[it.entrega_id] = itemsPorEntrega[it.entrega_id]||[]).push(it); });
  const nombreContrato = (DOTACION.contratos.find(c=>c.id===t.contrato_id)||{}).nombre || "";

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const PW = 210, M = 10, RIGHT = PW - M;
  const x0=M, x1=M+18, x2=M+78, x2f=M+104, x3=M+139, x4=RIGHT; // Fecha 18 / Ítems 60 / Foto 26 / Firma trab. 35 / Firma resp. 51

  function grayHead(y,h){ doc.setFillColor(238,241,248); doc.rect(M,y,RIGHT-M,h,"F"); }

  function encabezado(){
    let y=M;
    const hH=24, logoW=44;
    doc.setDrawColor(150,160,190); doc.setLineWidth(0.3); doc.rect(M,y,RIGHT-M,hH);
    doc.line(M+logoW,y,M+logoW,y+hH);
    try{ doc.addImage(LOGO,"JPEG",M+4,y+2,36,36*315/570); }catch(e){}
    doc.setTextColor(20,33,90); doc.setFont("helvetica","bold"); doc.setFontSize(14);
    doc.text("CONTROL DE ENTREGA DE EPP", M+logoW+(RIGHT-M-logoW)/2, y+13, {align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(90,90,110);
    doc.text(pdfTexto("Kárdex acumulado por trabajador"+(nombreContrato?" · "+nombreContrato:"")+" · Don Aseo Ltda."), M+logoW+(RIGHT-M-logoW)/2, y+19, {align:"center"});
    y += hH;

    const fh=16;
    doc.setDrawColor(150,160,190); doc.rect(M,y,RIGHT-M,fh);
    doc.line(M+95,y,M+95,y+fh);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(90,90,110);
    doc.text("TRABAJADOR", M+3, y+5);
    doc.text("CARGO / ÁREA", M+98, y+5);
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
    doc.text(pdfTexto(t.nombre||""), M+3, y+11);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(60,60,70);
    doc.text("C.C. "+(t.identificacion||""), M+3, y+15.5);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(20,20,20);
    doc.text(doc.splitTextToSize(pdfTexto((t.cargo||"—")+(t.area?(" · "+t.area):"")), RIGHT-M-100), M+98, y+11);
    y += fh + 2;
    return y;
  }

  function tablaHead(y){
    const h=8;
    grayHead(y,h);
    doc.setDrawColor(150,160,190);
    [x0,x1,x2,x2f,x3,x4].forEach(x=>doc.line(x,y,x,y+h));
    doc.rect(M,y,RIGHT-M,h);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(40,40,60);
    const ct=(a,b,txt)=>doc.text(txt,(a+b)/2,y+5.2,{align:"center"});
    ct(x0,x1,"FECHA"); ct(x1,x2,"ÍTEMS ENTREGADOS");
    ct(x2,x2f,"FOTO"); ct(x2f,x3,"FIRMA TRABAJADOR"); ct(x3,x4,"FIRMA RESPONSABLE");
    return y+h;
  }

  const FOOTER_Y = 290;
  function piePagina(pag){
    doc.setFontSize(6.6); doc.setTextColor(140,140,160);
    doc.text("Este documento constituye evidencia de la entrega de EPP, firmada digitalmente por el trabajador y el responsable.", PW/2, FOOTER_Y, {align:"center"});
    doc.text("Generado el "+fmtDateTime(new Date())+" · Don Aseo Ltda. · Pág. "+pag, PW/2, FOOTER_Y+4, {align:"center"});
  }

  const FOOTER_TOP = 278;
  const colFotoW = x2f-x2-4;
  let y = encabezado();
  y = tablaHead(y);
  let pag = 1;
  for(const e of listaEntregas){
    const its = itemsPorEntrega[e.id]||[];
    const lineas = its.length ? its.map(it=>"• "+it.nombre_item+" × "+it.cantidad+(it.talla?" ("+it.talla+")":"")) : ["—"];
    const wrapped = doc.splitTextToSize(pdfTexto(lineas.join("\n")), x2-x1-4);
    let rowH = Math.max(e.via==='remoto' ? 22 : 16, wrapped.length*3.6 + 5);
    // Si hay foto, la fila crece para respetar su proporción original (nunca se estira/deforma la foto)
    let fotoH = 0;
    const dims = e.foto_trabajador ? await getImageSize(e.foto_trabajador) : null;
    if(dims && dims.w>0){ fotoH = Math.min(90, colFotoW * (dims.h/dims.w)); rowH = Math.max(rowH, fotoH+4); }
    if(y + rowH > FOOTER_TOP){
      piePagina(pag);
      doc.addPage(); pag++;
      y = M+2; y = tablaHead(y);
    }
    doc.setDrawColor(180,188,210);
    [x0,x1,x2,x2f,x3,x4].forEach(x=>doc.line(x,y,x,y+rowH));
    doc.line(M,y+rowH,RIGHT,y+rowH);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(20,20,20);
    doc.text(fmtDate(e.fecha), (x0+x1)/2, y+rowH/2-0.5, {align:"center"});
    let yAudit = y+rowH/2+4;
    if(e.creado_en){
      const horaFirma = new Date(e.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'});
      doc.setFontSize(6.5); doc.setTextColor(120,120,140);
      doc.text(horaFirma, (x0+x1)/2, yAudit, {align:"center"});
      yAudit += 3;
    }
    if(e.via==='remoto'){
      doc.setFontSize(5.3); doc.setTextColor(150,150,170);
      if(e.ip_address){ doc.text("IP "+e.ip_address, (x0+x1)/2, yAudit, {align:"center"}); yAudit += 2.6; }
      const disp = resumenDispositivoUA(e.dispositivo_ua);
      if(disp) doc.text(disp, (x0+x1)/2, yAudit, {align:"center"});
    }
    doc.setFontSize(7.4); doc.setTextColor(20,20,20);
    doc.text(wrapped, x1+2, y+5);
    if(e.foto_trabajador){
      try{
        if(dims && dims.w>0) doc.addImage(e.foto_trabajador,"JPEG",x2+2,y+2,colFotoW,fotoH);
        else doc.addImage(e.foto_trabajador,"JPEG",x2+2,y+2,colFotoW,rowH-4); // sin dimensiones (raro): antiguo comportamiento de respaldo
      }catch(err){}
    }
    if(e.firma_trabajador){ try{ doc.addImage(e.firma_trabajador,"PNG",x2f+3,y+2,x3-x2f-6,rowH-4); }catch(err){} }
    if(e.firma_responsable){ try{ doc.addImage(e.firma_responsable,"PNG",x3+3,y+2,x4-x3-6,rowH-4); }catch(err){} }
    else if(e.via==='remoto'){
      doc.setFont("helvetica","italic"); doc.setFontSize(7.5); doc.setTextColor(130,130,150);
      doc.text("Firmado remotamente", (x3+x4)/2, y+rowH/2, {align:"center"});
      doc.setFont("helvetica","normal");
    }
    doc.setFontSize(6); doc.setTextColor(120,120,140);
    if(e.responsable_nombre) doc.text(pdfTexto(e.responsable_nombre), x3+3, y+rowH-1.5);
    y += rowH;
  }
  piePagina(pag);

  const safe = (t.nombre||"trabajador").replace(/[^\w\sáéíóúñ-]/gi,"").trim().replace(/\s+/g,"_").slice(0,40);
  return { doc, nombreBase: safe };
}

async function generarKardexPDF(trabajadorId){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  bloquear("Generando PDF…");
  try{
    const r = await construirKardexPDF(trabajadorId);
    if(!r){ toast("Este trabajador no tiene entregas registradas","err"); return; }
    r.doc.save("Kardex_dotacion_"+r.nombreBase+".pdf");
    toast("PDF generado","ok");
  }catch(e){ console.error(e); toast("No se pudo generar el PDF: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

async function descargarZipKardexSeleccion(contratoIds){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  if(!window.JSZip){ toast("No se pudo cargar el compresor ZIP (revisa tu conexión)","err"); return; }
  const idsSet = new Set(contratoIds);
  const candidatos = DOTACION.trabajadores.filter(t=>idsSet.has(t.contrato_id));
  const idsConEntrega = new Set(DOTACION.entregas.map(e=>e.trabajador_id));
  const lista = candidatos.filter(t=>idsConEntrega.has(t.id));
  if(!candidatos.length){ toast("No hay trabajadores para exportar","err"); return; }
  if(!lista.length){ toast("Ninguno de los trabajadores elegidos tiene entregas registradas todavía","err"); return; }
  bloquear("Preparando ZIP…");
  try{
    const zip = new JSZip();
    const usados = {};
    let incluidos = 0, sinEntregas = candidatos.length - lista.length;
    for(let i=0;i<lista.length;i++){
      const t = lista[i];
      bloquearMsg(`Generando kárdex ${i+1} de ${lista.length}…`);
      try{
        const r = await construirKardexPDF(t.id);
        if(!r){ sinEntregas++; continue; }
        let base = r.nombreBase || ('trabajador_'+(i+1));
        if(usados[base]!=null){ usados[base]++; base = base+'_'+usados[base]; } else usados[base]=0;
        zip.file(base+'.pdf', r.doc.output('arraybuffer'));
        incluidos++;
      }catch(e){ console.warn('kardex zip', t.id, e); }
    }
    if(!incluidos){ toast("Ningún trabajador tiene entregas registradas todavía","err"); return; }
    bloquearMsg("Comprimiendo ZIP…");
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
    const url = URL.createObjectURL(blob);
    const nombreContrato = contratoIds.length===DOTACION.contratos.length ? 'todos_los_contratos' : (contratoIds.length===1 ? (DOTACION.contratos.find(c=>c.id===contratoIds[0])?.nombre||'contrato') : contratoIds.length+'_contratos');
    const safeContrato = String(nombreContrato).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,40);
    const a = document.createElement('a'); a.href=url;
    a.download = 'Kardex_dotacion_'+safeContrato+'.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 6000);
    let msg = `ZIP generado con ${incluidos} kárdex`;
    if(sinEntregas) msg += ` (${sinEntregas} trabajador(es) sin entregas, omitido(s))`;
    toast(msg,"ok");
  }catch(e){ console.error(e); toast("No se pudo generar el ZIP: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* Excel de entregas de EPP: una fila por entrega (nombre/identificación/cargo/área + fecha/ítems/responsable).
   Los trabajadores sin ninguna entrega también aparecen, con esas columnas en blanco (para detectar
   quién todavía no ha recibido nada). Se consultan fecha/ítems/responsable frescos porque el estado
   precargado (DOTACION.entregas/entregaItems) no trae responsable_nombre ni talla. */
async function descargarExcelDotSeleccion(contratoIds){
  if(!window.XLSX){ toast("No se pudo cargar el generador de Excel (revisa tu conexión)","err"); return; }
  const idsSet = new Set(contratoIds);
  const trabajadores = DOTACION.trabajadores.filter(t=>idsSet.has(t.contrato_id));
  if(!trabajadores.length){ toast("No hay trabajadores para exportar","err"); return; }
  bloquear("Generando Excel…");
  try{
    const idsTrab = trabajadores.map(t=>t.id);
    const { data: entregas, error: e1 } = await sb.from("dot_entregas")
      .select("id,trabajador_id,fecha,responsable_nombre,via").in("trabajador_id", idsTrab).order("fecha",{ascending:true});
    if(e1){ toast("No se pudo cargar: "+e1.message,"err"); return; }
    const idsEnt = (entregas||[]).map(e=>e.id);
    const { data: items, error: e2 } = idsEnt.length
      ? await sb.from("dot_entrega_items").select("entrega_id,nombre_item,cantidad,talla").in("entrega_id", idsEnt)
      : { data: [] };
    if(e2){ toast("No se pudo cargar: "+e2.message,"err"); return; }
    const itemsPorEntrega = {};
    (items||[]).forEach(it=>{ (itemsPorEntrega[it.entrega_id]=itemsPorEntrega[it.entrega_id]||[]).push(it); });
    const entregasPorTrab = {};
    (entregas||[]).forEach(e=>{ (entregasPorTrab[e.trabajador_id]=entregasPorTrab[e.trabajador_id]||[]).push(e); });

    const filas = [];
    trabajadores.forEach(t=>{
      const nombreContrato = (DOTACION.contratos.find(c=>c.id===t.contrato_id)||{}).nombre || '';
      const entregasT = entregasPorTrab[t.id] || [];
      if(!entregasT.length){
        filas.push({ Contrato:nombreContrato, 'Nombre completo':t.nombre, 'Identificación':t.identificacion, Cargo:t.cargo||'', 'Área':t.area||'', 'Fecha de entrega':'', 'Ítems entregados':'', Responsable:'' });
      } else {
        entregasT.forEach(e=>{
          const its = (itemsPorEntrega[e.id]||[]).map(it=>it.nombre_item+' × '+it.cantidad+(it.talla?' ('+it.talla+')':'')).join(', ');
          filas.push({
            Contrato: nombreContrato, 'Nombre completo': t.nombre, 'Identificación': t.identificacion,
            Cargo: t.cargo||'', 'Área': t.area||'',
            'Fecha de entrega': fmtDate(e.fecha), 'Ítems entregados': its || '—',
            Responsable: e.responsable_nombre || (e.via==='remoto' ? '(entrega remota)' : '')
          });
        });
      }
    });
    const ws = XLSX.utils.json_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'EPP');
    const nombreArchivo = contratoIds.length===DOTACION.contratos.length ? 'todos_los_contratos' : (contratoIds.length===1 ? (DOTACION.contratos.find(c=>c.id===contratoIds[0])?.nombre||'contrato') : contratoIds.length+'_contratos');
    const safe = String(nombreArchivo).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,40);
    XLSX.writeFile(wb, 'Entregas_EPP_'+safe+'.xlsx');
    toast("Excel generado","ok");
  }catch(e){ console.error(e); toast("No se pudo generar el Excel: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* ============================================================
   MÓDULO DOTACIÓN · Elementos de dotación legal (2 pantalones,
   2 camisas, 1 par de botas + adicional libre). Directorio propio
   de entidades/trabajadores, SEPARADO del módulo EPP. Dos vías:
   presencial (supervisor logueado) y remota (enlace único para
   toda la empresa, por cédula, sin login).
   ============================================================ */
let DTL = { entidades: [], trabajadores: [], entregas: [], predeterminados: [] };
let dtlQuery = "";

/* Filtro de la grilla de trabajadores — "todas" muestra a todos los que la cuenta pueda ver
   (RLS ya limita a las entidades con acceso), sin necesidad de elegir una entidad primero. */
let dtlFiltroEntidad = localStorage.getItem('dtl_filtro_entidad') || 'todas';
/* Selección múltiple para marcar inactivos / eliminar en bloque (solo admin) */
let dtlMostrarInactivos = false;

async function loadDtlState(){
  const [en, t, e] = await Promise.all([
    sb.from("dtl_entidades").select("id,nombre,activo,creado_en").order("creado_en",{ascending:true}),
    sb.from("dtl_trabajadores").select("id,nombre,identificacion,cargo,area,entidad_id,fecha_ingreso,correo,activo,inactivo_por_archivo,creado_en").order("nombre",{ascending:true}),
    sb.from("dtl_entregas").select("id,trabajador_id,fecha").order("fecha",{ascending:false})
  ]);
  const err = en.error || t.error || e.error;
  if(err){ console.warn(err); toast("Error cargando Dotación: "+err.message,"err"); }
  DTL.entidades = en.data || [];
  DTL.trabajadores = t.data || [];
  DTL.entregas = e.data || [];
  // Si el filtro guardado ya no corresponde a una entidad que exista/tengas acceso, vuelve a "todas"
  if(dtlFiltroEntidad!=='todas' && !DTL.entidades.some(x=>x.id===dtlFiltroEntidad)){
    dtlFiltroEntidad = 'todas';
    localStorage.setItem('dtl_filtro_entidad', 'todas');
  }
}

function nombreEntidadDtl(id){ const x = DTL.entidades.find(e=>e.id===id); return x ? x.nombre : '—'; }
/* Trabajadores visibles en la grilla según el filtro ("todas" = todos los accesibles) */
function trabajadoresDeEntidad(){
  return dtlFiltroEntidad==='todas' ? DTL.trabajadores : DTL.trabajadores.filter(t=>t.entidad_id===dtlFiltroEntidad);
}
function entregasDeEntidad(){
  const ids = new Set(trabajadoresDeEntidad().map(t=>t.id));
  return DTL.entregas.filter(e=>ids.has(e.trabajador_id));
}
/* Predeterminados de UNA entidad específica, cargados bajo demanda (ya no hay una sola
   "entidad actual" global — cada acción resuelve la entidad que le corresponde) */
async function cargarPredeterminadosDtl(entidadId){
  if(!entidadId) return [];
  const { data, error } = await sb.from("dtl_predeterminados").select("id,nombre,responsable_nombre,responsable_cargo,firma").eq("entidad_id", entidadId).order("creado_en",{ascending:true});
  if(error){ console.warn(error); return []; }
  return data || [];
}

/* Lista actualmente visible (entidad + búsqueda + filtro de inactivos) — la usan tanto
   la grilla como la casilla "Todos". */
function trabajadoresFiltradosDtl(){
  let db = trabajadoresDeEntidad();
  if(!dtlMostrarInactivos) db = db.filter(t=>t.activo!==false);
  const q = dtlQuery.trim().toLowerCase();
  if(q) db = db.filter(t=>
    (t.nombre||"").toLowerCase().includes(q) ||
    (t.identificacion||"").toLowerCase().includes(q) ||
    (t.cargo||"").toLowerCase().includes(q) ||
    (t.area||"").toLowerCase().includes(q)
  );
  return db;
}

function actualizarContadorSeleccionDtl(){
  const el = document.getElementById('contadorSeleccionDtl');
  if(el) el.textContent = seleccionadosDtl.size+' seleccionado(s)';
}

/* Se llama cada vez que cambia la selección: muestra/oculta la barra de acciones en
   bloque y sincroniza la casilla "Todos" sin recargar toda la grilla. */
function actualizarBarraSeleccionDtl(){
  const barra = document.getElementById('barraSeleccionDtl');
  if(barra) barra.style.display = seleccionadosDtl.size ? 'flex' : 'none';
  actualizarContadorSeleccionDtl();
  const chkTodos = document.getElementById('chkTodosDtl');
  if(chkTodos){
    const visibles = trabajadoresFiltradosDtl();
    chkTodos.checked = visibles.length>0 && visibles.every(t=>seleccionadosDtl.has(t.id));
  }
}

function renderDtlGrid(){
  const host = document.getElementById("dtlGrid");
  if(!host) return;
  const db = trabajadoresFiltradosDtl();
  if(!db.length){
    host.innerHTML = `<div class="empty"><div class="ic">${I.box}</div><h3>${trabajadoresDeEntidad().length?'Sin resultados':'Sin trabajadores todavía'}</h3>
      <p>${trabajadoresDeEntidad().length?'Prueba con otro término de búsqueda, o marca "Mostrar inactivos".':'Agrega trabajadores uno por uno o con carga masiva desde Excel.'}</p></div>`;
    actualizarBarraSeleccionDtl();
    return;
  }
  host.innerHTML = `<div class="grid">${db.map(trabajadorDtlCard).join("")}</div>`;
  host.querySelectorAll("[data-sel-trabdtl]").forEach(chk=>{
    chk.onchange = ()=>{
      const id = chk.dataset.selTrabdtl;
      if(chk.checked) seleccionadosDtl.add(id); else seleccionadosDtl.delete(id);
      actualizarBarraSeleccionDtl();
    };
  });
  host.querySelectorAll("[data-trabdtl]").forEach(b=>{
    b.onclick = ()=>{
      const id=b.dataset.id, act=b.dataset.trabdtl;
      if(act==="ver") location.hash = "#/dotacionlegal/trabajador/"+id;
      else if(act==="kardex") generarKardexDtlPDF(id);
      else if(act==="entregar") abrirNuevaEntregaDtl(id);
      else if(act==="editar") abrirTrabajadorDtlForm(id);
      else if(act==="del") eliminarTrabajadorDtl(id);
    };
  });
  actualizarBarraSeleccionDtl();
}

  if(!seleccionadosDtl.size){ toast("Selecciona al menos un trabajador","err"); return; }
  const ids = Array.from(seleccionadosDtl);
  bloquear("Reactivando…");

}

/* Igual que borrarContratosVaciosDot pero para Dotación (dtl_entidades). */
async function borrarContratosVaciosDtl(entidadIdsTocadas){
  const ids = [...new Set(entidadIdsTocadas)].filter(Boolean);
  if(!ids.length) return;
  const { data: restantes } = await sb.from("dtl_trabajadores").select("entidad_id").in("entidad_id", ids);
  const conGente = new Set((restantes||[]).map(r=>r.entidad_id));
  const vacias = ids.filter(eid=>!conGente.has(eid));
  if(!vacias.length) return;
  const nombres = vacias.map(eid=>DTL.entidades.find(x=>x.id===eid)?.nombre).filter(Boolean);
  const { error } = await sb.from("dtl_entidades").delete().in("id", vacias);
  if(error){ console.warn(error); toast("No se pudo borrar el contrato que quedó vacío: "+error.message,"err"); return; }
  if(vacias.includes(dtlFiltroEntidad)){ dtlFiltroEntidad='todas'; localStorage.setItem('dtl_filtro_entidad','todas'); }
  toast(`${nombres.length===1?`Contrato "${nombres[0]}" eliminado`:nombres.length+' contratos eliminados'} por quedar sin trabajadores`,"ok");
}

async function eliminarSeleccionDtl(){
  if(!seleccionadosDtl.size){ toast("Selecciona al menos un trabajador","err"); return; }
  const ids = Array.from(seleccionadosDtl);
  openModal(`<div class="modal" style="max-width:460px">
    <div class="modal-head"><div><h2>Eliminar trabajadores</h2><p>Esta acción no se puede deshacer.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body"><p style="font-size:14.5px;color:var(--ink-2)">Se eliminarán <b>${ids.length}</b> trabajador(es) del directorio junto con <b>todo su historial de entregas y firmas</b>. Si solo quieres dejar de verlos sin perder su historial, usa "Marcar como inactivo" en vez de esto. Si algún contrato queda sin trabajadores, también se elimina.</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confEliminarSeleccionDtl">${I.trash} Sí, eliminar ${ids.length}</button></div></div>`);
  document.getElementById('confEliminarSeleccionDtl').onclick = async ()=>{
    const btn=document.getElementById("confEliminarSeleccionDtl"); btn.disabled=true; btn.innerHTML="Eliminando…";
    bloquear("Eliminando…");
    try{
      const entidadesTocadas = ids.map(id=>DTL.trabajadores.find(t=>t.id===id)?.entidad_id);
      const { error } = await porLotes(ids, lote=> sb.from("dtl_trabajadores").delete().in("id", lote));
      if(error){ toast("No se pudo eliminar: "+error.message,"err"); return; }
      await borrarContratosVaciosDtl(entidadesTocadas);
      await loadDtlState();
      seleccionadosDtl.clear();
      closeModal();
      toast(`${ids.length} trabajador(es) eliminados`,"ok");
      renderDtlAdmin();
    } finally { desbloquear(); }
  };
}

/* "Entregas de hoy" — mismo patrón que abrirEntregasHoyDot (EPP): filtra en memoria
   cuáles son de hoy y solo trae el detalle pesado (hora/responsable/vía) de esas. */
async function abrirEntregasHoyDtl(){
  const hoy = hoyLocal();
  const idsHoy = DTL.entregas.filter(e=>e.fecha===hoy).map(e=>e.id);
  openModal(`<div class="modal" style="max-width:520px">
    <div class="modal-head"><div><h2>Entregas de hoy</h2><p>${fmtDate(hoy)}</p></div>

  </div>`);

  if(!idsHoy.length){ host.innerHTML = `<div class="empty"><div class="ic">${I.box}</div><h3>Sin entregas hoy</h3><p>Todavía no se ha registrado ninguna entrega de dotación hoy.</p></div>`; return; }
  const { data, error } = await sb.from("dtl_entregas").select("id,trabajador_id,creado_en,responsable_nombre,via").in("id", idsHoy).order("creado_en",{ascending:false});

  host.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px">${data.map(e=>{

    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px">
      <div><div style="font-weight:700;font-size:13.5px">${esc(t?.nombre||'—')}${contrato&&contrato!=='—'?` <span class="muted-sm" style="font-weight:600">· ${esc(contrato)}</span>`:''}</div>

      <span class="muted-sm" style="white-space:nowrap">${hora}</span>

/* ---------- Corregir cargos en bloque (mismo concepto que en EPP) ---------- */
function abrirCorregirCargosDtl(){
  const trabs = trabajadoresDeEntidad();
  const porCargo = {};
  trabs.forEach(t=>{
    const k = (t.cargo||'').trim();
    porCargo[k] = (porCargo[k]||0) + 1;
  });
  const lista = Object.keys(porCargo).sort((a,b)=> porCargo[b]-porCargo[a]);
  openModal(`<div class="modal" style="max-width:520px">
    <div class="modal-head"><div><h2>Corregir cargos</h2><p>Renombra un cargo y se corrige de una vez en todos los trabajadores que lo tengan escrito igual.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      ${lista.length ? lista.map(c=>`
        <div class="cat-row">
          <span style="flex:1;font-weight:600;font-size:13.5px">${c?esc(c):'<span class="muted-sm">(sin cargo)</span>'} <span class="muted-sm">— ${porCargo[c]} trabajador${porCargo[c]===1?'':'es'}</span></span>
          <button class="icon-btn" title="Renombrar" data-cargo-edit="${esc(c)}">${I.pen}</button>
        </div>`).join('') : '<p class="muted-sm">No hay trabajadores en este contrato.</p>'}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>
  </div>`);
  document.querySelectorAll('[data-cargo-edit]').forEach(b=>{
    const cargoActual = b.dataset.cargoEdit;
    b.onclick = ()=> abrirRenombrarCargoDtl(cargoActual, porCargo[cargoActual]);
  });
}
function abrirRenombrarCargoDtl(cargoActual, cantidad){
  openSubModal(`<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>Renombrar cargo</h2><p>Se corregirá en ${cantidad} trabajador${cantidad===1?'':'es'}.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Texto correcto *</label><input id="cargoNuevoDtl" value="${esc(cargoActual)}" placeholder="Cargo"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarCargoDtl">${I.check} Corregir</button>
    </div></div>`, ()=> abrirCorregirCargosDtl());
  document.getElementById('btnGuardarCargoDtl').onclick = async ()=>{
    const nuevo = document.getElementById('cargoNuevoDtl').value.trim();
    if(!nuevo){ toast("Escribe el texto correcto","err"); return; }
    if(nuevo === cargoActual){ toast("No cambiaste nada","err"); return; }
    const btn = document.getElementById('btnGuardarCargoDtl'); btn.disabled=true; btn.innerHTML="Corrigiendo…";
    bloquear("Corrigiendo cargo…");
    try{
      const ids = trabajadoresDeEntidad().filter(t=>(t.cargo||'').trim()===cargoActual).map(t=>t.id);
      const { error } = await porLotes(ids, lote=> sb.from("dtl_trabajadores").update({ cargo: nuevo }).in("id", lote));
      if(error){ toast("No se pudo corregir: "+error.message,"err"); return; }
      await loadDtlState();
      toast(`Cargo corregido en ${ids.length} trabajador(es)`,"ok");
      closeModal();
      renderDtlGrid();

}

function abrirGestionEntidadesDtl(){
  openModal(`<div class="modal" style="max-width:480px">

      <div id="entidadesLista"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>
  </div>`);
  document.getElementById('btnNuevaEntidad').onclick = ()=> abrirFormEntidadDtl(null);
  renderEntidadesDtlLista();
}
function renderEntidadesDtlLista(){
  const host = document.getElementById('entidadesLista'); if(!host) return;
  host.innerHTML = DTL.entidades.map(x=>`
    <div class="cat-row">
      <span style="flex:1;font-weight:600;font-size:13.5px;${x.activo?'':'opacity:.45'}">${esc(x.nombre)}${x.activo?'':' (archivado)'}</span>
      <button class="icon-btn" title="Renombrar" data-ent-edit="${x.id}">${I.pen}</button>
      <button class="icon-btn ${x.activo?'danger':''}" title="${x.activo?'Archivar':'Reactivar'}" data-ent-toggle="${x.id}">${x.activo?I.lock:I.check}</button>
    </div>`).join('') || '<p class="muted-sm">Sin contratos todavía.</p>';
  host.querySelectorAll('[data-ent-edit]').forEach(b=>{ b.onclick = ()=> abrirFormEntidadDtl(b.dataset.entEdit); });
  host.querySelectorAll('[data-ent-toggle]').forEach(b=>{
    b.onclick = async ()=>{
      const x = DTL.entidades.find(e=>e.id===b.dataset.entToggle);
      const archivando = x.activo;
      const { error } = await sb.from("dtl_entidades").update({ activo: !x.activo }).eq("id", x.id);
      if(error){ toast("No se pudo actualizar: "+error.message,"err"); return; }
      let nTocados = 0;
      if(archivando){
        // Al archivar un contrato, sus trabajadores dejan de tener sentido en la vista
        // normal — se marcan inactivos igual que si el admin los hubiera seleccionado
        // uno por uno (se conserva todo su historial de entregas y firmas). Se marcan
        // con inactivo_por_archivo:true para poder reactivar EXACTAMENTE a estos (y no a
        // alguien que ya estaba inactivo por otra razón desde antes de archivar).
        const idsTrab = DTL.trabajadores.filter(t=>t.entidad_id===x.id && t.activo!==false).map(t=>t.id);
        nTocados = idsTrab.length;
        if(nTocados){
          const { error: e2 } = await porLotes(idsTrab, lote=> sb.from("dtl_trabajadores").update({activo:false, inactivo_por_archivo:true}).in("id", lote));
          if(e2){ toast("Contrato archivado, pero no se pudo marcar a los trabajadores como inactivos: "+e2.message,"err"); }
        }
      } else {
        // Al reactivar, solo se reactivan los que quedaron inactivos POR archivar este
        // contrato — no a quien ya estaba inactivo antes por otro motivo.
        const idsTrab = DTL.trabajadores.filter(t=>t.entidad_id===x.id && t.inactivo_por_archivo).map(t=>t.id);
        nTocados = idsTrab.length;
        if(nTocados){
          const { error: e2 } = await porLotes(idsTrab, lote=> sb.from("dtl_trabajadores").update({activo:true, inactivo_por_archivo:false}).in("id", lote));
          if(e2){ toast("Contrato reactivado, pero no se pudo reactivar a sus trabajadores: "+e2.message,"err"); }
        }
      }
      await loadDtlState(); renderEntidadesDtlLista();
      toast(archivando
        ?`Contrato archivado${nTocados?` — ${nTocados} trabajador(es) marcados como inactivos`:''}`
        :`Contrato reactivado${nTocados?` — ${nTocados} trabajador(es) reactivados`:''}`,"ok");
    };
  });
}
/* comoRaiz=true: igual que en abrirFormContrato — se abre sin modal "padre" al que
   volver (ej. desde "Crea tu primer contrato"), así la X/Cancelar cierra de una. */
function abrirFormEntidadDtl(id, alGuardar, comoRaiz){
  const x = id ? DTL.entidades.find(e=>e.id===id) : null;
  const html = `<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>${x?'Renombrar contrato':'Nuevo contrato'}</h2><p>Ej. "Sede Bogotá", "Hospital San Rafael"…</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Nombre *</label><input id="entNombre" value="${esc(x?.nombre||'')}" placeholder="Nombre del contrato"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarEntidad">${I.check} Guardar</button>
    </div></div>`;
  if(comoRaiz) openModal(html); else openSubModal(html, ()=> alGuardar ? alGuardar() : abrirGestionEntidadesDtl());
  document.getElementById('btnGuardarEntidad').onclick = async ()=>{
    const nombre = document.getElementById('entNombre').value.trim();
    if(!nombre){ toast("Ponle un nombre","err"); return; }
    const btn = document.getElementById('btnGuardarEntidad'); btn.disabled=true; btn.innerHTML="Guardando…";
    const { error } = x
      ? await sb.from("dtl_entidades").update({ nombre }).eq("id", x.id)
      : await sb.from("dtl_entidades").insert({ nombre });
    if(error){ btn.disabled=false; btn.innerHTML=`${I.check} Guardar`; toast("No se pudo guardar: "+error.message,"err"); return; }
    await loadDtlState();
    toast(x?"Contrato actualizado":"Contrato creado","ok");
    closeModal();
    if(comoRaiz && alGuardar) alGuardar();
  };
}

/* Intenta interpretar una fecha de Excel en varios formatos comunes → YYYY-MM-DD, o null si no se pudo */
/* Solo acepta AAAA-MM-DD o DD/MM/AAAA con año de EXACTAMENTE 4 dígitos (1900-2100) — si no calza,
   devuelve null en vez de arriesgar una interpretación rara de new Date() (ej. un año mal tecleado
   como "20255" en vez de "2025" podía producir una fecha absurda que rompía TODA la carga). */
function parseFechaExcelDtl(v){
  const s = String(v||"").trim();
  if(!s) return null;
  let anio, mes, dia;
  const mIso = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(mIso){ anio=+mIso[1]; mes=+mIso[2]; dia=+mIso[3]; }
  else {
    const mDmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(!mDmy) return null;
    dia=+mDmy[1]; mes=+mDmy[2]; anio=+mDmy[3];
  }
  if(anio<1900 || anio>2100 || mes<1 || mes>12 || dia<1 || dia>31) return null;
  return `${String(anio).padStart(4,'0')}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
}
async function cargarTrabajadoresExcelDtl(file){
  if(!window.XLSX){ toast("No se pudo cargar el lector de Excel (revisa tu conexión)","err"); return; }
  bloquear("Leyendo archivo…");
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
    if(!filas.length){ toast("El archivo está vacío","err"); return; }
    const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
    const head = (filas[0]||[]).map(norm);
    const findCol = (...alts)=> head.findIndex(h => alts.some(a => h.includes(a)));
    let cEnt = findCol("contrato","entidad"), cNom = findCol("nombre"), cCed = findCol("cedula","cédula","identificacion","documento"),
        cFecha = findCol("fecha de ingreso","fecha ingreso","ingreso"), cCargo = findCol("cargo"), cCorreo = findCol("correo","email","e-mail");
    let start = 1;
    if(cNom === -1){ cEnt=0; cNom=1; cCed=2; cFecha=3; cCargo=4; cCorreo=5; start=0; }
    const validos = []; let ignoradas = 0;
    for(let i=start;i<filas.length;i++){
      const r = filas[i]; if(!r) continue;
      const entidadNombre = String(cEnt>=0?r[cEnt]:"").trim();
      const nombre = String(cNom>=0?r[cNom]:"").trim();
      const identificacion = String(cCed>=0?r[cCed]:"").trim();
      if(!entidadNombre || !nombre || !identificacion){ if(r.some(v=>String(v||"").trim())) ignoradas++; continue; }
      validos.push({
        entidadNombre, nombre, identificacion,
        fecha_ingreso: cFecha>=0 ? parseFechaExcelDtl(r[cFecha]) : null,
        cargo: cCargo>=0?(String(r[cCargo]||"").trim()||null):null,
        correo: cCorreo>=0?(String(r[cCorreo]||"").trim()||null):null
      });
    }
    if(!validos.length){ toast("No se encontraron filas válidas (se requiere contrato, nombre y cédula)","err"); return; }

    // Resuelve el nombre del contrato/entidad a un id — si no existe, se crea (requiere ser admin por RLS)
    const keyEnt = s => s.trim().toLowerCase();
    const entidadPorNombre = new Map(DTL.entidades.map(en=>[keyEnt(en.nombre), en.id]));
    let entidadesCreadas = 0;
    for(const it of validos){
      const k = keyEnt(it.entidadNombre);
      if(!entidadPorNombre.has(k)){
        const { data, error } = await sb.from("dtl_entidades").insert({ nombre: it.entidadNombre }).select().single();
        if(error){ toast(`No se pudo crear el contrato "${it.entidadNombre}": `+error.message,"err"); return; }
        entidadPorNombre.set(k, data.id);
        DTL.entidades.push(data);
        entidadesCreadas++;
      }
      it.entidad_id = entidadPorNombre.get(k);
    }

    const keyOf = s => s.trim().toLowerCase();
    const existentes = new Set(DTL.trabajadores.map(t=>keyOf(t.identificacion)));
    const vistos = new Set(); let dup = 0, yaExistian = 0;
    const nuevos = [];
    validos.forEach(it=>{
      const k = keyOf(it.identificacion);
      if(vistos.has(k)){ dup++; return; }
      vistos.add(k);
      if(existentes.has(k)){ yaExistian++; return; }
      nuevos.push({ nombre: it.nombre, identificacion: it.identificacion, cargo: it.cargo, correo: it.correo, fecha_ingreso: it.fecha_ingreso, entidad_id: it.entidad_id });
    });
    if(nuevos.length){
      const { error } = await sb.from("dtl_trabajadores").insert(nuevos);
      if(error){ toast("No se pudo cargar: "+error.message,"err"); return; }
    }
    let msg = `${nuevos.length} trabajador(es) nuevo(s) agregado(s)`;
    if(entidadesCreadas) msg += ` · ${entidadesCreadas} contrato(s) nuevo(s) creado(s)`;
    if(yaExistian) msg += ` · ${yaExistian} ya existían (cédula repetida, sin cambios)`;
    if(ignoradas) msg += ` · ${ignoradas} fila(s) incompleta(s) omitida(s)`;
    if(dup) msg += ` · ${dup} duplicada(s) en el archivo`;
    toast(msg,"ok");
    // renderDtlAdmin (no renderDtlGrid) a propósito: si se cargó desde la pantalla
    // "Crea tu primer contrato" (0 entidades), hay que reconstruir toda la página para
    // que aparezca el panel normal — renderDtlGrid asume que ese panel ya existe.
    await renderDtlAdmin(true);
  }catch(e){ console.error(e); toast("No se pudo leer el archivo: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

        <div><label>Cantidad de pares</label><input type="number" min="0" id="dtlBotasCant" value="${dtlEntregaDraft.botasCantidad}"></div>
        <div><label>Talla *</label><input id="dtlBotasTalla" value="${esc(dtlEntregaDraft.botasTalla)}" placeholder="Ej. 40"></div>
      </div>
      <div class="field"><label>Adicional <span class="opt">(opcional — algo más que se entregue)</span></label><textarea id="dtlAdicional" placeholder="Ej. 1 chaqueta impermeable">${esc(dtlEntregaDraft.adicional)}</textarea></div>

      <div class="field" style="margin-top:14px">
        <label>Responsable que entrega *</label>
        ${DTL.predeterminados.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px" id="predetDtlChips">
          ${DTL.predeterminados.map(p=>`<button type="button" class="chip-predet ${p.id===dtlEntregaDraft.predeterminadoId?'active':''}" data-predetdtl-id="${p.id}" title="${esc(p.nombre)}">${esc(p.nombre)}</button>`).join('')}
        </div>`:''}
      </div>
      <div class="field row2">
        <div><input id="dtlRespNombre" value="${esc(dtlEntregaDraft.responsableNombre)}" placeholder="Nombre del responsable" ${dtlEntregaDraft.predeterminadoId?'readonly':''}></div>
        <div><input id="dtlRespCargo" value="${esc(dtlEntregaDraft.responsableCargo)}" placeholder="Cargo" ${dtlEntregaDraft.predeterminadoId?'readonly':''}></div>
      </div>
      <p class="muted-sm" id="dtlQuienFirma" style="margin-top:-6px"></p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnDtlContinuar">${I.check} Continuar a firmas</button>
    </div>
  </div>`);
  actualizarQuienFirmaDtl();
  wireDtlPredetChips();
  wireIncluirItemDtl('dtlPantalonInc','dtlPantalonFields','dtlPantalonCant',2);
  wireIncluirItemDtl('dtlCamisaInc','dtlCamisaFields','dtlCamisaCant',2);
  wireIncluirItemDtl('dtlBotasInc','dtlBotasFields','dtlBotasCant',1);
  document.getElementById('btnDtlContinuar').onclick = validarYContinuarPasoDtl1;
}

/* Casilla "se entrega este ítem" — marcada por defecto (siempre se suele entregar todo);
   al desmarcarla oculta cantidad/talla y deja la cantidad en 0 (no se entrega esta vez). */
function wireIncluirItemDtl(chkId, fieldsId, cantInputId, cantidadPorDefecto){
  const chk = document.getElementById(chkId);
  const fields = document.getElementById(fieldsId);
  const cantInput = document.getElementById(cantInputId);
  fields.style.display = chk.checked ? '' : 'none';
  chk.onchange = ()=>{
    fields.style.display = chk.checked ? '' : 'none';
    if(!chk.checked){ cantInput.dataset.prev = cantInput.value; cantInput.value = 0; }
    else { cantInput.value = (cantInput.dataset.prev && +cantInput.dataset.prev>0) ? cantInput.dataset.prev : cantidadPorDefecto; }
  };
}

function wireDtlPredetChips(){
  document.querySelectorAll('#predetDtlChips [data-predetdtl-id]').forEach(chip=>{
    chip.onclick = ()=>{
      const id = chip.dataset.predetdtlId;
      const yaActivo = dtlEntregaDraft.predeterminadoId === id;
      dtlEntregaDraft.predeterminadoId = yaActivo ? null : id;
      document.querySelectorAll('#predetDtlChips [data-predetdtl-id]').forEach(c=> c.classList.toggle('active', c.dataset.predetdtlId===dtlEntregaDraft.predeterminadoId));
      const nombreInput = document.getElementById('dtlRespNombre'), cargoInput = document.getElementById('dtlRespCargo');
      if(dtlEntregaDraft.predeterminadoId){
        const p = DTL.predeterminados.find(x=>x.id===dtlEntregaDraft.predeterminadoId);
        nombreInput.value = p.responsable_nombre; cargoInput.value = p.responsable_cargo||'';
        nombreInput.setAttribute('readonly',''); cargoInput.setAttribute('readonly','');
      } else {
        nombreInput.removeAttribute('readonly'); cargoInput.removeAttribute('readonly');
      }
      actualizarQuienFirmaDtl();
    };
  });
}
function actualizarQuienFirmaDtl(){
  const el = document.getElementById('dtlQuienFirma'); if(!el) return;
  const p = dtlEntregaDraft.predeterminadoId ? DTL.predeterminados.find(x=>x.id===dtlEntregaDraft.predeterminadoId) : null;
  el.textContent = p ? `Firmará: ${p.responsable_nombre} — usando la firma guardada de "${p.nombre}", no se pedirá de nuevo.` : '';
}

function validarYContinuarPasoDtl1(){
  const selTrab = document.getElementById('dtlTrabajador');
  if(selTrab){ dtlEntregaDraft.trabajadorId = selTrab.value || null; }
  if(!dtlEntregaDraft.trabajadorId){ toast("Selecciona el trabajador","err"); return; }
  dtlEntregaDraft.fecha = document.getElementById('dtlFecha').value || hoyLocal();
  dtlEntregaDraft.pantalonCantidad = +document.getElementById('dtlPantalonCant').value || 0;
  dtlEntregaDraft.pantalonTalla = document.getElementById('dtlPantalonTalla').value.trim();
  dtlEntregaDraft.camisaCantidad = +document.getElementById('dtlCamisaCant').value || 0;
  dtlEntregaDraft.camisaTalla = document.getElementById('dtlCamisaTalla').value.trim();
  dtlEntregaDraft.botasCantidad = +document.getElementById('dtlBotasCant').value || 0;
  dtlEntregaDraft.botasTalla = document.getElementById('dtlBotasTalla').value.trim();
  dtlEntregaDraft.adicional = document.getElementById('dtlAdicional').value.trim();
  dtlEntregaDraft.responsableNombre = document.getElementById('dtlRespNombre').value.trim();
  dtlEntregaDraft.responsableCargo = document.getElementById('dtlRespCargo').value.trim();
  if(!dtlEntregaDraft.responsableNombre){ toast("Falta el nombre del responsable que entrega","err"); return; }
  if(dtlEntregaDraft.pantalonCantidad<=0 && dtlEntregaDraft.camisaCantidad<=0 && dtlEntregaDraft.botasCantidad<=0 && !dtlEntregaDraft.adicional){
    toast("Agrega al menos un elemento a entregar","err"); return;
  }
  if(dtlEntregaDraft.pantalonCantidad>0 && !dtlEntregaDraft.pantalonTalla){ toast("Escribe la talla del pantalón","err"); return; }
  if(dtlEntregaDraft.camisaCantidad>0 && !dtlEntregaDraft.camisaTalla){ toast("Escribe la talla de la camisa","err"); return; }
  if(dtlEntregaDraft.botasCantidad>0 && !dtlEntregaDraft.botasTalla){ toast("Escribe la talla de las botas","err"); return; }
  localStorage.setItem('dtl_ultimo_responsable', JSON.stringify({ nombre: dtlEntregaDraft.responsableNombre, cargo: dtlEntregaDraft.responsableCargo }));
  renderPasoDtl2();
}

function renderPasoDtl2(){
  const t = DTL.trabajadores.find(x=>x.id===dtlEntregaDraft.trabajadorId);
  const resumen = [];
  if(dtlEntregaDraft.pantalonCantidad>0) resumen.push(`<span class="entrega-item-tag">Pantalón × ${dtlEntregaDraft.pantalonCantidad}${dtlEntregaDraft.pantalonTalla?' · '+esc(dtlEntregaDraft.pantalonTalla):''}</span>`);
  if(dtlEntregaDraft.camisaCantidad>0) resumen.push(`<span class="entrega-item-tag">Camisa × ${dtlEntregaDraft.camisaCantidad}${dtlEntregaDraft.camisaTalla?' · '+esc(dtlEntregaDraft.camisaTalla):''}</span>`);
  if(dtlEntregaDraft.botasCantidad>0) resumen.push(`<span class="entrega-item-tag">Botas × ${dtlEntregaDraft.botasCantidad}${dtlEntregaDraft.botasTalla?' · '+esc(dtlEntregaDraft.botasTalla):''}</span>`);
  if(dtlEntregaDraft.adicional) resumen.push(`<span class="entrega-item-tag">${esc(dtlEntregaDraft.adicional)}</span>`);
  const guardada = dtlEntregaDraft.firmaTrabajador;
  openModal(`<div class="modal" style="max-width:560px">
    <div class="modal-head"><div><h2>Firma del trabajador</h2><p>Paso 2 de 3 — ${esc(t?.nombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div style="margin-bottom:14px">${resumen.join('')}</div>
      <div style="margin-bottom:14px">
        <p class="muted-sm" style="margin-bottom:6px">Foto del trabajador recibiendo ${APP_CONFIG.dotacionFotoObligatoria?'<span style="color:var(--danger);font-weight:700">(obligatoria)</span>':'<span class="opt">(opcional)</span>'}</p>
        <div id="fotoTrabDtlPreview">${fotoTrabDtlPreviewHTML()}</div>
        <input type="file" id="fileFotoTrabDtl" accept="image/*" capture="user" style="display:none">
      </div>
      <div class="firma-legal" style="margin-bottom:14px">
        <p>${esc(DTL_DECLARACION)}</p>
      </div>
      ${guardada?`<div id="firmaTGuardadaDtl" style="text-align:center;margin-bottom:12px"><img src="${guardada}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"></div>`:''}
      <div id="padWrapTDtl" style="${guardada?'display:none':''}">
        <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
        <div class="sig-actions"><button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button></div>
      </div>
      ${guardada?`<button class="btn btn-ghost btn-sm" id="btnRefirmarTDtl">${I.pen} Firmar de nuevo</button>`:''}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="renderPasoDtl1()">${I.back} Atrás</button>
      <button class="btn btn-green" id="btnFirmaTrabOkDtl">${I.check} ${guardada?'Continuar':'Firmar y continuar'}</button>
    </div>
  </div>`);
  wireFotoTrabDtlPreview();
  let usarPad = !guardada;
  if(usarPad){ initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear(); }
  const reBtn = document.getElementById('btnRefirmarTDtl');
  if(reBtn) reBtn.onclick = ()=>{
    document.getElementById('firmaTGuardadaDtl').style.display='none';
    document.getElementById('padWrapTDtl').style.display='block';
    usarPad = true; reBtn.style.display='none';
    initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear();
  };
  document.getElementById('btnFirmaTrabOkDtl').onclick = ()=>{
    if(APP_CONFIG.dotacionFotoObligatoria && !dtlEntregaDraft.fotoTrabajador){ toast("La foto del trabajador es obligatoria","err"); return; }
    if(usarPad){
      if(!sigPad || sigPad.isEmpty()){ toast("El trabajador debe firmar primero","err"); return; }
      dtlEntregaDraft.firmaTrabajador = sigPad.dataURL();
    }
    renderPasoDtl3();
  };
}

/* Foto opcional del trabajador (paso 2 del asistente de entrega presencial) */
function fotoTrabDtlPreviewHTML(){
  return dtlEntregaDraft.fotoTrabajador
    ? `<div class="cap-prev"><img src="${dtlEntregaDraft.fotoTrabajador}"><button class="btn btn-ghost btn-sm" id="btnCambiarFotoTrabDtl">${I.pen} Cambiar foto</button></div>`
    : `<button class="btn btn-ghost btn-sm" id="btnTomarFotoTrabDtl">${I.user} Tomar foto</button>`;
}
function wireFotoTrabDtlPreview(){
  const inp = document.getElementById('fileFotoTrabDtl');
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    dtlEntregaDraft.fotoTrabajador = await comprimirImagen(f, 700);
    inp.value = '';
    document.getElementById('fotoTrabDtlPreview').innerHTML = fotoTrabDtlPreviewHTML();
    wireFotoTrabDtlPreview();
  };
  const bt = document.getElementById('btnTomarFotoTrabDtl'); if(bt) bt.onclick = ()=> inp.click();
  const bc = document.getElementById('btnCambiarFotoTrabDtl'); if(bc) bc.onclick = ()=> inp.click();
}

function renderPasoDtl3(){
  const plantilla = dtlEntregaDraft.predeterminadoId ? DTL.predeterminados.find(x=>x.id===dtlEntregaDraft.predeterminadoId) : null;
  openModal(`<div class="modal" style="max-width:560px">
    <div class="modal-head"><div><h2>Firma del responsable</h2><p>Paso 3 de 3 — ${esc(dtlEntregaDraft.responsableNombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <p class="muted-sm" style="margin-bottom:10px">Confirma que hiciste la entrega.</p>
      ${plantilla?`
      <div id="firmaRGuardadaDtl" style="text-align:center;margin-bottom:12px"><img src="${plantilla.firma}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"></div>
      <p class="muted-sm" style="text-align:center;margin-bottom:10px">Firma guardada en "${esc(plantilla.nombre)}"</p>
      <div style="display:flex;justify-content:center;margin-bottom:6px">
        <button class="btn btn-ghost btn-sm" id="btnRefirmarRDtl">${I.pen} Firmar de nuevo (solo para esta entrega)</button>
      </div>`:''}
      <div id="padWrapRDtl" style="${plantilla?'display:none':''}">
        <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
        <div class="sig-actions"><button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button></div>
        ${!plantilla && DTL.predeterminados.length<PREDET_DTL_MAX?`
        <label class="chk" style="margin-top:8px" id="chkWrapGuardarPredetDtl"><input type="checkbox" id="chkGuardarPredetDtl" checked> Guardar como plantilla predeterminada (Predeterminado)</label>
        <div class="field" id="nuevaPredetDtlNombreWrap" style="margin-top:6px"><input id="nuevaPredetDtlNombre" placeholder="Nombre de la plantilla, ej. Plantilla1"></div>`:''}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="renderPasoDtl2()">${I.back} Atrás</button>
      <button class="btn btn-green" id="btnFirmaRespOkDtl">${I.check} Guardar entrega</button>
    </div>
  </div>`);
  let usarGuardada = !!plantilla;
  if(!usarGuardada){ initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear(); }
  const chkGuardarPredet = document.getElementById('chkGuardarPredetDtl');
  if(chkGuardarPredet) chkGuardarPredet.onchange = ()=>{
    document.getElementById('nuevaPredetDtlNombreWrap').style.display = chkGuardarPredet.checked ? 'block' : 'none';
  };
  const reBtn = document.getElementById('btnRefirmarRDtl');
  if(reBtn) reBtn.onclick = ()=>{
    document.getElementById('firmaRGuardadaDtl').style.display='none';
    reBtn.parentElement.style.display='none';
    document.getElementById('padWrapRDtl').style.display='block';
    usarGuardada = false;
    initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear();
  };
  document.getElementById('btnFirmaRespOkDtl').onclick = async ()=>{
    let firma;
    if(usarGuardada){
      firma = plantilla.firma;
    } else {
      if(!sigPad || sigPad.isEmpty()){ toast("Falta la firma del responsable","err"); return; }
      firma = sigPad.dataURL();
      const chk = document.getElementById('chkGuardarPredetDtl');
      if(chk && chk.checked){
        const tEnt = DTL.trabajadores.find(x=>x.id===dtlEntregaDraft.trabajadorId);
        const nombrePlantilla = document.getElementById('nuevaPredetDtlNombre').value.trim() || ('Plantilla '+(DTL.predeterminados.length+1));
        const { error } = await sb.from("dtl_predeterminados").insert({
          nombre: nombrePlantilla,
          responsable_nombre: dtlEntregaDraft.responsableNombre || '',
          responsable_cargo: dtlEntregaDraft.responsableCargo || null,
          firma,
          entidad_id: tEnt?.entidad_id
        });
        if(error) toast("La entrega se va a guardar, pero no se pudo guardar la plantilla: "+error.message,"err");
      }
    }
    const btn=document.getElementById('btnFirmaRespOkDtl'); btn.disabled=true; btn.innerHTML="Guardando…";
    await guardarEntregaDtlFinal(firma);
  };
}

async function guardarEntregaDtlFinal(firmaResponsable){
  bloquear("Guardando entrega…");
  try{
    const { error } = await sb.from("dtl_entregas").insert({
      trabajador_id: dtlEntregaDraft.trabajadorId,
      fecha: dtlEntregaDraft.fecha,
      pantalon_cantidad: dtlEntregaDraft.pantalonCantidad, pantalon_talla: dtlEntregaDraft.pantalonTalla || null,
      camisa_cantidad: dtlEntregaDraft.camisaCantidad, camisa_talla: dtlEntregaDraft.camisaTalla || null,
      botas_cantidad: dtlEntregaDraft.botasCantidad, botas_talla: dtlEntregaDraft.botasTalla || null,
      adicional: dtlEntregaDraft.adicional || null,
      responsable_nombre: dtlEntregaDraft.responsableNombre || null,
      responsable_cargo: dtlEntregaDraft.responsableCargo || null,
      firma_trabajador: dtlEntregaDraft.firmaTrabajador,
      firma_responsable: firmaResponsable,
      foto_trabajador: dtlEntregaDraft.fotoTrabajador,
      via: 'presencial'
    });
    if(error){ toast("No se pudo guardar la entrega: "+error.message,"err"); return; }
    const trabId = dtlEntregaDraft.trabajadorId;
    const yaEstabaEnFicha = location.hash === "#/dotacionlegal/trabajador/"+trabId;
    dtlEntregaDraft = null;
    await loadDtlState();
    closeModal();
    toast("Entrega registrada correctamente","ok");
    if(yaEstabaEnFicha){ await renderFichaTrabajadorDtl(trabId); }
    else { location.hash = "#/dotacionlegal/trabajador/"+trabId; }
  } finally { desbloquear(); }
}

/* ---------- Ficha del trabajador: historial completo + kárdex imprimible ---------- */
async function renderFichaTrabajadorDtl(id){
  bloquear("Cargando ficha…");
  try{
    await loadDtlState();
    const t = DTL.trabajadores.find(x=>x.id===id);
    if(!t){ toast("Trabajador no encontrado","err"); location.hash="#/dotacionlegal"; return; }
    const { data: entregas } = await sb.from("dtl_entregas")
      .select("id,fecha,pantalon_cantidad,pantalon_talla,camisa_cantidad,camisa_talla,botas_cantidad,botas_talla,adicional,responsable_nombre,via,creado_en,creado_por")
      .eq("trabajador_id", id).order("fecha",{ascending:false});
    const listaEntregas = entregas || [];

    const filas = listaEntregas.map(e=>{
      const partes = [];
      if(e.pantalon_cantidad>0) partes.push(`Pantalón × ${e.pantalon_cantidad}${e.pantalon_talla?' ('+esc(e.pantalon_talla)+')':''}`);
      if(e.camisa_cantidad>0) partes.push(`Camisa × ${e.camisa_cantidad}${e.camisa_talla?' ('+esc(e.camisa_talla)+')':''}`);
      if(e.botas_cantidad>0) partes.push(`Botas × ${e.botas_cantidad}${e.botas_talla?' ('+esc(e.botas_talla)+')':''}`);
      if(e.adicional) partes.push(esc(e.adicional));
      return `<tr>
        <td>${fmtDate(e.fecha)}</td>
        <td>${partes.join(', ')||'—'}</td>
        <td>${esc(e.responsable_nombre||(e.via==='remoto'?'(entrega remota)':'—'))}</td>
        <td>${puedoTocarReciente(e.creado_en, e.creado_por)?`<button class="icon-btn" title="Editar entrega" onclick="abrirEditarEntregaDtl('${e.id}','${t.id}')">${I.pen}</button>
        <button class="icon-btn danger" title="Eliminar entrega" onclick="eliminarEntregaDtl('${e.id}','${t.id}')">${I.trash}</button>`:''}</td>
      </tr>`;
    }).join('');

    document.getElementById("app").innerHTML = `
      ${topbar('dotacionlegal')}
      <div class="wrap">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" id="btnVolverDtl">${I.back} Volver</button>
        </div>
        <div class="page-head">
          <div><h1>${esc(t.nombre)}</h1><p>C.C. ${esc(t.identificacion)}${t.cargo?' · '+esc(t.cargo):''}${t.area?' · '+esc(t.area):''} · ${esc(nombreEntidadDtl(t.entidad_id))}${t.fecha_ingreso?' · Ingresó '+fmtDate(t.fecha_ingreso):''}${t.correo?' · '+esc(t.correo):''}</p></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            ${MIPERFIL.esAdmin?`<button class="btn btn-ghost" id="btnEditarTrabDtl">${I.pen} Editar datos</button>`:''}
            ${listaEntregas.length?`<button class="btn btn-ghost" id="btnKardexDtl">${I.pdf} Imprimir kárdex</button>`:''}
            ${puedeEscribir()?`<button class="btn btn-primary" id="btnNuevaEntregaFichaDtl">${I.plus} Registrar entrega</button>`:''}
          </div>
        </div>
        <div class="sec-bar"><h2>Historial de entregas</h2><span class="muted-sm">${listaEntregas.length} registrada(s)</span></div>
        ${listaEntregas.length?`<div class="table-wrap"><table class="dt"><thead><tr><th>Fecha</th><th>Elementos entregados</th><th>Responsable</th><th>Acciones</th></tr></thead><tbody>${filas}</tbody></table></div>`
          :`<div class="empty"><div class="ic">${I.box}</div><h3>Sin entregas todavía</h3><p>Registra la primera entrega de dotación para este trabajador.</p></div>`}
      </div>`;
    wireLogout();
    document.getElementById('btnVolverDtl').onclick = ()=> location.hash="#/dotacionlegal";
    const bet = document.getElementById('btnEditarTrabDtl'); if(bet) bet.onclick = ()=> abrirTrabajadorDtlForm(t.id);
    const bk = document.getElementById('btnKardexDtl'); if(bk) bk.onclick = ()=> generarKardexDtlPDF(t.id);
    const bnef = document.getElementById('btnNuevaEntregaFichaDtl'); if(bnef) bnef.onclick = ()=> abrirNuevaEntregaDtl(t.id);
  } finally { desbloquear(); }
}

function eliminarEntregaDtl(entregaId, trabajadorId){
  openModal(`<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>Eliminar entrega</h2><p>Esta acción no se puede deshacer.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body"><p style="font-size:14.5px;color:var(--ink-2)">Se eliminará este registro de entrega junto con sus firmas. Úsalo solo si fue un error.</p></div>
