    botasCantidad: 1, botasTalla: '',
    adicional: '',
    responsableNombre: '',
    responsableCargo: '',
    predeterminadoId: null,
    firmaTrabajador: null,
    fotoTrabajador: null
  };
  renderPasoDtl1();
}

/* ---------- Nueva entrega ESCANEADA de Dotación (mismo patrón que EPP) ---------- */
function abrirNuevaEntregaEscaneadaDtl(trabajadorId){
  const t = DTL.trabajadores.find(x=>x.id===trabajadorId);
  if(!t){ toast("Trabajador no encontrado","err"); return; }
  const nSugerido = DTL.entregas.filter(e=>e.trabajador_id===t.id).length + 1;
  const tituloSugerido = `Entrega #${nSugerido} · ${fmtDate(hoyLocal())}`;
  dtlEscaneadaState = { trabajadorId, archivo: null, archivoTipo: null, archivoNombre: null };
  openModal(`<div class="modal" style="max-width:480px">
    <div class="modal-head"><div><h2>Registrar entrega escaneada</h2><p>Este contrato usa formato físico — sube la foto o el PDF ya firmado.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="trab-summary" style="margin-bottom:14px"><div class="tk">Trabajador</div><div class="tv">${esc(t.nombre)} — C.C. ${esc(t.identificacion)}</div></div>
      <div class="field row2">
        <div><label>Fecha *</label><input type="date" id="entEscDtlFecha" value="${hoyLocal()}"></div>
        <div><label>Título *</label><input id="entEscDtlTitulo" value="${esc(tituloSugerido)}" placeholder="Ej. Entrega #3 · 26/07/2026"></div>
      </div>
      <div class="field">
        <label>Archivo escaneado (foto o PDF) *</label>
        <div id="entEscDtlPreview"></div>
        <input type="file" id="entEscDtlArchivo" accept="image/*,.pdf" style="display:none">
        <button type="button" class="btn btn-ghost btn-sm" id="entEscDtlBtnArchivo" style="margin-top:8px">${I.plus} Elegir archivo</button>
      </div>
      <div id="entEscDtlError" class="login-err"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarEntEscDtl">${I.check} Guardar</button>
    </div></div>`);
  document.getElementById('entEscDtlBtnArchivo').onclick = ()=> document.getElementById('entEscDtlArchivo').click();
  document.getElementById('entEscDtlArchivo').onchange = async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const esPdf = f.type==='application/pdf' || /\.pdf$/i.test(f.name||'');
    if(esPdf){
      const rd = new FileReader();
      dtlEscaneadaState.archivo = await new Promise(res=>{ rd.onload=()=>res(rd.result); rd.readAsDataURL(f); });
      dtlEscaneadaState.archivoTipo = 'application/pdf';
    } else {
      dtlEscaneadaState.archivo = await comprimirImagen(f, 1400);
      dtlEscaneadaState.archivoTipo = 'image/jpeg';
    }
    dtlEscaneadaState.archivoNombre = f.name;
    renderEntEscDtlPreview();
  };
  renderEntEscDtlPreview();
  document.getElementById('btnGuardarEntEscDtl').onclick = guardarEntregaEscaneadaDtl;
}

function renderEntEscDtlPreview(){
  const host = document.getElementById('entEscDtlPreview'); if(!host) return;
  if(!dtlEscaneadaState.archivo){ host.innerHTML = '<p class="muted-sm" style="margin-top:6px">Ningún archivo elegido todavía.</p>'; return; }
  if(dtlEscaneadaState.archivoTipo === 'application/pdf'){
    host.innerHTML = `<div class="muted-sm" style="margin-top:6px">${I.pdf} ${esc(dtlEscaneadaState.archivoNombre||'archivo.pdf')} (PDF cargado)</div>`;
  } else {
    host.innerHTML = `<img src="${dtlEscaneadaState.archivo}" style="max-width:100%;max-height:220px;border:1px solid var(--line);border-radius:8px;margin-top:6px">`;
  }
}

async function guardarEntregaEscaneadaDtl(){
  const err = document.getElementById('entEscDtlError'); err.textContent='';
  const fecha = document.getElementById('entEscDtlFecha').value || hoyLocal();
  const titulo = document.getElementById('entEscDtlTitulo').value.trim();
  if(!titulo){ err.textContent = 'Escribe un título.'; return; }
  if(!dtlEscaneadaState.archivo){ err.textContent = 'Sube el archivo escaneado.'; return; }
  const btn = document.getElementById('btnGuardarEntEscDtl'); btn.disabled=true; btn.innerHTML='Guardando…';
  const { error } = await sb.rpc('dtl_entrega_escaneada_registrar', {
    p_trabajador_id: dtlEscaneadaState.trabajadorId,
    p_fecha: fecha,
    p_adjunto_titulo: titulo,
    p_adjunto_archivo: dtlEscaneadaState.archivo,
    p_adjunto_tipo: dtlEscaneadaState.archivoTipo
  });
  if(error){
    btn.disabled=false; btn.innerHTML=`${I.check} Guardar`;
    toast("No se pudo guardar: "+error.message,"err");
    return;
  }
  const trabajadorId = dtlEscaneadaState.trabajadorId;
  await loadDtlState();
  closeModal();
  toast("Entrega escaneada guardada","ok");
  const yaEstabaEnFicha = location.hash === "#/dotacionlegal/trabajador/"+trabajadorId;
  if(yaEstabaEnFicha){ renderFichaTrabajadorDtl(trabajadorId); }
  else { location.hash = "#/dotacionlegal/trabajador/"+trabajadorId; }
}

      <div class="field"><label>Fecha de entrega</label><input type="date" id="dtlFecha" value="${dtlEntregaDraft.fecha}"></div>

      <div class="field row2" id="dtlPantalonFields">
        <div><label>Cantidad</label><input type="number" min="0" id="dtlPantalonCant" value="${dtlEntregaDraft.pantalonCantidad}"></div>
        <div><label>Talla *</label><input id="dtlPantalonTalla" value="${esc(dtlEntregaDraft.pantalonTalla)}" placeholder="Ej. 34"></div>
      </div>
      <label class="chk" style="margin-bottom:6px"><input type="checkbox" id="dtlCamisaInc" checked> Camisas</label>
      <div class="field row2" id="dtlCamisaFields">
        <div><label>Cantidad</label><input type="number" min="0" id="dtlCamisaCant" value="${dtlEntregaDraft.camisaCantidad}"></div>
        <div><label>Talla *</label><input id="dtlCamisaTalla" value="${esc(dtlEntregaDraft.camisaTalla)}" placeholder="Ej. M"></div>
      </div>
      <label class="chk" style="margin-bottom:6px"><input type="checkbox" id="dtlBotasInc" checked> Par de botas</label>
      <div class="field row2" id="dtlBotasFields">
        <div><label>Cantidad de pares</label><input type="number" min="0" id="dtlBotasCant" value="${dtlEntregaDraft.botasCantidad}"></div>
        <div><label>Talla *</label><input id="dtlBotasTalla" value="${esc(dtlEntregaDraft.botasTalla)}" placeholder="Ej. 40"></div>
      </div>
      <div class="field"><label>Adicional <span class="opt">(opcional — algo más que se entregue)</span></label><textarea id="dtlAdicional" placeholder="Ej. 1 chaqueta impermeable">${esc(dtlEntregaDraft.adicional)}</textarea></div>

          ${DTL.predeterminados.map(p=>`<button type="button" class="chip-predet ${p.id===dtlEntregaDraft.predeterminadoId?'active':''}" data-predetdtl-id="${p.id}" title="${esc(p.nombre)}">${esc(p.nombre)}</button>`).join('')}
        </div>`:''}
      </div>
      <div class="field row2">
        <div><input id="dtlRespNombre" value="${esc(dtlEntregaDraft.responsableNombre)}" placeholder="Nombre del responsable" ${dtlEntregaDraft.predeterminadoId?'readonly':''}></div>
        <div><input id="dtlRespCargo" value="${esc(dtlEntregaDraft.responsableCargo)}" placeholder="Cargo" ${dtlEntregaDraft.predeterminadoId?'readonly':''}></div>

    </div>
  </div>`);
  actualizarQuienFirmaDtl();
  wireDtlPredetChips();
  if(dtlEntregaDraft.catalogoUnico){
    renderItemsListDtl();
    document.getElementById('btnAddItemDtl').onclick = ()=>{ dtlEntregaDraft.items.push({catalogoId:'',cantidad:1,talla:''}); renderItemsListDtl(); };
  } else {
    wireIncluirItemDtl('dtlPantalonInc','dtlPantalonFields','dtlPantalonCant',2);
    wireIncluirItemDtl('dtlCamisaInc','dtlCamisaFields','dtlCamisaCant',2);
    wireIncluirItemDtl('dtlBotasInc','dtlBotasFields','dtlBotasCant',1);
  }
  document.getElementById('btnDtlContinuar').onclick = validarYContinuarPasoDtl1;
}

/* Lista dinámica de ítems para entidades con "catálogo único" — calco de
   renderItemsList (EPP, líneas ~5665-5689) adaptada a dtlEntregaDraft.items + DTL.catalogo. */
function renderItemsListDtl(){
  const host = document.getElementById('itemsListDtl'); if(!host) return;
  const activos = DTL.catalogo.filter(c=>c.activo);
  host.innerHTML = dtlEntregaDraft.items.map((it,i)=>`
    <div class="item-row" data-i="${i}">
      <span class="firmante-num">${i+1}</span>
      <select data-f="catalogoId">
        <option value="">Elige el ítem…</option>
        ${activos.map(c=>`<option value="${c.id}" ${c.id===it.catalogoId?'selected':''}>${esc(c.nombre)}</option>`).join('')}
      </select>
      <input data-f="cantidad" type="number" min="1" step="1" value="${it.cantidad}" placeholder="Cant.">
      <input data-f="talla" value="${esc(it.talla||'')}" placeholder="Talla (opc.)">
      <button class="icon-btn danger" data-del="${i}" title="Quitar" ${dtlEntregaDraft.items.length<=1?'disabled':''}>${I.trash}</button>
    </div>`).join('');
  host.querySelectorAll('.item-row').forEach(row=>{
    const i = +row.dataset.i;
    row.querySelector('[data-f="catalogoId"]').onchange = (e)=>{ dtlEntregaDraft.items[i].catalogoId = e.target.value; };
    row.querySelector('[data-f="cantidad"]').oninput = (e)=>{ dtlEntregaDraft.items[i].cantidad = +e.target.value || 1; };
    row.querySelector('[data-f="talla"]').oninput = (e)=>{ dtlEntregaDraft.items[i].talla = e.target.value; };
    const del = row.querySelector('[data-del]');
    if(del) del.onclick = ()=>{ if(dtlEntregaDraft.items.length<=1) return; dtlEntregaDraft.items.splice(i,1); renderItemsListDtl(); };
  });
}

/* Casilla "se entrega este ítem" — marcada por defecto (siempre se suele entregar todo);
   al desmarcarla oculta cantidad/talla y deja la cantidad en 0 (no se entrega esta vez). */
function wireIncluirItemDtl(chkId, fieldsId, cantInputId, cantidadPorDefecto){
  const chk = document.getElementById(chkId);
  const fields = document.getElementById(fieldsId);
  const cantInput = document.getElementById(cantInputId);
  fields.style.display = chk.checked ? '' : 'none';
  chk.onchange = ()=>{
    fields.style.display = chk.checked ? '' : 'none';
    if(!chk.checked){ cantInput.dataset.prev = cantInput.value; cantInput.value = 0; }
    else { cantInput.value = (cantInput.dataset.prev && +cantInput.dataset.prev>0) ? cantInput.dataset.prev : cantidadPorDefecto; }
  };
}

function wireDtlPredetChips(){
  document.querySelectorAll('#predetDtlChips [data-predetdtl-id]').forEach(chip=>{
    chip.onclick = ()=>{
      const id = chip.dataset.predetdtlId;
      const yaActivo = dtlEntregaDraft.predeterminadoId === id;
      dtlEntregaDraft.predeterminadoId = yaActivo ? null : id;
      document.querySelectorAll('#predetDtlChips [data-predetdtl-id]').forEach(c=> c.classList.toggle('active', c.dataset.predetdtlId===dtlEntregaDraft.predeterminadoId));
      const nombreInput = document.getElementById('dtlRespNombre'), cargoInput = document.getElementById('dtlRespCargo');
      if(dtlEntregaDraft.predeterminadoId){
        const p = DTL.predeterminados.find(x=>x.id===dtlEntregaDraft.predeterminadoId);
        nombreInput.value = p.responsable_nombre; cargoInput.value = p.responsable_cargo||'';
        nombreInput.setAttribute('readonly',''); cargoInput.setAttribute('readonly','');
      } else {
        nombreInput.removeAttribute('readonly'); cargoInput.removeAttribute('readonly');
      }
      actualizarQuienFirmaDtl();
    };
  });
}
function actualizarQuienFirmaDtl(){
  const el = document.getElementById('dtlQuienFirma'); if(!el) return;
  const p = dtlEntregaDraft.predeterminadoId ? DTL.predeterminados.find(x=>x.id===dtlEntregaDraft.predeterminadoId) : null;
  el.textContent = p ? `Firmará: ${p.responsable_nombre} — usando la firma guardada de "${p.nombre}", no se pedirá de nuevo.` : '';
}

function validarYContinuarPasoDtl1(){
  const selTrab = document.getElementById('dtlTrabajador');
  if(selTrab){ dtlEntregaDraft.trabajadorId = selTrab.value || null; }
  if(!dtlEntregaDraft.trabajadorId){ toast("Selecciona el trabajador","err"); return; }
  dtlEntregaDraft.fecha = document.getElementById('dtlFecha').value || hoyLocal();
  dtlEntregaDraft.adicional = document.getElementById('dtlAdicional').value.trim();
  dtlEntregaDraft.responsableNombre = document.getElementById('dtlRespNombre').value.trim();
  dtlEntregaDraft.responsableCargo = document.getElementById('dtlRespCargo').value.trim();
  if(!dtlEntregaDraft.responsableNombre){ toast("Falta el nombre del responsable que entrega","err"); return; }
  if(dtlEntregaDraft.catalogoUnico){
    if(!dtlEntregaDraft.items.some(it=>it.catalogoId)){ toast("Elige al menos un ítem","err"); return; }
    renderPasoDtl2();
    return;
  }
  dtlEntregaDraft.pantalonCantidad = +document.getElementById('dtlPantalonCant').value || 0;
  dtlEntregaDraft.pantalonTalla = document.getElementById('dtlPantalonTalla').value.trim();
  dtlEntregaDraft.camisaCantidad = +document.getElementById('dtlCamisaCant').value || 0;
  dtlEntregaDraft.camisaTalla = document.getElementById('dtlCamisaTalla').value.trim();
  dtlEntregaDraft.botasCantidad = +document.getElementById('dtlBotasCant').value || 0;
  dtlEntregaDraft.botasTalla = document.getElementById('dtlBotasTalla').value.trim();
  if(dtlEntregaDraft.pantalonCantidad<=0 && dtlEntregaDraft.camisaCantidad<=0 && dtlEntregaDraft.botasCantidad<=0 && !dtlEntregaDraft.adicional){
    toast("Agrega al menos un elemento a entregar","err"); return;
  }
  if(dtlEntregaDraft.pantalonCantidad>0 && !dtlEntregaDraft.pantalonTalla){ toast("Escribe la talla del pantalón","err"); return; }
  if(dtlEntregaDraft.camisaCantidad>0 && !dtlEntregaDraft.camisaTalla){ toast("Escribe la talla de la camisa","err"); return; }
  if(dtlEntregaDraft.botasCantidad>0 && !dtlEntregaDraft.botasTalla){ toast("Escribe la talla de las botas","err"); return; }
  renderPasoDtl2();
}

function renderPasoDtl2(){
  const t = DTL.trabajadores.find(x=>x.id===dtlEntregaDraft.trabajadorId);
  const resumen = [];
  if(dtlEntregaDraft.catalogoUnico){
    dtlEntregaDraft.items.filter(it=>it.catalogoId).forEach(it=>{
      const c = DTL.catalogo.find(x=>x.id===it.catalogoId);
      resumen.push(`<span class="entrega-item-tag">${esc(c?c.nombre:'Ítem')} × ${it.cantidad}${it.talla?' · '+esc(it.talla):''}</span>`);
    });
  } else {
    if(dtlEntregaDraft.pantalonCantidad>0) resumen.push(`<span class="entrega-item-tag">Pantalón × ${dtlEntregaDraft.pantalonCantidad}${dtlEntregaDraft.pantalonTalla?' · '+esc(dtlEntregaDraft.pantalonTalla):''}</span>`);
    if(dtlEntregaDraft.camisaCantidad>0) resumen.push(`<span class="entrega-item-tag">Camisa × ${dtlEntregaDraft.camisaCantidad}${dtlEntregaDraft.camisaTalla?' · '+esc(dtlEntregaDraft.camisaTalla):''}</span>`);
    if(dtlEntregaDraft.botasCantidad>0) resumen.push(`<span class="entrega-item-tag">Botas × ${dtlEntregaDraft.botasCantidad}${dtlEntregaDraft.botasTalla?' · '+esc(dtlEntregaDraft.botasTalla):''}</span>`);
  }
  if(dtlEntregaDraft.adicional) resumen.push(`<span class="entrega-item-tag">${esc(dtlEntregaDraft.adicional)}</span>`);
  const guardada = dtlEntregaDraft.firmaTrabajador;
  openModal(`<div class="modal" style="max-width:560px">
    <div class="modal-head"><div><h2>Firma del trabajador</h2><p>Paso 2 de 3 — ${esc(t?.nombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div style="margin-bottom:14px">${resumen.join('')}</div>
      <div style="margin-bottom:14px">
        <p class="muted-sm" style="margin-bottom:6px">Foto del trabajador recibiendo ${APP_CONFIG.dotacionFotoObligatoria?'<span style="color:var(--danger);font-weight:700">(obligatoria)</span>':'<span class="opt">(opcional)</span>'}</p>
        <div id="fotoTrabDtlPreview">${fotoTrabDtlPreviewHTML()}</div>
        <input type="file" id="fileFotoTrabDtl" accept="image/*" capture="user" style="display:none">
      </div>
      <div class="firma-legal" style="margin-bottom:14px">
        <p>${esc(DTL_DECLARACION)}</p>
      </div>
      ${guardada?`<div id="firmaTGuardadaDtl" style="text-align:center;margin-bottom:12px"><img src="${guardada}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"></div>`:''}
      <div id="padWrapTDtl" style="${guardada?'display:none':''}">
        <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
        <div class="sig-actions"><button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button></div>
      </div>
      ${guardada?`<button class="btn btn-ghost btn-sm" id="btnRefirmarTDtl">${I.pen} Firmar de nuevo</button>`:''}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="renderPasoDtl1()">${I.back} Atrás</button>
      <button class="btn btn-green" id="btnFirmaTrabOkDtl">${I.check} ${guardada?'Continuar':'Firmar y continuar'}</button>
    </div>
  </div>`);
  wireFotoTrabDtlPreview();
  let usarPad = !guardada;
  if(usarPad){ initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear(); }
  const reBtn = document.getElementById('btnRefirmarTDtl');
  if(reBtn) reBtn.onclick = ()=>{
    document.getElementById('firmaTGuardadaDtl').style.display='none';
    document.getElementById('padWrapTDtl').style.display='block';
    usarPad = true; reBtn.style.display='none';
    initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear();
  };
  document.getElementById('btnFirmaTrabOkDtl').onclick = ()=>{
    if(APP_CONFIG.dotacionFotoObligatoria && !dtlEntregaDraft.fotoTrabajador){ toast("La foto del trabajador es obligatoria","err"); return; }
    if(usarPad){
      if(!sigPad || sigPad.isEmpty()){ toast("El trabajador debe firmar primero","err"); return; }
      dtlEntregaDraft.firmaTrabajador = sigPad.dataURL();
    }
    renderPasoDtl3();
  };
}

/* Foto opcional del trabajador (paso 2 del asistente de entrega presencial) */
function fotoTrabDtlPreviewHTML(){
  return dtlEntregaDraft.fotoTrabajador
    ? `<div class="cap-prev"><img src="${dtlEntregaDraft.fotoTrabajador}"><button class="btn btn-ghost btn-sm" id="btnCambiarFotoTrabDtl">${I.pen} Cambiar foto</button></div>`
    : `<button class="btn btn-ghost btn-sm" id="btnTomarFotoTrabDtl">${I.user} Tomar foto</button>`;
}
function wireFotoTrabDtlPreview(){
  const inp = document.getElementById('fileFotoTrabDtl');
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    dtlEntregaDraft.fotoTrabajador = await comprimirImagen(f, 420, 0.6);
    inp.value = '';
    document.getElementById('fotoTrabDtlPreview').innerHTML = fotoTrabDtlPreviewHTML();
    wireFotoTrabDtlPreview();
  };
  const bt = document.getElementById('btnTomarFotoTrabDtl'); if(bt) bt.onclick = ()=> inp.click();
  const bc = document.getElementById('btnCambiarFotoTrabDtl'); if(bc) bc.onclick = ()=> inp.click();
}

function renderPasoDtl3(){
  const plantilla = dtlEntregaDraft.predeterminadoId ? DTL.predeterminados.find(x=>x.id===dtlEntregaDraft.predeterminadoId) : null;
  openModal(`<div class="modal" style="max-width:560px">
    <div class="modal-head"><div><h2>Firma del responsable</h2><p>Paso 3 de 3 — ${esc(dtlEntregaDraft.responsableNombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <p class="muted-sm" style="margin-bottom:10px">Confirma que hiciste la entrega.</p>
      ${plantilla?`
      <div id="firmaRGuardadaDtl" style="text-align:center;margin-bottom:12px"><img src="${plantilla.firma}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"></div>
      <p class="muted-sm" style="text-align:center;margin-bottom:10px">Firma guardada en "${esc(plantilla.nombre)}"</p>`:''}
      <div id="padWrapRDtl" style="${plantilla?'display:none':''}">
        <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
        <div class="sig-actions"><button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button></div>
        ${!plantilla && DTL.predeterminados.length<PREDET_DTL_MAX?`
        <label class="chk" style="margin-top:8px" id="chkWrapGuardarPredetDtl"><input type="checkbox" id="chkGuardarPredetDtl"> Guardar como plantilla predeterminada (Predeterminado)</label>
        <div class="field" id="nuevaPredetDtlNombreWrap" style="margin-top:6px;display:none"><input id="nuevaPredetDtlNombre" placeholder="Nombre de la plantilla, ej. Plantilla1"></div>`:''}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="renderPasoDtl2()">${I.back} Atrás</button>
      <button class="btn btn-green" id="btnFirmaRespOkDtl">${I.check} Guardar entrega</button>
    </div>
  </div>`);
  // Igual que en EPP: si la plantilla se eligió desde el paso 1, se usa esa firma
  // sin dar la opción de "firmar de nuevo" aquí (evita confundir a los supervisores).
  let usarGuardada = !!plantilla;
  if(!usarGuardada){ initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear(); }
  const chkGuardarPredet = document.getElementById('chkGuardarPredetDtl');
  if(chkGuardarPredet) chkGuardarPredet.onchange = ()=>{
    document.getElementById('nuevaPredetDtlNombreWrap').style.display = chkGuardarPredet.checked ? 'block' : 'none';
  };
  document.getElementById('btnFirmaRespOkDtl').onclick = async ()=>{
    let firma;
    if(usarGuardada){
      firma = plantilla.firma;
    } else {
      if(!sigPad || sigPad.isEmpty()){ toast("Falta la firma del responsable","err"); return; }
      firma = sigPad.dataURL();
      const chk = document.getElementById('chkGuardarPredetDtl');
      if(chk && chk.checked){
        const tEnt = DTL.trabajadores.find(x=>x.id===dtlEntregaDraft.trabajadorId);
        const nombrePlantilla = document.getElementById('nuevaPredetDtlNombre').value.trim() || ('Plantilla '+(DTL.predeterminados.length+1));
        const { error } = await sb.from("dtl_predeterminados").insert({
          nombre: nombrePlantilla,
          responsable_nombre: dtlEntregaDraft.responsableNombre || '',
          responsable_cargo: dtlEntregaDraft.responsableCargo || null,
          firma,
          entidad_id: tEnt?.entidad_id
        });
        if(error) toast("La entrega se va a guardar, pero no se pudo guardar la plantilla: "+error.message,"err");
      }
    }
    const btn=document.getElementById('btnFirmaRespOkDtl'); btn.disabled=true; btn.innerHTML="Guardando…";
    await guardarEntregaDtlFinal(firma);
  };
}

async function guardarEntregaDtlFinal(firmaResponsable){
  bloquear("Guardando entrega…");
  try{
    let error;
    if(dtlEntregaDraft.catalogoUnico){
      const items = dtlEntregaDraft.items.filter(it=>it.catalogoId).map(it=>{
        const c = DTL.catalogo.find(x=>x.id===it.catalogoId);
        return { nombre: c?c.nombre:'Ítem', cantidad: it.cantidad, talla: it.talla||null };
      });
      ({ error } = await sb.rpc('dtl_entrega_items_presencial_registrar', {
        p_trabajador_id: dtlEntregaDraft.trabajadorId,
        p_fecha: dtlEntregaDraft.fecha,
        p_adicional: dtlEntregaDraft.adicional || null,
        p_responsable_nombre: dtlEntregaDraft.responsableNombre || null,
        p_responsable_cargo: dtlEntregaDraft.responsableCargo || null,
        p_firma_trabajador: dtlEntregaDraft.firmaTrabajador,
        p_firma_responsable: firmaResponsable,
        p_foto_trabajador: dtlEntregaDraft.fotoTrabajador,
        p_items: items
      }));
    } else {
      ({ error } = await sb.rpc('dtl_entrega_presencial_registrar', {
        p_trabajador_id: dtlEntregaDraft.trabajadorId,
        p_fecha: dtlEntregaDraft.fecha,
        p_pantalon_cantidad: dtlEntregaDraft.pantalonCantidad, p_pantalon_talla: dtlEntregaDraft.pantalonTalla || null,
        p_camisa_cantidad: dtlEntregaDraft.camisaCantidad, p_camisa_talla: dtlEntregaDraft.camisaTalla || null,
        p_botas_cantidad: dtlEntregaDraft.botasCantidad, p_botas_talla: dtlEntregaDraft.botasTalla || null,
        p_adicional: dtlEntregaDraft.adicional || null,
        p_responsable_nombre: dtlEntregaDraft.responsableNombre || null,
        p_responsable_cargo: dtlEntregaDraft.responsableCargo || null,
        p_firma_trabajador: dtlEntregaDraft.firmaTrabajador,
        p_firma_responsable: firmaResponsable,
        p_foto_trabajador: dtlEntregaDraft.fotoTrabajador
      }));
    }
    if(error){ toast("No se pudo guardar la entrega: "+error.message,"err"); return; }
    const trabId = dtlEntregaDraft.trabajadorId;
    const yaEstabaEnFicha = location.hash === "#/dotacionlegal/trabajador/"+trabId;
    dtlEntregaDraft = null;
    await loadDtlState();
    closeModal();
    toast("Entrega registrada correctamente","ok");
    if(yaEstabaEnFicha){ await renderFichaTrabajadorDtl(trabId); }
    else { location.hash = "#/dotacionlegal/trabajador/"+trabId; }
  } finally { desbloquear(); }
}

/* ---------- Ficha del trabajador: historial completo + kárdex imprimible ---------- */
async function renderFichaTrabajadorDtl(id){
  bloquear("Cargando ficha…");
  try{
    await loadDtlState();
    const t = DTL.trabajadores.find(x=>x.id===id);
    if(!t){ toast("Trabajador no encontrado","err"); location.hash="#/dotacionlegal"; return; }
    const entidadDelTrab = DTL.entidades.find(en=>en.id===t.entidad_id);
    const esContratoEscaneadoDtl = entidadDelTrab?.modo_registro === 'escaneado';
    const { data: entregas } = await sb.from("dtl_entregas")
      .select("id,fecha,pantalon_cantidad,pantalon_talla,camisa_cantidad,camisa_talla,botas_cantidad,botas_talla,adicional,responsable_nombre,via,creado_en,creado_por,tipo_registro,adjunto_titulo,adjunto_tipo,ip_address,dispositivo_ua")
      .eq("trabajador_id", id).order("fecha",{ascending:false}).order("creado_en",{ascending:false});
    const listaEntregas = entregas || [];
    // Ítems de "catálogo único" (dtl_entrega_items) — solo existen para entregas de entidades
    // con esa bandera activada; el resto de entregas no tiene ninguna fila aquí.
    const idsEntDtl = listaEntregas.filter(e=>e.tipo_registro!=='escaneado').map(e=>e.id);
    const { data: itemsDtl } = idsEntDtl.length
      ? await sb.from("dtl_entrega_items").select("entrega_id,nombre_item,cantidad,talla").in("entrega_id", idsEntDtl)
      : { data: [] };
    const itemsPorEntregaDtl = {};
    (itemsDtl||[]).forEach(it=>{ (itemsPorEntregaDtl[it.entrega_id] = itemsPorEntregaDtl[it.entrega_id]||[]).push(it); });

    const filas = listaEntregas.map(e=>{
      const esEscaneada = e.tipo_registro === 'escaneado';
      const partes = [];
      if(e.pantalon_cantidad>0) partes.push(`Pantalón × ${e.pantalon_cantidad}${e.pantalon_talla?' ('+esc(e.pantalon_talla)+')':''}`);
      if(e.camisa_cantidad>0) partes.push(`Camisa × ${e.camisa_cantidad}${e.camisa_talla?' ('+esc(e.camisa_talla)+')':''}`);
      if(e.botas_cantidad>0) partes.push(`Botas × ${e.botas_cantidad}${e.botas_talla?' ('+esc(e.botas_talla)+')':''}`);
      if(!partes.length && itemsPorEntregaDtl[e.id]){
        itemsPorEntregaDtl[e.id].forEach(it=> partes.push(`${esc(it.nombre_item)} × ${it.cantidad}${it.talla?' ('+esc(it.talla)+')':''}`));
      }
      if(e.adicional) partes.push(esc(e.adicional));
      const horaEnt = e.creado_en ? new Date(e.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'}) : '';
      const auditLinea = (e.ip_address||e.dispositivo_ua)
        ? `<div class="muted-sm">${e.ip_address?'IP '+esc(e.ip_address):''}${e.ip_address&&e.dispositivo_ua?' · ':''}${e.dispositivo_ua?esc(resumenDispositivoUA(e.dispositivo_ua)):''}</div>` : '';
      const itemsCol = esEscaneada
        ? `<span class="badge cerrada" style="margin-right:6px"><span class="dot"></span>Escaneado</span>${esc(e.adjunto_titulo||'')}`
        : (partes.join(', ')||'—');
      const responsableCol = esEscaneada
        ? `${esc(nombreDe(e.creado_por))}${correoDe(e.creado_por)?`<div class="muted-sm">${esc(correoDe(e.creado_por))}</div>`:''}`
        : esc(e.responsable_nombre||(e.via==='remoto'?'(entrega remota)':'—'));
      const accionesCol = esEscaneada
        ? `<div style="display:flex;gap:6px"><button class="icon-btn" title="Ver archivo" onclick="verAdjuntoEntrega('${e.id}','dtl_entregas')">${I.eye}</button>
           ${puedoTocarEntrega(e.creado_por)?`<button class="icon-btn" title="Editar entrega" onclick="abrirEditarEntregaEscaneada('${e.id}','${t.id}','dtl_entregas')">${I.pen}</button>
           <button class="icon-btn danger" title="Eliminar entrega" onclick="eliminarEntregaDtl('${e.id}','${t.id}')">${I.trash}</button>`:''}</div>`
        : (puedoTocarEntrega(e.creado_por)?`<div style="display:flex;gap:6px"><button class="icon-btn" title="Editar entrega" onclick="abrirEditarEntregaDtl('${e.id}','${t.id}')">${I.pen}</button>
        <button class="icon-btn danger" title="Eliminar entrega" onclick="eliminarEntregaDtl('${e.id}','${t.id}')">${I.trash}</button></div>`:'');
      return `<tr>
        <td>${fmtDate(e.fecha)}${horaEnt?`<div class="muted-sm">${horaEnt}</div>`:''}${auditLinea}</td>
        <td>${itemsCol}</td>
        <td>${responsableCol}</td>
        <td>${accionesCol}</td>
      </tr>`;
    }).join('');

    document.getElementById("app").innerHTML = `
      ${topbar('dotacionlegal')}
      <div class="wrap">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" id="btnVolverDtl">${I.back} Volver</button>
        </div>
        ${t.aviso_cedula_rh?`<div class="aviso-cedula"><span>${I.warn} ${esc(t.aviso_cedula_rh)}</span><button class="btn btn-ghost btn-sm" id="btnDescartarAvisoCedulaDtl">Descartar</button></div>`:''}
        <div class="page-head">
          <div><h1>${esc(t.nombre)}</h1><p>C.C. ${esc(t.identificacion)}${t.cargo?' · '+esc(t.cargo):''}${t.area?' · '+esc(t.area):''} · ${esc(nombreEntidadDtl(t.entidad_id))}${t.fecha_ingreso?' · Ingresó '+fmtDate(t.fecha_ingreso):''}${t.fecha_salida?' · Salió '+fmtDate(t.fecha_salida):''}${t.correo?' · '+esc(t.correo):''}</p></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            ${MIPERFIL.esAdmin?`<button class="btn btn-ghost" id="btnEditarTrabDtl">${I.pen} Editar datos</button>`:''}
            ${listaEntregas.length?(esContratoEscaneadoDtl
              ? `<button class="btn btn-ghost" id="btnZipAdjuntosDtl">${I.doc} Descargar ZIP</button>`
              : `<button class="btn btn-ghost" id="btnKardexDtl">${I.pdf} Imprimir kárdex</button>`):''}
            ${puedeEscribir()?`<button class="btn btn-primary" id="btnNuevaEntregaFichaDtl" title="${t.activo===false?'No se puede registrar entrega: el trabajador está inactivo':''}" ${t.activo===false?'disabled':''}>${I.plus} Registrar entrega</button>`:''}
          </div>
        </div>
        <div class="sec-bar"><h2>Historial de entregas</h2><span class="muted-sm">${listaEntregas.length} registrada(s)</span></div>
        ${listaEntregas.length?`<div class="table-wrap"><table class="dt"><thead><tr><th>Fecha</th><th>Elementos entregados</th><th>Responsable</th><th>Acciones</th></tr></thead><tbody>${filas}</tbody></table></div>`
          :`<div class="empty"><div class="ic">${I.box}</div><h3>Sin entregas todavía</h3><p>Registra la primera entrega de dotación para este trabajador.</p></div>`}
      </div>`;
    wireLogout();
    document.getElementById('btnVolverDtl').onclick = ()=> location.hash="#/dotacionlegal";
    const bet = document.getElementById('btnEditarTrabDtl'); if(bet) bet.onclick = ()=> abrirTrabajadorDtlForm(t.id);
    const bdac = document.getElementById('btnDescartarAvisoCedulaDtl'); if(bdac) bdac.onclick = ()=> descartarAvisoCedulaRh('dtl_trabajadores', t.id, ()=>renderFichaTrabajadorDtl(t.id));
    const bk = document.getElementById('btnKardexDtl'); if(bk) bk.onclick = ()=> generarKardexDtlPDF(t.id);
    const bzipDtl = document.getElementById('btnZipAdjuntosDtl'); if(bzipDtl) bzipDtl.onclick = ()=> descargarZipAdjuntosTrabajador('dtl_entregas', t.id, t.nombre);
    const bnef = document.getElementById('btnNuevaEntregaFichaDtl'); if(bnef) bnef.onclick = ()=> abrirNuevaEntregaDtl(t.id);
  } finally { desbloquear(); }
}

  openModal(`<div class="modal" style="max-width:440px">

/* ---------- Editar una entrega de Dotación ya registrada (fecha/ítems/responsable/
   firmas/foto). Mismo candado que el botón de lápiz de la ficha — admin siempre, editor
   solo la que él mismo registró (puedoTocar), sin límite de 24h desde CAMBIOS_SQL_55. ---------- */
let editarEntregaDtlDraft = null;
async function abrirEditarEntregaDtl(entregaId, trabajadorId){
  bloquear("Cargando…");
  let entrega, items = [], catalogoUnico = false;
  try{
    const { data:e } = await sb.from("dtl_entregas")
      .select("id,fecha,pantalon_cantidad,pantalon_talla,camisa_cantidad,camisa_talla,botas_cantidad,botas_talla,adicional,responsable_nombre,responsable_cargo,via,firma_trabajador,firma_responsable,foto_trabajador")
      .eq("id",entregaId).maybeSingle();
    entrega = e;
    const t = DTL.trabajadores.find(x=>x.id===trabajadorId);
    catalogoUnico = !!DTL.entidades.find(x=>x.id===t?.entidad_id)?.catalogo_unico;
    if(catalogoUnico){
      const { data:it } = await sb.from("dtl_entrega_items").select("id,nombre_item,cantidad,talla").eq("entrega_id",entregaId);
      items = it||[];
    }
  } finally { desbloquear(); }
  if(!entrega){ toast("Entrega no encontrada","err"); return; }
  editarEntregaDtlDraft = {
    id: entrega.id, trabajadorId,
    fecha: entrega.fecha,
    catalogoUnico: catalogoUnico,
    items: items.length ? items.map(it=>({ nombreItem: it.nombre_item, cantidad: it.cantidad, talla: it.talla||'' })) : [{ nombreItem:'', cantidad:1, talla:'' }],
    pantalonCantidad: entrega.pantalon_cantidad, pantalonTalla: entrega.pantalon_talla || '',
    camisaCantidad: entrega.camisa_cantidad, camisaTalla: entrega.camisa_talla || '',
    botasCantidad: entrega.botas_cantidad, botasTalla: entrega.botas_talla || '',
    adicional: entrega.adicional || '',
    responsableNombre: entrega.responsable_nombre || '', responsableCargo: entrega.responsable_cargo || '',
    via: entrega.via,
    firmaTrabajador: entrega.firma_trabajador || '',
    firmaResponsable: entrega.firma_responsable || '',
    fotoTrabajador: entrega.foto_trabajador || null
  };
  renderFormEditarEntregaDtl();
}

/* Editor de ítems de una entrega ya registrada, para entidades con "catálogo único"
   — calco de renderEeItemsList (EPP, líneas ~6032-6052): inputs de texto libre, no un
   select del catálogo (igual que EPP, que tampoco usa el catálogo para editar, solo
   para registrar una entrega nueva). */
function renderEeDtlItemsList(){
  const host = document.getElementById('eeDtlItemsList'); if(!host) return;
  const d = editarEntregaDtlDraft;
  host.innerHTML = d.items.map((it,i)=>`
    <div class="item-row" data-i="${i}">
      <span class="firmante-num">${i+1}</span>
      <input data-f="nombreItem" value="${esc(it.nombreItem||'')}" placeholder="Nombre del ítem">
      <input data-f="cantidad" type="number" min="1" step="1" value="${it.cantidad}" placeholder="Cant.">
      <input data-f="talla" value="${esc(it.talla||'')}" placeholder="Talla (opc.)">
      <button class="icon-btn danger" data-del="${i}" title="Quitar" ${d.items.length<=1?'disabled':''}>${I.trash}</button>
    </div>`).join('');
  host.querySelectorAll('input[data-f]').forEach(el=>{
    el.oninput = ()=>{
      const i = +el.closest('.item-row').dataset.i;
      const val = el.dataset.f==='cantidad' ? (+el.value||0) : el.value;
      d.items[i][el.dataset.f] = val;
    };
  });
  host.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{ if(d.items.length<=1) return; d.items.splice(+b.dataset.del,1); renderEeDtlItemsList(); };
  });
}

async function guardarEdicionEntregaDtl(){
  const d = editarEntregaDtlDraft;
  const fecha = document.getElementById('eeDtlFecha').value;
  const adicional = document.getElementById('eeDtlAdicional').value.trim();
  let payload, validosItems;
  if(d.catalogoUnico){
    validosItems = d.items.filter(it=>it.nombreItem && it.cantidad>0);
    if(!validosItems.length){ toast("Agrega al menos un ítem con nombre y cantidad","err"); return; }
    payload = { fecha, pantalon_cantidad:0, pantalon_talla:null, camisa_cantidad:0, camisa_talla:null, botas_cantidad:0, botas_talla:null, adicional: adicional||null };
  } else {
    const pantalonCantidad = +document.getElementById('eeDtlPantalonCant').value || 0;
    const pantalonTalla = document.getElementById('eeDtlPantalonTalla').value.trim();
    const camisaCantidad = +document.getElementById('eeDtlCamisaCant').value || 0;
    const camisaTalla = document.getElementById('eeDtlCamisaTalla').value.trim();
    const botasCantidad = +document.getElementById('eeDtlBotasCant').value || 0;
    const botasTalla = document.getElementById('eeDtlBotasTalla').value.trim();
    if(pantalonCantidad>0 && !pantalonTalla){ toast("Escribe la talla del pantalón","err"); return; }
    if(camisaCantidad>0 && !camisaTalla){ toast("Escribe la talla de la camisa","err"); return; }
    if(botasCantidad>0 && !botasTalla){ toast("Escribe la talla de las botas","err"); return; }
    payload = {
      fecha, pantalon_cantidad: pantalonCantidad, pantalon_talla: pantalonTalla||null,
      camisa_cantidad: camisaCantidad, camisa_talla: camisaTalla||null,
      botas_cantidad: botasCantidad, botas_talla: botasTalla||null,
      adicional: adicional||null
    };
  }
  payload.foto_trabajador = d.fotoTrabajador||null;
  if(d.via==='presencial'){
    payload.responsable_nombre = document.getElementById('eeDtlRespNombre').value.trim()||null;
    payload.responsable_cargo = document.getElementById('eeDtlRespCargo').value.trim()||null;
  }
  const btn = document.getElementById('btnEeDtlGuardar'); btn.disabled=true; btn.innerHTML="Guardando…";
  bloquear("Guardando cambios…");
  try{
    const { error } = await sb.from("dtl_entregas").update(payload).eq("id", d.id);
    if(error){ toast("No se pudo guardar: "+error.message,"err"); return; }
    if(d.catalogoUnico){
      await sb.from("dtl_entrega_items").delete().eq("entrega_id", d.id);
      const { error:e2 } = await sb.from("dtl_entrega_items").insert(validosItems.map(it=>({ entrega_id: d.id, nombre_item: it.nombreItem, cantidad: it.cantidad, talla: it.talla||null })));
      if(e2){ toast("Se guardó la entrega, pero hubo un error con los ítems: "+e2.message,"err"); closeModal(); renderFichaTrabajadorDtl(d.trabajadorId); return; }
    }
    toast("Entrega actualizada","ok");
    closeModal();
    renderFichaTrabajadorDtl(d.trabajadorId);
  } finally { desbloquear(); }
}

/* Resumen legible del user-agent capturado por el servidor en la entrega remota — solo
   identifica la familia de sistema operativo, no busca precisión de navegador/versión. */
function resumenDispositivoUA(ua){
  if(!ua) return null;
  if(/ipad/i.test(ua)) return 'iPad';
  if(/iphone/i.test(ua)) return 'iPhone';
  if(/android/i.test(ua)) return 'Android';
  if(/windows/i.test(ua)) return 'Windows';
  if(/macintosh|mac os x/i.test(ua)) return 'Mac';
  if(/linux/i.test(ua)) return 'Linux';
  return 'Otro dispositivo';
}

/* ---------- Kárdex acumulado en PDF ---------- */
async function construirKardexDtlPDF(trabajadorId, filtroFechas){
  const { data: t } = await sb.from("dtl_trabajadores").select("id,nombre,identificacion,cargo,area,entidad_id").eq("id",trabajadorId).maybeSingle();
  if(!t) return null;
  let q = sb.from("dtl_entregas")
    .select("id,fecha,pantalon_cantidad,pantalon_talla,camisa_cantidad,camisa_talla,botas_cantidad,botas_talla,adicional,responsable_nombre,firma_trabajador,firma_responsable,foto_trabajador,creado_en,via,ip_address,dispositivo_ua,tipo_registro,adjunto_titulo,adjunto_archivo,adjunto_tipo")
    .eq("trabajador_id", trabajadorId);
  if(filtroFechas){ q = q.gte("fecha", filtroFechas.desde).lte("fecha", filtroFechas.hasta); }
  const { data: entregas } = await q.order("fecha",{ascending:false}).order("creado_en",{ascending:false});
  const listaEntregas = entregas || [];
  if(!listaEntregas.length) return null;
  const nombreEntidad = (DTL.entidades.find(x=>x.id===t.entidad_id)||{}).nombre || "";
  const idsEntDtlPdf = listaEntregas.filter(e=>e.tipo_registro!=='escaneado').map(e=>e.id);
  const { data: itemsDtlPdf } = idsEntDtlPdf.length
    ? await sb.from("dtl_entrega_items").select("entrega_id,nombre_item,cantidad,talla").in("entrega_id", idsEntDtlPdf)
    : { data: [] };
  const itemsPorEntregaDtlPdf = {};
  (itemsDtlPdf||[]).forEach(it=>{ (itemsPorEntregaDtlPdf[it.entrega_id] = itemsPorEntregaDtlPdf[it.entrega_id]||[]).push(it); });

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const PW = 210, M = 10, RIGHT = PW - M;
  const x0=M, x1=M+18, x2=M+78, x2f=M+104, x3=M+139, x4=RIGHT;

  function grayHead(y,h){ doc.setFillColor(238,241,248); doc.rect(M,y,RIGHT-M,h,"F"); }

  function encabezado(){
    let y=M;
    const hH=24, logoW=44;
    doc.setDrawColor(150,160,190); doc.setLineWidth(0.3); doc.rect(M,y,RIGHT-M,hH);
    doc.line(M+logoW,y,M+logoW,y+hH);
    try{ doc.addImage(LOGO,"JPEG",M+4,y+2,36,36*315/570); }catch(e){}
    doc.setTextColor(20,33,90); doc.setFont("helvetica","bold"); doc.setFontSize(14);
    doc.text("CONTROL DE ENTREGA DE DOTACIÓN", M+logoW+(RIGHT-M-logoW)/2, y+13, {align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(90,90,110);
    doc.text(pdfTexto("Kárdex acumulado por trabajador"+(nombreEntidad?" · "+nombreEntidad:"")+" · Don Aseo Ltda."), M+logoW+(RIGHT-M-logoW)/2, y+19, {align:"center"});
    y += hH;

    const fh=16;
    doc.setDrawColor(150,160,190); doc.rect(M,y,RIGHT-M,fh);
    doc.line(M+95,y,M+95,y+fh);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(90,90,110);
    doc.text("TRABAJADOR", M+3, y+5);
    doc.text("CARGO / ÁREA", M+98, y+5);
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
    doc.text(pdfTexto(t.nombre||""), M+3, y+11);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(60,60,70);
    doc.text("C.C. "+(t.identificacion||""), M+3, y+15.5);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(20,20,20);
    doc.text(doc.splitTextToSize(pdfTexto((t.cargo||"—")+(t.area?(" · "+t.area):"")), RIGHT-M-100), M+98, y+11);
    y += fh + 2;
    return y;
  }

  function tablaHead(y){
    const h=8;
    grayHead(y,h);
    doc.setDrawColor(150,160,190);
    [x0,x1,x2,x2f,x3,x4].forEach(x=>doc.line(x,y,x,y+h));
    doc.rect(M,y,RIGHT-M,h);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(40,40,60);
    const ct=(a,b,txt)=>doc.text(txt,(a+b)/2,y+5.2,{align:"center"});
    ct(x0,x1,"FECHA"); ct(x1,x2,"ELEMENTOS ENTREGADOS");
    ct(x2,x2f,"FOTO"); ct(x2f,x3,"FIRMA TRABAJADOR"); ct(x3,x4,"FIRMA RESPONSABLE");
    return y+h;
  }

  const FOOTER_Y = 282;
  function piePagina(pag){
    doc.setFontSize(5.8); doc.setTextColor(140,140,160);
    doc.text(doc.splitTextToSize(pdfTexto(DTL_DECLARACION), RIGHT-M), PW/2, FOOTER_Y-4, {align:"center"});
    doc.text("Generado el "+fmtDateTime(new Date())+" · Don Aseo Ltda. · Pág. "+pag, PW/2, FOOTER_Y+8, {align:"center"});
  }

  const FOOTER_TOP = 265;
  const colFotoW = x2f-x2-4;
  // Decodificar todas las fotos EN PARALELO antes de dibujar (ver mismo comentario
  // en construirKardexPDF de EPP).
  const dimsPorEntrega = {};
  await Promise.all(listaEntregas.map(async e=>{
    if(e.tipo_registro==='escaneado'){
      if(e.adjunto_archivo && e.adjunto_tipo!=='application/pdf') dimsPorEntrega[e.id] = await getImageSize(e.adjunto_archivo);
    } else if(e.foto_trabajador) dimsPorEntrega[e.id] = await getImageSize(e.foto_trabajador);
  }));
  // Firmas convertidas a JPEG en paralelo (ver mismo comentario en construirKardexPDF de EPP).
  const firmasJpgPorEntrega = {};
  await Promise.all(listaEntregas.map(async e=>{
    if(e.tipo_registro==='escaneado') return;
    const [t,r] = await Promise.all([firmaParaPdf(e.firma_trabajador), firmaParaPdf(e.firma_responsable)]);
    firmasJpgPorEntrega[e.id] = { t, r };
  }));
  let y = encabezado();
  y = tablaHead(y);
  let pag = 1;
  for(const e of listaEntregas){
    const esEscaneada = e.tipo_registro === 'escaneado';
    const partes = [];
    if(e.pantalon_cantidad>0) partes.push("• Pantalón × "+e.pantalon_cantidad+(e.pantalon_talla?" ("+e.pantalon_talla+")":""));
    if(e.camisa_cantidad>0) partes.push("• Camisa × "+e.camisa_cantidad+(e.camisa_talla?" ("+e.camisa_talla+")":""));
    if(e.botas_cantidad>0) partes.push("• Botas × "+e.botas_cantidad+(e.botas_talla?" ("+e.botas_talla+")":""));
    if(!partes.length && itemsPorEntregaDtlPdf[e.id]){
      itemsPorEntregaDtlPdf[e.id].forEach(it=> partes.push("• "+it.nombre_item+" × "+it.cantidad+(it.talla?" ("+it.talla+")":"")));
    }
    if(e.adicional) partes.push("• "+e.adicional);
    const lineas = esEscaneada ? [pdfTexto(e.adjunto_titulo||'Entrega escaneada')] : (partes.length ? partes : ["—"]);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.4);
    const wrapped = doc.splitTextToSize(pdfTexto(lineas.join("\n")), x2-x1-4);
    const tieneAuditoria = !!(e.ip_address || e.dispositivo_ua);
    let rowH = Math.max(tieneAuditoria ? 22 : 16, wrapped.length*3.6 + 5);
    let fotoH = 0;
    const dims = dimsPorEntrega[e.id] || null;
    if(dims && dims.w>0){ fotoH = Math.min(90, colFotoW * (dims.h/dims.w)); rowH = Math.max(rowH, fotoH+4); }
    if(y + rowH > FOOTER_TOP){
      piePagina(pag);
      doc.addPage(); pag++;
      y = M+2; y = tablaHead(y);
    }
    doc.setDrawColor(180,188,210);
    [x0,x1,x2,x2f,x3,x4].forEach(x=>doc.line(x,y,x,y+rowH));
    doc.line(M,y+rowH,RIGHT,y+rowH);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(20,20,20);
    doc.text(fmtDate(e.fecha), (x0+x1)/2, y+rowH/2-0.5, {align:"center"});
    let yAudit = y+rowH/2+4;
    if(e.creado_en){
      const horaFirma = new Date(e.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'});
      doc.setFontSize(6.5); doc.setTextColor(120,120,140);
      doc.text(horaFirma, (x0+x1)/2, yAudit, {align:"center"});
      yAudit += 3;
    }
    if(tieneAuditoria){
      doc.setFontSize(5.3); doc.setTextColor(150,150,170);
      if(e.ip_address){ doc.text("IP "+e.ip_address, (x0+x1)/2, yAudit, {align:"center"}); yAudit += 2.6; }
      const disp = resumenDispositivoUA(e.dispositivo_ua);
      if(disp) doc.text(disp, (x0+x1)/2, yAudit, {align:"center"});
    }
    doc.setFont("helvetica","normal"); doc.setFontSize(7.4); doc.setTextColor(20,20,20);
    doc.text(wrapped, x1+2, y+5);
    if(esEscaneada){
      if(e.adjunto_tipo==='application/pdf'){
        doc.setFont("helvetica","italic"); doc.setFontSize(6.6); doc.setTextColor(130,130,150);
        doc.text(doc.splitTextToSize("Archivo PDF adjunto — ver en el sistema", x4-x2-4), x2+2, y+rowH/2-1);
        doc.setFont("helvetica","normal");
      } else if(e.adjunto_archivo){
        try{
          if(dims && dims.w>0) doc.addImage(e.adjunto_archivo,"JPEG",x2+2,y+2,colFotoW,fotoH);
          else doc.addImage(e.adjunto_archivo,"JPEG",x2+2,y+2,colFotoW,rowH-4);
        }catch(err){}
      }
    } else {
      if(e.foto_trabajador){
        try{
          if(dims && dims.w>0) doc.addImage(e.foto_trabajador,"JPEG",x2+2,y+2,colFotoW,fotoH);
          else doc.addImage(e.foto_trabajador,"JPEG",x2+2,y+2,colFotoW,rowH-4);
        }catch(err){}
      }
      if(e.firma_trabajador){ try{ doc.addImage((firmasJpgPorEntrega[e.id]||{}).t||e.firma_trabajador,"JPEG",x2f+3,y+2,x3-x2f-6,rowH-4); }catch(err){} }
      if(e.firma_responsable){ try{ doc.addImage((firmasJpgPorEntrega[e.id]||{}).r||e.firma_responsable,"JPEG",x3+3,y+2,x4-x3-6,rowH-4); }catch(err){} }
      else if(e.via==='remoto'){
        doc.setFont("helvetica","italic"); doc.setFontSize(7.5); doc.setTextColor(130,130,150);
        doc.text("Firmado remotamente", (x3+x4)/2, y+rowH/2, {align:"center"});
        doc.setFont("helvetica","normal");
      }
    }
    doc.setFontSize(6); doc.setTextColor(120,120,140);
    if(e.responsable_nombre) doc.text(pdfTexto(e.responsable_nombre), x3+3, y+rowH-1.5);
    y += rowH;
  }
  piePagina(pag);

  const safe = (t.nombre||"trabajador").replace(/[^\w\sáéíóúñ-]/gi,"").trim().replace(/\s+/g,"_").slice(0,40);
  return { doc, nombreBase: safe };
}

async function generarKardexDtlPDF(trabajadorId){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  bloquear("Generando PDF…");
  try{
    const r = await construirKardexDtlPDF(trabajadorId);
    if(!r){ toast("Este trabajador no tiene entregas registradas","err"); return; }
    r.doc.save("Kardex_dotacion_"+r.nombreBase+".pdf");
    toast("PDF generado","ok");
  }catch(e){ console.error(e); toast("No se pudo generar el PDF: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* Elegir qué entidades incluir antes de generar el ZIP — evita procesar los 600+ trabajadores
   de golpe cuando la vista combinada (sección 7.17) no tiene ya una "entidad actual" que acotar. */
function abrirSeleccionZipDtl(){
  const preseleccion = dtlFiltroEntidad!=='todas' ? [dtlFiltroEntidad] : [];
  openModal(`<div class="modal" style="max-width:480px">
    <div class="modal-head"><div><h2>Descargar kárdex (ZIP)</h2><p>Elige qué contratos incluir — entre más elijas, más tarda en generarse.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
        <button class="btn btn-ghost btn-sm" id="btnZipDtlTodas">Seleccionar todos</button>
      </div>
      <div id="zipDtlLista">
        ${DTL.entidades.length
          ? DTL.entidades.map(en=>`<label class="chk" style="padding:4px 0"><input type="checkbox" data-zip-entidad="${en.id}" ${preseleccion.includes(en.id)?'checked':''}> ${esc(en.nombre)}</label>`).join('')
          : '<p class="muted-sm">No hay contratos creados.</p>'}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnZipDtlDescargar">${I.doc} Descargar ZIP</button>
    </div>
  </div>`);
  document.getElementById('btnZipDtlTodas').onclick = ()=>{
    document.querySelectorAll('[data-zip-entidad]').forEach(chk=>chk.checked=true);
  };
  document.getElementById('btnZipDtlDescargar').onclick = ()=>{
    const ids = Array.from(document.querySelectorAll('[data-zip-entidad]:checked')).map(el=>el.dataset.zipEntidad);
    if(!ids.length){ toast("Elige al menos un contrato","err"); return; }
    closeModal();
    descargarZipKardexDtlSeleccion(ids);
  };
}

async function descargarZipKardexDtlSeleccion(entidadIds){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  if(!window.JSZip){ toast("No se pudo cargar el compresor ZIP (revisa tu conexión)","err"); return; }
  const idsSet = new Set(entidadIds);
  const candidatos = DTL.trabajadores.filter(t=>idsSet.has(t.entidad_id));
  const idsConEntrega = new Set(DTL.entregas.map(e=>e.trabajador_id));
  const lista = candidatos.filter(t=>idsConEntrega.has(t.id));
  if(!candidatos.length){ toast("No hay trabajadores para exportar","err"); return; }
  if(!lista.length){ toast("Ninguno de los trabajadores elegidos tiene entregas registradas todavía","err"); return; }
  bloquear("Preparando ZIP…");
  try{
    const zip = new JSZip();
    const usados = {};
    let incluidos = 0, sinEntregas = candidatos.length - lista.length;
    for(let i=0;i<lista.length;i++){
      const t = lista[i];
      bloquearMsg(`Generando kárdex ${i+1} de ${lista.length}…`);
      try{
        const r = await construirKardexDtlPDF(t.id);
        if(!r){ sinEntregas++; continue; }
        let base = r.nombreBase || ('trabajador_'+(i+1));
        if(usados[base]!=null){ usados[base]++; base = base+'_'+usados[base]; } else usados[base]=0;
        zip.file(base+'.pdf', r.doc.output('arraybuffer'));
        incluidos++;
      }catch(e){ console.warn('kardex zip', t.id, e); }
    }
    if(!incluidos){ toast("Ningún trabajador tiene entregas registradas todavía","err"); return; }
    bloquearMsg("Comprimiendo ZIP…");
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
    const url = URL.createObjectURL(blob);
    const nombreEntidad = entidadIds.length===DTL.entidades.length ? 'todos_los_contratos' : (entidadIds.length===1 ? nombreEntidadDtl(entidadIds[0]) : entidadIds.length+'_contratos');
    const safeEntidad = String(nombreEntidad).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,40);
    const a = document.createElement('a'); a.href=url;
    a.download = 'Kardex_dotacion_'+safeEntidad+'.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 6000);
    let msg = `ZIP generado con ${incluidos} kárdex`;
    if(sinEntregas) msg += ` (${sinEntregas} trabajador(es) sin entregas, omitido(s))`;
    toast(msg,"ok");
  }catch(e){ console.error(e); toast("No se pudo generar el ZIP: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* Selección de contratos para el Excel de entregas de Dotación — mismo modal que el ZIP, distinta acción. */
/* Ya no pregunta qué contrato(s) incluir: descarga directo el contrato activo del
   selector de arriba, o todos si el selector está en "Todos los contratos". */
function descargarExcelDtl(){
  const ids = dtlFiltroEntidad==='todas' ? DTL.entidades.map(en=>en.id) : [dtlFiltroEntidad];
  if(!ids.length){ toast("No hay contratos para exportar","err"); return; }
  descargarExcelDtlSeleccion(ids);
}

/* Excel de entregas de Dotación: una fila por entrega (nombre/identificación/cargo/área + fecha/ítems/responsable).
   Los trabajadores sin ninguna entrega también aparecen, con esas columnas en blanco. */
async function descargarExcelDtlSeleccion(entidadIds){
  if(!window.XLSX){ toast("No se pudo cargar el generador de Excel (revisa tu conexión)","err"); return; }
  const idsSet = new Set(entidadIds);
  const trabajadores = DTL.trabajadores.filter(t=>idsSet.has(t.entidad_id));
  if(!trabajadores.length){ toast("No hay trabajadores para exportar","err"); return; }
  bloquear("Generando Excel…");
  try{
    const idsTrab = trabajadores.map(t=>t.id);
    const { data: entregas, error } = await sb.from("dtl_entregas")
      .select("id,trabajador_id,fecha,pantalon_cantidad,pantalon_talla,camisa_cantidad,camisa_talla,botas_cantidad,botas_talla,adicional,responsable_nombre,via")
      .in("trabajador_id", idsTrab).order("fecha",{ascending:true});
    if(error){ toast("No se pudo cargar: "+error.message,"err"); return; }
    const entregasPorTrab = {};
    (entregas||[]).forEach(e=>{ (entregasPorTrab[e.trabajador_id]=entregasPorTrab[e.trabajador_id]||[]).push(e); });
    const idsEntXls = (entregas||[]).map(e=>e.id);
    const { data: itemsXls } = idsEntXls.length
      ? await sb.from("dtl_entrega_items").select("entrega_id,nombre_item,cantidad,talla").in("entrega_id", idsEntXls)
      : { data: [] };
    const itemsPorEntregaXls = {};
    (itemsXls||[]).forEach(it=>{ (itemsPorEntregaXls[it.entrega_id] = itemsPorEntregaXls[it.entrega_id]||[]).push(it); });

    const filas = [];
    trabajadores.forEach(t=>{
      const nombreContrato = nombreEntidadDtl(t.entidad_id);
      const entregasT = entregasPorTrab[t.id] || [];
      if(!entregasT.length){
        filas.push({ Contrato:nombreContrato, 'Nombre completo':t.nombre, 'Identificación':t.identificacion, Cargo:t.cargo||'', 'Área':t.area||'', 'Fecha de entrega':'', 'Ítems entregados':'', Responsable:'' });
      } else {
        entregasT.forEach(e=>{
          const partes = [];
          if(e.pantalon_cantidad>0) partes.push('Pantalón × '+e.pantalon_cantidad+(e.pantalon_talla?' ('+e.pantalon_talla+')':''));
          if(e.camisa_cantidad>0) partes.push('Camisa × '+e.camisa_cantidad+(e.camisa_talla?' ('+e.camisa_talla+')':''));
          if(e.botas_cantidad>0) partes.push('Botas × '+e.botas_cantidad+(e.botas_talla?' ('+e.botas_talla+')':''));
          if(!partes.length && itemsPorEntregaXls[e.id]){
            itemsPorEntregaXls[e.id].forEach(it=> partes.push(it.nombre_item+' × '+it.cantidad+(it.talla?' ('+it.talla+')':'')));
          }
          if(e.adicional) partes.push(e.adicional);
          filas.push({
            Contrato: nombreContrato, 'Nombre completo': t.nombre, 'Identificación': t.identificacion,
            Cargo: t.cargo||'', 'Área': t.area||'',
            'Fecha de entrega': fmtDate(e.fecha), 'Ítems entregados': partes.join(', ') || '—',
            Responsable: e.responsable_nombre || (e.via==='remoto' ? '(entrega remota)' : '')
          });
        });
      }
    });
    const ws = XLSX.utils.json_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Dotación');
    const nombreArchivo = entidadIds.length===DTL.entidades.length ? 'todos_los_contratos' : (entidadIds.length===1 ? nombreEntidadDtl(entidadIds[0]) : entidadIds.length+'_contratos');
    const safe = String(nombreArchivo).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,40);
    XLSX.writeFile(wb, 'Entregas_Dotacion_'+safe+'.xlsx');
    toast("Excel generado","ok");
  }catch(e){ console.error(e); toast("No se pudo generar el Excel: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

    <div class="pub-wrap"><div class="pub-card"><div class="pub-body">

      <div class="field"><label>Número de identificación (cédula) *</label><input id="dpCedula" inputmode="numeric" placeholder="C.C."></div>

      <button class="btn btn-primary" id="dpBuscarBtn" style="width:100%;padding:13px;margin-top:6px">${I.check} Continuar</button>
    </div></div></div>`;
  document.getElementById('dpBuscarBtn').onclick = async ()=>{
    const cedula = document.getElementById('dpCedula').value.trim();
    const err = document.getElementById('dpError');
    err.textContent = '';
    if(!cedula){ err.textContent = 'Escribe tu cédula.'; return; }
    const btn = document.getElementById('dpBuscarBtn'); btn.disabled=true; btn.innerHTML='Buscando…';
    const { data, error } = await sb.rpc('dtl_publico_buscar', { p_cedula: cedula });

    if(error || !data || !data.ok){

async function confirmarEntregaDtlPublica(){
  const err = document.getElementById('dpError'); err.textContent = '';
  const t = dtlPublicoState.trabajador;
  const adicional = document.getElementById('dpAdicional').value.trim() || null;
  let rpc, params;
  if(t.catalogo_unico){
    const items = [];
    dtlPublicoState.catalogo.forEach(c=>{
      const s = dtlPublicoState.seleccion[c.id];
      if(!s || !s.incluido) return;
      const cant = +s.cantidad || 0;
      if(cant>0) items.push({ nombre: c.nombre, cantidad: cant, talla: (s.talla||'').trim()||null });
    });
    if(!items.length){ err.textContent = 'Selecciona al menos un ítem que estás recibiendo.'; return; }
    rpc = 'dtl_publico_registrar_items';
    params = { p_trabajador_id: t.id, p_items: items, p_adicional: adicional, p_firma_trabajador: null, p_foto_trabajador: dtlPublicoState.foto };
  } else {
    const pCant = +document.getElementById('dpPantalonCant').value || 0;
    const pTalla = document.getElementById('dpPantalonTalla').value.trim();
    const cCant = +document.getElementById('dpCamisaCant').value || 0;
    const cTalla = document.getElementById('dpCamisaTalla').value.trim();
    const bCant = +document.getElementById('dpBotasCant').value || 0;
    const bTalla = document.getElementById('dpBotasTalla').value.trim();
    if(pCant>0 && !pTalla){ err.textContent = 'Escribe la talla del pantalón.'; return; }
    if(cCant>0 && !cTalla){ err.textContent = 'Escribe la talla de la camisa.'; return; }
    if(bCant>0 && !bTalla){ err.textContent = 'Escribe la talla de las botas.'; return; }
    rpc = 'dtl_publico_registrar';
    params = {
      p_trabajador_id: t.id,
      p_pantalon_cantidad: pCant, p_pantalon_talla: pTalla || null,
      p_camisa_cantidad: cCant, p_camisa_talla: cTalla || null,
      p_botas_cantidad: bCant, p_botas_talla: bTalla || null,
      p_adicional: adicional, p_firma_trabajador: null, p_foto_trabajador: dtlPublicoState.foto
    };
  }
  if(APP_CONFIG.dotacionFotoObligatoria && !dtlPublicoState.foto){ err.textContent = 'Tu foto es obligatoria para continuar.'; return; }
  if(!sigPad || sigPad.isEmpty()){ err.textContent = 'Falta tu firma.'; return; }
  const btn = document.getElementById('dpConfirmarBtn'); btn.disabled=true; btn.innerHTML='Guardando…';
  params.p_firma_trabajador = sigPad.dataURL();
  const { data, error } = await sb.rpc(rpc, params);
  if(error || !data || !data.ok){
    btn.disabled=false; btn.innerHTML=`${I.check} Confirmar entrega`;
    err.textContent = (error && error.message) ? error.message : 'No se pudo registrar la entrega. Intenta de nuevo.';
    return;
  }
  renderDtlPublicoExito();
}

function renderDtlPublicoExito(){
  document.getElementById("app").innerHTML = pantallaFirmaOk("¡Listo!", "Tu entrega de dotación quedó registrada correctamente.");
}

/* ---------- Enlace "trabajadores nuevos" de Dotación (#/dotacionlegal/entrega-nuevo/<entidadId>).
   Mismo concepto que el de EPP: crea la ficha primero, y reutiliza el mismo
   formulario/RPC de registro del enlace normal (renderDtlPublicoFormulario/
   confirmarEntregaDtlPublica). ---------- */
async function renderDtlPublicoNuevo(entidadId){
  dtlPublicoState = { trabajador:null, foto:null };
  await cargarAppConfig();
  bloquear("Cargando…");
  const { data, error } = await sb.rpc('dtl_publico_entidad_info', { p_entidad_id: entidadId });
  desbloquear();
  if(error || !data || !data.ok || !data.activo){
    document.getElementById("app").innerHTML = pantallaFirmaOk("Enlace no disponible", "Este enlace ya no está activo. Contacta a tu supervisor.");
    return;
  }
  renderDtlPublicoNuevoFormulario(entidadId, data.nombre, !!data.catalogo_unico);
}

function renderDtlPublicoNuevoFormulario(entidadId, nombreEntidad, catalogoUnico){
  document.getElementById("app").innerHTML = `
    <div class="pub-wrap"><div class="pub-card"><div class="pub-body">

      <div class="field"><label>Número de identificación (cédula) *</label><input id="npDtlCedula" inputmode="numeric" placeholder="C.C."></div>
      <div class="field"><label>Cargo <span class="opt">(opcional)</span></label><input id="npDtlCargo" placeholder="Cargo"></div>
      <div id="npDtlError" class="login-err"></div>

    </div></div></div>`;
  document.getElementById('npDtlContinuarBtn').onclick = async ()=>{
    const nombre = document.getElementById('npDtlNombre').value.trim();

    const { data, error } = await sb.rpc('dtl_publico_crear_nuevo', { p_entidad_id: entidadId, p_nombre: nombre, p_cedula: cedula, p_cargo: cargo||null });

        : 'No se pudo crear tu ficha. Intenta de nuevo.';
      return;
    }
    dtlPublicoState.trabajador = { id: data.trabajador_id, nombre, identificacion: cedula, cargo, entidad_id: entidadId, entidad_nombre: nombreEntidad, catalogo_unico: catalogoUnico };
    await renderDtlPublicoFormulario();

/* ============================================================
   MÓDULO INSPECCIONES · Formatos de inspección configurables (checklist
   con secciones info/checklist/tabla_dinamica), llenados desde el
   celular por un inspector logueado, con firma del inspector y del
   responsable del área — por contrato, mismo patrón que EPP/Dotación.
   ============================================================ */
let INSPECCIONES = { contratos: [], formatos: [], predeterminados: [], herramientas: [], mantenimientos: [], enlaces: [], inspecciones: [] };
let contratoInspActualId = localStorage.getItem('insp_contrato_actual') || null;
let inspSubtabActiva = null; // recuerda la pestaña elegida (preop/insp/hv/formatos) entre refrescos silenciosos
let formatosInspFiltroTipo = 'todos'; // filtro de "Formatos": todos/inspeccion/preoperacional

async function loadInspeccionesState(){
  const [co, fo, en, ins, pd] = await Promise.all([
    sb.from("insp_contratos").select("id,nombre,activo,creado_en").order("creado_en",{ascending:true}),
    sb.from("insp_formatos").select("id,nombre,activo,tiene_fotos,firmantes,color_acento,mostrar_cumplimiento,tipo").order("nombre",{ascending:true}),
    sb.from("insp_enlaces").select("id,contrato_id,formato_id,predeterminado_id,firmantes_banco,herramienta_id,nombre,formato_nombre,tiene_fotos,firmantes,color_acento,mostrar_cumplimiento,tipo,activo,creado_en").order("creado_en",{ascending:true}),
    cargarTodasFilas(()=> sb.from("insp_inspecciones").select("id,enlace_id,contrato_id,formato_nombre,creado_en,creado_por,inspector_nombre").order("creado_en",{ascending:false}).order("id",{ascending:true})),
    // Banco de firmas GLOBAL (igual que "Formatos") — no por contrato, ver [[CAMBIOS_SQL_63]].
    sb.from("insp_predeterminados").select("id,nombre,responsable_nombre,responsable_cargo,firma").order("nombre",{ascending:true})
  ]);
  const err = co.error || fo.error || en.error || ins.error || pd.error;
  if(err){ console.warn(err); toast("Error cargando Inspecciones: "+err.message,"err"); }
  INSPECCIONES.contratos = co.data || [];
  INSPECCIONES.formatos = fo.data || [];
  INSPECCIONES.enlaces = en.data || [];
  INSPECCIONES.inspecciones = ins.data || [];
  INSPECCIONES.predeterminados = pd.data || [];
  // Si el contrato guardado ya no existe (o nunca se eligió uno), cae al primero activo, o al primero que haya
  const existe = contratoInspActualId==='todos' || INSPECCIONES.contratos.some(x=>x.id===contratoInspActualId);
  if(!existe){
    const primero = INSPECCIONES.contratos.find(x=>x.activo) || INSPECCIONES.contratos[0];
    contratoInspActualId = primero ? primero.id : null;
    if(contratoInspActualId) localStorage.setItem('insp_contrato_actual', contratoInspActualId);
  }
  // Herramientas/equipos del catálogo: esa sí sigue siendo POR CONTRATO (a diferencia de
  // Formatos/Firmas) — cada contrato tiene sus propios equipos físicos.
  if(contratoInspActualId && contratoInspActualId!=='todos'){
    const { data:hr, error:ehr } = await sb.from("insp_herramientas").select("id,contrato_id,nombre,codigo,activo").eq("contrato_id", contratoInspActualId).order("nombre",{ascending:true});
    if(ehr) console.warn(ehr);
    INSPECCIONES.herramientas = hr || [];
  } else {
    INSPECCIONES.herramientas = [];
  }
  // Mantenimientos: mismo criterio que Herramientas — por contrato, cada equipo físico
  // tiene su propio historial de mantenimiento.
  if(contratoInspActualId && contratoInspActualId!=='todos'){
    const { data:mt, error:emt } = await sb.from("insp_mantenimientos")
      .select("id,contrato_id,herramienta_id,herramienta_nombre,fecha,frecuencia,tipo,descripcion,responsable_nombre,creado_en")
      .eq("contrato_id", contratoInspActualId).order("fecha",{ascending:false});
    if(emt) console.warn(emt);
    INSPECCIONES.mantenimientos = mt || [];
  } else {
    INSPECCIONES.mantenimientos = [];
  }
}
function contratoInspActual(){ return INSPECCIONES.contratos.find(x=>x.id===contratoInspActualId) || null; }
function inspeccionesDelContrato(){
  return contratoInspActualId==='todos' ? INSPECCIONES.inspecciones : INSPECCIONES.inspecciones.filter(i=>i.contrato_id===contratoInspActualId);
}
function enlacesDelContrato(){
  return contratoInspActualId==='todos' ? INSPECCIONES.enlaces : INSPECCIONES.enlaces.filter(e=>e.contrato_id===contratoInspActualId);
}

/* comoRaiz=true: igual que en abrirFormContrato (EPP) — se abre sin modal "padre" al que
   volver (ej. desde "Crea tu primer contrato"), así la X/Cancelar cierra de una. */
function abrirFormContratoInsp(id, alGuardar, comoRaiz){
  const x = id ? INSPECCIONES.contratos.find(c=>c.id===id) : null;
  const html = `<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>${x?'Renombrar contrato':'Nuevo contrato'}</h2><p>Ej. "Corabastos", "Hospital de Medellín"…</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>Nombre *</label><input id="ciNombre" value="${esc(x?.nombre||'')}" placeholder="Nombre del contrato"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarContratoInsp">${I.check} Guardar</button>
    </div></div>`;
  if(comoRaiz) openModal(html); else openSubModal(html, ()=> alGuardar ? alGuardar() : abrirGestionContratosInsp());
  document.getElementById('btnGuardarContratoInsp').onclick = async ()=>{
    const nombre = document.getElementById('ciNombre').value.trim();
    if(!nombre){ toast("Ponle un nombre","err"); return; }
    const btn = document.getElementById('btnGuardarContratoInsp'); btn.disabled=true; btn.innerHTML="Guardando…";
    const { error } = x
      ? await sb.from("insp_contratos").update({ nombre }).eq("id", x.id)
      : await sb.from("insp_contratos").insert({ nombre });
    if(error){ btn.disabled=false; btn.innerHTML=`${I.check} Guardar`; toast("No se pudo guardar: "+error.message,"err"); return; }
    await loadInspeccionesState();
    toast(x?"Contrato actualizado":"Contrato creado","ok");
    closeModal();
    if(comoRaiz && alGuardar) alGuardar();
    refrescarPanelInspSiVisible();
  };
}

/* ---------- Constructor de formatos: secciones info / checklist / tabla_dinamica ---------- */
let formatoEditorId = null;
let enlaceEditorId = null; // si no es null, el constructor edita un insp_enlaces (activo en uso), no un insp_formatos (plantilla)
let formatoEditorState = null; // { nombre, activo, tiene_fotos, estructura:[...] }

function nuevoIdCampoInsp(){ return 'c'+Math.random().toString(36).slice(2,9); }
function etiquetaTipoInsp(tipo){ return tipo==='preoperacional' ? 'Preoperacional' : tipo==='inventario' ? 'Inventario' : 'Inspección'; }
function etiquetaFrecuenciaMantInsp(f){ return {mensual:'Mensual', semestral:'Semestral', anual:'Anual'}[f] || f || '—'; }
function etiquetaTipoMantInsp(t){ return {correctivo:'Correctivo', preventivo:'Preventivo'}[t] || t || '—'; }
// Mismo default que la columna insp_formatos.firmantes en Supabase (CAMBIOS_SQL_56) —
// reproduce EXACTO el comportamiento de siempre (Inspector fresco + Responsable del
// área banco) para que un formato sin personalizar no cambie nada.
const FIRMANTES_DEFAULT_INSP = [{id:'inspector',rol:'Inspector',origen:'fresco'},{id:'responsable',rol:'Responsable del área',origen:'banco'}];

/* Campos de texto corto de secciones "info" — son los únicos que un firmante "en
   vivo" puede vincular como su nombre (ver renderFirmantesFormatoInsp), para no
   tener que volver a escribirlo al firmar abajo. */
function camposTextoInfoInsp(estructura){
  const out = [];
  (estructura||[]).forEach(s=>{
    if(s.tipo==='info'){
      (s.campos||[]).forEach(c=>{
        if(c.tipo==='texto') out.push({ id:c.id, etiqueta:c.etiqueta||'(sin nombre)', seccion:s.titulo||'' });
      });
    }
  });
  return out;
}
function campoInfoTexto(estructura, campoId){
  if(!campoId) return null;
  return camposTextoInfoInsp(estructura).find(c=>c.id===campoId) || null;
}

async function renderConstructorFormatoInsp(formatoId, enlaceId){
  formatoEditorId = formatoId;
  enlaceEditorId = enlaceId || null;
  if(formatoId || enlaceId){
    bloquear(enlaceId ? "Cargando…" : "Cargando formato…");
    const { data, error } = enlaceId
      ? await sb.from("insp_enlaces").select("formato_nombre,tiene_fotos,estructura,firmantes,color_acento,mostrar_cumplimiento,tipo,imagen_pdf,activo").eq("id",enlaceId).maybeSingle()
      : await sb.from("insp_formatos").select("*").eq("id",formatoId).maybeSingle();
    desbloquear();
    if(error || !data){ toast(enlaceId?"No se pudo cargar":"No se pudo cargar el formato","err"); location.hash="#/inspecciones"; return; }
    formatoEditorState = {
      nombre: (enlaceId ? data.formato_nombre : data.nombre) || "", activo: data.activo!==false,
      estructura: Array.isArray(data.estructura) ? JSON.parse(JSON.stringify(data.estructura)) : [],
      firmantes: Array.isArray(data.firmantes) ? JSON.parse(JSON.stringify(data.firmantes)) : JSON.parse(JSON.stringify(FIRMANTES_DEFAULT_INSP)),
      color_acento: data.color_acento || '#14215a',
      mostrar_cumplimiento: data.mostrar_cumplimiento !== false,
      tipo: ['preoperacional','inventario'].includes(data.tipo) ? data.tipo : 'inspeccion',
      imagen_pdf: data.imagen_pdf || null

    // Compatibilidad con formatos/enlaces guardados antes de que "fotos" fuera una
    // sección movible: si tenían fotos activadas pero ninguna sección tipo 'fotos' en
    // su estructura, se la agregamos al final — mismo lugar donde siempre salían.
    if(data.tiene_fotos!==false && !formatoEditorState.estructura.some(s=>s.tipo==='fotos')){
      formatoEditorState.estructura.push({ id: nuevoIdCampoInsp(), tipo:'fotos', titulo:'Registro fotográfico', max:5, requerido:false });

    formatoEditorState = { nombre:"", activo:true, estructura: [{ id: nuevoIdCampoInsp(), tipo:'fotos', titulo:'Registro fotográfico', max:5, requerido:false }], firmantes: JSON.parse(JSON.stringify(FIRMANTES_DEFAULT_INSP)), color_acento: '#14215a', mostrar_cumplimiento: true, tipo: 'inspeccion', imagen_pdf: null };

  // nada, y hasta se puede "probar" (marcar checklist, escribir respuestas, subir una
  // foto de prueba) porque es el mismo formulario real, solo que nada de eso se guarda.
  inspeccionDraft = { estructura: formatoEditorState.estructura, tieneFotos:false, respuestas:{}, fotos:[] };

            <input type="color" id="fiColorAcento" value="${esc(formatoEditorState.color_acento||'#14215a')}" style="width:44px;height:32px;padding:2px;border:1px solid var(--line);border-radius:6px;cursor:pointer">

          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn btn-ghost btn-sm" id="btnSubirImagenPdf">${I.plus} <span id="fiImagenPdfLabel">${formatoEditorState.imagen_pdf ? 'Cambiar foto' : 'Subir foto del equipo'}</span></button>
            <button type="button" class="btn btn-ghost btn-sm" id="btnQuitarImagenPdf" style="${formatoEditorState.imagen_pdf?'':'display:none'}">${I.trash} Quitar foto</button>

          </div>
        </div>
        <div class="cons-preview">
          <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap">
            <button type="button" class="btn btn-primary btn-sm" data-cons-tab="form">👁 Formulario</button>
            <button type="button" class="btn btn-ghost btn-sm" data-cons-tab="pdf">${I.doc} Ver PDF final</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btnActualizarPdfPreview" style="display:none">${I.check} Actualizar</button>
            <button type="button" class="btn btn-ghost btn-sm" id="btnAbrirPdfPreview" style="display:none;margin-left:auto">${I.link} Abrir en pestaña nueva</button>
          </div>
          <div id="consVistaForm" class="pub-card">
            <div class="pub-head" style="padding:18px">
              <div class="acc"></div>
              <h1 style="font-size:17px" id="prevNombreFormato">${esc(formatoEditorState.nombre)||'Nombre del formato'}</h1>
            </div>
            <div class="pub-body" style="padding:18px" id="inspFormBody"></div>
          </div>
          <div id="consVistaPdf" style="display:none;height:calc(100vh - 160px);min-height:400px;border:1px solid var(--line);border-radius:12px;overflow-y:auto;overflow-x:hidden;background:#525659;padding:18px 0"></div>
