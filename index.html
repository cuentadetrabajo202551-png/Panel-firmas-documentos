/* "volver" es opcional: si quien llama está mostrando una lista (detalle de un
   enlace, hoja de vida de una herramienta, historial del contrato), le pasa una
   función que la vuelve a abrir (ya sin la fila borrada) en vez de cerrar todo
   — mismo patrón de openSubModal usado en el resto de la app. Sin "volver" (ej.
   desde "Ver detalle" de la inspección misma, que deja de existir) se cierra
   todo y se refresca el panel de Inspecciones que quedó detrás. */
function eliminarInspeccion(id, volver){
  openSubModal(`<div class="modal" style="max-width:420px">
    <div class="modal-head"><div><h2>Eliminar inspección</h2><p>Esta acción no se puede deshacer.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body"><p style="font-size:14.5px;color:var(--ink-2)">Se eliminará esta inspección junto con sus fotos y firmas guardadas.</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confDelInsp">${I.trash} Sí, eliminar</button></div></div>`, volver);
  document.getElementById('confDelInsp').onclick = async ()=>{
    const btn = document.getElementById('confDelInsp'); btn.disabled=true; btn.innerHTML="Eliminando…";
    const { error } = await sb.from("insp_inspecciones").delete().eq("id", id);
    if(error){ btn.disabled=false; btn.innerHTML=`${I.trash} Sí, eliminar`; toast("No se pudo eliminar: "+error.message,"err"); return; }
    await loadInspeccionesState();
    toast("Inspección eliminada","ok");
    closeModal();
    if(!volver) renderInspeccionesAdmin('norecarga');
  };
}

/* Edición admin/editor de una inspección ya guardada — reutiliza el mismo motor de
   formulario dinámico del enlace público (renderInspFormBody y compañía, que ya
   trabajan sobre "inspeccionDraft" sin importar si viven en un modal administrado o
   en la página pública). Solo se puede tocar el CONTENIDO (respuestas y fotos) —
   las firmas y los nombres de inspector/responsable representan lo que efectivamente
   se firmó ese día y no se re-editan aquí. */
/* Igual que abrirEditarInspeccion, pero recibe solo el id (para abrir directo desde
   una fila de lista que no tiene el registro completo cargado, ej. el detalle de un
   enlace) — carga la inspección completa y ahí sí abre el editor. */
async function abrirEditarInspeccionPorId(id){
  bloquear("Cargando inspección…");
  const { data, error } = await sb.from("insp_inspecciones").select("*").eq("id",id).maybeSingle();
  desbloquear();
  if(error || !data){ toast("No se pudo cargar la inspección","err"); return; }
  abrirEditarInspeccion(data);
}

function abrirEditarInspeccion(data){
  inspeccionDraft = {
    estructura: Array.isArray(data.estructura) ? data.estructura : [],
    tieneFotos: true,
    respuestas: JSON.parse(JSON.stringify(data.respuestas || {})),
    fotos: Array.isArray(data.fotos) ? [...data.fotos] : []
  };
  openModal(`<div class="modal lg">
    <div class="modal-head"><div><h2>Editar inspección</h2><p>${esc(data.formato_nombre)}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body" id="inspFormBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarEditarInsp">${I.check} Guardar cambios</button>
    </div>
  </div>`);
  renderInspFormBody();
  document.getElementById('btnGuardarEditarInsp').onclick = ()=> guardarEditarInspeccion(data.id);
}

async function guardarEditarInspeccion(id){
  if(!validarCamposRequeridosInsp()) return;
  const btn = document.getElementById('btnGuardarEditarInsp'); btn.disabled=true; btn.innerHTML="Guardando…";
  bloquear("Guardando cambios…");
  try{
    const { error } = await sb.from("insp_inspecciones").update({ respuestas: inspeccionDraft.respuestas, fotos: inspeccionDraft.fotos }).eq("id", id);
    if(error){ toast("No se pudo guardar: "+error.message,"err"); return; }
    toast("Inspección actualizada","ok");
    inspeccionDraft = null;
    await loadInspeccionesState();
    closeModal();
    verInspeccion(id);
  } finally { desbloquear(); }
}

/* ---------- PDF de la inspección: dibujado a mano con jsPDF base (mismo estilo que
   construirKardexPDF), recorriendo dinámicamente la "estructura" congelada de la
   inspección — cada tipo de sección tiene su propia función de dibujo, pensadas para
   poder reutilizarse si mañana hay un formato distinto con otras secciones. ---------- */
// Color de acento configurable por formato (insp_formatos.color_acento) — reemplaza
// el azul institucional fijo (#14215a = rgb(20,33,90)) en las cabeceras del PDF. Vía
// ctx.colorAcento, calculado una sola vez en construirInspeccionPDF y compartido por
// todos los dibujadores (ya reciben "ctx" como parámetro). Cualquier hex inválido o
// vacío se cae al azul institucional, nunca revienta el PDF.
function hexToRgbInsp(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec((hex||'').trim());
  if(!m) return [20,33,90];
  const n = parseInt(m[1],16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function dibujarSeccionInfoPDF(doc, y, seccion, respuestas, ctx){
  const { M, RIGHT, asegurarEspacio } = ctx;
  y = asegurarEspacio(y, 14);
  doc.setFillColor(ctx.colorAcento[0],ctx.colorAcento[1],ctx.colorAcento[2]); doc.rect(M,y,RIGHT-M,7,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(255,255,255);
  doc.text(pdfTexto(seccion.titulo||""), M+3, y+5);
  y += 7+3;
  for(const c of (seccion.campos||[])){
    const val = respuestas[c.id];
    const texto = c.tipo==='seleccion_multiple'
      ? (Array.isArray(val) && val.length ? val.join(', ') : '—')
      : ((val!=null && val!=='') ? String(val) : '—');
    y = asegurarEspacio(y, 10);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(90,90,110);
    doc.text(pdfTexto((c.etiqueta||'').toUpperCase()), M, y);
    y += 4;
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(20,20,20);
    const wrapped = doc.splitTextToSize(pdfTexto(texto), RIGHT-M);
    doc.text(wrapped, M, y);
    y += wrapped.length*4.2 + 4;
  }
  return y+2;
}

function dibujarSeccionChecklistPDF(doc, y, seccion, respuestas, ctx){
  const { M, RIGHT, asegurarEspacio } = ctx;
  const estados = seccion.estados || [];
  const conObs = !!seccion.conObservaciones;
  const conMarca = !!seccion.conMarcaModelo;
  const conCant = !!seccion.conCantidad;
  const conVence = !!seccion.conFechaVencimiento;
  const marcaColW = 30, cantColW = 18, venceColW = 26, obsColW = 38;
  const extrasW = (conMarca?marcaColW:0) + (conCant?cantColW:0) + (conVence?venceColW:0) + (conObs?obsColW:0);
  // El ancho del ítem cede espacio a los estados cuando varias columnas extra están
  // activadas a la vez (cantidad+vencimiento+observaciones) — si no, con 3 estados
  // (ej. "Cumple"/"No cumple"/"N/A") cada columna quedaba demasiado angosta y el
  // encabezado se salía encimándose con el de la columna vecina.
  const estadoColMin = 22;
  let itemColW = 78;
  if(estados.length){
    const disponible = RIGHT-M-extrasW;
    const necesarioParaEstados = estadoColMin*estados.length;
    if(disponible-itemColW < necesarioParaEstados) itemColW = Math.max(45, disponible-necesarioParaEstados);
  }
  const estadoColW = estados.length ? (RIGHT-M-itemColW-extrasW) / estados.length : 0;
  // xs: bordes de columna, en orden ÍTEM | estado(s) | Cantidad | Vencimiento | Observaciones
  // (mismo orden que los checkboxes del constructor) — cada bloque opcional se agrega
  // solo si está activado, así el ancho sobrante se reparte siempre entre los estados.
  const xs = [M, M+itemColW];
  for(let i=0;i<estados.length;i++) xs.push(M+itemColW+estadoColW*(i+1));
  let xCursor = xs[xs.length-1];
  if(conMarca){ xCursor += marcaColW; xs.push(xCursor); }
  if(conCant){ xCursor += cantColW; xs.push(xCursor); }
  if(conVence){ xCursor += venceColW; xs.push(xCursor); }
  if(conObs){ xCursor += obsColW; xs.push(xCursor); }
  // Índice en xs donde arranca la primera columna "extra" (Cantidad, si existe) — las
  // columnas de estado ocupan xs[1] a xs[1+estados.length].
  const idxExtrasInicio = 1 + estados.length;

  function tituloYCab(yy){
    doc.setFillColor(ctx.colorAcento[0],ctx.colorAcento[1],ctx.colorAcento[2]); doc.rect(M,yy,RIGHT-M,7,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(255,255,255);
    doc.text(pdfTexto(seccion.titulo||""), M+3, yy+5);
    yy += 7;
    // Encabezados con ajuste de línea propio (splitTextToSize): si una columna quedó
    // angosta y su texto no cabe en una línea (ej. "NO CUMPLE" en 22mm), pasa a una 2ª
    // línea dentro de su propia columna en vez de desbordarse sobre la vecina.
    doc.setFont("helvetica","bold"); doc.setFontSize(6.6);
    const celdas = [{txt:'ÍTEM', x0:xs[0], x1:xs[1], align:'left'}];
    estados.forEach((e,i)=> celdas.push({txt:(e||'').toUpperCase(), x0:xs[i+1], x1:xs[i+2], align:'center'}));
    let idxCab = idxExtrasInicio;
    if(conMarca){ celdas.push({txt:'MARCA/MODELO', x0:xs[idxCab], x1:xs[idxCab+1], align:'center'}); idxCab++; }
    if(conCant){ celdas.push({txt:'CANT.', x0:xs[idxCab], x1:xs[idxCab+1], align:'center'}); idxCab++; }
    if(conVence){ celdas.push({txt:(seccion.fechaVenceEtiqueta||'Vence').toUpperCase(), x0:xs[idxCab], x1:xs[idxCab+1], align:'center'}); idxCab++; }
    if(conObs){ celdas.push({txt:'OBSERVACIONES', x0:xs[idxCab], x1:xs[idxCab+1], align:'center'}); idxCab++; }
    const wrapCeldas = celdas.map(c=> doc.splitTextToSize(pdfTexto(c.txt), (c.x1-c.x0)-3));
    const maxLineas = Math.max(1, ...wrapCeldas.map(w=>w.length));
    const h = Math.max(7, maxLineas*3.1+3.6);
    doc.setFillColor(238,241,248); doc.rect(M,yy,RIGHT-M,h,"F");
    doc.setDrawColor(150,160,190);
    xs.forEach(x=>doc.line(x,yy,x,yy+h));
    doc.rect(M,yy,RIGHT-M,h);
    doc.setTextColor(40,40,60);
    celdas.forEach((c,i)=>{
      const lineas = wrapCeldas[i];
      const startY = yy + (h-(lineas.length-1)*3.1)/2 + 1.6;
      if(c.align==='left') doc.text(lineas, c.x0+3, startY);
      else doc.text(lineas, (c.x0+c.x1)/2, startY, {align:"center"});
    });
    return yy+h;
  }

  y = asegurarEspacio(y, 14);
  y = tituloYCab(y);

  for(const it of (seccion.items||[])){
    const r = respuestas[it.id] || {};
    let idx = idxExtrasInicio;
    const marcaIdx = conMarca ? idx++ : null;
    const cantIdx = conCant ? idx++ : null;
    const venceIdx = conVence ? idx++ : null;
    const obsIdx = conObs ? idx++ : null;
    doc.setFont("helvetica","normal"); doc.setFontSize(7.4);
    const wrappedItem = doc.splitTextToSize(pdfTexto(it.texto||''), itemColW-4);
    const wrappedMarca = marcaIdx!=null ? doc.splitTextToSize(pdfTexto(r.marca_modelo||''), (xs[marcaIdx+1]-xs[marcaIdx])-4) : [];
    const wrappedObs = obsIdx!=null ? doc.splitTextToSize(pdfTexto(r.observaciones||''), (xs[obsIdx+1]-xs[obsIdx])-4) : [];
    const rowH = Math.max(7, Math.max(wrappedItem.length, wrappedMarca.length, wrappedObs.length)*3.4 + 3.5);
    if(y+rowH > ctx.FOOTER_TOP){ y = ctx.nuevaPagina(); y = tituloYCab(y); }
    doc.setDrawColor(180,188,210);
    xs.forEach(x=>doc.line(x,y,x,y+rowH));
    doc.line(M,y+rowH,RIGHT,y+rowH);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.4); doc.setTextColor(20,20,20);
    doc.text(wrappedItem, M+2, y+4.4);
    estados.forEach((e,i)=>{
      if(r.estado===e){
        doc.setFont("helvetica","bold"); doc.setFontSize(9);
        doc.text("X", (xs[i+1]+xs[i+2])/2, y+rowH/2+1.4, {align:"center"});
        doc.setFont("helvetica","normal"); doc.setFontSize(7.4);
      }
    });
    if(marcaIdx!=null && wrappedMarca.length){ doc.text(wrappedMarca, xs[marcaIdx]+2, y+4.4); }
    if(cantIdx!=null && r.cantidad!=null && r.cantidad!==''){ doc.text(pdfTexto(String(r.cantidad)), (xs[cantIdx]+xs[cantIdx+1])/2, y+rowH/2+1.4, {align:"center"}); }
    if(venceIdx!=null && r.fecha_vencimiento){ doc.text(fmtDate(r.fecha_vencimiento), (xs[venceIdx]+xs[venceIdx+1])/2, y+rowH/2+1.4, {align:"center"}); }
    if(obsIdx!=null && wrappedObs.length){ doc.text(wrappedObs, xs[obsIdx]+2, y+4.4); }
    y += rowH;
  }
  return y+4;
}

function dibujarSeccionTablaPDF(doc, y, seccion, respuestas, ctx){
  const { M, RIGHT, asegurarEspacio } = ctx;
  const columnas = seccion.columnas || [];
  const filas = Array.isArray(respuestas[seccion.id]) ? respuestas[seccion.id] : [];
  y = asegurarEspacio(y, 14);
  doc.setFillColor(ctx.colorAcento[0],ctx.colorAcento[1],ctx.colorAcento[2]); doc.rect(M,y,RIGHT-M,7,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(255,255,255);
  doc.text(pdfTexto(seccion.titulo||""), M+3, y+5);
  y += 7;
  if(!filas.length || !columnas.length){
    doc.setFont("helvetica","italic"); doc.setFontSize(8); doc.setTextColor(130,130,150);
    doc.text("Sin registros.", M, y+5);
    return y+9;
  }
  const colW = (RIGHT-M)/columnas.length;
  const xs = columnas.map((c,i)=> M+colW*i).concat([RIGHT]);
  const h=7;
  doc.setFillColor(238,241,248); doc.rect(M,y,RIGHT-M,h,"F");
  doc.setDrawColor(150,160,190);
  xs.forEach(x=>doc.line(x,y,x,y+h));
  doc.rect(M,y,RIGHT-M,h);
  doc.setFont("helvetica","bold"); doc.setFontSize(6.6); doc.setTextColor(40,40,60);
  columnas.forEach((c,i)=> doc.text(pdfTexto((c.etiqueta||'').toUpperCase()), (xs[i]+xs[i+1])/2, y+4.6, {align:"center"}));
  y += h;
  for(const fila of filas){
    doc.setFont("helvetica","normal"); doc.setFontSize(7.6);
    const wrappedCols = columnas.map(c=> doc.splitTextToSize(pdfTexto(fila[c.id]||'—'), colW-4));
    const rowH = Math.max(7, Math.max(...wrappedCols.map(w=>w.length))*3.6 + 3);
    y = asegurarEspacio(y, rowH);
    doc.setDrawColor(180,188,210);
    xs.forEach(x=>doc.line(x,y,x,y+rowH));
    doc.line(M,y+rowH,RIGHT,y+rowH);
    doc.setFont("helvetica","normal"); doc.setTextColor(20,20,20);
    wrappedCols.forEach((w,i)=> doc.text(w, xs[i]+2, y+4.4));
    y += rowH;
  }
  return y+4;
}

function dibujarSeccionGpsPDF(doc, y, seccion, respuestas, ctx){
  const { M, RIGHT, asegurarEspacio } = ctx;
  const g = respuestas[seccion.id];
  y = asegurarEspacio(y, 14);
  doc.setFillColor(ctx.colorAcento[0],ctx.colorAcento[1],ctx.colorAcento[2]); doc.rect(M,y,RIGHT-M,7,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(255,255,255);
  doc.text(pdfTexto(seccion.titulo||"Ubicación"), M+3, y+5);
  y += 7;
  doc.setDrawColor(150,160,190); doc.rect(M,y,RIGHT-M,9);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(20,20,20);
  const texto = (g && g.lat!=null && g.lng!=null)
    ? 'Coordenadas: '+(+g.lat).toFixed(5)+', '+(+g.lng).toFixed(5)+(g.precision?' (±'+Math.round(g.precision)+' m)':'')
    : 'Sin ubicación registrada.';
  doc.text(pdfTexto(texto), M+3, y+6);
  return y+9+4;
}

async function dibujarFotosPDF(doc, y, fotos, ctx){
  const { M, RIGHT, asegurarEspacio } = ctx;
  const gap = 4;
  const colW = (RIGHT-M-gap)/2;
  const maxH = 55;
  let col = 0, rowStartY = y;
  for(const f of fotos){
    // Ajustar la foto DENTRO de una caja colW×maxH conservando su proporción real
    // ("contain", no "stretch") — antes solo se topaba la altura en maxH pero se
    // dejaba el ancho fijo en colW, así que una foto vertical (ej. un pantallazo de
    // celular) quedaba estirada horizontalmente. Ahora, si al toparse la altura la
    // imagen queda más angosta que la celda, se centra en vez de deformarse.
    let w = colW, h = maxH;
    try{
      const dims = await getImageSize(f);
      if(dims && dims.w>0 && dims.h>0){
        h = colW * (dims.h/dims.w);
        if(h > maxH){ h = maxH; w = maxH * (dims.w/dims.h); }
      }
    }catch(e){}
    if(col===0){ rowStartY = asegurarEspacio(y, maxH+4); y = rowStartY; }
    const cellX = M + col*(colW+gap);
    const x = cellX + (colW-w)/2;
    const yImg = y + (maxH-h)/2;
    try{ doc.addImage(f, "JPEG", x, yImg, w, h); }catch(e){}
    col++;
    if(col===2){ y = rowStartY + maxH + gap; col=0; }
  }
  if(col===1){ y = rowStartY + maxH + gap; }
  return y+2;
}

/* idOrData: un id (string, hace el fetch de siempre — panel administrado) o el
   objeto de datos ya cargado (respuesta de insp_publica_registrar — el enlace
   público no tiene sesión para volver a consultar la tabla). */
async function construirInspeccionPDF(idOrData){
  let insp;
  if(typeof idOrData === 'string'){
    const { data } = await sb.from("insp_inspecciones").select("*").eq("id",idOrData).maybeSingle();
    insp = data;
  } else {
    insp = idOrData;
  }
  if(!insp) return null;
  // color_acento/mostrar_cumplimiento/imagen_pdf: desde [[CAMBIOS_SQL_61]] siempre se
  // congelan en insp_inspecciones (antes solo viajaban en la respuesta jsonb de la RPC
  // pública, con un fallback en vivo contra la plantilla — ya no hace falta, esto es
  // solo defensa para filas legado que quedaron sin backfillear).
  if(insp.color_acento == null) insp.color_acento = '#14215a';
  if(insp.mostrar_cumplimiento == null) insp.mostrar_cumplimiento = true;
  const nombreContrato = insp.contrato_nombre != null ? insp.contrato_nombre : ((INSPECCIONES.contratos.find(c=>c.id===insp.contrato_id)||{}).nombre || "");

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const PW = 210, M = 10, RIGHT = PW - M;
  const FOOTER_Y = 290, FOOTER_TOP = 278;
  let pag = 1;

  function piePagina(){
    doc.setFontSize(6.6); doc.setTextColor(140,140,160);
    doc.text(pdfTexto("Este documento constituye evidencia de la inspección, firmada digitalmente por el inspector y el responsable del área."), PW/2, FOOTER_Y, {align:"center"});
    doc.text("Generado el "+fmtDateTime(new Date())+" · Don Aseo Ltda. · Pág. "+pag, PW/2, FOOTER_Y+4, {align:"center"});
  }
  function nuevaPagina(){ piePagina(); doc.addPage(); pag++; return M+2; }
  function asegurarEspacio(y, alto){ return (y+alto > FOOTER_TOP) ? nuevaPagina() : y; }
  const ctx = { M, RIGHT, FOOTER_TOP, asegurarEspacio, nuevaPagina, colorAcento: hexToRgbInsp(insp.color_acento) };

  // Encabezado
  let y = M;
  const hH=24, logoW=44, fotoW = insp.imagen_pdf ? 32 : 0;
  const contentRight = RIGHT - fotoW;
  doc.setDrawColor(150,160,190); doc.setLineWidth(0.3); doc.rect(M,y,RIGHT-M,hH);
  doc.line(M+logoW,y,M+logoW,y+hH);
  try{ doc.addImage(LOGO,"JPEG",M+4,y+2,36,36*315/570); }catch(e){}
  doc.setTextColor(ctx.colorAcento[0],ctx.colorAcento[1],ctx.colorAcento[2]); doc.setFont("helvetica","bold"); doc.setFontSize(12.5);
  doc.text(doc.splitTextToSize(pdfTexto((insp.formato_nombre||"INSPECCIÓN").toUpperCase()), contentRight-M-logoW-6), M+logoW+(contentRight-M-logoW)/2, y+11, {align:"center"});
  doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(90,90,110);
  doc.text(pdfTexto("Don Aseo Ltda."+(nombreContrato?" · "+nombreContrato:"")), M+logoW+(contentRight-M-logoW)/2, y+20, {align:"center"});
  if(insp.imagen_pdf){
    doc.line(contentRight,y,contentRight,y+hH);
    try{
      const tam = await getImageSize(insp.imagen_pdf);
      const padd = 2, cajaW = fotoW - padd*2, cajaH = hH - padd*2;
      let dw = cajaW, dh = tam ? cajaW*tam.h/tam.w : cajaH;
      if(dh > cajaH){ dh = cajaH; dw = tam ? cajaH*tam.w/tam.h : cajaW; }
      doc.addImage(insp.imagen_pdf, contentRight+(fotoW-dw)/2, y+(hH-dh)/2, dw, dh);
    }catch(e){}
  }
  y += hH;

  const fh=14;
  doc.setDrawColor(150,160,190); doc.rect(M,y,RIGHT-M,fh);
  doc.line(M+63,y,M+63,y+fh); doc.line(M+126,y,M+126,y+fh);
  const horaInsp = insp.creado_en ? new Date(insp.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'}) : '';
  doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(90,90,110);
  doc.text("FECHA", M+3, y+5); doc.text("CONTRATO", M+66, y+5); doc.text(insp.herramienta_nombre?"HERRAMIENTA":"EMPRESA", M+129, y+5);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(20,20,20);
  doc.text(fmtDate((insp.creado_en||'').slice(0,10)) + (horaInsp?"  "+horaInsp:""), M+3, y+10.5);
  doc.text(doc.splitTextToSize(pdfTexto(nombreContrato||"—"), 60), M+66, y+10.5);
  doc.text(doc.splitTextToSize(pdfTexto(insp.herramienta_nombre || "Don Aseo Ltda."), 60), M+129, y+10.5);
  y += fh + 4;

  // Resumen de cumplimiento — calculado con el mismo marcado manual conforme/no
  // conforme/no aplica que el usuario definió por sección (claseEstadoInsp /
  // calcularCumplimientoInsp). Si el formato no tiene ninguna sección checklist con
  // respuestas, "pct" sale null y esta caja simplemente no se dibuja.
  const cump = calcularCumplimientoInsp(insp.estructura, insp.respuestas);
  if(cump.pct!=null && insp.mostrar_cumplimiento!==false){
    const boxH = 12;
    y = asegurarEspacio(y, boxH+4);
    const color = cump.pct>=80 ? [31,168,78] : cump.pct>=50 ? [201,138,26] : [214,59,80];
    doc.setDrawColor(150,160,190); doc.setFillColor(246,248,253); doc.rect(M,y,RIGHT-M,boxH,"FD");
    doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(color[0],color[1],color[2]);
    doc.text(cump.pct+"%", M+6, y+8.5);
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(ctx.colorAcento[0],ctx.colorAcento[1],ctx.colorAcento[2]);
    doc.text("CUMPLIMIENTO", M+26, y+5.5);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.4); doc.setTextColor(90,90,110);
    doc.text(pdfTexto(`${cump.conformes} conforme(s) · ${cump.noConformes} no conforme(s)`+(cump.neutrales?` · ${cump.neutrales} no aplica`:'')+(cump.sinResponder?` · ${cump.sinResponder} sin responder`:'')), M+26, y+9.5);
    y += boxH + 4;
  }

  // Secciones dinámicas — recorren la estructura congelada de la inspección, no la del
  // formato en vivo (que puede haber cambiado desde que se hizo esta inspección).
  const estructura = Array.isArray(insp.estructura) ? insp.estructura : [];
  const respuestas = insp.respuestas || {};
  let fotosDibujadas = false;
  for(const s of estructura){
    if(s.tipo==='info') y = dibujarSeccionInfoPDF(doc, y, s, respuestas, ctx);
    else if(s.tipo==='checklist') y = dibujarSeccionChecklistPDF(doc, y, s, respuestas, ctx);
    else if(s.tipo==='tabla_dinamica') y = dibujarSeccionTablaPDF(doc, y, s, respuestas, ctx);
    else if(s.tipo==='gps') y = dibujarSeccionGpsPDF(doc, y, s, respuestas, ctx);
    else if(s.tipo==='fotos'){
      if((insp.fotos||[]).length){
        y = asegurarEspacio(y, 14);
        doc.setFillColor(ctx.colorAcento[0],ctx.colorAcento[1],ctx.colorAcento[2]); doc.rect(M,y,RIGHT-M,7,"F");
        doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(255,255,255);
        doc.text(pdfTexto(s.titulo||"Registro fotográfico"), M+3, y+5);
        y += 7+3;
        y = await dibujarFotosPDF(doc, y, insp.fotos, ctx);
      }
      fotosDibujadas = true;
    }
  }

  // Fotos — respaldo para inspecciones guardadas antes de que "fotos" fuera una
  // sección movible dentro de la estructura (quedan igual que siempre: al final).
  if(!fotosDibujadas && (insp.fotos||[]).length){
    y = asegurarEspacio(y, 14);
    doc.setFillColor(ctx.colorAcento[0],ctx.colorAcento[1],ctx.colorAcento[2]); doc.rect(M,y,RIGHT-M,7,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(255,255,255);
    doc.text("Registro fotográfico", M+3, y+5);
    y += 7+3;
    y = await dibujarFotosPDF(doc, y, insp.fotos, ctx);
  }

  // Firmas — arreglo genérico de 0 a N (insp.firmantes, ver CAMBIOS_SQL_56). Las
  // inspecciones guardadas ANTES de esa migración no tienen "firmantes" (o viene
  // vacío) — se arma la lista equivalente desde las columnas viejas fijas
  // (inspector/responsable), mismo criterio de compatibilidad que el resto del
  // módulo. Si de verdad no hay ningún firmante (formato con 0 firmantes), esta
  // sección completa no se dibuja.
  let firmasLista = Array.isArray(insp.firmantes) && insp.firmantes.length ? insp.firmantes : [];
  if(!firmasLista.length){
    if(insp.firma_inspector) firmasLista.push({ rol:'Inspector', nombre:insp.inspector_nombre, cargo:null, firma:insp.firma_inspector });
    if(insp.firma_responsable) firmasLista.push({ rol:'Responsable del área', nombre:insp.responsable_nombre, cargo:insp.responsable_cargo, firma:insp.firma_responsable });
  }
  if(firmasLista.length){
    y = asegurarEspacio(y, 14);
    doc.setFillColor(ctx.colorAcento[0],ctx.colorAcento[1],ctx.colorAcento[2]); doc.rect(M,y,RIGHT-M,7,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(255,255,255);
    doc.text("Firmas", M+3, y+5);
    y += 7+3;
    const colW = (RIGHT-M-6)/2;
    const boxH = 34;
    for(let i=0;i<firmasLista.length;i+=2){
      y = asegurarEspacio(y, boxH);
      const par = firmasLista.slice(i,i+2);
      doc.setDrawColor(150,160,190);
      for(let j=0;j<par.length;j++){
        const f = par[j];
        const x = M + j*(colW+6);
        doc.rect(x,y,colW,boxH);
        doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.setTextColor(90,90,110);
        doc.text(pdfTexto((f.rol||'').toUpperCase()), x+3, y+5);
        try{ if(f.firma) doc.addImage(await firmaParaPdf(f.firma),"JPEG",x+3,y+7,colW-6,20); }catch(e){}
        doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(20,20,20);
        doc.text(pdfTexto((f.nombre||"")+(f.cargo?" · "+f.cargo:"")), x+3, y+boxH-2);
      }
      y += boxH + (i+2<firmasLista.length ? 4 : 0);
    }
  }

  if(insp.ip_address || insp.dispositivo_ua){
    y += 4;
    doc.setFont("helvetica","normal"); doc.setFontSize(6.5); doc.setTextColor(120,120,140);
    const disp = insp.dispositivo_ua ? resumenDispositivoUA(insp.dispositivo_ua) : '';
    doc.text(pdfTexto("Registrado desde "+(insp.ip_address?"IP "+insp.ip_address:"")+(insp.ip_address&&disp?" · ":"")+disp), M, y);
  }

  piePagina();

  const safe = (insp.formato_nombre||"inspeccion").replace(/[^\w\sáéíóúñ-]/gi,"").trim().replace(/\s+/g,"_").slice(0,40);
  const fechaSafe = (insp.creado_en||'').slice(0,10);
  return { doc, nombreBase: safe+"_"+fechaSafe };
}

async function generarInspeccionPDF(id){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  bloquear("Generando PDF…");
  try{
    const r = await construirInspeccionPDF(id);
    if(!r){ toast("No se encontró la inspección","err"); return; }
    r.doc.save("Inspeccion_"+r.nombreBase+".pdf");
    toast("PDF generado","ok");
  }catch(e){ console.error(e); toast("No se pudo generar el PDF: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* ---------- Página pública del enlace de inspección (sin login) — mismo patrón
   que renderPublic (Asistencia): fetch por RPC security definer, formulario, y al
   enviar se llama otra RPC security definer que guarda y devuelve todo lo necesario
   para armar el PDF de una vez (esta página nunca tiene sesión para volver a
   consultar la tabla). Reutiliza renderInspFormBody y todo el motor del formulario
   dinámico ya escrito — no le importa si vive en un modal o en una página pública. ---------- */
// Un pad de firma POR firmante "fresco" (0 a N, ver CAMBIOS_SQL_56) — aparte del
// sigPad global de siempre, para no interferir con el resto de la app (ver
// crearFirmaPad/initSignature más arriba).
let firmantesPadsInsp = {};

async function renderInspeccionPublica(enlaceId){
  // Regla fija: este formulario público nunca se ve en modo oscuro (ver el script
  // de tema en el <head>) — se refuerza acá por si se llega a esta ruta navegando
  // dentro de la misma pestaña (ese script del <head> solo corre en la carga inicial).
  document.documentElement.setAttribute('data-theme', 'light');
  document.body.style.overflow = "";
  bloquear("Cargando…");
  let resp;
  try{ resp = await sb.rpc("insp_enlace_publico", { p_enlace_id: enlaceId }); }
  finally{ desbloquear(); }
  const r = resp && resp.data;
  if(resp.error || !r || !r.ok){
    document.getElementById("app").innerHTML = `
      <div class="pub-wrap"><div class="pub-card"><div class="locked-screen">
        <div class="ic">${I.lockBig}</div>
        <h2>Enlace no disponible</h2>
        <p>Este enlace no existe o ya no está activo. Verifica con quien te lo compartió.</p>
      </div></div></div>`;
    return;
  }

  const firmantesFmt = Array.isArray(r.formato.firmantes) ? r.formato.firmantes : FIRMANTES_DEFAULT_INSP;
  const firmantesFresco = firmantesFmt.filter(f=>f.origen==='fresco');

  inspeccionDraft = {
    enlaceId,
    formatoNombre: r.formato.nombre,
    estructura: Array.isArray(r.formato.estructura) ? r.formato.estructura : [],
    tieneFotos: r.formato.tiene_fotos !== false,
    firmantesFmt, firmantesFresco,
    respuestas: {},
    fotos: []
  };
  firmantesPadsInsp = {};

  document.getElementById("app").innerHTML = `
    <div class="pub-wrap">
      <div class="pub-card">
        <div class="pub-head">
          <div class="acc"></div>
          <h1>${esc(inspeccionDraft.formatoNombre)}</h1>
          <div class="sub"><span>${I.building} ${esc(r.contrato_nombre||'—')}</span></div>
        </div>
        <div class="pub-body" id="pubBody">
          <div class="pub-logo">
            <img src="${LOGO}" alt="Don Aseo Ltda.">
            <div><div class="pt1">Don Aseo Ltda.</div><div class="pt2">NIT 812.000.152-7 · ${CODIGO}</div></div>
          </div>
          <div id="inspFormBody"></div>
          ${firmantesFresco.map(f=>{
            const vinculo = campoInfoTexto(inspeccionDraft.estructura, f.campoNombre);
            return `
            <div class="field">
              <label>Tu nombre — ${esc(f.rol)} *</label>
              <input data-firmante-nombre="${esc(f.id)}" placeholder="Nombres y apellidos" autocomplete="off" ${vinculo?`readonly data-firmante-nombre-vinculado="${esc(vinculo.id)}"`:''}>
              ${vinculo?`<p class="muted-sm" style="margin-top:4px">Se toma de "${esc(vinculo.etiqueta)}" — no hace falta escribirlo de nuevo.</p>`:''}
            </div>
            <div class="field" style="margin-bottom:8px">
              <label>Firma digital — ${esc(f.rol)} *</label>
              <div class="sig-box" id="sigBox_${esc(f.id)}">
                <canvas id="sigCanvas_${esc(f.id)}"></canvas>
                <div class="sig-placeholder" id="sigPh_${esc(f.id)}">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div>
              </div>
              <div class="sig-actions"><button type="button" class="btn btn-ghost btn-sm" data-sig-clear-insp="${esc(f.id)}">${I.trash} Limpiar firma</button></div>
            </div>`;
          }).join('')}
          <button class="btn btn-green" id="pEnviarInsp" style="width:100%;padding:14px;margin-top:8px">${I.check} Enviar inspección</button>
        </div>
      </div>
    </div>`;

  renderInspFormBody();
  sincronizarFirmantesVinculadosInsp();
  firmantesFresco.forEach(f=>{ firmantesPadsInsp[f.id] = crearFirmaPad('sigCanvas_'+f.id, 'sigBox_'+f.id, 'sigPh_'+f.id); });
  document.querySelectorAll('[data-sig-clear-insp]').forEach(b=>{
    b.onclick = ()=> firmantesPadsInsp[b.dataset.sigClearInsp]?.clear();
  });
  document.getElementById("pEnviarInsp").onclick = ()=> enviarInspeccionPublica(enlaceId);
}

/* Mantiene sincronizado el input (de solo lectura) de "Tu nombre" de un firmante en
   vivo vinculado a un campo de información — se llama cada vez que cambia CUALQUIER
   campo de texto (wireInspFormBody), no solo el vinculado, porque es barato y así no
   hay que rastrear cuál firmante depende de cuál campo en cada sitio que toca
   inspeccionDraft.respuestas. */
function sincronizarFirmantesVinculadosInsp(){
  document.querySelectorAll('[data-firmante-nombre-vinculado]').forEach(inp=>{
    inp.value = inspeccionDraft.respuestas[inp.dataset.firmanteNombreVinculado] || '';
  });
}

async function enviarInspeccionPublica(enlaceId){
  if(!validarCamposRequeridosInsp()) return;
  const seccionGps = inspeccionDraft.estructura.find(s=>s.tipo==='gps');
  if(seccionGps && !inspeccionDraft.respuestas[seccionGps.id]){ toast("Comparte tu ubicación (GPS) antes de enviar","err"); return; }
  if(requeridoFotosInsp() && !inspeccionDraft.fotos.length){ toast("Agrega al menos una foto antes de enviar","err"); return; }

  const p_firmantes = [];
  for(const f of inspeccionDraft.firmantesFresco){
    const vinculo = campoInfoTexto(inspeccionDraft.estructura, f.campoNombre);
    const nombre = vinculo
      ? (inspeccionDraft.respuestas[vinculo.id]||'').trim()
      : (document.querySelector(`[data-firmante-nombre="${f.id}"]`)?.value||'').trim();
    if(!nombre){ toast(vinculo ? `Falta completar "${vinculo.etiqueta}" (arriba en el formulario)` : `Falta el nombre de "${f.rol}"`,"err"); return; }
    const pad = firmantesPadsInsp[f.id];
    if(!pad || pad.isEmpty()){ toast(`Falta la firma de "${f.rol}"`,"err"); return; }
    p_firmantes.push({ id: f.id, nombre, firma: pad.dataURL() });
  }

  const btn = document.getElementById('pEnviarInsp');
  btn.disabled = true; btn.innerHTML = "Enviando…";
  const { data, error } = await sb.rpc("insp_publica_registrar", {
    p_enlace_id: enlaceId,
    p_respuestas: inspeccionDraft.respuestas,
    p_firmantes,
    p_fotos: inspeccionDraft.fotos
  });
  if(error || !data || !data.ok){
    btn.disabled = false; btn.innerHTML = `${I.check} Enviar inspección`;
    const motivo = data && data.motivo;
    const msg = motivo==='falta_banco' ? "Este enlace no tiene todas sus firmas guardadas configuradas — avisa a quien te lo compartió."
      : motivo==='falta_firmante' ? "Falta un nombre o una firma."
      : motivo==='max_fotos' ? "Superaste el máximo de fotos permitido para este formato."
      : motivo==='fotos_requeridas' ? "Este formato exige al menos una foto."
      : motivo==='formato_inactivo' ? "Este formato ya no está disponible."
      : motivo==='no_encontrado' ? "Este enlace ya no está activo."
      : "No se pudo enviar: "+((error&&error.message)||motivo||'');
    toast(msg,"err");
    return;
  }
  try{
    const r = await construirInspeccionPDF(data);
    if(r) r.doc.save("Inspeccion_"+r.nombreBase+".pdf");
  }catch(e){ console.error(e); }
  inspeccionDraft = null;
  document.getElementById("app").innerHTML = pantallaFirmaOk("¡Listo!", "Tu inspección quedó guardada y el PDF se está descargando.");
}

  wireLogout();
  document.getElementById('audModulo').value = auditFiltroModulo;
  document.getElementById('audAccion').value = auditFiltroAccion;
  document.getElementById('btnAudFiltrar').onclick = ()=>{
    auditFiltroDesde = document.getElementById('audDesde').value;
    auditFiltroHasta = document.getElementById('audHasta').value;
    auditFiltroModulo = document.getElementById('audModulo').value;
    auditFiltroAccion = document.getElementById('audAccion').value;
    cargarBitacora();
  };
  document.getElementById('btnAudLimpiar').onclick = ()=>{
    auditFiltroDesde=''; auditFiltroHasta=''; auditFiltroModulo='todos'; auditFiltroAccion='todos';
    renderAuditoria();
  };
  await cargarBitacora();
  if(silent) window.scrollTo(0, scrollY);
}

async function cargarBitacora(){
  const host = document.getElementById('audLista');
  if(!host) return;
  host.innerHTML = `<div class="empty"><h3>Cargando…</h3></div>`;
  let q = sb.from("acc_bitacora").select("*").order("ocurrido_en",{ascending:false}).limit(300);
  if(auditFiltroDesde) q = q.gte("ocurrido_en", auditFiltroDesde+"T00:00:00");
  if(auditFiltroHasta) q = q.lte("ocurrido_en", auditFiltroHasta+"T23:59:59");
  if(auditFiltroModulo!=='todos') q = q.eq("modulo", auditFiltroModulo);
  if(auditFiltroAccion!=='todos') q = q.eq("accion", auditFiltroAccion);
  const { data, error } = await q;
  if(error){
    host.innerHTML = `<div class="empty"><h3>No se pudo cargar</h3><p>${esc(error.message)}</p></div>`;
    return;
  }
  if(!data || !data.length){
    host.innerHTML = `<div class="empty"><h3>Sin movimientos</h3><p>No hay registros para los filtros elegidos.</p></div>`;
    return;
  }
  const modLabel = { epp:'EPP', dotacion:'Dotación', asistencia:'Asistencia', documentos:'Documentos' };
  const accLabel = { crear:'Creación', editar:'Edición', eliminar:'Eliminación' };
  const accBadge = { crear:'activa', editar:'cerrada', eliminar:'venc' };
  const hayFiltros = auditFiltroDesde || auditFiltroHasta || auditFiltroModulo!=='todos' || auditFiltroAccion!=='todos';
  host.innerHTML = `<div class="table-wrap"><table class="dt">
    <thead><tr><th>Fecha y hora</th><th>Módulo</th><th>Acción</th><th>Detalle</th><th>Quién</th></tr></thead>
    <tbody>${data.map(r=>`
      <tr>
        <td style="white-space:nowrap">${fmtDateTime(r.ocurrido_en)}</td>
        <td><span class="tipo">${esc(modLabel[r.modulo]||r.modulo)}</span></td>
        <td><span class="badge ${accBadge[r.accion]||'cerrada'}"><span class="dot"></span>${esc(accLabel[r.accion]||r.accion)}</span></td>
        <td>${esc(r.descripcion)}</td>
        <td>${r.actor_uid ? esc(nombreDe(r.actor_uid)) : '<span class="muted-sm">Enlace remoto (sin sesión)</span>'}</td>
      </tr>`).join('')}</tbody>
  </table></div>
  <p class="muted-sm" style="margin-top:10px">Mostrando los ${data.length} movimientos más recientes${hayFiltros?' que cumplen los filtros':''}${data.length===300?' (hay más — usa los filtros de fecha para ver más atrás)':''}.</p>`;
}

async function guardarAjustesGenerales(){
  const eppOb = document.getElementById('cfgFotoEpp').checked;
  const dtlOb = document.getElementById('cfgFotoDtl').checked;
  const btn = document.getElementById('btnGuardarAjustes'); btn.disabled=true; btn.innerHTML="Guardando…";
  const { error } = await sb.from("app_config").update({ epp_foto_obligatoria: eppOb, dotacion_foto_obligatoria: dtlOb }).eq("id", true);
  if(error){ toast("No se pudo guardar: "+error.message,"err"); btn.disabled=false; btn.innerHTML=`${I.check} Guardar`; return; }
  APP_CONFIG = { eppFotoObligatoria: eppOb, dotacionFotoObligatoria: dtlOb };
  toast("Ajustes guardados","ok");
  btn.disabled=false; btn.innerHTML=`${I.check} Guardar`;
}

async function toggleActivoPerfil(id, activo){
  if(id === MIPERFIL.uid){ toast("No puedes desactivar tu propia cuenta","err"); return; }
  const { error } = await sb.from("acc_perfiles").update({ activo }).eq("id", id);
  if(error){ toast("No se pudo actualizar: "+error.message,"err"); renderConfiguracion(); return; }
  toast(activo?"Usuario activado":"Usuario desactivado","ok");
  renderConfiguracion();
}

            : '<p class="muted-sm">Aún no hay contratos creados.</p>'}
        </div>
        <label class="chk" style="margin-top:8px"><input type="checkbox" data-pf-mod="inspecciones" ${modulos.includes('inspecciones')?'checked':''}> Inspecciones</label>
        <div id="permisosInspecciones" style="margin-top:10px;padding:12px 14px;background:#f6f8fd;border:1px solid var(--line);border-radius:10px;${modulos.includes('inspecciones')?'':'display:none'}">
          <div class="sec-bar" style="margin:0 0 8px"><h2 style="font-size:13px">Contratos permitidos (Inspecciones)</h2>${todosLosContratosInsp.length?`<button type="button" class="btn btn-ghost btn-sm" id="btnPfContratoInspTodos">Marcar todos</button>`:''}</div>
          ${todosLosContratosInsp.length
            ? todosLosContratosInsp.map(c=>`<label class="chk" style="padding:3px 0"><input type="checkbox" data-pf-contratoinsp="${c.id}" ${contratosInspMarcados.includes(c.id)?'checked':''}> ${esc(c.nombre)}</label>`).join('')
            : '<p class="muted-sm">Aún no hay contratos creados.</p>'}
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarPermisos">${I.check} Guardar</button>
    </div></div>`);

  /* Resumen en texto claro de lo que estos checkboxes realmente significan — se recalcula
     en vivo con cada cambio, para que no haya sorpresas como "le quité módulos pero le
     quedó acceso a todo" (eso pasaba cuando "Es administrador" seguía marcado sin notarlo). */
  const actualizarResumenAccesoUI = ()=>{
    const el = document.getElementById('resumenAcceso'); if(!el) return;
    if(document.getElementById('pfAdmin').checked){
      el.innerHTML = `<b>Administrador</b> — acceso total a todos los módulos y contratos, sin restricciones.`;
      return;
    }
    const modulosSel = Array.from(document.querySelectorAll('[data-pf-mod]:checked')).map(x=>x.dataset.pfMod);
    if(!modulosSel.length){
      el.innerHTML = `<span style="color:var(--danger)">Sin ningún módulo marcado — al iniciar sesión no verá nada.</span>`;
      return;
    }
    const partes = [];
    if(modulosSel.includes('asistencia')) partes.push('Asistencia');
    if(modulosSel.includes('documentos')) partes.push('Documentos y Firmas');
    if(modulosSel.includes('dotacion')){
      const ids = Array.from(document.querySelectorAll('[data-pf-contrato]:checked')).map(x=>x.dataset.pfContrato);
      const nombres = ids.map(id=>todosLosContratos.find(c=>c.id===id)?.nombre).filter(Boolean);
      partes.push(`EPP (${nombres.length?esc(nombres.join(', ')):'<span style="color:var(--danger)">ningún contrato marcado</span>'})`);
    }
    if(modulosSel.includes('dotacionlegal')){
      const ids = Array.from(document.querySelectorAll('[data-pf-entidad]:checked')).map(x=>x.dataset.pfEntidad);
      const nombres = ids.map(id=>todasLasEntidades.find(x=>x.id===id)?.nombre).filter(Boolean);
      partes.push(`Dotación (${nombres.length?esc(nombres.join(', ')):'<span style="color:var(--danger)">ningún contrato marcado</span>'})`);
    }
    if(modulosSel.includes('inspecciones')){
      const ids = Array.from(document.querySelectorAll('[data-pf-contratoinsp]:checked')).map(x=>x.dataset.pfContratoinsp);
      const nombres = ids.map(id=>todosLosContratosInsp.find(x=>x.id===id)?.nombre).filter(Boolean);
      partes.push(`Inspecciones (${nombres.length?esc(nombres.join(', ')):'<span style="color:var(--danger)">ningún contrato marcado</span>'})`);
    }
    const rol = document.querySelector('input[name="pfRol"]:checked')?.value || 'editor';
    const rolTxt = rol==='visualizador' ? 'solo puede ver (Visualizador)' : 'puede crear/editar lo suyo (Editor)';
    el.innerHTML = `Podrá entrar a: <b>${partes.join(' · ')}</b>. Rol: ${rolTxt}.`;
  };
  actualizarResumenAccesoUI();

  document.getElementById('pfAdmin').onchange = (e)=>{
    document.getElementById('permisosDetalle').style.display = e.target.checked ? 'none' : 'block';
    actualizarResumenAccesoUI();
  };
  const chkDot = document.querySelector('[data-pf-mod="dotacion"]');
  if(chkDot) chkDot.onchange = (e)=>{ document.getElementById('permisosDotacion').style.display = e.target.checked ? 'block' : 'none'; };
  const chkDtl = document.querySelector('[data-pf-mod="dotacionlegal"]');
  if(chkDtl) chkDtl.onchange = (e)=>{ document.getElementById('permisosDotacionLegal').style.display = e.target.checked ? 'block' : 'none'; };
  const chkInsp = document.querySelector('[data-pf-mod="inspecciones"]');
  if(chkInsp) chkInsp.onchange = (e)=>{ document.getElementById('permisosInspecciones').style.display = e.target.checked ? 'block' : 'none'; };
  /* "Marcar todos"/"Quitar todos": evita tener que darle clic contrato por contrato
     cuando alguien necesita ver, por ejemplo, TODA la Dotación de todos los contratos. */
  // El sub-checkbox "puede agregar al catálogo" de un contrato solo tiene sentido si
  // ese contrato está marcado — se deshabilita (y se desmarca) junto con él.
  const sincronizarCatalogoContrato = (contratoId, marcado)=>{
    const sub = document.querySelector(`[data-pf-contrato-catalogo="${contratoId}"]`);
    if(!sub) return;
    sub.disabled = !marcado;
    if(!marcado) sub.checked = false;
  };
  document.querySelectorAll('[data-pf-contrato]').forEach(chk=>{
    chk.addEventListener('change', ()=> sincronizarCatalogoContrato(chk.dataset.pfContrato, chk.checked));
  });
  const btnPfContratoTodos = document.getElementById('btnPfContratoTodos');
  if(btnPfContratoTodos) btnPfContratoTodos.onclick = ()=>{
    const marcar = btnPfContratoTodos.textContent.trim()==='Marcar todos';
    document.querySelectorAll('[data-pf-contrato]').forEach(chk=>{ chk.checked = marcar; sincronizarCatalogoContrato(chk.dataset.pfContrato, marcar); });
    btnPfContratoTodos.textContent = marcar ? 'Quitar todos' : 'Marcar todos';
    actualizarResumenAccesoUI();
  };
  const btnPfEntidadTodos = document.getElementById('btnPfEntidadTodos');
  if(btnPfEntidadTodos) btnPfEntidadTodos.onclick = ()=>{
    const marcar = btnPfEntidadTodos.textContent.trim()==='Marcar todos';
    document.querySelectorAll('[data-pf-entidad]').forEach(chk=> chk.checked = marcar);
    btnPfEntidadTodos.textContent = marcar ? 'Quitar todos' : 'Marcar todos';
    actualizarResumenAccesoUI();
  };
  const btnPfContratoInspTodos = document.getElementById('btnPfContratoInspTodos');
  if(btnPfContratoInspTodos) btnPfContratoInspTodos.onclick = ()=>{
    const marcar = btnPfContratoInspTodos.textContent.trim()==='Marcar todos';
    document.querySelectorAll('[data-pf-contratoinsp]').forEach(chk=> chk.checked = marcar);
    btnPfContratoInspTodos.textContent = marcar ? 'Quitar todos' : 'Marcar todos';
    actualizarResumenAccesoUI();
  };
  document.querySelectorAll('input[name="pfRol"]').forEach(r=> r.addEventListener('change', actualizarResumenAccesoUI));
  document.querySelectorAll('[data-pf-mod],[data-pf-contrato],[data-pf-entidad],[data-pf-contratoinsp]').forEach(chk=>{
    chk.addEventListener('change', actualizarResumenAccesoUI);
  });
  document.getElementById('btnGuardarPermisos').onclick = ()=> guardarPermisosUsuario(perfilId);
}

async function guardarPermisosUsuario(perfilId){
  const esAdmin = document.getElementById('pfAdmin').checked;
  const modulosMarcados = esAdmin ? [] : Array.from(document.querySelectorAll('[data-pf-mod]:checked')).map(el=>el.dataset.pfMod);
  const contratosMarcados = esAdmin ? [] : Array.from(document.querySelectorAll('[data-pf-contrato]:checked')).map(el=>el.dataset.pfContrato);
  const catalogoMarcados = esAdmin ? [] : Array.from(document.querySelectorAll('[data-pf-contrato-catalogo]:checked')).map(el=>el.dataset.pfContratoCatalogo);
  const entidadesMarcadas = esAdmin ? [] : Array.from(document.querySelectorAll('[data-pf-entidad]:checked')).map(el=>el.dataset.pfEntidad);
  const contratosInspMarcados = esAdmin ? [] : Array.from(document.querySelectorAll('[data-pf-contratoinsp]:checked')).map(el=>el.dataset.pfContratoinsp);
  const rolSeleccionado = document.querySelector('input[name="pfRol"]:checked');
  const rol = rolSeleccionado ? rolSeleccionado.value : 'editor';
  const nombre = document.getElementById('pfNombre').value.trim();

  const btn = document.getElementById('btnGuardarPermisos'); btn.disabled=true; btn.innerHTML="Guardando…";
  bloquear("Guardando permisos…");
  try{
    const payloadPerfil = { es_admin: esAdmin, rol };
    if(nombre) payloadPerfil.nombre = nombre;
    const { error:e1 } = await sb.from("acc_perfiles").update(payloadPerfil).eq("id", perfilId);
    if(e1){ toast("No se pudo guardar: "+e1.message,"err"); return; }

    // Reemplazo simple: borra lo que había y vuelve a insertar lo marcado (evita comparar/diferenciar)
    await sb.from("acc_perfil_modulos").delete().eq("perfil_id", perfilId);
    if(modulosMarcados.length){
      const { error:e2 } = await sb.from("acc_perfil_modulos").insert(modulosMarcados.map(m=>({perfil_id:perfilId, modulo:m})));
      if(e2){ toast("Se guardó parcialmente, error en módulos: "+e2.message,"err"); }
    }
    await sb.from("acc_perfil_contratos").delete().eq("perfil_id", perfilId);
    if(contratosMarcados.length){
      const { error:e3 } = await sb.from("acc_perfil_contratos").insert(contratosMarcados.map(c=>({perfil_id:perfilId, contrato_id:c, puede_agregar_catalogo: catalogoMarcados.includes(c)})));
      if(e3){ toast("Se guardó parcialmente, error en contratos: "+e3.message,"err"); }
    }
    await sb.from("acc_perfil_entidades").delete().eq("perfil_id", perfilId);
    if(entidadesMarcadas.length){
      const { error:e4 } = await sb.from("acc_perfil_entidades").insert(entidadesMarcadas.map(en=>({perfil_id:perfilId, entidad_id:en})));
      if(e4){ toast("Se guardó parcialmente, error en contratos: "+e4.message,"err"); }
    }
    await sb.from("acc_perfil_contratos_insp").delete().eq("perfil_id", perfilId);
    if(contratosInspMarcados.length){
      const { error:e5 } = await sb.from("acc_perfil_contratos_insp").insert(contratosInspMarcados.map(c=>({perfil_id:perfilId, contrato_id:c})));
      if(e5){ toast("Se guardó parcialmente, error en contratos: "+e5.message,"err"); }
    }
    toast("Permisos actualizados","ok");
    closeModal();
    if(perfilId === MIPERFIL.uid){ await cargarMiPerfil(); }   // si te editaste a ti mismo, refresca tus propios permisos
    renderConfiguracion();
  } finally { desbloquear(); }
}

/* ---------- Auto-refresh del panel al volver a la pestaña ---------- */
document.addEventListener("visibilitychange", ()=>{
  // No recargar si está oculta, en una vista pública, o en un formulario (perdería lo escrito)
  if(document.hidden || esRutaPublica() || esRutaEdicion()) return;
  // Home de documentos / dotación: refresco SILENCIOSO (sin reloj de arena) para no molestar
  // (si el acceso fue revocado mientras la pestaña estaba abierta, cae a router() para mostrar el candado)
  if((location.hash===""||location.hash==="#"||location.hash==="#/") && tieneModulo('asistencia')){ loadState().then(()=> renderAdmin(true)); return; }
  if(location.hash === "#/docs" && tieneModulo('documentos')){ renderDocsAdmin(true); return; }
  if(location.hash === "#/dotacion" && tieneModulo('dotacion')){ renderDotacionAdmin(true); return; }
  if(location.hash === "#/dotacionlegal" && tieneModulo('dotacionlegal')){ renderDtlAdmin(true); return; }
  if(location.hash === "#/inspecciones" && tieneModulo('inspecciones')){ renderInspeccionesAdmin(true); return; }
  if(location.hash === "#/configuracion" && MIPERFIL.esAdmin){ renderConfiguracion(true); return; }
  if(location.hash === "#/auditoria" && MIPERFIL.esAdmin){ renderAuditoria(true); return; }
  router();   // re-renderiza el módulo activo (asistencia, documentos, dotación o configuración)
});

/* ---------- Si la sesión se cierra, volver al login ---------- */
sb.auth.onAuthStateChange((event)=>{
  if(event === "SIGNED_OUT" && !esRutaPublica()){
    // Igual que en "Salir" (wireLogout): si la sesión se cerró sola (ej. token expirado) en vez
    // de por el botón, hay que limpiar MIPERFIL/STATE aquí también — si no, quedan con los datos
    // del usuario anterior y el siguiente que inicie sesión en esta misma pestaña los hereda.
    MIPERFIL = { cargado:false, activo:true, esAdmin:false, rol:"editor", modulos:[], contratos:[], entidadesDtl:[], contratosInsp:[], nombre:"", uid:null };
    PERFILES_NOMBRE = {}; PERFILES_CORREO = {};
    STATE.listas = []; STATE.userEmail = "";
    renderLogin();
  }
});

/* ---------- Arranque ---------- */
router();
</script>
