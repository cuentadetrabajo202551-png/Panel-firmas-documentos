function renderPasoEntregaFirmaResponsable(){
  const plantilla = entregaDraft.predeterminadoId ? DOTACION.predeterminados.find(x=>x.id===entregaDraft.predeterminadoId) : null;
  openModal(`<div class="modal" style="max-width:560px">
    <div class="modal-head"><div><h2>Firma del responsable</h2><p>Paso 3 de 3 — ${esc(entregaDraft.responsableNombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <p class="muted-sm" style="margin-bottom:10px">Confirma que hiciste la entrega.</p>
      ${plantilla?`
      <div id="firmaRGuardada" style="text-align:center;margin-bottom:12px"><img src="${plantilla.firma}" style="height:80px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px"></div>
      <p class="muted-sm" style="text-align:center;margin-bottom:10px">Firma guardada en "${esc(plantilla.nombre)}"</p>`:''}
      <div id="padWrapR" style="${plantilla?'display:none':''}">
        <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
        <div class="sig-actions"><button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button></div>
        ${!plantilla && DOTACION.predeterminados.length<PREDET_MAX?`
        <label class="chk" style="margin-top:8px" id="chkWrapGuardarPredet"><input type="checkbox" id="chkGuardarPredet"> Guardar como plantilla predeterminada (Predeterminado)</label>
        <div class="field" id="nuevaPredetNombreWrap" style="margin-top:6px;display:none"><input id="nuevaPredetNombre" placeholder="Nombre de la plantilla, ej. Plantilla1"></div>`:''}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="renderPasoEntregaFirmaTrabajador()">${I.back} Atrás</button>
      <button class="btn btn-green" id="btnFirmaRespOk">${I.check} Guardar entrega</button>
    </div>
  </div>`);
  // Si se eligió la plantilla desde el paso 1, se usa esa firma sin opción de
  // "firmar de nuevo" — dar esa opción aquí solo abría la puerta a que un supervisor
  // firmara sin querer con una firma distinta a la que ya había seleccionado.
  let usarGuardada = !!plantilla;
  if(!usarGuardada){ initSignature(); document.getElementById('sigClear').onclick = ()=> sigPad.clear(); }
  const chkGuardarPredet = document.getElementById('chkGuardarPredet');
  if(chkGuardarPredet) chkGuardarPredet.onchange = ()=>{
    document.getElementById('nuevaPredetNombreWrap').style.display = chkGuardarPredet.checked ? 'block' : 'none';
  };
  document.getElementById('btnFirmaRespOk').onclick = async ()=>{
    let firma;
    if(usarGuardada){
      firma = plantilla.firma;
    } else {
      if(!sigPad || sigPad.isEmpty()){ toast("Falta la firma del responsable","err"); return; }
      firma = sigPad.dataURL();
      const chk = document.getElementById('chkGuardarPredet');
      if(chk && chk.checked){
        const nombrePlantilla = document.getElementById('nuevaPredetNombre').value.trim() || ('Plantilla '+(DOTACION.predeterminados.length+1));
        const { error } = await sb.from("dot_predeterminados").insert({
          nombre: nombrePlantilla,
          responsable_nombre: entregaDraft.responsableNombre || '',
          responsable_cargo: entregaDraft.responsableCargo || null,
          firma,
          contrato_id: contratoActualId
        });
        if(error) toast("La entrega se va a guardar, pero no se pudo guardar la plantilla: "+error.message,"err");
        else await loadDotacionState();
      }
    }
    const btn=document.getElementById('btnFirmaRespOk'); btn.disabled=true; btn.innerHTML="Guardando…";
    await guardarEntregaFinal(firma);
  };
}

async function guardarEntregaFinal(firmaResponsable){
  bloquear("Guardando entrega…");
  try{
    const items = entregaDraft.items.map(it=>{
      const c = DOTACION.catalogo.find(x=>x.id===it.catalogoId);
      return { nombre: c?c.nombre:'Ítem', cantidad: it.cantidad, talla: it.talla||null };
    });
    const { error } = await sb.rpc('dot_entrega_presencial_registrar', {
      p_trabajador_id: entregaDraft.trabajadorId,
      p_fecha: entregaDraft.fecha,
      p_responsable_nombre: entregaDraft.responsableNombre || null,
      p_responsable_cargo: entregaDraft.responsableCargo || null,
      p_observaciones: entregaDraft.observaciones || null,
      p_firma_trabajador: entregaDraft.firmaTrabajador,
      p_firma_responsable: firmaResponsable,
      p_foto_trabajador: entregaDraft.fotoTrabajador,
      p_items: items
    });
    if(error){ toast("No se pudo guardar la entrega: "+error.message,"err"); return; }
    const trabId = entregaDraft.trabajadorId;
    const yaEstabaEnFicha = location.hash === "#/dotacion/trabajador/"+trabId;
    entregaDraft = null;
    await loadDotacionState();
    closeModal();
    toast("Entrega registrada correctamente","ok");
    if(yaEstabaEnFicha){ await renderFichaTrabajador(trabId); }
    else { location.hash = "#/dotacion/trabajador/"+trabId; }
  } finally { desbloquear(); }
}

/* ---------- Ficha del trabajador: historial completo + kárdex imprimible ---------- */
async function renderFichaTrabajador(id){
  bloquear("Cargando ficha…");
  try{
    await loadDotacionState();
    const t = DOTACION.trabajadores.find(x=>x.id===id);
    if(!t){ toast("Trabajador no encontrado","err"); location.hash="#/dotacion"; return; }
    const contratoDelTrab = DOTACION.contratos.find(c=>c.id===t.contrato_id);
    const esContratoEscaneado = contratoDelTrab?.modo_registro === 'escaneado';
    const { data: entregas } = await sb.from("dot_entregas")
      .select("id,fecha,responsable_nombre,responsable_cargo,observaciones,creado_en,creado_por,tipo_registro,adjunto_titulo,adjunto_tipo,ip_address,dispositivo_ua")
      .eq("trabajador_id", id).order("fecha",{ascending:false}).order("creado_en",{ascending:false});
    const listaEntregas = entregas || [];
    const idsEnt = listaEntregas.filter(e=>e.tipo_registro!=='escaneado').map(e=>e.id);
    const { data: items } = idsEnt.length
      ? await sb.from("dot_entrega_items").select("entrega_id,nombre_item,cantidad,talla").in("entrega_id", idsEnt)
      : { data: [] };
    const itemsPorEntrega = {};
    (items||[]).forEach(it=>{ (itemsPorEntrega[it.entrega_id] = itemsPorEntrega[it.entrega_id]||[]).push(it); });

    const filas = listaEntregas.map(e=>{
      const horaEnt = e.creado_en ? new Date(e.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'}) : '';
      const esEscaneada = e.tipo_registro === 'escaneado';
      const auditLinea = (e.ip_address||e.dispositivo_ua)
        ? `<div class="muted-sm">${e.ip_address?'IP '+esc(e.ip_address):''}${e.ip_address&&e.dispositivo_ua?' · ':''}${e.dispositivo_ua?esc(resumenDispositivoUA(e.dispositivo_ua)):''}</div>` : '';
      const itemsCol = esEscaneada
        ? `<span class="badge cerrada" style="margin-right:6px"><span class="dot"></span>Escaneado</span>${esc(e.adjunto_titulo||'')}`
        : ((itemsPorEntrega[e.id]||[]).map(it=>`${esc(it.nombre_item)} × ${it.cantidad}${it.talla?' ('+esc(it.talla)+')':''}`).join(', ')||'—');
      const responsableCol = esEscaneada
        ? `${esc(nombreDe(e.creado_por))}${correoDe(e.creado_por)?`<div class="muted-sm">${esc(correoDe(e.creado_por))}</div>`:''}`
        : esc(e.responsable_nombre||'—');
      const accionesCol = esEscaneada
        ? `<div style="display:flex;gap:6px"><button class="icon-btn" title="Ver archivo" onclick="verAdjuntoEntrega('${e.id}','dot_entregas')">${I.eye}</button>
           ${puedoTocarEntrega(e.creado_por)?`<button class="icon-btn" title="Editar entrega" onclick="abrirEditarEntregaEscaneada('${e.id}','${t.id}','dot_entregas')">${I.pen}</button>
           <button class="icon-btn danger" title="Eliminar entrega" onclick="eliminarEntrega('${e.id}','${t.id}')">${I.trash}</button>`:''}</div>`
        : (puedoTocarEntrega(e.creado_por)?`<div style="display:flex;gap:6px"><button class="icon-btn" title="Editar entrega" onclick="abrirEditarEntrega('${e.id}','${t.id}')">${I.pen}</button>
        <button class="icon-btn danger" title="Eliminar entrega" onclick="eliminarEntrega('${e.id}','${t.id}')">${I.trash}</button></div>`:'');
      return `<tr>
        <td>${fmtDate(e.fecha)}${horaEnt?`<div class="muted-sm">${horaEnt}</div>`:''}${auditLinea}</td>
        <td>${itemsCol}</td>
        <td>${responsableCol}</td>
        <td>${accionesCol}</td>
      </tr>`;
    }).join('');

    document.getElementById("app").innerHTML = `
      ${topbar('dotacion')}
      <div class="wrap">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" id="btnVolverDot">${I.back} Volver</button>
        </div>
        ${t.aviso_cedula_rh?`<div class="aviso-cedula"><span>${I.warn} ${esc(t.aviso_cedula_rh)}</span><button class="btn btn-ghost btn-sm" id="btnDescartarAvisoCedula">Descartar</button></div>`:''}
        <div class="page-head">
          <div><h1>${esc(t.nombre)}</h1><p>C.C. ${esc(t.identificacion)}${t.cargo?' · '+esc(t.cargo):''}${t.area?' · '+esc(t.area):''} · ${esc(DOTACION.contratos.find(c=>c.id===t.contrato_id)?.nombre||'—')}${t.fecha_ingreso?' · Ingresó '+fmtDate(t.fecha_ingreso):''}${t.fecha_salida?' · Salió '+fmtDate(t.fecha_salida):''}</p></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            ${MIPERFIL.esAdmin?`<button class="btn btn-ghost" id="btnEditarTrab">${I.pen} Editar datos</button>`:''}
            ${listaEntregas.length?(esContratoEscaneado
              ? `<button class="btn btn-ghost" id="btnZipAdjuntos">${I.doc} Descargar ZIP</button>`
              : `<button class="btn btn-ghost" id="btnKardex">${I.pdf} Imprimir kárdex</button>`):''}
            ${puedeEscribir()?`<button class="btn btn-primary" id="btnNuevaEntregaFicha" title="${t.activo===false?'No se puede registrar entrega: el trabajador está inactivo':''}" ${t.activo===false?'disabled':''}>${I.plus} Registrar entrega</button>`:''}
          </div>
        </div>
        <div class="sec-bar"><h2>Historial de entregas</h2><span class="muted-sm">${listaEntregas.length} registrada(s)</span></div>
        ${listaEntregas.length?`<div class="table-wrap"><table class="dt"><thead><tr><th>Fecha</th><th>Ítems entregados</th><th>Responsable</th><th>Acciones</th></tr></thead><tbody>${filas}</tbody></table></div>`
          :`<div class="empty"><div class="ic">${I.box}</div><h3>Sin entregas todavía</h3><p>Registra la primera entrega de EPP para este trabajador.</p></div>`}
      </div>`;
    wireLogout();
    document.getElementById('btnVolverDot').onclick = ()=> location.hash="#/dotacion";
    const bet = document.getElementById('btnEditarTrab'); if(bet) bet.onclick = ()=> abrirTrabajadorForm(t.id);
    const bdac = document.getElementById('btnDescartarAvisoCedula'); if(bdac) bdac.onclick = ()=> descartarAvisoCedulaRh('dot_trabajadores', t.id, ()=>renderFichaTrabajador(t.id));
    const bk = document.getElementById('btnKardex'); if(bk) bk.onclick = ()=> generarKardexPDF(t.id);
    const bzip = document.getElementById('btnZipAdjuntos'); if(bzip) bzip.onclick = ()=> descargarZipAdjuntosTrabajador('dot_entregas', t.id, t.nombre);
    const bnef = document.getElementById('btnNuevaEntregaFicha'); if(bnef) bnef.onclick = ()=> abrirNuevaEntrega(t.id);
  } finally { desbloquear(); }
}

function eliminarEntrega(entregaId, trabajadorId){
  openModal(`<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>Eliminar entrega</h2><p>Esta acción no se puede deshacer.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body"><p style="font-size:14.5px;color:var(--ink-2)">Se eliminará este registro de entrega junto con sus firmas. Úsalo solo si fue un error (ej. se registró a la persona equivocada).</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confDelEnt">${I.trash} Sí, eliminar</button></div></div>`);
  document.getElementById("confDelEnt").onclick = async ()=>{
    const btn=document.getElementById("confDelEnt"); btn.disabled=true; btn.innerHTML="Eliminando…";
    const { error } = await sb.from("dot_entregas").delete().eq("id", entregaId);
    if(error){ btn.disabled=false; btn.innerHTML=`${I.trash} Sí, eliminar`; toast("No se pudo eliminar: "+error.message,"err"); return; }
    closeModal();
    toast("Entrega eliminada","ok");
    renderFichaTrabajador(trabajadorId);
  };
}

/* ---------- Editar una entrega ya registrada (fecha/ítems/responsable/observaciones/
   firmas/foto). Admin siempre; editor solo la que él mismo registró (puedoTocar), ahora
   SIN límite de 24h desde CAMBIOS_SQL_55 — sigue sin poder tocar la de un compañero, eso
   no cambió. Cada cambio queda registrado con el detalle campo por campo en Auditoría
   (acc_diff_texto), justamente para poder dar esta libertad de tiempo con confianza. ---------- */
let editarEntregaDraft = null;
async function abrirEditarEntrega(entregaId, trabajadorId){
  bloquear("Cargando…");
  let entrega, items;
  try{
    const { data:e } = await sb.from("dot_entregas").select("id,fecha,responsable_nombre,responsable_cargo,observaciones,firma_trabajador,firma_responsable,foto_trabajador").eq("id",entregaId).maybeSingle();
    const { data:it } = await sb.from("dot_entrega_items").select("id,nombre_item,cantidad,talla").eq("entrega_id",entregaId);
    entrega = e; items = it||[];
  } finally { desbloquear(); }
  if(!entrega){ toast("Entrega no encontrada","err"); return; }
  editarEntregaDraft = {
    id: entrega.id, trabajadorId,
    fecha: entrega.fecha,
    responsableNombre: entrega.responsable_nombre || '',
    responsableCargo: entrega.responsable_cargo || '',
    observaciones: entrega.observaciones || '',
    firmaTrabajador: entrega.firma_trabajador || '',
    firmaResponsable: entrega.firma_responsable || '',
    fotoTrabajador: entrega.foto_trabajador || null,
    // Resuelve contra el catálogo activo por nombre exacto (sin distinguir mayúsculas)
    // para poder mostrar un <select> en "Editar entrega" — si el ítem se renombró o
    // desactivó desde que se registró esta entrega, no hay match: catalogoId queda
    // vacío y nombreItem conserva el texto original tal cual (no se corrompe el
    // histórico si el usuario no toca esa fila).
    items: items.length ? items.map(it=>{
      const match = DOTACION.catalogo.find(c=>c.activo && c.nombre.trim().toLowerCase()===String(it.nombre_item||'').trim().toLowerCase());
      return { catalogoId: match ? match.id : '', nombreItem: it.nombre_item, cantidad: it.cantidad, talla: it.talla||'' };
    }) : [{ catalogoId:'', nombreItem:'', cantidad:1, talla:'' }]
  };
  renderFormEditarEntrega();
}

/* Foto de una entrega ya registrada, editable desde "Editar entrega" (EPP y Dotación,
   comparten estas 3 funciones vía el parámetro "draft" que reciben) — antes no se podía
   tocar aquí; el usuario pidió poder corregirla si quedó borrosa/equivocada. */
function eeFotoPreviewHTML(draft){
  draft = draft || editarEntregaDraft;
  return draft.fotoTrabajador
    ? `<div class="cap-prev"><img src="${draft.fotoTrabajador}"><button class="btn btn-ghost btn-sm" id="btnEeCambiarFoto">${I.pen} Cambiar foto</button></div>`
    : `<button class="btn btn-ghost btn-sm" id="btnEeCambiarFoto">${I.user} Agregar foto</button>`;
}
function wireEeFotoPreview(draft){
  draft = draft || editarEntregaDraft;
  const inp = document.getElementById('eeFileFoto');
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    draft.fotoTrabajador = await comprimirImagen(f, 420, 0.6);
    inp.value = '';
    document.getElementById('eeFotoPreview').innerHTML = eeFotoPreviewHTML(draft);

function renderEeItemsList(){
  const host = document.getElementById('eeItemsList'); if(!host) return;
  const activos = DOTACION.catalogo.filter(c=>c.activo);
  host.innerHTML = editarEntregaDraft.items.map((it,i)=>{
    // Ítem legado sin match en el catálogo activo (se renombró/desactivó desde que se
    // registró esta entrega): se muestra como opción fija no reseleccionable, para no
    // corromper el histórico si el usuario no toca la fila.
    const sinMatch = !it.catalogoId && it.nombreItem;
    return `
    <div class="item-row" data-i="${i}">
      <span class="firmante-num">${i+1}</span>
      <select data-f="catalogoId">
        <option value="">Elige el ítem…</option>
        ${sinMatch?`<option value="" selected disabled>${esc(it.nombreItem)} (ya no está en el catálogo activo)</option>`:''}
        ${activos.map(c=>`<option value="${c.id}" ${c.id===it.catalogoId?'selected':''}>${esc(c.nombre)}</option>`).join('')}
      </select>
      <input data-f="cantidad" type="number" min="1" step="1" value="${it.cantidad}" placeholder="Cant.">
      <input data-f="talla" value="${esc(it.talla||'')}" placeholder="Talla (opc.)">
      <button class="icon-btn danger" data-del="${i}" title="Quitar" ${editarEntregaDraft.items.length<=1?'disabled':''}>${I.trash}</button>
    </div>`;
  }).join('');
  host.querySelectorAll('select[data-f="catalogoId"]').forEach(el=>{
    el.onchange = ()=>{
      const i = +el.closest('.item-row').dataset.i;
      const c = activos.find(x=>x.id===el.value);
      editarEntregaDraft.items[i].catalogoId = el.value;
      if(c) editarEntregaDraft.items[i].nombreItem = c.nombre;
    };
  });
  host.querySelectorAll('input[data-f]').forEach(el=>{
    el.oninput = ()=>{
      const i = +el.closest('.item-row').dataset.i;
      const val = el.dataset.f==='cantidad' ? (+el.value||0) : el.value;
      editarEntregaDraft.items[i][el.dataset.f] = val;
    };
  });
  host.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{ if(editarEntregaDraft.items.length<=1) return; editarEntregaDraft.items.splice(+b.dataset.del,1); renderEeItemsList(); };
  });
}

async function guardarEdicionEntrega(){
  const fecha = document.getElementById('eeFecha').value;
  const responsableNombre = document.getElementById('eeRespNombre').value.trim();
  const responsableCargo = document.getElementById('eeRespCargo').value.trim();
  const observaciones = document.getElementById('eeObs').value.trim();
  const validos = editarEntregaDraft.items.filter(it=>it.nombreItem && it.cantidad>0);
  if(!validos.length){ toast("Agrega al menos un ítem con nombre y cantidad","err"); return; }
  const btn = document.getElementById('btnEeGuardar'); btn.disabled=true; btn.innerHTML="Guardando…";
  bloquear("Guardando cambios…");
  try{
    const { error:e1 } = await sb.from("dot_entregas").update({
      fecha, responsable_nombre: responsableNombre||null, responsable_cargo: responsableCargo||null, observaciones: observaciones||null,
      foto_trabajador: editarEntregaDraft.fotoTrabajador||null
    }).eq("id", editarEntregaDraft.id);
    if(e1){ toast("No se pudo guardar: "+e1.message,"err"); return; }
    await sb.from("dot_entrega_items").delete().eq("entrega_id", editarEntregaDraft.id);
    const { error:e2 } = await sb.from("dot_entrega_items").insert(validos.map(it=>({ entrega_id: editarEntregaDraft.id, nombre_item: it.nombreItem, cantidad: it.cantidad, talla: it.talla||null })));
    if(e2) toast("Se guardó la entrega, pero hubo un error con los ítems: "+e2.message,"err");
    else toast("Entrega actualizada","ok");
    closeModal();
    renderFichaTrabajador(editarEntregaDraft.trabajadorId);
  } finally { desbloquear(); }
}

/* ---------- Corregir la firma de una entrega ya guardada (EPP o Dotación).
   Ej. el trabajador firmó por error donde iba la firma del responsable.
   Reemplaza SOLO esa firma puntual — no toca fecha/ítems/foto/lo demás.
   Compartida entre EPP (dot_entregas) y Dotación (dtl_entregas): "tabla" y
   "modulo" dicen a cuál de las dos vuelve y en qué draft en memoria escribir. ---------- */
async function abrirCorregirFirmaEntrega(tabla, campo, etiqueta, modulo){
  const draft = modulo==='epp' ? editarEntregaDraft : editarEntregaDtlDraft;
  let predet = [];
  if(campo==='firma_responsable'){
    if(modulo==='epp'){ predet = DOTACION.predeterminados; }
    else {
      const trab = DTL.trabajadores.find(t=>t.id===draft.trabajadorId);
      predet = await cargarPredeterminadosDtl(trab?.entidad_id);
    }
  }
  const volver = ()=> modulo==='epp' ? renderFormEditarEntrega() : renderFormEditarEntregaDtl();
  openSubModal(`<div class="modal" style="max-width:480px">
    <div class="modal-head"><div><h2>Corregir ${etiqueta.toLowerCase()}</h2><p>Reemplaza la firma guardada en esta entrega.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      ${predet.length?`<label style="font-weight:700;font-size:14px;display:block;margin-bottom:8px">Usar una firma guardada</label>
      <div id="predetPickList">
        ${predet.map(p=>`<button type="button" class="predet-pick" data-predet-firma="${p.id}"><img src="${p.firma}" class="sig-thumb"><span>${esc(p.responsable_nombre)} — ${esc(p.nombre)}</span></button>`).join('')}
      </div>
      <label style="font-weight:700;font-size:14px;display:block;margin:16px 0 8px">O firma nueva</label>`:''}
      <div class="sig-box" id="sigBox"><canvas id="sigCanvas"></canvas><div class="sig-placeholder" id="sigPh">${I.pen}<span>Firma aquí con el dedo, mouse o lápiz</span></div></div>
      <div class="sig-actions"><button class="btn btn-ghost btn-sm" id="sigClear">${I.trash} Limpiar</button></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarFirmaCorregida">${I.check} Guardar firma</button>
    </div>
  </div>`, volver);
  initSignature();
  document.getElementById('sigClear').onclick = ()=> sigPad.clear();
  const guardar = async (firma)=>{
    const btn = document.getElementById('btnGuardarFirmaCorregida'); btn.disabled=true; btn.innerHTML="Guardando…";
    bloquear("Guardando firma…");
    const { error } = await sb.from(tabla).update({ [campo]: firma }).eq("id", draft.id);
    desbloquear();
    if(error){ btn.disabled=false; btn.innerHTML=`${I.check} Guardar firma`; toast("No se pudo guardar: "+error.message,"err"); return; }
    if(campo==='firma_trabajador') draft.firmaTrabajador = firma; else draft.firmaResponsable = firma;
    toast("Firma corregida","ok");
    closeModal();
  };
  document.querySelectorAll('#predetPickList [data-predet-firma]').forEach(btnP=>{
    btnP.onclick = ()=>{
      const p = predet.find(x=>x.id===btnP.dataset.predetFirma);
      if(p) guardar(p.firma);
    };
  });
  document.getElementById('btnGuardarFirmaCorregida').onclick = ()=>{
    if(!sigPad || sigPad.isEmpty()){ toast("Firma primero","err"); return; }
    guardar(sigPad.dataURL());
  };
}

/* Quita el aviso de "RH cambió la cédula" de la ficha de un trabajador, una vez
   que el admin ya lo revisó — no cambia ningún otro dato. */
async function descartarAvisoCedulaRh(tabla, id, alTerminar){
  const { error } = await sb.from(tabla).update({ aviso_cedula_rh: null }).eq("id", id);
  if(error){ toast("No se pudo descartar: "+error.message,"err"); return; }
  toast("Aviso descartado","ok");

}

/* ---------- "Link trabajadores nuevos": herramienta admin-only, compartida entre
   EPP y Dotación. Un solo link fijo por contrato (usa el id del contrato/entidad
   directamente en la URL — no hace falta guardar nada aparte, "existe" apenas el
   contrato existe). Para trabajadores que RH todavía no cargó: crean su propia
   ficha antes de registrar su primera entrega. Ver renderDotPublicoNuevo /
   renderDtlPublicoNuevo más abajo. ---------- */
function mostrarLinkTrabajadoresNuevos(modulo){
  const enTodos = modulo==='epp' ? (contratoActualId==='todos') : (dtlFiltroEntidad==='todas');
  if(enTodos){ toast("Elige un contrato específico primero","err"); return; }
  const id = modulo==='epp' ? contratoActualId : dtlFiltroEntidad;
  const tabla = modulo==='epp' ? 'dot_contratos' : 'dtl_entidades';
  const ruta = modulo==='epp' ? 'dotacion' : 'dotacionlegal';
  const c = modulo==='epp' ? DOTACION.contratos.find(x=>x.id===id) : DTL.entidades.find(x=>x.id===id);
  const nombre = c?.nombre;
  const url = location.href.split("#")[0] + "#/" + ruta + "/entrega-nuevo/" + id;
  const activo = c?.link_nuevos_activo !== false;
  openModal(`<div class="modal" style="max-width:460px">
    <div class="modal-head"><div><h2>Link trabajadores nuevos</h2><p>${esc(nombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <p class="muted-sm" style="margin-bottom:10px">Para trabajadores que todavía no tienen ficha creada (RH no los ha cargado). Al entrar, primero llenan sus datos personales y quedan registrados en este contrato — de ahí en adelante usan el enlace normal para sus próximas entregas. Solo funciona una vez por cédula.</p>
      <label class="chk" style="margin-bottom:10px"><input type="checkbox" id="chkLinkNuevosActivo" ${activo?'checked':''}> Enlace activo (desactívalo cuando no lo necesites, para evitar errores)</label>
      <div class="field"><input readonly value="${esc(url)}" onclick="this.select()"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-ghost" id="btnQrLinkNuevos">${I.qr} QR</button>
      <button class="btn btn-primary" id="btnCopiarLinkNuevos">${I.link} Copiar enlace</button>
    </div></div>`);
  document.getElementById('btnCopiarLinkNuevos').onclick = ()=> copyText(url, "Enlace copiado");
  document.getElementById('btnQrLinkNuevos').onclick = ()=> mostrarQR(url, "Trabajadores nuevos — "+(nombre||''));
  document.getElementById('chkLinkNuevosActivo').onchange = async (e)=>{
    const nuevoValor = e.target.checked;
    const { error } = await sb.from(tabla).update({ link_nuevos_activo: nuevoValor }).eq("id", id);
    if(error){ e.target.checked = !nuevoValor; toast("No se pudo actualizar: "+error.message,"err"); return; }
    if(c) c.link_nuevos_activo = nuevoValor;
    toast(nuevoValor?"Enlace activado":"Enlace desactivado","ok");
  };
}

/* ============================================================
   Flujo público — enlace de entrega remota de EPP, UN ENLACE POR
   CONTRATO (#/dotacion/entrega/<contratoId>). En EPP la cédula es
   única solo DENTRO de cada contrato (no en toda la empresa como en
   Dotación), así que el enlace lleva el contrato incluido y busca la
   cédula solo ahí — sin ambigüedad posible.
   ============================================================ */
const EPP_DECLARACION = "Declaro haber recibido a satisfacción los elementos de protección personal (EPP) relacionados en este documento, en buen estado y en las cantidades indicadas. Me comprometo a utilizarlos durante el desarrollo de mis labores y a darles el cuidado adecuado.";
let dotPublicoState = { contratoId:null, catalogo:[], trabajador:null, foto:null };

/* ---------- Enlace/QR ÚNICO de EPP (un solo enlace para todos los contratos) ----------
   No se sabe a qué contrato pertenece la persona hasta que escribe su cédula —
   la cédula en EPP es única POR CONTRATO (a propósito, un trabajador puede estar
   activo en más de uno a la vez), así que puede aparecer más de una vez. Regla:
   si aparece en un solo contrato, se sigue directo; si aparece en varios pero
   solo UNO está activo, se usa ese sin preguntar (el otro ya no aplica — típico
   caso de alguien que cambió de contrato); si de verdad hay ambigüedad (0
   activos, o 2+ activos a la vez), se le pregunta en cuál trabaja. */
async function renderDotPublicoUniversal(){
  dotPublicoState = { contratoId:null, catalogo:[], trabajador:null, foto:null };
  await cargarAppConfig();   // sin esto, APP_CONFIG queda en su valor por defecto y el aviso "(obligatoria)" no sale aunque sí se exija al guardar (lo aplica un trigger en la base de datos, no el cliente)
  renderDotPublicoCedulaUniversal();
}

function renderDotPublicoCedulaUniversal(){
  document.getElementById("app").innerHTML = `
    <div class="pub-wrap"><div class="pub-card"><div class="pub-body">
      <img src="${LOGO}" alt="Don Aseo Ltda." style="height:48px;display:block;margin:0 auto 18px">
      <h2 style="text-align:center;margin-bottom:6px">Entrega de EPP</h2>
      <p class="muted-sm" style="text-align:center;margin-bottom:20px">Escribe tu número de cédula para continuar.</p>
      <div class="field"><label>Número de identificación (cédula) *</label><input id="epCedula" inputmode="numeric" placeholder="C.C."></div>
      <div id="epError" class="login-err"></div>
      <button class="btn btn-primary" id="epBuscarBtn" style="width:100%;padding:13px;margin-top:6px">${I.check} Continuar</button>
    </div></div></div>`;
  document.getElementById('epBuscarBtn').onclick = async ()=>{
    const cedula = document.getElementById('epCedula').value.trim();
    const err = document.getElementById('epError');
    err.textContent = '';
    if(!cedula){ err.textContent = 'Escribe tu cédula.'; return; }
    const btn = document.getElementById('epBuscarBtn'); btn.disabled=true; btn.innerHTML='Buscando…';
    const { data, error } = await sb.rpc('dot_publico_buscar_global', { p_cedula: cedula });
    btn.disabled=false; btn.innerHTML=`${I.check} Continuar`;
    if(error || !data || !data.length){
      err.textContent = 'No encontramos tu cédula. Contacta a Recursos Humanos.';
      return;
    }
    const activos = data.filter(c=>c.activo);
    if(!activos.length){
      err.textContent = 'Tu cédula no está activa en ningún contrato. Contacta a Recursos Humanos.';
      return;
    }
    if(activos.length === 1){ await continuarConTrabajadorEpp(activos[0]); return; }
    renderDotPublicoElegirContrato(activos);
  };
}

/* Pantalla intermedia — solo aparece cuando de verdad hay ambigüedad real
   (la misma cédula activa en más de un contrato, o inactiva en todos). */
function renderDotPublicoElegirContrato(candidatos){
  document.getElementById("app").innerHTML = `
    <div class="pub-wrap"><div class="pub-card"><div class="pub-body">
      <img src="${LOGO}" alt="Don Aseo Ltda." style="height:48px;display:block;margin:0 auto 18px">
      <h2 style="text-align:center;margin-bottom:6px">¿En cuál contrato trabajas?</h2>
      <p class="muted-sm" style="text-align:center;margin-bottom:20px">Encontramos tu cédula en más de un contrato.</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${candidatos.map((c,i)=>`<button class="btn btn-ghost" data-elegir="${i}" style="width:100%;padding:13px;text-align:left">${esc(c.contrato_nombre||'Contrato')}</button>`).join('')}
      </div>
    </div></div></div>`;
  document.querySelectorAll('[data-elegir]').forEach(b=>{
    b.onclick = ()=> continuarConTrabajadorEpp(candidatos[+b.dataset.elegir]);
  });
}

async function continuarConTrabajadorEpp(t){
  dotPublicoState.contratoId = t.contrato_id;
  dotPublicoState.trabajador = { id:t.id, nombre:t.nombre, identificacion:t.identificacion, cargo:t.cargo, contratoNombre:t.contrato_nombre };
  const { data } = await sb.rpc('dot_publico_catalogo', { p_contrato_id: t.contrato_id });
  dotPublicoState.catalogo = data || [];
  renderDotPublicoFormulario();
}

function epFotoPreviewHTML(){
  return dotPublicoState.foto
    ? `<div class="cap-prev"><img src="${dotPublicoState.foto}"><button class="btn btn-ghost btn-sm" id="epBtnCambiarFoto">${I.pen} Cambiar foto</button></div>`
    : `<button class="btn btn-ghost btn-sm" id="epBtnTomarFoto">${I.user} Tomar foto</button>`;

function wireEpFotoPreview(){
  const inp = document.getElementById('epFileFoto');
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    dotPublicoState.foto = await comprimirImagen(f, 420, 0.6);
    inp.value = '';
    document.getElementById('epFotoPreview').innerHTML = epFotoPreviewHTML();
    wireEpFotoPreview();
  };
  const bt = document.getElementById('epBtnTomarFoto'); if(bt) bt.onclick = ()=> inp.click();
  const bc = document.getElementById('epBtnCambiarFoto'); if(bc) bc.onclick = ()=> inp.click();
}

async function confirmarEntregaDotPublica(){
  const err = document.getElementById('epError'); err.textContent = '';
  const items = [];
  dotPublicoState.catalogo.forEach(c=>{
    const s = dotPublicoState.seleccion[c.id];
    if(!s || !s.incluido) return;
    const cant = +s.cantidad || 0;
    if(cant>0) items.push({ nombre: c.nombre, cantidad: cant, talla: (s.talla||'').trim()||null });
  });
  if(!items.length){ err.textContent = 'Selecciona al menos un ítem que estás recibiendo.'; return; }
  if(APP_CONFIG.eppFotoObligatoria && !dotPublicoState.foto){ err.textContent = 'Tu foto es obligatoria para continuar.'; return; }
  if(!sigPad || sigPad.isEmpty()){ err.textContent = 'Falta tu firma.'; return; }
  const btn = document.getElementById('epConfirmarBtn'); btn.disabled=true; btn.innerHTML='Guardando…';
  const firma = sigPad.dataURL();
  const observaciones = document.getElementById('epObs').value.trim();
  const { data, error } = await sb.rpc('dot_publico_registrar', {
    p_contrato_id: dotPublicoState.contratoId,
    p_trabajador_id: dotPublicoState.trabajador.id,
    p_items: items,
    p_observaciones: observaciones || null,
    p_firma_trabajador: firma,
    p_foto_trabajador: dotPublicoState.foto
  });
  if(error || !data || !data.ok){
    btn.disabled=false; btn.innerHTML=`${I.check} Confirmar entrega`;
    err.textContent = (error && error.message) ? error.message : 'No se pudo registrar la entrega. Intenta de nuevo.';
    return;
  }
  renderDotPublicoExito();
}

  document.getElementById("app").innerHTML = pantallaFirmaOk("¡Listo!", "Tu entrega de EPP quedó registrada correctamente.");
}

/* Dimensiones naturales (px) de una imagen data-URL, para no distorsionar su proporción al estamparla en el PDF */
function getImageSize(dataUrl){
  return new Promise(res=>{
    if(!dataUrl){ res(null); return; }
    const img = new Image();
    img.onload = ()=> res({ w:img.naturalWidth, h:img.naturalHeight });
    img.onerror = ()=> res(null);
    img.src = dataUrl;
  });
}

/* ---------- Kárdex acumulado en PDF (evidencia por si hay un reclamo) ---------- */
/* Arma el PDF del kárdex de UN trabajador. Devuelve {doc, nombreBase} o null si no tiene entregas.
   No guarda el archivo — lo reutilizan tanto la descarga individual como el ZIP masivo. */
async function construirKardexPDF(trabajadorId, filtroFechas){
  const { data: t } = await sb.from("dot_trabajadores").select("id,nombre,identificacion,cargo,area,contrato_id").eq("id",trabajadorId).maybeSingle();
  if(!t) return null;
  let q = sb.from("dot_entregas")
    .select("id,fecha,responsable_nombre,responsable_cargo,firma_trabajador,firma_responsable,foto_trabajador,creado_en,via,ip_address,dispositivo_ua,tipo_registro,adjunto_titulo,adjunto_archivo,adjunto_tipo")
    .eq("trabajador_id", trabajadorId);
  if(filtroFechas){ q = q.gte("fecha", filtroFechas.desde).lte("fecha", filtroFechas.hasta); }
  const { data: entregas } = await q.order("fecha",{ascending:false}).order("creado_en",{ascending:false});
  const listaEntregas = entregas || [];
  if(!listaEntregas.length) return null;
  const ids = listaEntregas.map(e=>e.id);
  const { data: items } = await sb.from("dot_entrega_items").select("entrega_id,nombre_item,cantidad,talla").in("entrega_id", ids);
  const itemsPorEntrega = {};
  (items||[]).forEach(it=>{ (itemsPorEntrega[it.entrega_id] = itemsPorEntrega[it.entrega_id]||[]).push(it); });
  const nombreContrato = (DOTACION.contratos.find(c=>c.id===t.contrato_id)||{}).nombre || "";

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const PW = 210, M = 10, RIGHT = PW - M;
  const x0=M, x1=M+18, x2=M+78, x2f=M+104, x3=M+139, x4=RIGHT; // Fecha 18 / Ítems 60 / Foto 26 / Firma trab. 35 / Firma resp. 51

  function grayHead(y,h){ doc.setFillColor(238,241,248); doc.rect(M,y,RIGHT-M,h,"F"); }

  function encabezado(){
    let y=M;
    const hH=24, logoW=44;
    doc.setDrawColor(150,160,190); doc.setLineWidth(0.3); doc.rect(M,y,RIGHT-M,hH);
    doc.line(M+logoW,y,M+logoW,y+hH);
    try{ doc.addImage(LOGO,"JPEG",M+4,y+2,36,36*315/570); }catch(e){}
    doc.setTextColor(20,33,90); doc.setFont("helvetica","bold"); doc.setFontSize(14);
    doc.text("CONTROL DE ENTREGA DE EPP", M+logoW+(RIGHT-M-logoW)/2, y+13, {align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(90,90,110);
    doc.text(pdfTexto("Kárdex acumulado por trabajador"+(nombreContrato?" · "+nombreContrato:"")+" · Don Aseo Ltda."), M+logoW+(RIGHT-M-logoW)/2, y+19, {align:"center"});
    y += hH;

    const fh=16;
    doc.setDrawColor(150,160,190); doc.rect(M,y,RIGHT-M,fh);
    doc.line(M+95,y,M+95,y+fh);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(90,90,110);
    doc.text("TRABAJADOR", M+3, y+5);
    doc.text("CARGO / ÁREA", M+98, y+5);
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
    doc.text(pdfTexto(t.nombre||""), M+3, y+11);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(60,60,70);
    doc.text("C.C. "+(t.identificacion||""), M+3, y+15.5);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(20,20,20);
    doc.text(doc.splitTextToSize(pdfTexto((t.cargo||"—")+(t.area?(" · "+t.area):"")), RIGHT-M-100), M+98, y+11);
    y += fh + 2;
    return y;
  }

  function tablaHead(y){
    const h=8;
    grayHead(y,h);
    doc.setDrawColor(150,160,190);
    [x0,x1,x2,x2f,x3,x4].forEach(x=>doc.line(x,y,x,y+h));
    doc.rect(M,y,RIGHT-M,h);
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(40,40,60);
    const ct=(a,b,txt)=>doc.text(txt,(a+b)/2,y+5.2,{align:"center"});
    ct(x0,x1,"FECHA"); ct(x1,x2,"ÍTEMS ENTREGADOS");
    ct(x2,x2f,"FOTO"); ct(x2f,x3,"FIRMA TRABAJADOR"); ct(x3,x4,"FIRMA RESPONSABLE");
    return y+h;
  }

  const FOOTER_Y = 290;
  function piePagina(pag){
    doc.setFontSize(6.6); doc.setTextColor(140,140,160);
    doc.text("Este documento constituye evidencia de la entrega de EPP, firmada digitalmente por el trabajador y el responsable.", PW/2, FOOTER_Y, {align:"center"});
    doc.text("Generado el "+fmtDateTime(new Date())+" · Don Aseo Ltda. · Pág. "+pag, PW/2, FOOTER_Y+4, {align:"center"});
  }

  const FOOTER_TOP = 278;
  const colFotoW = x2f-x2-4;
  // Decodificar todas las fotos EN PARALELO antes de dibujar (antes se hacía una por
  // una dentro del for, esperando cada foto antes de pasar a la siguiente — con
  // trabajadores de historial largo eso hacía que el kárdex tardara cada vez más).
  const dimsPorEntrega = {};
  await Promise.all(listaEntregas.map(async e=>{
    if(e.tipo_registro==='escaneado'){
      if(e.adjunto_archivo && e.adjunto_tipo!=='application/pdf') dimsPorEntrega[e.id] = await getImageSize(e.adjunto_archivo);
    } else if(e.foto_trabajador) dimsPorEntrega[e.id] = await getImageSize(e.foto_trabajador);
  }));
  // Firmas convertidas a JPEG en paralelo, mismo motivo que dimsPorEntrega arriba (ver
  // firmaParaPdf): jsPDF infla mucho una firma PNG al incrustarla en el PDF.
  const firmasJpgPorEntrega = {};
  await Promise.all(listaEntregas.map(async e=>{
    if(e.tipo_registro==='escaneado') return;
    const [t,r] = await Promise.all([firmaParaPdf(e.firma_trabajador), firmaParaPdf(e.firma_responsable)]);
    firmasJpgPorEntrega[e.id] = { t, r };
  }));
  let y = encabezado();
  y = tablaHead(y);
  let pag = 1;
  for(const e of listaEntregas){
    const esEscaneada = e.tipo_registro === 'escaneado';
    const its = itemsPorEntrega[e.id]||[];
    const lineas = esEscaneada
      ? [pdfTexto(e.adjunto_titulo||'Entrega escaneada')]
      : (its.length ? its.map(it=>"• "+it.nombre_item+" × "+it.cantidad+(it.talla?" ("+it.talla+")":"")) : ["—"]);
    // splitTextToSize mide el texto con la fuente ACTIVA en el momento de llamarla — hay
    // que fijarla aquí, a la misma que se usa luego para dibujar (7.4), si no el ancho de
    // ajuste queda calculado con la fuente que haya quedado activa de la fila anterior
    // (más chica) y el texto se sale del recuadro al dibujarse más grande de lo que se midió.
    doc.setFont("helvetica","normal"); doc.setFontSize(7.4);
    const wrapped = doc.splitTextToSize(pdfTexto(lineas.join("\n")), x2-x1-4);
    const tieneAuditoria = !!(e.ip_address || e.dispositivo_ua);
    let rowH = Math.max(tieneAuditoria ? 22 : 16, wrapped.length*3.6 + 5);
    // Si hay foto, la fila crece para respetar su proporción original (nunca se estira/deforma la foto)
    let fotoH = 0;
    const dims = dimsPorEntrega[e.id] || null;
    if(dims && dims.w>0){ fotoH = Math.min(90, colFotoW * (dims.h/dims.w)); rowH = Math.max(rowH, fotoH+4); }
    if(y + rowH > FOOTER_TOP){
      piePagina(pag);
      doc.addPage(); pag++;
      y = M+2; y = tablaHead(y);
    }
    doc.setDrawColor(180,188,210);
    [x0,x1,x2,x2f,x3,x4].forEach(x=>doc.line(x,y,x,y+rowH));
    doc.line(M,y+rowH,RIGHT,y+rowH);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(20,20,20);
    doc.text(fmtDate(e.fecha), (x0+x1)/2, y+rowH/2-0.5, {align:"center"});
    let yAudit = y+rowH/2+4;
    if(e.creado_en){
      const horaFirma = new Date(e.creado_en).toLocaleTimeString("es-CO",{hour:'2-digit',minute:'2-digit'});
      doc.setFontSize(6.5); doc.setTextColor(120,120,140);
      doc.text(horaFirma, (x0+x1)/2, yAudit, {align:"center"});
      yAudit += 3;
    }
    if(tieneAuditoria){
      doc.setFontSize(5.3); doc.setTextColor(150,150,170);
      if(e.ip_address){ doc.text("IP "+e.ip_address, (x0+x1)/2, yAudit, {align:"center"}); yAudit += 2.6; }
      const disp = resumenDispositivoUA(e.dispositivo_ua);
      if(disp) doc.text(disp, (x0+x1)/2, yAudit, {align:"center"});
    }
    doc.setFont("helvetica","normal"); doc.setFontSize(7.4); doc.setTextColor(20,20,20);
    doc.text(wrapped, x1+2, y+5);
    if(esEscaneada){
      if(e.adjunto_tipo==='application/pdf'){
        doc.setFont("helvetica","italic"); doc.setFontSize(6.6); doc.setTextColor(130,130,150);
        doc.text(doc.splitTextToSize("Archivo PDF adjunto — ver en el sistema", x4-x2-4), x2+2, y+rowH/2-1);
        doc.setFont("helvetica","normal");
      } else if(e.adjunto_archivo){
        try{
          if(dims && dims.w>0) doc.addImage(e.adjunto_archivo,"JPEG",x2+2,y+2,colFotoW,fotoH);
          else doc.addImage(e.adjunto_archivo,"JPEG",x2+2,y+2,colFotoW,rowH-4);
        }catch(err){}
      }
    } else {
      if(e.foto_trabajador){
        try{
          if(dims && dims.w>0) doc.addImage(e.foto_trabajador,"JPEG",x2+2,y+2,colFotoW,fotoH);
          else doc.addImage(e.foto_trabajador,"JPEG",x2+2,y+2,colFotoW,rowH-4); // sin dimensiones (raro): antiguo comportamiento de respaldo
        }catch(err){}
      }
      if(e.firma_trabajador){ try{ doc.addImage((firmasJpgPorEntrega[e.id]||{}).t||e.firma_trabajador,"JPEG",x2f+3,y+2,x3-x2f-6,rowH-4); }catch(err){} }
      if(e.firma_responsable){ try{ doc.addImage((firmasJpgPorEntrega[e.id]||{}).r||e.firma_responsable,"JPEG",x3+3,y+2,x4-x3-6,rowH-4); }catch(err){} }
      else if(e.via==='remoto'){
        doc.setFont("helvetica","italic"); doc.setFontSize(7.5); doc.setTextColor(130,130,150);
        doc.text("Firmado remotamente", (x3+x4)/2, y+rowH/2, {align:"center"});
        doc.setFont("helvetica","normal");
      }
    }
    doc.setFontSize(6); doc.setTextColor(120,120,140);
    if(e.responsable_nombre) doc.text(pdfTexto(e.responsable_nombre), x3+3, y+rowH-1.5);
    y += rowH;
  }
  piePagina(pag);

  const safe = (t.nombre||"trabajador").replace(/[^\w\sáéíóúñ-]/gi,"").trim().replace(/\s+/g,"_").slice(0,40);
  return { doc, nombreBase: safe };
}

async function generarKardexPDF(trabajadorId){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  bloquear("Generando PDF…");
  try{
    const r = await construirKardexPDF(trabajadorId);
    if(!r){ toast("Este trabajador no tiene entregas registradas","err"); return; }
    r.doc.save("Kardex_dotacion_"+r.nombreBase+".pdf");
    toast("PDF generado","ok");
  }catch(e){ console.error(e); toast("No se pudo generar el PDF: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

async function descargarZipKardexSeleccion(contratoIds){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("No se pudo cargar el generador de PDF (revisa tu conexión)","err"); return; }
  if(!window.JSZip){ toast("No se pudo cargar el compresor ZIP (revisa tu conexión)","err"); return; }
  const idsSet = new Set(contratoIds);
  const candidatos = DOTACION.trabajadores.filter(t=>idsSet.has(t.contrato_id));
  const idsConEntrega = new Set(DOTACION.entregas.map(e=>e.trabajador_id));
  const lista = candidatos.filter(t=>idsConEntrega.has(t.id));
  if(!candidatos.length){ toast("No hay trabajadores para exportar","err"); return; }
  if(!lista.length){ toast("Ninguno de los trabajadores elegidos tiene entregas registradas todavía","err"); return; }
  bloquear("Preparando ZIP…");
  try{
    const zip = new JSZip();
    const usados = {};
    let incluidos = 0, sinEntregas = candidatos.length - lista.length;
    for(let i=0;i<lista.length;i++){
      const t = lista[i];
      bloquearMsg(`Generando kárdex ${i+1} de ${lista.length}…`);
      try{
        const r = await construirKardexPDF(t.id);
        if(!r){ sinEntregas++; continue; }
        let base = r.nombreBase || ('trabajador_'+(i+1));
        if(usados[base]!=null){ usados[base]++; base = base+'_'+usados[base]; } else usados[base]=0;
        zip.file(base+'.pdf', r.doc.output('arraybuffer'));
        incluidos++;
      }catch(e){ console.warn('kardex zip', t.id, e); }
    }
    if(!incluidos){ toast("Ningún trabajador tiene entregas registradas todavía","err"); return; }
    bloquearMsg("Comprimiendo ZIP…");
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
    const url = URL.createObjectURL(blob);
    const nombreContrato = contratoIds.length===DOTACION.contratos.length ? 'todos_los_contratos' : (contratoIds.length===1 ? (DOTACION.contratos.find(c=>c.id===contratoIds[0])?.nombre||'contrato') : contratoIds.length+'_contratos');
    const safeContrato = String(nombreContrato).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,40);
    const a = document.createElement('a'); a.href=url;
    a.download = 'Kardex_dotacion_'+safeContrato+'.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 6000);
    let msg = `ZIP generado con ${incluidos} kárdex`;
    if(sinEntregas) msg += ` (${sinEntregas} trabajador(es) sin entregas, omitido(s))`;
    toast(msg,"ok");
  }catch(e){ console.error(e); toast("No se pudo generar el ZIP: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* Selección de contratos para el Excel de entregas de EPP — mismo modal que el ZIP, distinta acción. */
/* Ya no pregunta qué contrato(s) incluir: descarga directo el contrato activo del
   selector de arriba, o todos si el selector está en "Todos los contratos". */
function descargarExcelDot(){
  const ids = contratoActualId==='todos' ? DOTACION.contratos.map(c=>c.id) : [contratoActualId];
  if(!ids.length){ toast("No hay contratos para exportar","err"); return; }
  descargarExcelDotSeleccion(ids);
}

/* Excel de entregas de EPP: una fila por entrega (nombre/identificación/cargo/área + fecha/ítems/responsable).
   Los trabajadores sin ninguna entrega también aparecen, con esas columnas en blanco (para detectar
   quién todavía no ha recibido nada). Se consultan fecha/ítems/responsable frescos porque el estado
   precargado (DOTACION.entregas/entregaItems) no trae responsable_nombre ni talla. */
async function descargarExcelDotSeleccion(contratoIds){
  if(!window.XLSX){ toast("No se pudo cargar el generador de Excel (revisa tu conexión)","err"); return; }
  const idsSet = new Set(contratoIds);
  const trabajadores = DOTACION.trabajadores.filter(t=>idsSet.has(t.contrato_id));
  if(!trabajadores.length){ toast("No hay trabajadores para exportar","err"); return; }
  bloquear("Generando Excel…");
  try{
    const idsTrab = trabajadores.map(t=>t.id);
    const { data: entregas, error: e1 } = await sb.from("dot_entregas")
      .select("id,trabajador_id,fecha,responsable_nombre,via").in("trabajador_id", idsTrab).order("fecha",{ascending:true});
    if(e1){ toast("No se pudo cargar: "+e1.message,"err"); return; }
    const idsEnt = (entregas||[]).map(e=>e.id);
    const { data: items, error: e2 } = idsEnt.length
      ? await sb.from("dot_entrega_items").select("entrega_id,nombre_item,cantidad,talla").in("entrega_id", idsEnt)
      : { data: [] };
    if(e2){ toast("No se pudo cargar: "+e2.message,"err"); return; }
    const itemsPorEntrega = {};
    (items||[]).forEach(it=>{ (itemsPorEntrega[it.entrega_id]=itemsPorEntrega[it.entrega_id]||[]).push(it); });
    const entregasPorTrab = {};
    (entregas||[]).forEach(e=>{ (entregasPorTrab[e.trabajador_id]=entregasPorTrab[e.trabajador_id]||[]).push(e); });

    const filas = [];
    trabajadores.forEach(t=>{
      const nombreContrato = (DOTACION.contratos.find(c=>c.id===t.contrato_id)||{}).nombre || '';
      const entregasT = entregasPorTrab[t.id] || [];
      if(!entregasT.length){
        filas.push({ Contrato:nombreContrato, 'Nombre completo':t.nombre, 'Identificación':t.identificacion, Cargo:t.cargo||'', 'Área':t.area||'', 'Fecha de entrega':'', 'Ítems entregados':'', Responsable:'' });
      } else {
        entregasT.forEach(e=>{
          const its = (itemsPorEntrega[e.id]||[]).map(it=>it.nombre_item+' × '+it.cantidad+(it.talla?' ('+it.talla+')':'')).join(', ');
          filas.push({
            Contrato: nombreContrato, 'Nombre completo': t.nombre, 'Identificación': t.identificacion,
            Cargo: t.cargo||'', 'Área': t.area||'',
            'Fecha de entrega': fmtDate(e.fecha), 'Ítems entregados': its || '—',
            Responsable: e.responsable_nombre || (e.via==='remoto' ? '(entrega remota)' : '')
          });
        });
      }
    });
    const ws = XLSX.utils.json_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'EPP');
    const nombreArchivo = contratoIds.length===DOTACION.contratos.length ? 'todos_los_contratos' : (contratoIds.length===1 ? (DOTACION.contratos.find(c=>c.id===contratoIds[0])?.nombre||'contrato') : contratoIds.length+'_contratos');
    const safe = String(nombreArchivo).replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,40);
    XLSX.writeFile(wb, 'Entregas_EPP_'+safe+'.xlsx');
    toast("Excel generado","ok");
  }catch(e){ console.error(e); toast("No se pudo generar el Excel: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* ============================================================
   MÓDULO DOTACIÓN · Elementos de dotación legal (2 pantalones,
   2 camisas, 1 par de botas + adicional libre). Directorio propio
   de entidades/trabajadores, SEPARADO del módulo EPP. Dos vías:
   presencial (supervisor logueado) y remota (enlace único para
   toda la empresa, por cédula, sin login).
   ============================================================ */
let DTL = { entidades: [], trabajadores: [], entregas: [], predeterminados: [], catalogo: [] };
let dtlQuery = "";
let dtlEntregaDraft = null;
let dtlEscaneadaState = null;
/* Filtro de la grilla de trabajadores — "todas" muestra a todos los que la cuenta pueda ver
   (RLS ya limita a las entidades con acceso), sin necesidad de elegir una entidad primero. */
let dtlFiltroEntidad = localStorage.getItem('dtl_filtro_entidad') || 'todas';
/* Selección múltiple para marcar inactivos / eliminar en bloque (solo admin) */
let dtlMostrarInactivos = false;

const DTL_DECLARACION = "Declaro haber recibido a satisfacción los elementos de dotación relacionados en este documento, en buen estado y de acuerdo con mi talla. Me comprometo a utilizarlos durante el desarrollo de mis labores y a darles el cuidado adecuado.";

async function loadDtlState(){
  const [en, t, e] = await Promise.all([
    sb.from("dtl_entidades").select("id,nombre,activo,creado_en,modo_registro,link_nuevos_activo,catalogo_unico").order("nombre",{ascending:true}),
    cargarTodasFilas(()=> sb.from("dtl_trabajadores").select("id,nombre,identificacion,cargo,area,entidad_id,fecha_ingreso,fecha_salida,aviso_cedula_rh,correo,activo,inactivo_por_archivo,creado_en").order("nombre",{ascending:true}).order("id",{ascending:true})),
    cargarTodasFilas(()=> sb.from("dtl_entregas").select("id,trabajador_id,fecha").order("fecha",{ascending:false}).order("id",{ascending:true}))
  ]);
  const err = en.error || t.error || e.error;
  if(err){ console.warn(err); toast("Error cargando Dotación: "+err.message,"err"); }
  DTL.entidades = en.data || [];
  DTL.trabajadores = t.data || [];
  DTL.entregas = e.data || [];
  // Si el filtro guardado ya no corresponde a una entidad que exista/tengas acceso, vuelve a "todas"
  if(dtlFiltroEntidad!=='todas' && !DTL.entidades.some(x=>x.id===dtlFiltroEntidad)){
    dtlFiltroEntidad = 'todas';
    localStorage.setItem('dtl_filtro_entidad', 'todas');
  }
  // El catálogo único es POR ENTIDAD — se carga después de tener dtlFiltroEntidad resuelto.
  // En modo "todas" (o sin entidad) queda vacío.
  if(dtlFiltroEntidad && dtlFiltroEntidad!=='todas'){
    const { data:c, error:ec } = await sb.from("dtl_catalogo").select("*").eq("entidad_id", dtlFiltroEntidad).order("nombre",{ascending:true});
    if(ec) console.warn(ec);
    DTL.catalogo = c || [];
  } else {
    DTL.catalogo = [];
  }
}
function entidadActualDtl(){ return DTL.entidades.find(x=>x.id===dtlFiltroEntidad) || null; }

function nombreEntidadDtl(id){ const x = DTL.entidades.find(e=>e.id===id); return x ? x.nombre : '—'; }
/* Trabajadores visibles en la grilla según el filtro ("todas" = todos los accesibles) */
function trabajadoresDeEntidad(){
  return dtlFiltroEntidad==='todas' ? DTL.trabajadores : DTL.trabajadores.filter(t=>t.entidad_id===dtlFiltroEntidad);
}
function entregasDeEntidad(){
  const ids = new Set(trabajadoresDeEntidad().map(t=>t.id));
  return DTL.entregas.filter(e=>ids.has(e.trabajador_id));
}
/* Predeterminados de UNA entidad específica, cargados bajo demanda (ya no hay una sola
   "entidad actual" global — cada acción resuelve la entidad que le corresponde) */
async function cargarPredeterminadosDtl(entidadId){
  if(!entidadId) return [];
  const { data, error } = await sb.from("dtl_predeterminados").select("id,nombre,responsable_nombre,responsable_cargo,firma").eq("entidad_id", entidadId).order("creado_en",{ascending:true});
  if(error){ console.warn(error); return []; }
  return data || [];
}
/* Catálogo de ítems de UNA entidad específica, cargado bajo demanda — igual que
   cargarPredeterminadosDtl, porque DTL.catalogo (cargado en loadDtlState) está
   scoped a dtlFiltroEntidad y puede no corresponder a la entidad del trabajador
   si el panel está en modo "Todos los contratos". */
async function cargarCatalogoDtl(entidadId){
  if(!entidadId) return [];
  const { data, error } = await sb.from("dtl_catalogo").select("id,nombre,unidad,activo").eq("entidad_id", entidadId).order("nombre",{ascending:true});
  if(error){ console.warn(error); return []; }
  return data || [];
}

  if(silent) window.scrollTo(0, scrollY);
  if(!silent){ if(_dtlTimer) clearInterval(_dtlTimer); _dtlTimer = setInterval(_tickDtl, 20000); }
}

/* Lista actualmente visible (entidad + búsqueda + filtro de inactivos) — la usan tanto
   la grilla como la casilla "Todos". */
function trabajadoresFiltradosDtl(){
  let db = trabajadoresDeEntidad();
  if(!dtlMostrarInactivos) db = db.filter(t=>t.activo!==false);
  const q = dtlQuery.trim().toLowerCase();
  if(q) db = db.filter(t=>
    (t.nombre||"").toLowerCase().includes(q) ||
    (t.identificacion||"").toLowerCase().includes(q) ||
    (t.cargo||"").toLowerCase().includes(q) ||
    (t.area||"").toLowerCase().includes(q)
  );
  return db;
}

function actualizarContadorSeleccionDtl(){
  const el = document.getElementById('contadorSeleccionDtl');
  if(el) el.textContent = seleccionadosDtl.size+' seleccionado(s)';
}

/* Se llama cada vez que cambia la selección: muestra/oculta la barra de acciones en
   bloque y sincroniza la casilla "Todos" sin recargar toda la grilla. */
function actualizarBarraSeleccionDtl(){
  const barra = document.getElementById('barraSeleccionDtl');
  if(barra) barra.style.display = seleccionadosDtl.size ? 'flex' : 'none';
  actualizarContadorSeleccionDtl();
  const chkTodos = document.getElementById('chkTodosDtl');
  if(chkTodos){
    const visibles = trabajadoresFiltradosDtl();
    chkTodos.checked = visibles.length>0 && visibles.every(t=>seleccionadosDtl.has(t.id));
  }
}

function renderDtlGrid(){
  const host = document.getElementById("dtlGrid");
  if(!host) return;
  const db = trabajadoresFiltradosDtl();
  if(!db.length){
    host.innerHTML = `<div class="empty"><div class="ic">${I.box}</div><h3>${trabajadoresDeEntidad().length?'Sin resultados':'Sin trabajadores todavía'}</h3>
      <p>${trabajadoresDeEntidad().length?'Prueba con otro término de búsqueda, o marca "Mostrar inactivos".':'Agrega trabajadores uno por uno o con carga masiva desde Excel.'}</p></div>`;
    actualizarBarraSeleccionDtl();
    return;
  }
  host.innerHTML = `<div class="grid">${db.map(trabajadorDtlCard).join("")}</div>`;
  host.querySelectorAll("[data-sel-trabdtl]").forEach(chk=>{
    chk.onchange = ()=>{
      const id = chk.dataset.selTrabdtl;
      if(chk.checked) seleccionadosDtl.add(id); else seleccionadosDtl.delete(id);
      actualizarBarraSeleccionDtl();
    };
  });
  host.querySelectorAll("[data-trabdtl]").forEach(b=>{
    b.onclick = ()=>{
      const id=b.dataset.id, act=b.dataset.trabdtl;
      if(act==="ver") location.hash = "#/dotacionlegal/trabajador/"+id;
      else if(act==="kardex") generarKardexDtlPDF(id);
      else if(act==="entregar") abrirNuevaEntregaDtl(id);
      else if(act==="editar") abrirTrabajadorDtlForm(id);
      else if(act==="del") eliminarTrabajadorDtl(id);
    };
  });
  actualizarBarraSeleccionDtl();
}

/* Igual que borrarContratosVaciosDot pero para Dotación (dtl_entidades). */
async function borrarContratosVaciosDtl(entidadIdsTocadas){
  const ids = [...new Set(entidadIdsTocadas)].filter(Boolean);
  if(!ids.length) return;
  const { data: restantes } = await sb.from("dtl_trabajadores").select("entidad_id").in("entidad_id", ids);
  const conGente = new Set((restantes||[]).map(r=>r.entidad_id));
  const vacias = ids.filter(eid=>!conGente.has(eid));
  if(!vacias.length) return;
  const nombres = vacias.map(eid=>DTL.entidades.find(x=>x.id===eid)?.nombre).filter(Boolean);
  const { error } = await sb.from("dtl_entidades").delete().in("id", vacias);
  if(error){ console.warn(error); toast("No se pudo borrar el contrato que quedó vacío: "+error.message,"err"); return; }
  if(vacias.includes(dtlFiltroEntidad)){ dtlFiltroEntidad='todas'; localStorage.setItem('dtl_filtro_entidad','todas'); }
  toast(`${nombres.length===1?`Contrato "${nombres[0]}" eliminado`:nombres.length+' contratos eliminados'} por quedar sin trabajadores`,"ok");
}

async function eliminarSeleccionDtl(){
  if(!seleccionadosDtl.size){ toast("Selecciona al menos un trabajador","err"); return; }
  const ids = Array.from(seleccionadosDtl);
  openModal(`<div class="modal" style="max-width:460px">
    <div class="modal-head"><div><h2>Eliminar trabajadores</h2><p>Esta acción no se puede deshacer.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body"><p style="font-size:14.5px;color:var(--ink-2)">Se eliminarán <b>${ids.length}</b> trabajador(es) del directorio junto con <b>todo su historial de entregas y firmas</b>. Si solo quieres dejar de verlos sin perder su historial, usa "Marcar como inactivo" en vez de esto. Si algún contrato queda sin trabajadores, también se elimina.</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confEliminarSeleccionDtl">${I.trash} Sí, eliminar ${ids.length}</button></div></div>`);
  document.getElementById('confEliminarSeleccionDtl').onclick = async ()=>{
    const btn=document.getElementById("confEliminarSeleccionDtl"); btn.disabled=true; btn.innerHTML="Eliminando…";
    bloquear("Eliminando…");
    try{
      const entidadesTocadas = ids.map(id=>DTL.trabajadores.find(t=>t.id===id)?.entidad_id);
      const { error } = await porLotes(ids, lote=> sb.from("dtl_trabajadores").delete().in("id", lote));
      if(error){ toast("No se pudo eliminar: "+error.message,"err"); return; }
      await borrarContratosVaciosDtl(entidadesTocadas);
      await loadDtlState();
      seleccionadosDtl.clear();
      closeModal();
      toast(`${ids.length} trabajador(es) eliminados`,"ok");
      renderDtlAdmin();
    } finally { desbloquear(); }
  };
}

/* Historial de entregas de TODA la entidad actual, con filtro de mes — mismo patrón que
   [[abrirHistorialEntregasDot]] para EPP. */
async function abrirHistorialEntregasDtl(){
  if(dtlFiltroEntidad==='todas'){ toast("Elige un contrato específico primero","err"); return; }
  const entidad = DTL.entidades.find(x=>x.id===dtlFiltroEntidad);
  const mesInicial = hoyLocal().slice(0,7);
  openModal(`<div class="modal lg">
    <div class="modal-head"><div><h2>Historial de entregas</h2><p>${esc(entidad?.nombre||'')}</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>
    <div class="modal-body">
      <div class="field" style="max-width:220px">
        <label>Mes</label>
        <input type="month" id="historialDtlMes" value="${mesInicial}">
      </div>
      <div id="historialDtlLista" style="margin-top:12px"><div class="empty"><h3>Cargando…</h3></div></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-primary" id="btnDescargarHistorialDtl">${I.doc} Descargar ZIP</button>
    </div>
  </div>`);

  async function cargar(mes){
    const host = document.getElementById('historialDtlLista');
    if(!host) return;
    host.innerHTML = `<div class="empty"><h3>Cargando…</h3></div>`;
    const { desde, hasta } = rangoDelMes(mes);
    const trabajadores = trabajadoresDeEntidad();
    const idsTrab = trabajadores.map(t=>t.id);
    if(!idsTrab.length){ host.innerHTML = `<div class="empty"><div class="ic">${I.box}</div><h3>Sin trabajadores</h3></div>`; return; }
    let todas = [];
    const { error } = await porLotes(idsTrab, async (lote)=>{
      const { data, error } = await sb.from("dtl_entregas")
        .select("id,trabajador_id,fecha,creado_en,creado_por,responsable_nombre,via,tipo_registro,adjunto_titulo")
        .in("trabajador_id", lote).gte("fecha", desde).lte("fecha", hasta);
      if(error) return { error };
      todas = todas.concat(data||[]);
      return { error: null };
    });
    if(error){ host.innerHTML = `<div class="empty"><h3>No se pudo cargar</h3><p>${esc(error.message)}</p></div>`; return; }
    todas.sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||'') || (b.creado_en||'').localeCompare(a.creado_en||''));
    if(!todas.length){ host.innerHTML = `<div class="empty"><div class="ic">${I.box}</div><h3>Sin entregas</h3><p>No hay entregas registradas en ${fmtMesLabel(mes)}.</p></div>`; return; }
    host.innerHTML = `<p class="muted-sm" style="margin:0 0 8px">${todas.length} entrega(s) en ${fmtMesLabel(mes)}</p>
      <div style="display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto">${todas.map(e=>{
        const t = trabajadores.find(x=>x.id===e.trabajador_id);
        const esEscaneada = e.tipo_registro==='escaneado';
        const responsable = esEscaneada ? nombreDe(e.creado_por) : (e.via==='remoto'?'(entrega remota)':(e.responsable_nombre||'—'));
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px">
          <div><div style="font-weight:700;font-size:13.5px">${esc(t?.nombre||'—')}</div>
            <div class="muted-sm">${esEscaneada?'Escaneado: '+esc(e.adjunto_titulo||''):'Entregado por '+esc(responsable)}</div></div>
          <span class="muted-sm" style="white-space:nowrap">${fmtDate(e.fecha)}</span>
        </div>`;
      }).join('')}</div>`;
  }

  document.getElementById('historialDtlMes').onchange = (e)=> cargar(e.target.value);
  document.getElementById('btnDescargarHistorialDtl').onclick = ()=>{
    const mesInput = document.getElementById('historialDtlMes');
    const mes = (mesInput && mesInput.value) || mesInicial;
    const filtroFechas = rangoDelMes(mes);
    const trabajadores = trabajadoresDeEntidad();
    const nombreSafe = String(entidad?.nombre||'contrato').replace(/[^\w\sáéíóúñ-]/gi,'').trim().replace(/\s+/g,'_').slice(0,40);
    const nombreZip = 'Historial_Dotacion_'+nombreSafe+'_'+mes+'.zip';
    if(entidad?.modo_registro==='escaneado'){
      const mapaNombres = {}; trabajadores.forEach(t=>{ mapaNombres[t.id]=t.nombre; });
      descargarZipAdjuntosContrato('dtl_entregas', trabajadores.map(t=>t.id), mapaNombres, filtroFechas, nombreZip);
    } else {
      descargarZipKardexContratoFiltrado('dtl', trabajadores, filtroFechas, nombreZip);
    }
  };

  cargar(mesInicial);
}

/* ---------- Corregir cargos en bloque (mismo concepto que en EPP) ---------- */
function abrirCorregirCargosDtl(){

    <div class="modal-head"><div><h2>Corregir cargos</h2><p>Renombra un cargo y se corrige de una vez en todos los trabajadores que lo tengan escrito igual.</p></div>
      <button class="close-x" onclick="closeModal()">${I.close}</button></div>

function abrirRenombrarCargoDtl(cargoActual, cantidad){
  openSubModal(`<div class="modal" style="max-width:440px">
    <div class="modal-head"><div><h2>Renombrar cargo</h2><p>Se corregirá en ${cantidad} trabajador${cantidad===1?'':'es'}.</p></div>

    </div>
    <div class="modal-foot">

      <button class="btn btn-primary" id="btnGuardarCargoDtl">${I.check} Corregir</button>
    </div></div>`, ()=> abrirCorregirCargosDtl());

      <button class="icon-btn" title="Renombrar" data-ent-edit="${x.id}">${I.pen}</button>
      <button class="icon-btn ${x.activo?'danger':''}" title="${x.activo?'Archivar':'Reactivar'}" data-ent-toggle="${x.id}">${x.activo?I.lock:I.check}</button>
      <button class="icon-btn danger" title="${n?'No se puede eliminar: tiene trabajadores asociados':'Eliminar'}" data-ent-del="${x.id}" ${n?'disabled':''}>${I.trash}</button>
    </div>`;
  }).join('') || '<p class="muted-sm">Sin contratos todavía.</p>';
  host.querySelectorAll('[data-ent-edit]').forEach(b=>{ b.onclick = ()=> abrirFormEntidadDtl(b.dataset.entEdit); });
  host.querySelectorAll('[data-ent-del]').forEach(b=>{ b.onclick = ()=> eliminarEntidadDtl(b.dataset.entDel); });
  host.querySelectorAll('[data-ent-toggle]').forEach(b=>{
    b.onclick = async ()=>{
      const x = DTL.entidades.find(e=>e.id===b.dataset.entToggle);
      const archivando = x.activo;
      const { error } = await sb.from("dtl_entidades").update({ activo: !x.activo }).eq("id", x.id);
      if(error){ toast("No se pudo actualizar: "+error.message,"err"); return; }
      let nTocados = 0;
      if(archivando){
        // Al archivar un contrato, sus trabajadores dejan de tener sentido en la vista
        // normal — se marcan inactivos igual que si el admin los hubiera seleccionado
        // uno por uno (se conserva todo su historial de entregas y firmas). Se marcan
        // con inactivo_por_archivo:true para poder reactivar EXACTAMENTE a estos (y no a
        // alguien que ya estaba inactivo por otra razón desde antes de archivar).
        const idsTrab = DTL.trabajadores.filter(t=>t.entidad_id===x.id && t.activo!==false).map(t=>t.id);
        nTocados = idsTrab.length;
        if(nTocados){
          const { error: e2 } = await porLotes(idsTrab, lote=> sb.from("dtl_trabajadores").update({activo:false, inactivo_por_archivo:true}).in("id", lote));
          if(e2){ toast("Contrato archivado, pero no se pudo marcar a los trabajadores como inactivos: "+e2.message,"err"); }
        }
      } else {
        // Al reactivar, solo se reactivan los que quedaron inactivos POR archivar este
        // contrato — no a quien ya estaba inactivo antes por otro motivo.
        const idsTrab = DTL.trabajadores.filter(t=>t.entidad_id===x.id && t.inactivo_por_archivo).map(t=>t.id);
        nTocados = idsTrab.length;
        if(nTocados){
          const { error: e2 } = await porLotes(idsTrab, lote=> sb.from("dtl_trabajadores").update({activo:true, inactivo_por_archivo:false}).in("id", lote));
          if(e2){ toast("Contrato reactivado, pero no se pudo reactivar a sus trabajadores: "+e2.message,"err"); }
        }
      }
      await loadDtlState(); renderEntidadesDtlLista();
      toast(archivando
        ?`Contrato archivado${nTocados?` — ${nTocados} trabajador(es) marcados como inactivos`:''}`
        :`Contrato reactivado${nTocados?` — ${nTocados} trabajador(es) reactivados`:''}`,"ok");
    };
  });
}

/* Intenta interpretar una fecha de Excel en varios formatos comunes → YYYY-MM-DD, o null si no se pudo */
/* Solo acepta AAAA-MM-DD o DD/MM/AAAA con año de EXACTAMENTE 4 dígitos (1900-2100) — si no calza,
   devuelve null en vez de arriesgar una interpretación rara de new Date() (ej. un año mal tecleado
   como "20255" en vez de "2025" podía producir una fecha absurda que rompía TODA la carga). */
function parseFechaExcelDtl(v){
  const s = String(v||"").trim();
  if(!s) return null;
  let anio, mes, dia;
  const mIso = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(mIso){ anio=+mIso[1]; mes=+mIso[2]; dia=+mIso[3]; }
  else {
    const mDmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(!mDmy) return null;
    dia=+mDmy[1]; mes=+mDmy[2]; anio=+mDmy[3];
  }
  if(anio<1900 || anio>2100 || mes<1 || mes>12 || dia<1 || dia>31) return null;
  return `${String(anio).padStart(4,'0')}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
}
async function cargarTrabajadoresExcelDtl(file){
  if(!window.XLSX){ toast("No se pudo cargar el lector de Excel (revisa tu conexión)","err"); return; }
  bloquear("Leyendo archivo…");
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
    if(!filas.length){ toast("El archivo está vacío","err"); return; }
    const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
    const head = (filas[0]||[]).map(norm);
    const findCol = (...alts)=> head.findIndex(h => alts.some(a => h.includes(a)));
    let cEnt = findCol("contrato","entidad"), cNom = findCol("nombre"), cCed = findCol("cedula","cédula","identificacion","documento"),
        cFecha = findCol("fecha de ingreso","fecha ingreso","ingreso"), cCargo = findCol("cargo");
    let start = 1;
    if(cNom === -1){ cEnt=0; cNom=1; cCed=2; cFecha=3; cCargo=4; start=0; }
    const validos = []; let ignoradas = 0;
    for(let i=start;i<filas.length;i++){
      const r = filas[i]; if(!r) continue;
      const entidadNombre = String(cEnt>=0?r[cEnt]:"").trim();
      const nombre = String(cNom>=0?r[cNom]:"").trim();
      const identificacion = String(cCed>=0?r[cCed]:"").trim();
      if(!entidadNombre || !nombre || !identificacion){ if(r.some(v=>String(v||"").trim())) ignoradas++; continue; }
      validos.push({
        entidadNombre, nombre, identificacion,
        fecha_ingreso: cFecha>=0 ? parseFechaExcelDtl(r[cFecha]) : null,
        cargo: cCargo>=0?(String(r[cCargo]||"").trim()||null):null
      });
    }
    if(!validos.length){ toast("No se encontraron filas válidas (se requiere contrato, nombre y cédula)","err"); return; }

    // Resuelve el nombre del contrato/entidad a un id — si no existe, se crea (requiere ser admin por RLS)
    const keyEnt = s => s.trim().toLowerCase();
    const entidadPorNombre = new Map(DTL.entidades.map(en=>[keyEnt(en.nombre), en.id]));
    let entidadesCreadas = 0;
    for(const it of validos){
      const k = keyEnt(it.entidadNombre);
      if(!entidadPorNombre.has(k)){
        const { data, error } = await sb.from("dtl_entidades").insert({ nombre: it.entidadNombre }).select().single();
        if(error){ toast(`No se pudo crear el contrato "${it.entidadNombre}": `+error.message,"err"); return; }
        entidadPorNombre.set(k, data.id);
        DTL.entidades.push(data);
        entidadesCreadas++;
      }
      it.entidad_id = entidadPorNombre.get(k);
    }

    const keyOf = s => s.trim().toLowerCase();
    const existentes = new Set(DTL.trabajadores.map(t=>keyOf(t.identificacion)));
    const vistos = new Set(); let dup = 0, yaExistian = 0;
    const nuevos = [];
    validos.forEach(it=>{
      const k = keyOf(it.identificacion);
      if(vistos.has(k)){ dup++; return; }
      vistos.add(k);
      if(existentes.has(k)){ yaExistian++; return; }
      nuevos.push({ nombre: it.nombre, identificacion: it.identificacion, cargo: it.cargo, fecha_ingreso: it.fecha_ingreso, entidad_id: it.entidad_id });
    });
    if(nuevos.length){
      const { error } = await sb.from("dtl_trabajadores").insert(nuevos);
      if(error){ toast("No se pudo cargar: "+error.message,"err"); return; }
    }
    let msg = `${nuevos.length} trabajador(es) nuevo(s) agregado(s)`;
    if(entidadesCreadas) msg += ` · ${entidadesCreadas} contrato(s) nuevo(s) creado(s)`;
    if(yaExistian) msg += ` · ${yaExistian} ya existían (cédula repetida, sin cambios)`;
    if(ignoradas) msg += ` · ${ignoradas} fila(s) incompleta(s) omitida(s)`;
    if(dup) msg += ` · ${dup} duplicada(s) en el archivo`;
    toast(msg,"ok");
    // renderDtlAdmin (no renderDtlGrid) a propósito: si se cargó desde la pantalla
    // "Crea tu primer contrato" (0 entidades), hay que reconstruir toda la página para
    // que aparezca el panel normal — renderDtlGrid asume que ese panel ya existe.
    await renderDtlAdmin(true);
  }catch(e){ console.error(e); toast("No se pudo leer el archivo: "+(e.message||''),"err"); }
  finally{ desbloquear(); }
}

/* ---------- Nueva entrega presencial (asistente de 3 pasos) ---------- */
async function abrirNuevaEntregaDtl(trabajadorId){
  const t = DTL.trabajadores.find(x=>x.id===trabajadorId);
  if(!t){ toast("Trabajador no encontrado","err"); return; }
  const entidad = DTL.entidades.find(e=>e.id===t.entidad_id);
  if(entidad?.modo_registro==='escaneado'){
    abrirNuevaEntregaEscaneadaDtl(trabajadorId);

  }
  bloquear("Cargando…");
  try{

    if(entidad?.catalogo_unico) DTL.catalogo = await cargarCatalogoDtl(t.entidad_id);
  } finally{ desbloquear(); }
  dtlEntregaDraft = {
    trabajadorId: trabajadorId,
    fecha: hoyLocal(),
    catalogoUnico: !!entidad?.catalogo_unico,
    items: [{ catalogoId:'', cantidad:1, talla:'' }],
